/** @typedef {{time:number,open:number,high:number,low:number,close:number,volume:number}} Candle */
function sma(values, period) {
  const out = new Array(values.length).fill(null);
  let acc = 0;
  for (let i = 0; i < values.length; i++) {
    acc += values[i];
    if (i >= period) acc -= values[i - period];
    if (i >= period - 1) out[i] = acc / period;
  }
  return out;
}
function ema(values, period) {
  const out = new Array(values.length).fill(null);
  if (values.length < period) return out;
  const k = 2 / (period + 1);
  let prev = 0;
  for (let i = 0; i < period; i++) prev += values[i];
  prev /= period;
  out[period - 1] = prev;
  for (let i = period; i < values.length; i++) {
    prev = values[i] * k + prev * (1 - k);
    out[i] = prev;
  }
  return out;
}
function rma(values, period) {
  const out = new Array(values.length).fill(null);
  if (values.length < period) return out;
  let prev = 0;
  for (let i = 0; i < period; i++) prev += values[i];
  prev /= period;
  out[period - 1] = prev;
  for (let i = period; i < values.length; i++) {
    prev = (prev * (period - 1) + values[i]) / period;
    out[i] = prev;
  }
  return out;
}

/** True Range 序列 */
function trueRange(candles) {
  return candles.map((c, i) => {
    if (i === 0) return c.high - c.low;
    const p = candles[i - 1].close;
    return Math.max(c.high - c.low, Math.abs(c.high - p), Math.abs(c.low - p));
  });
}

/** ATR（Wilder 平滑） */
function atr(candles, period = 14) {
  return rma(trueRange(candles), period);
}
function rsi(candles, period = 14) {
  const closes = candles.map((c) => c.close);
  const gains = [0];
  const losses = [0];
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1];
    gains.push(Math.max(0, d));
    losses.push(Math.max(0, -d));
  }
  const ag = rma(gains, period);
  const al = rma(losses, period);
  return closes.map((_, i) => {
    if (ag[i] == null || al[i] == null) return null;
    if (al[i] === 0) return 100;
    const rs = ag[i] / al[i];
    return 100 - 100 / (1 + rs);
  });
}

/** 以「自然日（UTC）」錨定的 VWAP，含 ±1/±2 標準差通道 */
function sessionVwap(candles, { anchor = 'day' } = {}) {
  const vwap = new Array(candles.length).fill(null);
  const upper1 = new Array(candles.length).fill(null);
  const lower1 = new Array(candles.length).fill(null);
  const upper2 = new Array(candles.length).fill(null);
  const lower2 = new Array(candles.length).fill(null);
  let pv = 0, vol = 0, pv2 = 0, key = null;
  const keyOf = (ts) => {
    const d = new Date(ts);
    if (anchor === 'week') {
      const day = d.getUTCDay();
      const monday = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - ((day + 6) % 7));
      return monday;
    }
    return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  };
  for (let i = 0; i < candles.length; i++) {
    const c = candles[i];
    const k = keyOf(c.time);
    if (k !== key) { key = k; pv = 0; vol = 0; pv2 = 0; }
    const tp = (c.high + c.low + c.close) / 3;
    const v = c.volume || 1;
    pv += tp * v;
    pv2 += tp * tp * v;
    vol += v;
    const vw = pv / vol;
    const variance = Math.max(0, pv2 / vol - vw * vw);
    const sd = Math.sqrt(variance);
    vwap[i] = vw;
    upper1[i] = vw + sd;
    lower1[i] = vw - sd;
    upper2[i] = vw + 2 * sd;
    lower2[i] = vw - 2 * sd;
  }
  return { vwap, upper1, lower1, upper2, lower2 };
}

/**
 * 成交量分佈（Volume Profile）— 以指定區間計算 POC / VAH / VAL
 * 用於辨識「高成交量節點（HVN）」與「低成交量節點（LVN，價格容易快速穿越）」
 */
function volumeProfile(candles, { bins = 48, valueAreaPct = 0.7 } = {}) {
  if (!candles.length) return null;
  let hi = -Infinity, lo = Infinity;
  for (const c of candles) { if (c.high > hi) hi = c.high; if (c.low < lo) lo = c.low; }
  if (!(hi > lo)) return null;
  const step = (hi - lo) / bins;
  const buckets = new Array(bins).fill(0);
  for (const c of candles) {
    const a = Math.max(0, Math.min(bins - 1, Math.floor((c.low - lo) / step)));
    const b = Math.max(0, Math.min(bins - 1, Math.floor((c.high - lo) / step)));
    const span = b - a + 1;
    const share = (c.volume || 1) / span;
    for (let i = a; i <= b; i++) buckets[i] += share;
  }
  const total = buckets.reduce((s, v) => s + v, 0) || 1;
  let pocIdx = 0;
  buckets.forEach((v, i) => { if (v > buckets[pocIdx]) pocIdx = i; });
  // 由 POC 向兩側擴張直到覆蓋 valueAreaPct 的量能
  let lowIdx = pocIdx, highIdx = pocIdx, acc = buckets[pocIdx];
  while (acc / total < valueAreaPct && (lowIdx > 0 || highIdx < bins - 1)) {
    const down = lowIdx > 0 ? buckets[lowIdx - 1] : -1;
    const up = highIdx < bins - 1 ? buckets[highIdx + 1] : -1;
    if (up >= down) { highIdx++; acc += Math.max(0, up); }
    else { lowIdx--; acc += Math.max(0, down); }
  }
  const priceAt = (i) => lo + step * (i + 0.5);
  const maxVol = Math.max(...buckets);
  return {
    low: lo,
    high: hi,
    step,
    bins: buckets.map((v, i) => ({ price: priceAt(i), volume: v, ratio: v / maxVol })),
    poc: priceAt(pocIdx),
    vah: priceAt(highIdx),
    val: priceAt(lowIdx),
    lvn: buckets
      .map((v, i) => ({ price: priceAt(i), ratio: v / maxVol }))
      .filter((b) => b.ratio < 0.18),
  };
}

/** 相對量能：目前 K 棒量能相對過去 n 根平均的倍數 */
function relativeVolume(candles, period = 20) {
  const vols = candles.map((c) => c.volume || 0);
  const avg = sma(vols, period);
  return vols.map((v, i) => (avg[i] ? v / avg[i] : null));
}

/** 位移強度：K 棒實體相對 ATR 的倍數，用來判斷是否為 institutional displacement */
function displacement(candles, period = 14) {
  const a = atr(candles, period);
  return candles.map((c, i) => {
    if (!a[i]) return null;
    return (c.close - c.open) / a[i];
  });
}


/* ===== src/smc/swings.js ===== */
/**
 * 擺動點偵測（Swing / Fractal Pivots）
 * SMC 的一切都建立在「結構點」上：沒有正確的擺動高低點，就沒有正確的 BOS / CHoCH。
 *
 * 本模組提供：
 *  - detectSwings()      : n 根對稱分形法找出未來已確認的擺動點
 *  - alternateSwings()   : 強制高低交替（同向相鄰時保留更極端者），避免結構雜訊
 *  - labelSwings()       : 標記 HH / HL / LH / LL
 */

/** @typedef {{time:number,open:number,high:number,low:number,close:number,volume:number}} Candle */
/** @typedef {{index:number,time:number,price:number,type:'high'|'low',label?:string,confirmedAt?:number}} Swing */

/**
 * @param {Candle[]} candles
 * @param {number} strength 左右各需比較的 K 棒數（越大 = 越高級別的結構）
 * @returns {Swing[]} 依時間排序
 */
function detectSwings(candles, strength = 3) {
  const swings = [];
  if (candles.length < strength * 2 + 1) return swings;
  for (let i = strength; i < candles.length - strength; i++) {
    const c = candles[i];
    let isHigh = true;
    let isLow = true;
    for (let j = 1; j <= strength; j++) {
      const l = candles[i - j];
      const r = candles[i + j];
      // 左側嚴格、右側容許等值 → 避免雙頂時抓不到點
      if (l.high >= c.high || r.high > c.high) isHigh = false;
      if (l.low <= c.low || r.low < c.low) isLow = false;
      if (!isHigh && !isLow) break;
    }
    if (isHigh) {
      swings.push({ index: i, time: c.time, price: c.high, type: 'high', confirmedAt: candles[i + strength].time });
    }
    if (isLow) {
      swings.push({ index: i, time: c.time, price: c.low, type: 'low', confirmedAt: candles[i + strength].time });
    }
  }
  swings.sort((a, b) => a.index - b.index || (a.type === 'low' ? -1 : 1));
  return swings;
}

/**
 * 高低交替化：相鄰同型別的擺動點只保留最極端者。
 * 這一步是 SMC 結構分析的關鍵前處理（LuxAlgo / ICT 皆採用類似邏輯）。
 * @param {Swing[]} swings
 * @returns {Swing[]}
 */
function alternateSwings(swings) {
  const out = [];
  for (const s of swings) {
    const prev = out[out.length - 1];
    if (!prev) { out.push({ ...s }); continue; }
    if (prev.type === s.type) {
      const keepNew = s.type === 'high' ? s.price >= prev.price : s.price <= prev.price;
      if (keepNew) out[out.length - 1] = { ...s };
    } else {
      out.push({ ...s });
    }
  }
  return out;
}

/**
 * 標記 HH / HL / LH / LL（Higher High…），用於快速閱讀趨勢。
 * @param {Swing[]} swings
 */
function labelSwings(swings) {
  let lastHigh = null;
  let lastLow = null;
  return swings.map((s) => {
    let label = '';
    if (s.type === 'high') {
      if (lastHigh != null) label = s.price > lastHigh ? 'HH' : 'LH';
      lastHigh = s.price;
    } else {
      if (lastLow != null) label = s.price < lastLow ? 'LL' : 'HL';
      lastLow = s.price;
    }
    return { ...s, label };
  });
}

/** 取得結構化的擺動點（偵測 → 交替 → 標記） */
function structuredSwings(candles, strength = 3) {
  return labelSwings(alternateSwings(detectSwings(candles, strength)));
}

/** 最後一個指定型別的擺動點 */
function lastSwing(swings, type) {
  for (let i = swings.length - 1; i >= 0; i--) if (swings[i].type === type) return swings[i];
  return null;
}

/**
 * 交易區間（Dealing Range）：由最近一組「已確認的擺動高 + 擺動低」構成，
 * 是判斷溢價（Premium）／折價（Discount）的基準。
 */
function dealingRange(swings, candles = null) {
  const high = lastSwing(swings, 'high');
  const low = lastSwing(swings, 'low');
  if (!high || !low) return null;
  let hi = high.price;
  let lo = low.price;
  let hiIndex = high.index;
  let loIndex = low.index;
  // 價格若已突破舊區間，區間隨之延伸到新的極值（否則折溢價會算出 >100% 的怪數字）
  if (candles) {
    for (let i = Math.max(high.index, low.index); i < candles.length; i++) {
      if (candles[i].high > hi) { hi = candles[i].high; hiIndex = i; }
      if (candles[i].low < lo) { lo = candles[i].low; loIndex = i; }
    }
  }
  return {
    high: hi,
    low: lo,
    highIndex: hiIndex,
    lowIndex: loIndex,
    swingHigh: high.price,
    swingLow: low.price,
    equilibrium: (hi + lo) / 2,
    startIndex: Math.min(high.index, low.index),
    direction: hiIndex > loIndex ? 'up' : 'down',
  };
}


/* ===== src/smc/structure.js ===== */
/**
 * 市場結構（Market Structure）：BOS / CHoCH / 強弱高低點
 *
 * 定義（本專案採用的嚴謹版本）：
 *  - BOS  (Break of Structure)     : 沿著「既有趨勢方向」突破前一個擺動點 → 趨勢延續。
 *  - CHoCH(Change of Character)    : 逆著「既有趨勢方向」突破前一個擺動點 → 趨勢可能反轉，
 *                                    也是 SMC 中最重要的反轉訊號。
 *  - Strong High / Low             : 造成 BOS 的那個擺動點（機構防守，不易被破）。
 *  - Weak High / Low               : 被推開、尚未取得流動性的擺動點（後續容易被掃）。
 *
 * 突破判定可選 close（收盤價，較嚴謹）或 wick（影線，較敏感）。
 */

/** @typedef {import('./swings.js').Swing} Swing */

/**
 * @param {import('./swings.js').Swing[]} rawSwings
 * @param {any[]} candles
 * @param {{strength:number, breakBy?:'close'|'wick', scale?:'internal'|'swing'}} opts
 */
function analyzeStructure(candles, opts = {}) {
  const { strength = 3, breakBy = 'close', scale = 'swing' } = opts;
  const swings = alternateSwings(detectSwings(candles, strength));

  /** 依「確認 index」分組，模擬實時：擺動點要 strength 根之後才成立 */
  const byConfirm = new Map();
  for (const s of swings) {
    const ci = s.index + strength;
    if (!byConfirm.has(ci)) byConfirm.set(ci, []);
    byConfirm.get(ci).push(s);
  }

  /** @type {any[]} */
  const events = [];
  let trend = 0; // 1 = bull, -1 = bear, 0 = 未定
  let pendingHigh = null;
  let pendingLow = null;
  let strongLow = null;
  let strongHigh = null;

  for (let i = 0; i < candles.length; i++) {
    const c = candles[i];
    const confirmed = byConfirm.get(i);
    if (confirmed) {
      for (const s of confirmed) {
        if (s.type === 'high') {
          if (!pendingHigh || s.index > pendingHigh.index) pendingHigh = s;
        } else if (!pendingLow || s.index > pendingLow.index) {
          pendingLow = s;
        }
      }
    }

    const upLevel = breakBy === 'close' ? c.close : c.high;
    const downLevel = breakBy === 'close' ? c.close : c.low;

    if (pendingHigh && upLevel > pendingHigh.price) {
      const type = trend === -1 ? 'CHoCH' : 'BOS';
      events.push({
        id: `${scale}-${type}-${i}`,
        scale,
        type,
        dir: 'bull',
        price: pendingHigh.price,
        fromIndex: pendingHigh.index,
        fromTime: pendingHigh.time,
        breakIndex: i,
        breakTime: c.time,
        swept: pendingHigh,
      });
      trend = 1;
      strongLow = lowestBetween(candles, pendingHigh.index, i);
      strongHigh = null;
      pendingLow = strongLow
        ? { index: strongLow.index, time: candles[strongLow.index].time, price: strongLow.price, type: 'low' }
        : pendingLow;
      pendingHigh = null;
    } else if (pendingLow && downLevel < pendingLow.price) {
      const type = trend === 1 ? 'CHoCH' : 'BOS';
      events.push({
        id: `${scale}-${type}-${i}`,
        scale,
        type,
        dir: 'bear',
        price: pendingLow.price,
        fromIndex: pendingLow.index,
        fromTime: pendingLow.time,
        breakIndex: i,
        breakTime: c.time,
        swept: pendingLow,
      });
      trend = -1;
      strongHigh = highestBetween(candles, pendingLow.index, i);
      strongLow = null;
      pendingHigh = strongHigh
        ? { index: strongHigh.index, time: candles[strongHigh.index].time, price: strongHigh.price, type: 'high' }
        : pendingHigh;
      pendingLow = null;
    }
  }

  return {
    scale,
    strength,
    swings,
    events,
    trend,
    trendLabel: trend === 1 ? 'bullish' : trend === -1 ? 'bearish' : 'ranging',
    lastEvent: events[events.length - 1] || null,
    protectedHigh: strongHigh ? { price: strongHigh.price, index: strongHigh.index, kind: 'strong' } : (pendingHigh ? { price: pendingHigh.price, index: pendingHigh.index, kind: 'weak' } : null),
    protectedLow: strongLow ? { price: strongLow.price, index: strongLow.index, kind: 'strong' } : (pendingLow ? { price: pendingLow.price, index: pendingLow.index, kind: 'weak' } : null),
    pendingHigh,
    pendingLow,
  };
}

function lowestBetween(candles, a, b) {
  let best = null;
  for (let i = Math.max(0, a); i <= Math.min(candles.length - 1, b); i++) {
    if (!best || candles[i].low < best.price) best = { index: i, price: candles[i].low };
  }
  return best;
}

function highestBetween(candles, a, b) {
  let best = null;
  for (let i = Math.max(0, a); i <= Math.min(candles.length - 1, b); i++) {
    if (!best || candles[i].high > best.price) best = { index: i, price: candles[i].high };
  }
  return best;
}

/**
 * 雙尺度結構：同時計算「內部結構（Internal）」與「擺動結構（Swing）」。
 * SMC 的標準操作：以 Swing 結構定方向，以 Internal 結構找進場。
 */
function dualStructure(candles, { internalStrength = 2, swingStrength = 7, breakBy = 'close' } = {}) {
  return {
    internal: analyzeStructure(candles, { strength: internalStrength, breakBy, scale: 'internal' }),
    swing: analyzeStructure(candles, { strength: swingStrength, breakBy, scale: 'swing' }),
  };
}

/** 最近 n 筆結構事件（新到舊） */
function recentEvents(structure, n = 6) {
  return [...structure.events].slice(-n).reverse();
}


/* ===== src/smc/fvg.js ===== */
/**
 * 公允價值缺口（Fair Value Gap, FVG）／不平衡（Imbalance）
 *
 *  - Bullish FVG : low[i] > high[i-2]，中間那根為位移 K 棒 → 下方留下未成交區。
 *  - Bearish FVG : high[i] < low[i-2]。
 *  - IFVG (Inverse FVG) : FVG 被完全穿越並收盤於另一側後，角色反轉成反向的關鍵區。
 *  - Volume Imbalance   : 實體之間有缺口但影線重疊（較小級別的不平衡）。
 *
 * 每個缺口都會追蹤「填補率（fill%）」與狀態（fresh / partial / filled / inverted）。
 */
function detectFVG(candles, opts = {}) {
  const {
    minSizeAtr = 0.12,   // 過濾雜訊：缺口至少要有 ATR 的幾倍
    maxAgeBars = 600,
    includeVolumeImbalance = true,
  } = opts;
  const a = atr(candles, 14);
  const out = [];

  for (let i = 2; i < candles.length; i++) {
    const c0 = candles[i - 2];
    const c1 = candles[i - 1];
    const c2 = candles[i];
    if (candles.length - i > maxAgeBars) continue;
    const ref = a[i] || (c2.high - c2.low) || 1;

    if (c2.low > c0.high) {
      const size = c2.low - c0.high;
      if (size / ref >= minSizeAtr) {
        out.push(makeGap('fvg', 'bull', i, c0.high, c2.low, candles, { ref, driver: c1 }));
      }
    } else if (c2.high < c0.low) {
      const size = c0.low - c2.high;
      if (size / ref >= minSizeAtr) {
        out.push(makeGap('fvg', 'bear', i, c2.high, c0.low, candles, { ref, driver: c1 }));
      }
    } else if (includeVolumeImbalance) {
      // 量能不平衡：前一根收盤與本根開盤之間的空隙（影線仍重疊）
      const prevTopBody = Math.max(c1.open, c1.close);
      const prevBotBody = Math.min(c1.open, c1.close);
      const curTopBody = Math.max(c2.open, c2.close);
      const curBotBody = Math.min(c2.open, c2.close);
      if (curBotBody > prevTopBody && (curBotBody - prevTopBody) / ref >= minSizeAtr * 1.5) {
        out.push(makeGap('vi', 'bull', i, prevTopBody, curBotBody, candles, { ref, driver: c2 }));
      } else if (curTopBody < prevBotBody && (prevBotBody - curTopBody) / ref >= minSizeAtr * 1.5) {
        out.push(makeGap('vi', 'bear', i, curTopBody, prevBotBody, candles, { ref, driver: c2 }));
      }
    }
  }
  return out;
}

function makeGap(kind, dir, index, bottom, top, candles, { ref, driver }) {
  const gap = {
    id: `${kind}-${dir}-${index}`,
    kind,
    dir,
    index,
    time: candles[index].time,
    top,
    bottom,
    mid: (top + bottom) / 2,
    size: top - bottom,
    sizeAtr: (top - bottom) / ref,
    displacement: driver ? Math.abs(driver.close - driver.open) / ref : 0,
    state: 'fresh',
    fill: 0,
    filledIndex: null,
    invertedIndex: null,
  };
  trackFill(gap, candles);
  gap.score = scoreGap(gap, candles);
  return gap;
}

/** 追蹤填補與反轉（IFVG） */
function trackFill(gap, candles) {
  const height = gap.top - gap.bottom || 1;
  for (let i = gap.index + 1; i < candles.length; i++) {
    const c = candles[i];
    if (gap.dir === 'bull') {
      if (c.low < gap.top) {
        const pen = (gap.top - Math.max(gap.bottom, c.low)) / height;
        gap.fill = Math.max(gap.fill, Math.min(1, pen));
        if (gap.state === 'fresh') gap.state = 'partial';
      }
      if (c.close < gap.bottom) {
        gap.state = 'inverted';
        gap.invertedIndex = i;
        gap.fill = 1;
        gap.invertedDir = 'bear';
        break;
      }
      if (gap.fill >= 0.999 && gap.state !== 'inverted') { gap.state = 'filled'; gap.filledIndex ??= i; }
    } else {
      if (c.high > gap.bottom) {
        const pen = (Math.min(gap.top, c.high) - gap.bottom) / height;
        gap.fill = Math.max(gap.fill, Math.min(1, pen));
        if (gap.state === 'fresh') gap.state = 'partial';
      }
      if (c.close > gap.top) {
        gap.state = 'inverted';
        gap.invertedIndex = i;
        gap.fill = 1;
        gap.invertedDir = 'bull';
        break;
      }
      if (gap.fill >= 0.999 && gap.state !== 'inverted') { gap.state = 'filled'; gap.filledIndex ??= i; }
    }
  }
}

function scoreGap(gap, candles) {
  let s = 35;
  s += Math.min(25, gap.sizeAtr * 30);
  s += Math.min(15, gap.displacement * 12);
  if (gap.state === 'fresh') s += 18;
  else if (gap.state === 'partial') s += 8;
  else if (gap.state === 'filled') s -= 20;
  if (gap.kind === 'vi') s -= 10;
  if (gap.state === 'inverted') s += 4;
  s -= Math.min(10, (candles.length - gap.index) / 80);
  return Math.max(0, Math.min(100, Math.round(s)));
}

/**
 * 消耗缺口（Consequent Encroachment, CE）= FVG 的 50% 中線，
 * ICT 常用來作為精準進場價。
 */
const ce = (gap) => gap.mid;

/** 未填補（可交易）的缺口，依距離現價排序 */
function activeGaps(gaps, price) {
  return gaps
    .filter((g) => g.state === 'fresh' || g.state === 'partial' || g.state === 'inverted')
    .map((g) => ({ ...g, effectiveDir: g.state === 'inverted' ? g.invertedDir : g.dir }))
    .filter((g) => (g.effectiveDir === 'bull' ? g.bottom <= price * 1.001 : g.top >= price * 0.999))
    .sort((a, b) => Math.abs(a.mid - price) - Math.abs(b.mid - price));
}


/* ===== src/smc/orderblocks.js ===== */
/**
 * 訂單塊（Order Block）／破壞塊（Breaker Block）／減壓塊（Mitigation Block）
 *
 * 定義：
 *  - Order Block : 造成結構突破（BOS/CHoCH）之前的「最後一根反向 K 棒」，
 *                  代表機構在此累積訂單，價格回測時常見反應。
 *  - Breaker     : 失效的 OB（價格收盤穿越），角色反轉 → 支撐變壓力（或相反）。
 *  - Mitigation  : 已被部分回測（Tapped）但尚未失效的 OB。
 *
 * 品質評分（0–100）考量：位移強度、量能、是否內含 FVG、是否掃過流動性、新鮮度。
 */

/**
 * @param {any[]} candles
 * @param {any[]} events 來自 structure.analyzeStructure 的事件
 * @param {object} opts
 */
function detectOrderBlocks(candles, events, opts = {}) {
  const {
    zoneMode = 'wick',        // 'wick' = 高低點；'body' = 實體
    minDisplacementAtr = 1.0, // 突破腿至少要有幾倍 ATR 的位移
    maxAgeBars = 600,
    fvgList = [],
    sweeps = [],
  } = opts;

  const a = atr(candles, 14);
  const rvol = relativeVolume(candles, 20);
  const blocks = [];

  for (const ev of events) {
    const isBull = ev.dir === 'bull';
    const legStart = isBull
      ? lowestIndex(candles, ev.fromIndex, ev.breakIndex)
      : highestIndex(candles, ev.fromIndex, ev.breakIndex);
    if (legStart == null) continue;

    let obIndex = null;
    for (let i = ev.breakIndex; i >= Math.max(0, legStart - 3); i--) {
      const c = candles[i];
      if (isBull && c.close < c.open) { obIndex = i; break; }
      if (!isBull && c.close > c.open) { obIndex = i; break; }
    }
    if (obIndex == null) obIndex = legStart;

    const ob = candles[obIndex];
    const legRange = isBull
      ? candles[ev.breakIndex].high - candles[legStart].low
      : candles[legStart].high - candles[ev.breakIndex].low;
    const atrRef = a[ev.breakIndex] || a[obIndex] || legRange / 4 || 1;
    const displacementAtr = legRange / atrRef;
    if (displacementAtr < minDisplacementAtr) continue;
    if (candles.length - obIndex > maxAgeBars) continue;

    const top = zoneMode === 'body' ? Math.max(ob.open, ob.close) : ob.high;
    const bottom = zoneMode === 'body' ? Math.min(ob.open, ob.close) : ob.low;
    if (!(top > bottom)) continue;

    const id = `ob-${ev.scale}-${ev.dir}-${obIndex}`;
    if (blocks.some((b) => b.id === id)) continue;

    const containsFvg = fvgList.some(
      (f) => f.dir === (isBull ? 'bull' : 'bear') && f.index >= obIndex && f.index <= obIndex + 3,
    );
    const sweptBefore = sweeps.some(
      (s) => Math.abs(s.index - obIndex) <= 5 && s.dir === (isBull ? 'bull' : 'bear'),
    );

    const block = {
      id,
      kind: 'orderblock',
      dir: isBull ? 'bull' : 'bear',
      scale: ev.scale,
      index: obIndex,
      time: ob.time,
      top,
      bottom,
      mid: (top + bottom) / 2,
      causedBy: ev.type,
      breakIndex: ev.breakIndex,
      displacementAtr,
      rvol: rvol[obIndex] || 1,
      containsFvg,
      sweptBefore,
      state: 'fresh',
      touches: 0,
      mitigationPct: 0,
      firstTouchIndex: null,
      brokenIndex: null,
    };
    evaluateLifecycle(block, candles);
    block.score = scoreBlock(block, candles);
    blocks.push(block);
  }

  // 移除被更新、更靠近價格且同向且重疊的舊 OB（保留較新者），避免圖面雜訊
  return dedupeZones(blocks);
}

/** 追蹤 OB 生命週期：fresh → tapped → mitigated → breaker */
function evaluateLifecycle(block, candles) {
  const isBull = block.dir === 'bull';
  const height = block.top - block.bottom || 1;
  for (let i = block.breakIndex + 1; i < candles.length; i++) {
    const c = candles[i];
    const touched = isBull ? c.low <= block.top : c.high >= block.bottom;
    if (touched) {
      block.touches += 1;
      if (block.firstTouchIndex == null) block.firstTouchIndex = i;
      const pen = isBull
        ? (block.top - Math.max(block.bottom, c.low)) / height
        : (Math.min(block.top, c.high) - block.bottom) / height;
      block.mitigationPct = Math.max(block.mitigationPct, Math.min(1, pen));
      if (block.state === 'fresh') block.state = 'tapped';
    }
    const broken = isBull ? c.close < block.bottom : c.close > block.top;
    if (broken) {
      block.state = 'breaker';
      block.brokenIndex = i;
      block.breakerDir = isBull ? 'bear' : 'bull';
      break;
    }
    if (block.mitigationPct >= 0.98 && block.state !== 'breaker') block.state = 'mitigated';
  }
}

function scoreBlock(block, candles) {
  let s = 40;
  s += Math.min(25, block.displacementAtr * 8);           // 位移越強越可信
  s += Math.min(12, ((block.rvol || 1) - 1) * 12);        // 量能放大
  if (block.containsFvg) s += 12;                          // 內含 FVG → 高機率 OB
  if (block.sweptBefore) s += 10;                          // 形成前掃過流動性
  if (block.causedBy === 'CHoCH') s += 6;                  // 反轉級別權重
  if (block.scale === 'swing') s += 6;                     // 高級別結構
  if (block.state === 'fresh') s += 8;
  if (block.state === 'tapped') s += 2;
  if (block.state === 'mitigated') s -= 15;
  if (block.state === 'breaker') s -= 8;
  const age = candles.length - block.index;
  s -= Math.min(12, age / 60);                             // 越舊越衰減
  return Math.max(0, Math.min(100, Math.round(s)));
}

/** 同方向且重疊度 > 60% 的區塊只保留分數較高者 */
function dedupeZones(zones) {
  const out = [];
  for (const z of [...zones].sort((x, y) => y.index - x.index)) {
    const dup = out.find((o) => o.dir === z.dir && overlapRatio(o, z) > 0.6);
    if (!dup) out.push(z);
    else if ((z.score || 0) > (dup.score || 0)) Object.assign(dup, z);
  }
  return out.sort((a, b) => a.index - b.index);
}

function overlapRatio(a, b) {
  const lo = Math.max(a.bottom, b.bottom);
  const hi = Math.min(a.top, b.top);
  if (hi <= lo) return 0;
  const inter = hi - lo;
  return inter / Math.min(a.top - a.bottom, b.top - b.bottom);
}

function lowestIndex(candles, a, b) {
  let idx = null;
  for (let i = Math.max(0, a); i <= Math.min(candles.length - 1, b); i++) {
    if (idx == null || candles[i].low < candles[idx].low) idx = i;
  }
  return idx;
}

function highestIndex(candles, a, b) {
  let idx = null;
  for (let i = Math.max(0, a); i <= Math.min(candles.length - 1, b); i++) {
    if (idx == null || candles[i].high > candles[idx].high) idx = i;
  }
  return idx;
}

/**
 * 取出「可用的興趣點（POI）」：尚未失效、且仍位於價格可回測方向的 OB。
 * @param {any[]} blocks
 * @param {number} price
 */
function activeOrderBlocks(blocks, price) {
  return blocks
    .filter((b) => b.state !== 'mitigated')
    .map((b) => {
      const isBreaker = b.state === 'breaker';
      const dir = isBreaker ? b.breakerDir : b.dir;
      return { ...b, effectiveDir: dir };
    })
    .filter((b) => (b.effectiveDir === 'bull' ? b.bottom <= price : b.top >= price))
    .sort((a, b) => Math.abs(a.mid - price) - Math.abs(b.mid - price));
}


/* ===== src/smc/liquidity.js ===== */
/**
 * 流動性（Liquidity）模組
 *
 * SMC 的核心觀念：價格不是「隨機遊走」，而是在「流動性之間移動」。
 *  - Buy-side liquidity (BSL)  : 前高／等高之上的買單停損 → 空方的目標。
 *  - Sell-side liquidity (SSL) : 前低／等低之下的多單停損 → 多方的目標。
 *  - Liquidity Sweep / Stop Hunt: 影線穿越但收盤收回 → 流動性被掃，常見反轉起點。
 *  - Inducement (IDM)          : 進入真正 POI 之前，故意製造的假回調，用來誘出散戶單。
 *  - Equal Highs / Lows (EQH/EQL): 明顯的等高等低，是機構最愛的流動性池。
 */


/**
 * 建立流動性池：把容差內的擺動點群聚成一個「池」。
 */
function liquidityPools(candles, swings, opts = {}) {
  const { tolAtr = 0.18, minTouches = 1, maxAgeBars = 500 } = opts;
  const a = atr(candles, 14);
  const tolOf = (i) => (a[i] || candles[i].high - candles[i].low || 1) * tolAtr;
  const pools = [];

  for (const s of swings) {
    if (candles.length - s.index > maxAgeBars) continue;
    const tol = tolOf(s.index);
    const side = s.type === 'high' ? 'buyside' : 'sellside';
    const pool = pools.find(
      (p) => p.side === side && Math.abs(p.price - s.price) <= tol && !p.swept,
    );
    if (pool) {
      pool.touches += 1;
      pool.price = side === 'buyside' ? Math.max(pool.price, s.price) : Math.min(pool.price, s.price);
      pool.lastIndex = s.index;
      pool.indices.push(s.index);
      pool.equal = true;
    } else {
      pools.push({
        id: `liq-${side}-${s.index}`,
        side,
        price: s.price,
        touches: 1,
        equal: false,
        firstIndex: s.index,
        lastIndex: s.index,
        indices: [s.index],
        time: s.time,
        swept: false,
        sweptIndex: null,
      });
    }
  }

  // 標記是否已被掃除
  for (const p of pools) {
    for (let i = p.lastIndex + 1; i < candles.length; i++) {
      const c = candles[i];
      if (p.side === 'buyside' ? c.high > p.price : c.low < p.price) {
        p.swept = true;
        p.sweptIndex = i;
        p.sweptByClose = p.side === 'buyside' ? c.close > p.price : c.close < p.price;
        break;
      }
    }
    p.strength = Math.min(100, 30 + p.touches * 18 + (p.equal ? 15 : 0) + (p.swept ? -25 : 10));
  }

  return pools.filter((p) => p.touches >= minTouches).sort((x, y) => x.price - y.price);
}

/** 未被掃除的流動性（即潛在目標） */
function untappedLiquidity(pools, price) {
  return {
    above: pools.filter((p) => !p.swept && p.price > price).sort((a, b) => a.price - b.price),
    below: pools.filter((p) => !p.swept && p.price < price).sort((a, b) => b.price - a.price),
  };
}

/**
 * 流動性掃除（Sweep / Stop Hunt）偵測：
 * 影線穿越擺動點，但收盤收回 → 視為掃除。
 */
function detectSweeps(candles, swings, opts = {}) {
  const { lookforward = 60, minWickAtr = 0.05 } = opts;
  const a = atr(candles, 14);
  const sweeps = [];
  for (const s of swings) {
    const limit = Math.min(candles.length - 1, s.index + lookforward);
    for (let i = s.index + 2; i <= limit; i++) {
      const c = candles[i];
      const ref = a[i] || 1;
      if (s.type === 'high' && c.high > s.price) {
        const wick = c.high - Math.max(c.open, c.close);
        if (c.close < s.price && wick / ref >= minWickAtr) {
          sweeps.push(mkSweep('buyside', 'bear', s, i, c, (c.high - s.price) / ref));
        }
        break;
      }
      if (s.type === 'low' && c.low < s.price) {
        const wick = Math.min(c.open, c.close) - c.low;
        if (c.close > s.price && wick / ref >= minWickAtr) {
          sweeps.push(mkSweep('sellside', 'bull', s, i, c, (s.price - c.low) / ref));
        }
        break;
      }
    }
  }
  return sweeps.sort((x, y) => x.index - y.index);
}

function mkSweep(side, dir, swing, index, candle, depthAtr) {
  return {
    id: `sweep-${side}-${index}`,
    side,
    dir,
    index,
    time: candle.time,
    level: swing.price,
    extreme: side === 'buyside' ? candle.high : candle.low,
    depthAtr,
    strength: Math.min(100, 45 + depthAtr * 45),
  };
}

/**
 * 誘導（Inducement）：在最近一次結構事件的推動腿中，最後一個「反向次級擺動點」。
 * 價格通常會先取走這個流動性，再進入真正的 OB。
 */
function findInducement(candles, event, opts = {}) {
  if (!event) return null;
  const { strength = 2 } = opts;
  const minor = alternateSwings(detectSwings(candles, strength));
  const wantType = event.dir === 'bull' ? 'low' : 'high';
  const inRange = minor.filter(
    (s) => s.type === wantType && s.index > Math.min(event.fromIndex, event.breakIndex) && s.index < event.breakIndex,
  );
  const idm = inRange[inRange.length - 1];
  if (!idm) return null;
  let taken = false;
  let takenIndex = null;
  for (let i = event.breakIndex + 1; i < candles.length; i++) {
    const c = candles[i];
    if (wantType === 'low' ? c.low <= idm.price : c.high >= idm.price) {
      taken = true;
      takenIndex = i;
      break;
    }
  }
  return {
    id: `idm-${idm.index}`,
    dir: event.dir,
    price: idm.price,
    index: idm.index,
    time: idm.time,
    taken,
    takenIndex,
  };
}

/**
 * 流動性熱力圖：把所有池依價格分箱，量化上下方的流動性密度。
 * 用來回答：「價格接下來最可能被吸引到哪一側？」
 */
function liquidityBias(pools, price) {
  const above = pools.filter((p) => !p.swept && p.price > price);
  const below = pools.filter((p) => !p.swept && p.price < price);
  const w = (arr) => arr.reduce((s, p) => s + p.strength / Math.max(1, Math.abs(p.price - price) / price * 100), 0);
  const up = w(above);
  const down = w(below);
  const total = up + down || 1;
  return {
    up,
    down,
    upPct: (up / total) * 100,
    downPct: (down / total) * 100,
    bias: up > down * 1.2 ? 'buyside' : down > up * 1.2 ? 'sellside' : 'balanced',
  };
}


/* ===== src/smc/zones.js ===== */
/**
 * 溢價／折價（Premium / Discount）與最佳進場區（OTE）
 *
 * 機構思維：只在「折價」買、在「溢價」賣。
 *  - Equilibrium (EQ) = 交易區間 50%
 *  - Discount  = EQ 以下（買方有利）
 *  - Premium   = EQ 以上（賣方有利）
 *  - OTE (Optimal Trade Entry) = 回撤 0.618 ~ 0.79 之間的黃金區
 */
const FIB_LEVELS = [0, 0.236, 0.382, 0.5, 0.618, 0.705, 0.79, 1];

/**
 * @param {{high:number,low:number,direction:'up'|'down'}} range
 * @param {number} price
 */
function premiumDiscount(range, price) {
  if (!range) return null;
  const { high, low } = range;
  const span = high - low;
  if (!(span > 0)) return null;
  const rawRatio = (price - low) / span;
  const ratio = Math.max(0, Math.min(1, rawRatio));
  const eq = (high + low) / 2;
  let zone = 'equilibrium';
  if (ratio > 0.55) zone = 'premium';
  else if (ratio < 0.45) zone = 'discount';
  return {
    high,
    low,
    eq,
    span,
    ratio,
    rawRatio,
    outside: rawRatio > 1 ? 'above' : rawRatio < 0 ? 'below' : null,
    pct: ratio * 100,
    zone,
    /** 對多方有利 = 折價；對空方有利 = 溢價 */
    favors: zone === 'discount' ? 'long' : zone === 'premium' ? 'short' : 'neutral',
    deepDiscount: ratio < 0.25,
    deepPremium: ratio > 0.75,
  };
}

/** 回撤斐波那契等級（依區間方向計算） */
function fibLevels(range) {
  if (!range) return [];
  const { high, low, direction } = range;
  return FIB_LEVELS.map((l) => ({
    level: l,
    price: direction === 'up' ? high - (high - low) * l : low + (high - low) * l,
    label: l === 0.5 ? 'EQ' : `${(l * 100).toFixed(1)}%`,
  }));
}

/** OTE 區（0.618–0.79 回撤） */
function oteZone(range) {
  if (!range) return null;
  const { high, low, direction } = range;
  const span = high - low;
  if (!(span > 0)) return null;
  if (direction === 'up') {
    return { dir: 'long', top: high - span * 0.618, bottom: high - span * 0.79, sweet: high - span * 0.705 };
  }
  return { dir: 'short', top: low + span * 0.79, bottom: low + span * 0.618, sweet: low + span * 0.705 };
}

/**
 * 綜合 POI（Point of Interest）清單：把 OB、FVG、OTE、流動性整合成排序後的關鍵價位。
 */
function buildPois({ orderBlocks = [], gaps = [], ote = null, price, bias = 'neutral' }) {
  const pois = [];
  for (const b of orderBlocks) {
    const dir = b.state === 'breaker' ? b.breakerDir : b.dir;
    pois.push({
      id: b.id,
      type: b.state === 'breaker' ? 'Breaker' : 'Order Block',
      dir,
      top: b.top,
      bottom: b.bottom,
      mid: b.mid,
      score: b.score,
      state: b.state,
      scale: b.scale,
      meta: b,
    });
  }
  for (const g of gaps) {
    const dir = g.state === 'inverted' ? g.invertedDir : g.dir;
    pois.push({
      id: g.id,
      type: g.kind === 'vi' ? 'Volume Imbalance' : g.state === 'inverted' ? 'Inversion FVG' : 'FVG',
      dir,
      top: g.top,
      bottom: g.bottom,
      mid: g.mid,
      score: g.score,
      state: g.state,
      meta: g,
    });
  }
  if (ote) {
    pois.push({
      id: 'ote',
      type: 'OTE',
      dir: ote.dir === 'long' ? 'bull' : 'bear',
      top: ote.top,
      bottom: ote.bottom,
      mid: ote.sweet,
      score: 60,
      state: 'zone',
    });
  }
  const biasDir = bias === 'bullish' ? 'bull' : bias === 'bearish' ? 'bear' : null;
  return pois
    .map((p) => ({
      ...p,
      distancePct: ((p.mid - price) / price) * 100,
      aligned: biasDir ? p.dir === biasDir : true,
      // 綜合分數：品質分 + 與偏向一致 + 距離現價越近越優先
      rank: (p.score || 50) + (biasDir && p.dir === biasDir ? 12 : -8) - Math.min(25, Math.abs((p.mid - price) / price) * 900),
    }))
    .sort((a, b) => b.rank - a.rank);
}

/**
 * 區塊匯流（Confluence Stack）：多個 POI 價格重疊 → 強度倍增。
 */
function stackConfluence(pois, tolerancePct = 0.12) {
  const stacks = [];
  for (const p of pois) {
    const s = stacks.find(
      (st) => st.dir === p.dir && Math.abs(st.mid - p.mid) / Math.max(1e-9, p.mid) * 100 <= tolerancePct,
    );
    if (s) {
      s.members.push(p);
      s.top = Math.max(s.top, p.top);
      s.bottom = Math.min(s.bottom, p.bottom);
      s.mid = (s.top + s.bottom) / 2;
      s.score = Math.min(100, s.score + p.score * 0.35);
    } else {
      stacks.push({ dir: p.dir, top: p.top, bottom: p.bottom, mid: p.mid, score: p.score, members: [p] });
    }
  }
  return stacks.sort((a, b) => b.score - a.score);
}


/* ===== src/smc/sessions.js ===== */
/**
 * 交易時段（Killzones）與關鍵時間價位
 *
 * ICT 的時間框架（UTC）：
 *  - Asia      00:00–06:00（亞洲盤整，形成 Asia Range）
 *  - London KZ 07:00–10:00（倫敦殺區，常見掃亞洲高低）
 *  - NY AM KZ  12:00–15:00（紐約早盤殺區，主要行情）
 *  - NY PM KZ  17:30–20:00（紐約午盤，常見反轉）
 *
 * 另提供 PDH/PDL（前日高低）、PWH/PWL（前週高低）、PMH/PML（前月高低）。
 */
const SESSIONS = [
  { id: 'asia', name: 'Asia', nameZh: '亞洲盤', startH: 0, endH: 6, color: '#2b6cb0' },
  { id: 'london', name: 'London KZ', nameZh: '倫敦殺區', startH: 7, endH: 10, color: '#2f855a' },
  { id: 'nyam', name: 'New York AM KZ', nameZh: '紐約早盤殺區', startH: 12, endH: 15, color: '#b7791f' },
  { id: 'nypm', name: 'New York PM KZ', nameZh: '紐約午盤殺區', startH: 17.5, endH: 20, color: '#805ad5' },
];

const dayKey = (ts) => {
  const d = new Date(ts);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
};
function utcHourFloat(ts) {
  const d = new Date(ts);
  return d.getUTCHours() + d.getUTCMinutes() / 60;
}
function sessionOf(ts) {
  const h = utcHourFloat(ts);
  return SESSIONS.find((s) => h >= s.startH && h < s.endH) || null;
}

/** 計算每個交易日各時段的高低點（可作為流動性目標） */
function sessionRanges(candles, { maxDays = 5 } = {}) {
  const byDay = new Map();
  for (const c of candles) {
    const k = dayKey(c.time);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(c);
  }
  const days = [...byDay.keys()].sort((a, b) => a - b).slice(-maxDays);
  const out = [];
  for (const day of days) {
    const list = byDay.get(day);
    for (const s of SESSIONS) {
      const inSession = list.filter((c) => {
        const h = utcHourFloat(c.time);
        return h >= s.startH && h < s.endH;
      });
      if (!inSession.length) continue;
      const high = Math.max(...inSession.map((c) => c.high));
      const low = Math.min(...inSession.map((c) => c.low));
      out.push({
        id: `${s.id}-${day}`,
        session: s.id,
        name: s.name,
        nameZh: s.nameZh,
        color: s.color,
        day,
        start: inSession[0].time,
        end: inSession[inSession.length - 1].time,
        high,
        low,
        mid: (high + low) / 2,
      });
    }
  }
  return out;
}

/** 依較大週期彙整 K 線（用於取得前日／前週高低） */
function resample(candles, bucketFn) {
  const map = new Map();
  for (const c of candles) {
    const k = bucketFn(c.time);
    const cur = map.get(k);
    if (!cur) {
      map.set(k, { time: k, open: c.open, high: c.high, low: c.low, close: c.close, volume: c.volume || 0 });
    } else {
      cur.high = Math.max(cur.high, c.high);
      cur.low = Math.min(cur.low, c.low);
      cur.close = c.close;
      cur.volume += c.volume || 0;
    }
  }
  return [...map.values()].sort((a, b) => a.time - b.time);
}

const weekKey = (ts) => {
  const d = new Date(ts);
  const dow = (d.getUTCDay() + 6) % 7; // 週一為 0
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - dow);
};
const monthKey = (ts) => {
  const d = new Date(ts);
  return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
};

/** 關鍵時間價位：PDH/PDL、PWH/PWL、PMH/PML、今日開盤 */
function keyLevels(candles) {
  if (!candles.length) return [];
  const daily = resample(candles, dayKey);
  const weekly = resample(candles, weekKey);
  const monthly = resample(candles, monthKey);
  const levels = [];
  const push = (code, zh, en, price, color) => {
    if (price != null && isFinite(price)) levels.push({ code, zh, en, price, color });
  };
  const pd = daily[daily.length - 2];
  const pw = weekly[weekly.length - 2];
  const pm = monthly[monthly.length - 2];
  const today = daily[daily.length - 1];
  if (pd) {
    push('PDH', '前日高', 'Prev Day High', pd.high, '#e2b13c');
    push('PDL', '前日低', 'Prev Day Low', pd.low, '#e2b13c');
  }
  if (pw) {
    push('PWH', '前週高', 'Prev Week High', pw.high, '#3aa0ff');
    push('PWL', '前週低', 'Prev Week Low', pw.low, '#3aa0ff');
  }
  if (pm) {
    push('PMH', '前月高', 'Prev Month High', pm.high, '#b06ce8');
    push('PML', '前月低', 'Prev Month Low', pm.low, '#b06ce8');
  }
  if (today) push('DO', '今日開盤', 'Daily Open', today.open, '#8b97a8');
  return levels;
}


/* ===== src/smc/setups.js ===== */
/**
 * 交易計畫產生器（Trade Setup Builder）
 *
 * 把所有 SMC 元件組成一個「可執行、可驗證」的計畫：
 *   方向 → 進場區（POI）→ 停損（結構失效點）→ 三段目標（流動性）→ 風報比 → 匯流評分。
 *
 * 設計原則：所有判斷都必須「可解釋」，每一項匯流條件都附上通過與否及原因。
 */

const CHECKS = [
  { key: 'htfAlign', weight: 18, zh: '高週期偏向一致', en: 'HTF bias alignment' },
  { key: 'structure', weight: 15, zh: '進場週期已出現 CHoCH / BOS 確認', en: 'Entry TF structure confirmed' },
  { key: 'pdSide', weight: 12, zh: '價格位於正確的折價／溢價側', en: 'Correct premium/discount side' },
  { key: 'poiFresh', weight: 12, zh: '進場 POI 未被消耗（新鮮）', en: 'POI is unmitigated' },
  { key: 'sweep', weight: 12, zh: '進場前已掃除反向流動性', en: 'Liquidity swept before entry' },
  { key: 'stacked', weight: 10, zh: 'POI 具多重匯流（OB + FVG / OTE）', en: 'Stacked confluence at POI' },
  { key: 'rr', weight: 10, zh: '風報比達標', en: 'R:R meets minimum' },
  { key: 'target', weight: 10, zh: '目標方向存在未觸及流動性', en: 'Untapped liquidity at target' },
  { key: 'momentum', weight: 8, zh: '均線／動能方向支持', en: 'Momentum & MA support' },
  { key: 'killzone', weight: 5, zh: '位於高勝率交易時段（Killzone）', en: 'Inside a killzone' },
];

const TOTAL_WEIGHT = CHECKS.reduce((s, c) => s + c.weight, 0);

/**
 * @param {object} ctx 由 engine.js 提供的完整分析結果
 * @param {object} opts { minRR, htfBias, riskBufferAtr }
 */
function buildSetup(ctx, opts = {}) {
  const { minRR = 2, htfBias = null, riskBufferAtr = 0.35 } = opts;
  const { candles, price, atrValue, pois, stacks, structure, pd, liq, sweeps, indicators } = ctx;
  if (!candles.length) return null;

  // 方向 = 高週期偏向（權重 60%）+ 進場週期偏向（40%）。
  // 高週期定敘事，但若進場週期強烈反向，分數會被拉近中性 → 傾向不給計畫。
  const localScore = ctx.bias?.score ?? 0;
  const htfScore = htfBias?.score ?? localScore;
  const dirScore = htfBias ? htfScore * 0.6 + localScore * 0.4 : localScore;
  const conflict = htfBias ? Math.sign(htfScore) !== Math.sign(localScore) && Math.abs(htfScore) > 20 && Math.abs(localScore) > 20 : false;
  let dir = dirScore > 8 ? 'long' : dirScore < -8 ? 'short' : null;

  // 無明確方向時，改用「最近一次結構事件 + 折溢價」決定戰術方向
  if (!dir) {
    const le = structure.internal.lastEvent;
    if (le) dir = le.dir === 'bull' ? 'long' : 'short';
    else dir = pd?.favors === 'long' ? 'long' : 'short';
  }

  const wantDir = dir === 'long' ? 'bull' : 'bear';
  const candidates = pois.filter((p) => p.dir === wantDir && p.state !== 'mitigated' && p.state !== 'filled');
  // 多單找現價下方（或現價所在）的 POI；空單相反
  const zonePool = candidates.filter((p) => (dir === 'long' ? p.bottom <= price * 1.004 : p.top >= price * 0.996));
  // 只採用「價格搆得到」的 POI：太遠的區塊算不上可執行的計畫
  const reach = Math.max((atrValue || price * 0.004) * 5, price * 0.035);
  const nearby = zonePool.filter((p) => Math.abs(p.mid - price) <= reach);
  const poi = nearby[0] || zonePool[0] || candidates[0];
  if (!poi) {
    // 沒有可用 POI 時，回傳「為什麼沒有計畫」而不是沉默地消失
    return {
      none: true,
      dir,
      reasonZh: `目前偏向${dir === 'long' ? '做多' : '做空'}，但圖上沒有仍然有效的${dir === 'long' ? '需求' : '供給'}區（OB／FVG）可作為進場點。等待價格形成新的結構與 POI。`,
      reasonEn: `Bias is ${dir}, but there is no unmitigated ${dir === 'long' ? 'demand' : 'supply'} zone (OB/FVG) to trade from. Wait for new structure and a fresh POI.`,
    };
  }

  const inside = price <= poi.top && price >= poi.bottom;
  const entry = inside ? price : dir === 'long' ? Math.min(poi.top, price) : Math.max(poi.bottom, price);
  const entryZone = { top: poi.top, bottom: poi.bottom, mid: poi.mid };
  const buffer = (atrValue || (price * 0.002)) * riskBufferAtr;

  const structuralStop =
    dir === 'long'
      ? Math.min(poi.bottom, structure.internal.protectedLow?.price ?? poi.bottom)
      : Math.max(poi.top, structure.internal.protectedHigh?.price ?? poi.top);
  let stop = dir === 'long' ? structuralStop - buffer : structuralStop + buffer;

  // 停損不可過窄：至少 0.3 ATR，否則風報比會被灌水成不切實際的數字
  const minRisk = (atrValue || price * 0.004) * 0.3;
  if (Math.abs(entry - stop) < minRisk) stop = dir === 'long' ? entry - minRisk : entry + minRisk;

  const risk = Math.abs(entry - stop);
  if (!(risk > 0)) return null;

  const targets = pickTargets({ dir, entry, risk, ctx });
  const rr1 = targets[0] ? Math.abs(targets[0].price - entry) / risk : 0;
  const rrFinal = targets.length ? Math.abs(targets[targets.length - 1].price - entry) / risk : 0;

  const lastSweep = sweeps[sweeps.length - 1];
  const lastEvent = structure.internal.lastEvent;
  const kz = sessionOf(candles[candles.length - 1].time);
  const ema50 = lastVal(indicators.ema50);
  const ema200 = lastVal(indicators.ema200);
  const rsiVal = lastVal(indicators.rsi);

  const results = {
    htfAlign: htfBias ? (dir === 'long' ? htfBias.score > 5 : htfBias.score < -5) : (dir === 'long' ? dirScore > 0 : dirScore < 0),
    structure: !!lastEvent && (dir === 'long' ? lastEvent.dir === 'bull' : lastEvent.dir === 'bear'),
    pdSide: dir === 'long' ? (pd ? pd.ratio < 0.5 : false) : (pd ? pd.ratio > 0.5 : false),
    poiFresh: poi.state === 'fresh' || poi.state === 'zone',
    sweep: !!lastSweep && lastSweep.dir === wantDir && candles.length - lastSweep.index <= 30,
    stacked: (stacks.find((s) => s.dir === wantDir && overlap(s, poi))?.members?.length ?? 1) > 1,
    rr: rrFinal >= minRR,
    target: dir === 'long' ? liq.above.length > 0 : liq.below.length > 0,
    momentum:
      dir === 'long'
        ? (ema50 != null && price > ema50) || (rsiVal != null && rsiVal > 50)
        : (ema50 != null && price < ema50) || (rsiVal != null && rsiVal < 50),
    killzone: !!kz,
  };

  const checklist = CHECKS.map((c) => ({ ...c, ok: !!results[c.key] }));
  const raw = checklist.reduce((s, c) => s + (c.ok ? c.weight : 0), 0);
  const score = Math.round((raw / TOTAL_WEIGHT) * 100);
  const grade = score >= 80 ? 'A+' : score >= 68 ? 'A' : score >= 55 ? 'B' : score >= 42 ? 'C' : 'D';

  return {
    dir,
    conflict,
    side: dir === 'long' ? '做多 Long' : '做空 Short',
    poi,
    entry,
    entryZone,
    entryType: inside ? 'market' : 'limit',
    stop,
    risk,
    riskPct: (risk / entry) * 100,
    targets,
    rr1,
    rrFinal,
    score,
    grade,
    checklist,
    valid: score >= 42 && rrFinal >= Math.min(1.5, minRR),
    trend: structure.swing.trendLabel,
    killzone: kz,
    invalidation:
      dir === 'long'
        ? '價格以收盤價跌破 POI 下緣／受保護低點，多方劇本失效。'
        : '價格以收盤價突破 POI 上緣／受保護高點，空方劇本失效。',
    invalidationEn:
      dir === 'long'
        ? 'A close below the POI low / protected low invalidates the long thesis.'
        : 'A close above the POI high / protected high invalidates the short thesis.',
    notes: buildNotes({ dir, poi, pd, lastEvent, lastSweep, ctx, conflict }),
  };
}

function overlap(a, b) {
  return a.bottom <= b.top && b.bottom <= a.top;
}

function lastVal(arr) {
  if (!arr) return null;
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return arr[i];
  return null;
}

/** 目標優先順序：最近未觸及流動性 → 次級流動性 → 區間反向極值 / 1:3 延伸 */
function pickTargets({ dir, entry, risk, ctx }) {
  const { liq, range, price, keyLevels } = ctx;
  const pool = dir === 'long' ? liq.above : liq.below;
  const out = [];
  const seen = new Set();
  const add = (p, label, labelEn) => {
    if (p == null || !isFinite(p)) return;
    if (dir === 'long' ? p <= entry + risk * 0.3 : p >= entry - risk * 0.3) return;
    const key = p.toFixed(8);
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ price: p, label, labelEn, rr: Math.abs(p - entry) / risk });
  };

  pool.slice(0, 2).forEach((p, i) =>
    add(p.price, p.equal ? `等${dir === 'long' ? '高' : '低'}流動性` : `擺動${dir === 'long' ? '高' : '低'}流動性`, p.equal ? 'Equal-level liquidity' : 'Swing liquidity'),
  );
  const kl = (keyLevels || [])
    .filter((l) => (dir === 'long' ? l.price > price : l.price < price))
    .sort((a, b) => (dir === 'long' ? a.price - b.price : b.price - a.price))[0];
  if (kl) add(kl.price, `${kl.zh}（${kl.code}）`, `${kl.en} (${kl.code})`);
  if (range) add(dir === 'long' ? range.high : range.low, '區間極值', 'Range extreme');
  add(dir === 'long' ? entry + risk * 3 : entry - risk * 3, '1:3 延伸目標', '1:3 extension');

  // 過濾不切實際的目標：< 0.8R 太近沒有意義，> 12R 多半代表 POI 離現價太遠
  const sorted = out.sort((a, b) => a.rr - b.rr);
  const usable = sorted.filter((t) => t.rr >= 0.8 && t.rr <= 12);
  return (usable.length ? usable : sorted.slice(0, 1))
    .slice(0, 3)
    .map((t, i) => ({ ...t, name: `TP${i + 1}` }));
}

function buildNotes({ dir, poi, pd, lastEvent, lastSweep, ctx, conflict }) {
  const zh = [];
  const en = [];
  if (conflict) {
    zh.push('⚠ 高週期與進場週期方向分歧，屬於低品質環境，建議減碼或等待表態。');
    en.push('⚠ HTF and entry timeframe disagree — low-quality environment, reduce size or wait.');
  }
  if (lastEvent) {
    zh.push(`最近一次結構事件為 ${lastEvent.type}（${lastEvent.dir === 'bull' ? '看多' : '看空'}），突破價位 ${lastEvent.price.toFixed(2)}。`);
    en.push(`Latest structure event: ${lastEvent.type} (${lastEvent.dir}) breaking ${lastEvent.price.toFixed(2)}.`);
  }
  if (pd) {
    zh.push(`目前價格位於交易區間的 ${pd.pct.toFixed(1)}%（${pd.zone === 'premium' ? '溢價區' : pd.zone === 'discount' ? '折價區' : '均衡區'}）。`);
    en.push(`Price sits at ${pd.pct.toFixed(1)}% of the dealing range (${pd.zone}).`);
  }
  if (lastSweep) {
    zh.push(`最近一次流動性掃除發生在 ${lastSweep.side === 'buyside' ? '買方（前高之上）' : '賣方（前低之下）'}，深度 ${lastSweep.depthAtr.toFixed(2)} ATR。`);
    en.push(`Most recent sweep took ${lastSweep.side} liquidity, depth ${lastSweep.depthAtr.toFixed(2)} ATR.`);
  }
  zh.push(`建議在 ${poi.type} 區間（${poi.bottom.toFixed(2)} – ${poi.top.toFixed(2)}）等待反應後再進場，避免直接追價。`);
  en.push(`Wait for a reaction inside the ${poi.type} zone (${poi.bottom.toFixed(2)} – ${poi.top.toFixed(2)}) rather than chasing price.`);
  return { zh, en };
}

/** 部位大小計算（風險固定法） */
function positionSize({ accountSize, riskPct, entry, stop, leverage = 1 }) {
  const riskAmount = (accountSize * riskPct) / 100;
  const perUnit = Math.abs(entry - stop);
  if (!(perUnit > 0) || !(accountSize > 0)) return null;
  const qty = riskAmount / perUnit;
  const notional = qty * entry;
  return {
    riskAmount,
    qty,
    notional,
    marginRequired: notional / Math.max(1, leverage),
    leverageUsed: notional / Math.max(1e-9, accountSize),
    liquidationWarning: notional / Math.max(1, leverage) > accountSize,
  };
}


/* ===== src/smc/engine.js ===== */
/**
 * SMC 分析引擎 — 單一週期的完整分析流程
 *
 * 流程：K 線 → 擺動點 → 結構(BOS/CHoCH) → 流動性/掃除 → FVG → OB/Breaker
 *      → 折溢價/OTE → POI 排序 → 偏向評分 → 交易計畫
 *
 * 全部為純函式，不依賴瀏覽器，方便單元測試與回放（replay）重算。
 */
const DEFAULT_SETTINGS = {
  internalStrength: 2,
  swingStrength: 7,
  breakBy: 'close',        // 'close' | 'wick'
  obZoneMode: 'wick',      // 'wick' | 'body'
  minDisplacementAtr: 1.0,
  fvgMinAtr: 0.25,
  liquidityTolAtr: 0.18,
  minRR: 2,
  riskBufferAtr: 0.35,
  maxPois: 14,
  showVolumeImbalance: true,
};

/**
 * @param {any[]} candles OHLCV（時間升冪）
 * @param {object} settings
 */
function analyze(candles, settings = {}) {
  const cfg = { ...DEFAULT_SETTINGS, ...settings };
  if (!candles || candles.length < 30) {
    return { empty: true, candles: candles || [], settings: cfg };
  }

  const price = candles[candles.length - 1].close;
  const atrArr = atr(candles, 14);
  const atrValue = atrArr[atrArr.length - 1] || price * 0.004;

  const swings = structuredSwings(candles, cfg.swingStrength);
  const microSwings = structuredSwings(candles, cfg.internalStrength);
  const structure = dualStructure(candles, {
    internalStrength: cfg.internalStrength,
    swingStrength: cfg.swingStrength,
    breakBy: cfg.breakBy,
  });

  const sweeps = detectSweeps(candles, microSwings, { minWickAtr: 0.05 });
  const gaps = detectFVG(candles, {
    minSizeAtr: cfg.fvgMinAtr,
    includeVolumeImbalance: cfg.showVolumeImbalance,
  });

  const allEvents = [...structure.swing.events, ...structure.internal.events].sort(
    (a, b) => a.breakIndex - b.breakIndex,
  );
  const orderBlocks = detectOrderBlocks(candles, allEvents, {
    zoneMode: cfg.obZoneMode,
    minDisplacementAtr: cfg.minDisplacementAtr,
    fvgList: gaps,
    sweeps,
  });

  const pools = liquidityPools(candles, swings.concat(microSwings).sort((a, b) => a.index - b.index), {
    tolAtr: cfg.liquidityTolAtr,
  });
  const liq = untappedLiquidity(pools, price);
  const liqBias = liquidityBias(pools, price);
  const inducement = findInducement(candles, structure.internal.lastEvent, { strength: cfg.internalStrength });

  const range = dealingRange(swings, candles);
  const pd = premiumDiscount(range, price);
  const ote = oteZone(range);
  const fib = fibLevels(range);

  const closes = candles.map((c) => c.close);
  const indicators = {
    ema20: ema(closes, 20),
    ema50: ema(closes, 50),
    ema200: ema(closes, 200),
    rsi: rsi(candles, 14),
    atr: atrArr,
    rvol: relativeVolume(candles, 20),
    ...sessionVwap(candles),
    volumeProfile: volumeProfile(candles.slice(-200)),
  };

  const bias = computeBias({ structure, pd, liqBias, indicators, price });

  const activeOb = activeOrderBlocks(orderBlocks, price);
  const activeFvg = activeGaps(gaps, price);
  const pois = buildPois({
    orderBlocks: activeOb,
    gaps: activeFvg,
    ote,
    price,
    bias: bias.label,
  }).slice(0, cfg.maxPois);
  const stacks = stackConfluence(pois);

  const ctx = {
    candles,
    price,
    atrValue,
    swings,
    microSwings,
    structure,
    sweeps,
    gaps,
    orderBlocks,
    pools,
    liq,
    liqBias,
    inducement,
    range,
    pd,
    ote,
    fib,
    indicators,
    bias,
    pois,
    stacks,
    keyLevels: keyLevels(candles),
    sessions: sessionRanges(candles, { maxDays: 4 }),
    currentSession: sessionOf(candles[candles.length - 1].time),
    settings: cfg,
  };

  ctx.setup = buildSetup(ctx, { minRR: cfg.minRR, riskBufferAtr: cfg.riskBufferAtr, htfBias: settings.htfBias || null });
  return ctx;
}

/**
 * 偏向評分（-100 ~ +100）— 每個因子都可解釋。
 */
function computeBias({ structure, pd, liqBias, indicators, price }) {
  const factors = [];
  const add = (key, zh, en, score, detail) => factors.push({ key, zh, en, score, detail });

  const sw = structure.swing;
  add('swingStructure', '擺動結構', 'Swing structure',
    sw.trend * 34,
    sw.lastEvent ? `${sw.lastEvent.type} ${sw.lastEvent.dir}` : 'n/a');

  const it = structure.internal;
  add('internalStructure', '內部結構', 'Internal structure',
    it.trend * 16,
    it.lastEvent ? `${it.lastEvent.type} ${it.lastEvent.dir}` : 'n/a');

  if (pd) {
    // 折價區對多方有利，但若處於極端溢價則偏空
    const pdScore = (0.5 - pd.ratio) * 24;
    add('premiumDiscount', '折溢價位置', 'Premium/Discount', pdScore, `${pd.pct.toFixed(1)}% ${pd.zone}`);
  }

  if (liqBias) {
    const lb = ((liqBias.upPct - liqBias.downPct) / 100) * 12;
    add('liquidity', '流動性吸引', 'Liquidity draw', lb, liqBias.bias);
  }

  const ema50 = lastDefined(indicators.ema50);
  const ema200 = lastDefined(indicators.ema200);
  if (ema50 != null) add('ema50', '價格 vs EMA50', 'Price vs EMA50', price > ema50 ? 8 : -8, null);
  if (ema200 != null) add('ema200', '價格 vs EMA200', 'Price vs EMA200', price > ema200 ? 10 : -10, null);

  const r = lastDefined(indicators.rsi);
  if (r != null) add('rsi', 'RSI 動能', 'RSI momentum', ((r - 50) / 50) * 8, r.toFixed(1));

  const raw = factors.reduce((s, f) => s + f.score, 0);
  const score = Math.max(-100, Math.min(100, Math.round(raw)));
  const label = score >= 25 ? 'bullish' : score <= -25 ? 'bearish' : 'neutral';
  return {
    score,
    label,
    labelZh: label === 'bullish' ? '看多' : label === 'bearish' ? '看空' : '中性/盤整',
    strength: Math.min(100, Math.abs(score)),
    factors: factors.sort((a, b) => Math.abs(b.score) - Math.abs(a.score)),
  };
}

function lastDefined(arr) {
  if (!arr) return null;
  for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return arr[i];
  return null;
}

/**
 * 多週期分析（Multi-Timeframe / Top-Down Analysis）
 *
 * SMC 的標準流程：
 *   1. HTF（1D/4H）定「敘事」與流動性目標
 *   2. MTF（1H/15m）定「結構」與 POI
 *   3. LTF（5m/1m）找「進場」確認（CHoCH + FVG）
 *
 * 本模組把各週期偏向加權彙整，並輸出一致性（Alignment）指標。
 */
const TF_ORDER = ['1m', '3m', '5m', '15m', '30m', '1h', '2h', '4h', '6h', '12h', '1d', '3d', '1w'];

/** 週期權重：越高週期影響越大 */
const TF_WEIGHT = {
  '1m': 0.4, '3m': 0.5, '5m': 0.7, '15m': 1.0, '30m': 1.2,
  '1h': 1.6, '2h': 1.8, '4h': 2.2, '6h': 2.3, '12h': 2.6,
  '1d': 3.0, '3d': 3.2, '1w': 3.4,
};

/** 依進場週期推薦的 HTF / LTF 組合（採用交易員實務上的標準配對） */
const HTF_MAP = {
  '1m': '15m', '3m': '30m', '5m': '1h', '15m': '4h', '30m': '4h',
  '1h': '1d', '2h': '1d', '4h': '1d', '6h': '1w', '12h': '1w',
  '1d': '1w', '3d': '1w', '1w': '1w',
};
const LTF_MAP = {
  '1m': '1m', '3m': '1m', '5m': '1m', '15m': '5m', '30m': '5m',
  '1h': '15m', '2h': '15m', '4h': '1h', '6h': '1h', '12h': '1h',
  '1d': '4h', '3d': '4h', '1w': '1d',
};
function tfSuite(interval) {
  return {
    htf: HTF_MAP[interval] || '4h',
    mtf: interval,
    ltf: LTF_MAP[interval] || '5m',
  };
}

/**
 * @param {Array<{interval:string, bias:{score:number,label:string}, structure:any, pd:any}>} rows
 */
function aggregateBias(rows) {
  if (!rows.length) return null;
  let wsum = 0;
  let total = 0;
  for (const r of rows) {
    const w = TF_WEIGHT[r.interval] ?? 1;
    wsum += w;
    total += (r.bias?.score ?? 0) * w;
  }
  const score = Math.round(total / (wsum || 1));
  const bulls = rows.filter((r) => (r.bias?.score ?? 0) > 10).length;
  const bears = rows.filter((r) => (r.bias?.score ?? 0) < -10).length;
  const dominant = Math.max(bulls, bears);
  const alignment = Math.round((dominant / rows.length) * 100);
  const label = score >= 25 ? 'bullish' : score <= -25 ? 'bearish' : 'neutral';
  return {
    score,
    label,
    labelZh: label === 'bullish' ? '看多' : label === 'bearish' ? '看空' : '中性',
    alignment,
    bulls,
    bears,
    neutrals: rows.length - bulls - bears,
    rows,
    conflict: bulls > 0 && bears > 0 && Math.abs(bulls - bears) <= 1,
  };
}

/**
 * 由上而下的文字敘事（可直接貼進交易日誌）
 */
function narrative(rows, agg, lang = 'zh') {
  if (!agg) return '';
  const htf = rows[rows.length - 1];
  const ltf = rows[0];
  if (lang === 'zh') {
    const parts = [
      `整體偏向：${agg.labelZh}（分數 ${agg.score}，一致性 ${agg.alignment}%）。`,
      htf ? `高週期 ${htf.interval} 為 ${zh(htf.bias.label)}，結構 ${htf.structure?.swing?.trendLabel ?? '—'}。` : '',
      ltf ? `進場週期 ${ltf.interval} 為 ${zh(ltf.bias.label)}；${ltf.pd ? `價格位於區間 ${ltf.pd.pct.toFixed(0)}%（${zhZone(ltf.pd.zone)}）。` : ''}` : '',
      agg.conflict ? '⚠️ 各週期方向分歧，建議降低風險或等待高週期表態。' : '各週期方向大致一致，可依計畫執行。',
    ];
    return parts.filter(Boolean).join('\n');
  }
  const parts = [
    `Overall bias: ${agg.label} (score ${agg.score}, alignment ${agg.alignment}%).`,
    htf ? `HTF ${htf.interval} is ${htf.bias.label}, swing structure ${htf.structure?.swing?.trendLabel ?? '—'}.` : '',
    ltf ? `Entry TF ${ltf.interval} is ${ltf.bias.label}; ${ltf.pd ? `price at ${ltf.pd.pct.toFixed(0)}% of range (${ltf.pd.zone}).` : ''}` : '',
    agg.conflict ? '⚠️ Timeframes disagree — reduce risk or wait for HTF confirmation.' : 'Timeframes broadly agree — execute the plan.',
  ];
  return parts.filter(Boolean).join('\n');
}

const zh = (l) => (l === 'bullish' ? '看多' : l === 'bearish' ? '看空' : '中性');
const zhZone = (z) => (z === 'premium' ? '溢價' : z === 'discount' ? '折價' : '均衡');


/* ===== src/smc/backtest.js ===== */
/**
 * 訊號回測（Signal Backtest）
 *
 * 以「逐步重算」的方式驗證本引擎產生的計畫在歷史上的表現：
 *  - 每隔 step 根 K 棒，用當下可見的資料重新分析（避免未來函數）
 *  - 若產生有效計畫：市價單立即成交；限價單則等待價格回到進場區（最多 entryWindow 根）
 *  - 成交後模擬價格先碰 TP1 還是先碰 SL
 *  - 統計勝率、平均 R、期望值、最大連敗
 *
 * 注意：這是「訊號品質檢驗」而非完整策略回測，不含手續費滑價與部位管理。
 */

/**
 * @param {any[]} candles
 * @param {object} opts
 * @param {(p:{done:number,total:number})=>void} [onProgress]
 */
async function backtest(candles, opts = {}, onProgress) {
  const {
    warmup = 260,
    step = 5,
    horizon = 90,
    minScore = 55,
    entryWindow = 24,
    settings = {},
    chunkSize = 12,
  } = opts;

  const trades = [];
  const starts = [];
  for (let i = warmup; i < candles.length - 5; i += step) starts.push(i);

  let processed = 0;
  let lastExitIndex = -1;

  for (let c = 0; c < starts.length; c += chunkSize) {
    const slice = starts.slice(c, c + chunkSize);
    for (const i of slice) {
      processed++;
      if (i <= lastExitIndex) continue; // 同一時間只持有一筆，避免重複計數
      const visible = candles.slice(Math.max(0, i - 600), i + 1);
      const res = analyze(visible, settings);
      const setup = res.setup;
      if (!setup || setup.none || !setup.valid || setup.score < minScore) continue;

      const dir = setup.dir;
      const entry = setup.entry;
      const stop = setup.stop;
      const tp = setup.targets[0]?.price;
      if (!tp) continue;

      // 限價單：等待價格回到進場區（最多 entryWindow 根）。沒等到就不算一筆交易。
      let entryIndex = i;
      if (setup.entryType !== 'market') {
        entryIndex = null;
        for (let j = i + 1; j <= Math.min(candles.length - 1, i + entryWindow); j++) {
          const k = candles[j];
          const filled = dir === 'long' ? k.low <= entry : k.high >= entry;
          // 進場前就先反向跑掉（劇本失效）→ 放棄
          const invalidated = dir === 'long' ? k.close < stop : k.close > stop;
          if (filled) { entryIndex = j; break; }
          if (invalidated) break;
        }
        if (entryIndex == null) continue;
      }

      let outcome = null;
      let exitIndex = null;
      for (let j = entryIndex + 1; j <= Math.min(candles.length - 1, entryIndex + horizon); j++) {
        const k = candles[j];
        const hitStop = dir === 'long' ? k.low <= stop : k.high >= stop;
        const hitTp = dir === 'long' ? k.high >= tp : k.low <= tp;
        if (hitStop) { outcome = 'stop'; exitIndex = j; break; } // 同根同時觸及時保守假設先停損
        if (hitTp) { outcome = 'target'; exitIndex = j; break; }
      }
      if (!outcome) { outcome = 'timeout'; exitIndex = Math.min(candles.length - 1, entryIndex + horizon); }
      const risk = Math.abs(entry - stop) || 1;
      const exitPrice = outcome === 'target' ? tp : outcome === 'stop' ? stop : candles[exitIndex].close;
      const r = (dir === 'long' ? exitPrice - entry : entry - exitPrice) / risk;
      lastExitIndex = exitIndex;
      trades.push({
        index: i,
        entryIndex,
        time: candles[entryIndex].time,
        dir,
        entryType: setup.entryType,
        entry,
        stop,
        target: tp,
        outcome,
        r,
        score: setup.score,
        grade: setup.grade,
        exitIndex,
        exitTime: candles[exitIndex].time,
        bars: exitIndex - entryIndex,
      });
    }
    if (onProgress) onProgress({ done: processed, total: starts.length });
    await new Promise((r) => setTimeout(r, 0)); // 讓出主執行緒，保持 UI 流暢
  }

  return { trades, stats: summarize(trades) };
}
function summarize(trades) {
  const n = trades.length;
  if (!n) return { count: 0 };
  const wins = trades.filter((t) => t.r > 0);
  const losses = trades.filter((t) => t.r <= 0);
  const totalR = trades.reduce((s, t) => s + t.r, 0);
  const grossWin = wins.reduce((s, t) => s + t.r, 0);
  const grossLoss = Math.abs(losses.reduce((s, t) => s + t.r, 0));
  let equity = 0;
  let peak = 0;
  let maxDd = 0;
  let streak = 0;
  let worstStreak = 0;
  const curve = [];
  for (const t of trades) {
    equity += t.r;
    curve.push({ time: t.exitTime, equity });
    peak = Math.max(peak, equity);
    maxDd = Math.max(maxDd, peak - equity);
    if (t.r <= 0) { streak++; worstStreak = Math.max(worstStreak, streak); }
    else streak = 0;
  }
  return {
    count: n,
    wins: wins.length,
    losses: losses.length,
    winRate: (wins.length / n) * 100,
    totalR,
    expectancy: totalR / n,
    avgWin: wins.length ? grossWin / wins.length : 0,
    avgLoss: losses.length ? -grossLoss / losses.length : 0,
    profitFactor: grossLoss ? grossWin / grossLoss : grossWin > 0 ? Infinity : 0,
    maxDrawdownR: maxDd,
    maxLossStreak: worstStreak,
    avgBars: trades.reduce((s, t) => s + t.bars, 0) / n,
    curve,
    byGrade: groupBy(trades, (t) => t.grade),
    byDir: groupBy(trades, (t) => t.dir),
  };
}

function groupBy(trades, fn) {
  const map = new Map();
  for (const t of trades) {
    const k = fn(t);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(t);
  }
  return [...map.entries()]
    .map(([k, list]) => ({
      key: k,
      count: list.length,
      winRate: (list.filter((t) => t.r > 0).length / list.length) * 100,
      avgR: list.reduce((s, t) => s + t.r, 0) / list.length,
    }))
    .sort((a, b) => b.count - a.count);
}

/** 座標換算：K 棒索引 ↔ 像素、價格 ↔ 像素 */
function createScales({ width, height, padding, barsVisible, rightIndex, min, max, logScale = false }) {
  const plotW = width - padding.right;
  const plotH = height - padding.top - padding.bottom;
  const barWidth = plotW / barsVisible;
  const leftIndex = rightIndex - barsVisible;

  const toLog = (v) => Math.log(Math.max(1e-12, v));
  const lo = logScale ? toLog(min) : min;
  const hi = logScale ? toLog(max) : max;
  const span = hi - lo || 1;

  return {
    barWidth,
    leftIndex,
    rightIndex,
    plotW,
    plotH,
    x: (i) => (i - leftIndex) * barWidth + barWidth / 2,
    xToIndex: (px) => px / barWidth + leftIndex - 0.5,
    y: (p) => {
      const v = logScale ? toLog(p) : p;
      return padding.top + (1 - (v - lo) / span) * plotH;
    },
    yToPrice: (py) => {
      const t = 1 - (py - padding.top) / plotH;
      const v = lo + t * span;
      return logScale ? Math.exp(v) : v;
    },
    min,
    max,
  };
}

/**
 * 自動計算可視範圍的價格上下界。
 * extra（停損／目標等水平線）只有落在合理範圍內才納入，
 * 否則一個很遠的目標會把 K 棒壓成一條線。
 */
function autoRange(candles, from, to, extra = [], maxExpand = 0.45) {
  let min = Infinity;
  let max = -Infinity;
  for (let i = Math.max(0, Math.floor(from)); i <= Math.min(candles.length - 1, Math.ceil(to)); i++) {
    const c = candles[i];
    if (!c) continue;
    if (c.low < min) min = c.low;
    if (c.high > max) max = c.high;
  }
  if (!isFinite(min) || !isFinite(max)) return { min: 0, max: 1 };
  const span = max - min || max * 0.02 || 1;
  const loLimit = min - span * maxExpand;
  const hiLimit = max + span * maxExpand;
  for (const v of extra) {
    if (v == null || !isFinite(v)) continue;
    if (v < loLimit || v > hiLimit) continue;
    if (v < min) min = v;
    if (v > max) max = v;
  }
  const pad = (max - min) * 0.08 || max * 0.01 || 1;
  return { min: min - pad, max: max + pad };
}

/** 產生「好看」的價格刻度 */
function priceTicks(min, max, count = 6) {
  const span = max - min;
  if (!(span > 0)) return [];
  const rough = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  const step = (norm >= 5 ? 5 : norm >= 2 ? 2 : norm >= 1 ? 1 : 0.5) * mag;
  const first = Math.ceil(min / step) * step;
  const out = [];
  for (let v = first; v <= max; v += step) out.push(v);
  return out;
}

/** 時間軸刻度：依可視跨度自動選擇間隔 */
function timeTicks(candles, leftIndex, rightIndex, targetCount = 8) {
  const from = Math.max(0, Math.floor(leftIndex));
  const to = Math.min(candles.length - 1, Math.ceil(rightIndex));
  if (to <= from) return [];
  const visible = to - from;
  const stride = Math.max(1, Math.round(visible / targetCount));
  const out = [];
  for (let i = from; i <= to; i++) {
    if (i % stride === 0) out.push({ index: i, time: candles[i].time });
  }
  return out;
}
