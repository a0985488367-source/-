/**
 * SMC 疊圖層（Overlay Layers）
 * 每個函式都吃同一個 env：{ ctx, s(scales), t(theme), a(analysis), candles, layout, layers, lang }
 */


const RIGHT_EXTEND = 12; // 區塊往右延伸的 K 棒數

function clipPlot(env) {
  const { ctx, layout } = env;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, layout.padding.top, layout.width - layout.padding.right, layout.priceHeight);
  ctx.clip();
}

function tag(env, x, y, text, { bg, color, align = 'left', size = 10, pad = 3 }) {
  const { ctx } = env;
  ctx.save();
  ctx.font = `${size}px ui-monospace, SFMono-Regular, Menlo, monospace`;
  const w = ctx.measureText(text).width + pad * 2;
  const h = size + pad * 2 - 1;
  const rx = align === 'right' ? x - w : x;
  ctx.fillStyle = bg;
  roundRect(ctx, rx, y - h / 2, w, h, 2);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, rx + pad, y + 0.5);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function dashLine(ctx, x1, y1, x2, y2, dash = [4, 4], color, width = 1) {
  ctx.save();
  ctx.setLineDash(dash);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

/* ------------------------------------------------------------------ 交易時段 */
function drawSessions(env) {
  const { ctx, s, t, candles, layout } = env;
  clipPlot(env);
  let i = Math.max(1, Math.floor(s.leftIndex));
  const end = Math.min(candles.length - 1, Math.ceil(s.rightIndex));
  let cur = null;
  for (; i <= end; i++) {
    const h = utcHourFloat(candles[i].time);
    const sess = SESSIONS.find((x) => h >= x.startH && h < x.endH);
    if (sess && (!cur || cur.id !== sess.id || i - cur.end > 1)) {
      if (cur) paint(cur);
      cur = { id: sess.id, sess, start: i, end: i };
    } else if (sess && cur) {
      cur.end = i;
    } else if (!sess && cur) {
      paint(cur);
      cur = null;
    }
  }
  if (cur) paint(cur);
  ctx.restore();

  function paint(seg) {
    const x1 = s.x(seg.start) - s.barWidth / 2;
    const x2 = s.x(seg.end) + s.barWidth / 2;
    ctx.fillStyle = hexToRgba(seg.sess.color, 0.07);
    ctx.fillRect(x1, layout.padding.top, x2 - x1, layout.priceHeight);
    if (x2 - x1 > 44 && !env.narrow) {
      ctx.save();
      ctx.font = '9px ui-monospace, monospace';
      ctx.fillStyle = hexToRgba(seg.sess.color, 0.85);
      ctx.fillText(env.lang === 'zh' ? seg.sess.nameZh : seg.sess.name, x1 + 4, layout.padding.top + 11);
      ctx.restore();
    }
  }
}

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* --------------------------------------------------------------- 折溢價區間 */
function drawPremiumDiscount(env) {
  const { ctx, s, t, a, layout, candles } = env;
  const range = a.range;
  if (!range) return;
  clipPlot(env);
  const x1 = s.x(Math.max(0, range.startIndex));
  const x2 = s.x(candles.length - 1 + RIGHT_EXTEND);
  const yHigh = s.y(range.high);
  const yLow = s.y(range.low);
  const yEq = s.y(range.equilibrium);
  ctx.fillStyle = t.premium;
  ctx.fillRect(x1, yHigh, x2 - x1, yEq - yHigh);
  ctx.fillStyle = t.discount;
  ctx.fillRect(x1, yEq, x2 - x1, yLow - yEq);
  dashLine(ctx, x1, yEq, x2, yEq, [6, 4], t.eq, 1);
  dashLine(ctx, x1, yHigh, x2, yHigh, [2, 3], t.eq, 1);
  dashLine(ctx, x1, yLow, x2, yLow, [2, 3], t.eq, 1);
  tag(env, x1 + 4, yEq, 'EQ 50%', { bg: t.tagBg, color: t.text, size: 9 });
  if (!env.narrow) {
    tag(env, x1 + 4, yHigh + 8, env.lang === 'zh' ? '溢價 Premium' : 'Premium', { bg: 'transparent', color: t.textDim, size: 9 });
    tag(env, x1 + 4, yLow - 8, env.lang === 'zh' ? '折價 Discount' : 'Discount', { bg: 'transparent', color: t.textDim, size: 9 });
  }
  ctx.restore();
}
function drawOte(env) {
  const { ctx, s, t, a, candles } = env;
  if (!a.ote) return;
  clipPlot(env);
  const x1 = s.x(Math.max(0, a.range?.startIndex ?? 0));
  const x2 = s.x(candles.length - 1 + RIGHT_EXTEND);
  const yTop = s.y(a.ote.top);
  const yBot = s.y(a.ote.bottom);
  ctx.fillStyle = t.ote;
  ctx.fillRect(x1, Math.min(yTop, yBot), x2 - x1, Math.abs(yBot - yTop));
  dashLine(ctx, x1, s.y(a.ote.sweet), x2, s.y(a.ote.sweet), [3, 3], t.ote.replace('0.14', '0.6'), 1);
  tag(env, x2 - 4, Math.min(yTop, yBot) + 8, 'OTE 0.62–0.79', { bg: t.tagBg, color: '#b89bff', align: 'right', size: 9 });
  ctx.restore();
}
function drawFib(env) {
  const { ctx, s, t, a, candles } = env;
  if (!a.fib?.length) return;
  clipPlot(env);
  const x1 = s.x(Math.max(0, a.range?.startIndex ?? 0));
  const x2 = s.x(candles.length - 1 + RIGHT_EXTEND);
  for (const f of a.fib) {
    const y = s.y(f.price);
    dashLine(ctx, x1, y, x2, y, [2, 6], t.textDim, 1);
    tag(env, x2 - 4, y, `${f.label}  ${fmtPrice(f.price)}`, { bg: 'transparent', color: t.textDim, align: 'right', size: 9 });
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------- FVG */

const MAX_FVG_DRAWN = 26;
const MAX_OB_DRAWN = 20;
const MAX_FVG_NARROW = 12;
const MAX_OB_NARROW = 10;
function drawFvg(env) {
  const { ctx, s, t, a, candles, layers } = env;
  clipPlot(env);
  // 只畫最近的 N 個缺口，避免整張圖被色塊淹沒
  const list = a.gaps.slice(-(env.narrow ? MAX_FVG_NARROW : MAX_FVG_DRAWN));
  for (const g of list) {
    if (g.kind === 'vi' && !layers.volumeImbalance) continue;
    if (g.state === 'filled' && !layers.filledZones) continue;
    const endIdx = g.invertedIndex ?? g.filledIndex ?? candles.length - 1 + RIGHT_EXTEND;
    const x1 = s.x(g.index);
    const x2 = s.x(endIdx);
    if (x2 < 0 || x1 > s.plotW) continue;
    const yTop = s.y(g.top);
    const yBot = s.y(g.bottom);
    const bull = (g.state === 'inverted' ? g.invertedDir : g.dir) === 'bull';
    ctx.fillStyle = bull ? t.fvgBull : t.fvgBear;
    ctx.fillRect(x1, yTop, Math.max(2, x2 - x1), yBot - yTop);
    ctx.strokeStyle = bull ? t.fvgBullEdge : t.fvgBearEdge;
    ctx.lineWidth = 0.6;
    ctx.setLineDash(g.state === 'inverted' ? [3, 3] : []);
    ctx.strokeRect(x1, yTop, Math.max(2, x2 - x1), yBot - yTop);
    ctx.setLineDash([]);
    if (Math.abs(yBot - yTop) > 11 && x2 - x1 > 34) {
      const label = g.state === 'inverted' ? 'IFVG' : g.kind === 'vi' ? 'VI' : 'FVG';
      tag(env, x1 + 3, (yTop + yBot) / 2, label, { bg: 'transparent', color: bull ? t.fvgBullEdge : t.fvgBearEdge, size: 9 });
    }
  }
  ctx.restore();
}

/* ---------------------------------------------------------------- Order Block */
function drawOrderBlocks(env) {
  const { ctx, s, t, a, candles, layers, lang } = env;
  clipPlot(env);
  const obs = [...a.orderBlocks]
    .sort((x, y) => y.index - x.index)
    .slice(0, env.narrow ? MAX_OB_NARROW : MAX_OB_DRAWN)
    .sort((x, y) => x.index - y.index);
  for (const b of obs) {
    if (b.state === 'breaker' && !layers.breakers) continue;
    if (b.state !== 'breaker' && !layers.orderBlocks) continue;
    if (b.state === 'mitigated' && !layers.filledZones) continue;
    const endIdx = b.state === 'breaker' && b.brokenIndex ? Math.max(b.brokenIndex, b.index + 3) : candles.length - 1 + RIGHT_EXTEND;
    const x1 = s.x(b.index);
    const x2 = s.x(endIdx);
    if (x2 < 0 || x1 > s.plotW) continue;
    const yTop = s.y(b.top);
    const yBot = s.y(b.bottom);
    const eff = b.state === 'breaker' ? b.breakerDir : b.dir;
    const bull = eff === 'bull';
    const alpha = b.state === 'mitigated' ? 0.35 : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = bull ? t.bullZone : t.bearZone;
    ctx.fillRect(x1, yTop, Math.max(2, x2 - x1), yBot - yTop);
    ctx.strokeStyle = bull ? t.bullEdge : t.bearEdge;
    ctx.lineWidth = b.scale === 'swing' ? 1.2 : 0.7;
    ctx.setLineDash(b.state === 'breaker' ? [5, 3] : []);
    ctx.strokeRect(x1, yTop, Math.max(2, x2 - x1), yBot - yTop);
    ctx.setLineDash([]);
    const name = b.state === 'breaker' ? 'BB' : b.scale === 'swing' ? 'OB+' : 'OB';
    if (x2 - x1 > 30) {
      tag(env, x2 - 4, yTop + 7, `${name} ${b.score}`, {
        bg: t.tagBg, color: bull ? t.bullEdge : t.bearEdge, align: 'right', size: 9,
      });
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ----------------------------------------------------------------- 流動性 */
function drawLiquidity(env) {
  const { ctx, s, t, a, candles, lang } = env;
  clipPlot(env);
  const minStrength = env.narrow ? 55 : 45;
  for (const p of a.pools) {
    if (p.touches < 2 && !p.equal && p.strength < minStrength) continue;
    if (env.narrow && p.swept) continue;
    const x1 = s.x(p.firstIndex);
    const x2 = p.swept ? s.x(p.sweptIndex) : s.x(candles.length - 1 + RIGHT_EXTEND);
    if (x2 < 0 || x1 > s.plotW) continue;
    const y = s.y(p.price);
    dashLine(ctx, x1, y, x2, y, p.swept ? [2, 4] : [6, 3], p.swept ? t.liquiditySwept : t.liquidity, p.equal ? 1.3 : 0.8);
    if (!p.swept && x2 - x1 > 40) {
      const lbl = `${p.side === 'buyside' ? 'BSL' : 'SSL'}${p.equal ? (p.side === 'buyside' ? ' EQH' : ' EQL') : ''}`;
      tag(env, x2 - 3, y, lbl, { bg: t.tagBg, color: t.liquidity, align: 'right', size: 9 });
    }
  }
  ctx.restore();
}
function drawSweeps(env) {
  const { ctx, s, t, a } = env;
  clipPlot(env);
  for (const sw of a.sweeps) {
    const x = s.x(sw.index);
    if (x < -20 || x > s.plotW + 20) continue;
    const y = s.y(sw.extreme);
    const up = sw.side === 'buyside';
    ctx.save();
    ctx.fillStyle = t.sweep;
    ctx.beginPath();
    const dy = up ? -6 : 6;
    ctx.moveTo(x, y + dy * 0.2);
    ctx.lineTo(x - 4, y + dy);
    ctx.lineTo(x + 4, y + dy);
    ctx.closePath();
    ctx.fill();
    ctx.font = '8px ui-monospace, monospace';
    ctx.fillText('×', x - 2, y + dy * 2.2);
    ctx.restore();
  }
  ctx.restore();
}

/* ------------------------------------------------------------------ 結構線 */
function drawStructure(env) {
  const { ctx, s, t, a, layers } = env;
  clipPlot(env);
  const events = env.narrow
    ? a.structure.swing.events.map((e) => ({ ...e, major: true }))
    : [...a.structure.swing.events.map((e) => ({ ...e, major: true })), ...a.structure.internal.events];
  for (const e of events) {
    const x1 = s.x(e.fromIndex);
    const x2 = s.x(e.breakIndex);
    if (x2 < 0 || x1 > s.plotW) continue;
    const y = s.y(e.price);
    const color = e.type === 'CHoCH' ? t.structureChoch : t.structureBos;
    dashLine(ctx, x1, y, x2, y, e.major ? [] : [3, 3], color, e.major ? 1.3 : 0.8);
    if (x2 - x1 > 24) {
      tag(env, x2 + 2, y, `${e.type}${e.major ? '' : 'ᵢ'}`, { bg: t.tagBg, color, size: e.major ? 10 : 9 });
    }
  }
  ctx.restore();
}
function drawSwingLabels(env) {
  const { ctx, s, t, a } = env;
  if (s.barWidth < 2.5) return;
  clipPlot(env);
  ctx.font = '9px ui-monospace, monospace';
  for (const sw of a.swings) {
    const x = s.x(sw.index);
    if (x < -10 || x > s.plotW + 10) continue;
    const y = s.y(sw.price) + (sw.type === 'high' ? -8 : 12);
    ctx.fillStyle = sw.label === 'HH' || sw.label === 'HL' ? t.up : sw.label === 'LL' || sw.label === 'LH' ? t.down : t.textDim;
    ctx.textAlign = 'center';
    ctx.fillText(sw.label || (sw.type === 'high' ? 'H' : 'L'), x, y);
  }
  ctx.textAlign = 'left';
  ctx.restore();
}
function drawInducement(env) {
  const { ctx, s, t, a, candles } = env;
  const idm = a.inducement;
  if (!idm) return;
  clipPlot(env);
  const x1 = s.x(idm.index);
  const x2 = s.x(idm.taken ? idm.takenIndex : candles.length - 1 + RIGHT_EXTEND);
  const y = s.y(idm.price);
  dashLine(ctx, x1, y, x2, y, [1, 3], idm.taken ? t.textDim : '#ff9f43', 1);
  tag(env, x1 + 3, y, idm.taken ? 'IDM ✓' : 'IDM', { bg: t.tagBg, color: idm.taken ? t.textDim : '#ff9f43', size: 9 });
  ctx.restore();
}

/* --------------------------------------------------------------- 關鍵價位 */
function drawKeyLevels(env) {
  const { ctx, s, t, a, lang } = env;
  clipPlot(env);
  for (const l of a.keyLevels) {
    const y = s.y(l.price);
    if (y < 0 || y > env.layout.height) continue;
    dashLine(ctx, 0, y, s.plotW, y, [8, 5], l.color, 0.9);
    tag(env, 6, y, env.narrow ? l.code : `${l.code} ${fmtPrice(l.price)}`, { bg: t.tagBg, color: l.color, size: 9 });
  }
  ctx.restore();
}

/* ------------------------------------------------------------------- 均線 */

function linePath(env, arr, color, width = 1.2) {
  const { ctx, s, candles } = env;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  let started = false;
  const from = Math.max(0, Math.floor(s.leftIndex) - 1);
  const to = Math.min(candles.length - 1, Math.ceil(s.rightIndex) + 1);
  for (let i = from; i <= to; i++) {
    const v = arr[i];
    if (v == null) { started = false; continue; }
    const x = s.x(i);
    const y = s.y(v);
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}
function drawEmas(env) {
  const { a, t } = env;
  clipPlot(env);
  linePath(env, a.indicators.ema20, t.ema20, 1);
  linePath(env, a.indicators.ema50, t.ema50, 1.1);
  linePath(env, a.indicators.ema200, t.ema200, 1.3);
  env.ctx.restore();
}
function drawVwap(env) {
  const { a, t } = env;
  clipPlot(env);
  linePath(env, a.indicators.vwap, t.vwap, 1.2);
  linePath(env, a.indicators.upper1, t.vwap, 0.5);
  linePath(env, a.indicators.lower1, t.vwap, 0.5);
  env.ctx.restore();
}
function drawVolumeProfile(env) {
  const { ctx, s, t, a, layout } = env;
  const vp = a.indicators.volumeProfile;
  if (!vp) return;
  clipPlot(env);
  const maxW = Math.min(140, s.plotW * 0.22);
  const x0 = s.plotW;
  for (const b of vp.bins) {
    const y = s.y(b.price);
    const h = Math.max(1, Math.abs(s.y(vp.low) - s.y(vp.low + vp.step)) - 1);
    const w = b.ratio * maxW;
    const inVa = b.price <= vp.vah && b.price >= vp.val;
    ctx.fillStyle = inVa ? 'rgba(120,160,255,0.28)' : 'rgba(140,150,170,0.16)';
    ctx.fillRect(x0 - w, y - h / 2, w, h);
  }
  const yPoc = s.y(vp.poc);
  dashLine(ctx, x0 - maxW, yPoc, x0, yPoc, [], '#ffcf5c', 1.2);
  tag(env, x0 - maxW - 2, yPoc, `POC ${fmtPrice(vp.poc)}`, { bg: t.tagBg, color: '#ffcf5c', align: 'right', size: 9 });
  ctx.restore();
}

/* ------------------------------------------------------------ 交易計畫疊圖 */
function drawSetup(env) {
  const { ctx, s, t, a, candles, lang } = env;
  const setup = a.setup;
  if (!setup || setup.none) return;
  clipPlot(env);
  const x1 = s.x(candles.length - 14);
  const x2 = s.x(candles.length - 1 + RIGHT_EXTEND);
  const yEntry = s.y(setup.entry);
  const yStop = s.y(setup.stop);

  // 風險區
  ctx.fillStyle = 'rgba(239,83,80,0.12)';
  ctx.fillRect(x1, Math.min(yEntry, yStop), x2 - x1, Math.abs(yStop - yEntry));
  // 報酬區（到最終目標）
  const lastTp = setup.targets[setup.targets.length - 1];
  if (lastTp) {
    const yTp = s.y(lastTp.price);
    ctx.fillStyle = 'rgba(38,166,154,0.10)';
    ctx.fillRect(x1, Math.min(yEntry, yTp), x2 - x1, Math.abs(yTp - yEntry));
  }
  dashLine(ctx, x1, yEntry, x2, yEntry, [], t.entry, 1.4);
  dashLine(ctx, x1, yStop, x2, yStop, [4, 3], t.stop, 1.2);
  tag(env, x1 + 3, yEntry, `${lang === 'zh' ? '進場' : 'Entry'} ${fmtPrice(setup.entry)}`, { bg: t.tagBg, color: t.entry, size: 9 });
  tag(env, x1 + 3, yStop, `SL ${fmtPrice(setup.stop)}`, { bg: t.tagBg, color: t.stop, size: 9 });
  setup.targets.forEach((tp) => {
    const y = s.y(tp.price);
    dashLine(ctx, x1, y, x2, y, [4, 3], t.target, 1);
    tag(env, x1 + 3, y, `${tp.name} ${fmtPrice(tp.price)} · ${tp.rr.toFixed(1)}R`, { bg: t.tagBg, color: t.target, size: 9 });
  });
  ctx.restore();
}


/* ===== src/chart/chart.js ===== */
const L = { drawSessions, drawPremiumDiscount, drawOte, drawFib, drawFvg, drawOrderBlocks, drawLiquidity, drawSweeps, drawStructure, drawSwingLabels, drawInducement, drawKeyLevels, drawEmas, drawVwap, drawVolumeProfile, drawSetup };
/**
 * 自製 Canvas 圖表引擎
 * 不依賴任何第三方圖表庫 → 完全掌握 SMC 疊圖的繪製順序、命中測試與效能。
 *
 * 功能：K 棒／實心線圖、成交量副圖、價格與時間軸、十字線、平移縮放（滑鼠＋觸控）、
 *      疊圖層、圖例、最後價格標籤、區塊命中測試（滑鼠移到 OB/FVG 顯示詳情）。
 */




const TIME_AXIS_H = 22;
const PRICE_AXIS_W = 68;
const PRICE_AXIS_W_NARROW = 58;
const NARROW_WIDTH = 560;
class Chart {
  constructor(canvas, opts = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = window.devicePixelRatio || 1;
    this.candles = [];
    this.analysis = null;
    this.themeName = opts.theme || 'dark';
    this.lang = opts.lang || 'zh';
    this.timezone = opts.timezone || 'UTC';
    this.layers = opts.layers || {};
    this.chartType = opts.chartType || 'candles';
    this.logScale = false;
    this.barsVisible = 160;
    this.priceAxisW = PRICE_AXIS_W;
    this.narrow = false;
    this._userZoomed = false;
    this.rightIndex = 0;
    this.autoScroll = true;
    this.pointer = null;
    this.hover = null;
    this.onHover = opts.onHover || (() => {});
    this.onViewChange = opts.onViewChange || (() => {});
    this.volumePaneRatio = 0.16;
    this._raf = null;
    this._bind();
    this.resize();
  }

  setTheme(name) { this.themeName = name; this.requestRender(); }
  setLang(l) { this.lang = l; this.requestRender(); }
  setTimezone(tz) { this.timezone = tz; this.requestRender(); }
  setLayers(layers) { this.layers = layers; this.requestRender(); }
  setChartType(t) { this.chartType = t; this.requestRender(); }

  setData(candles, analysis, { keepView = true } = {}) {
    const wasAtRight = this.autoScroll || this.rightIndex >= this.candles.length - 1;
    this.candles = candles;
    this.analysis = analysis;
    if (!keepView || !this.rightIndex || wasAtRight) this.rightIndex = candles.length + 6;
    this.rightIndex = clamp(this.rightIndex, 10, candles.length + this.barsVisible * 0.5);
    this.requestRender();
  }

  resize() {
    const rect = this.canvas.parentElement.getBoundingClientRect();
    const w = Math.max(320, rect.width);
    const h = Math.max(260, rect.height);
    this.dpr = window.devicePixelRatio || 1;
    this.canvas.width = Math.floor(w * this.dpr);
    this.canvas.height = Math.floor(h * this.dpr);
    this.canvas.style.width = `${w}px`;
    this.canvas.style.height = `${h}px`;
    this.width = w;
    this.height = h;
    const wasNarrow = this.narrow;
    this.narrow = w < NARROW_WIDTH;
    this.priceAxisW = this.narrow ? PRICE_AXIS_W_NARROW : PRICE_AXIS_W;
    // 手機上預設顯示較少 K 棒，否則畫面糊成一片（使用者手動縮放後就不再自動調整）
    if (!this._userZoomed && this.narrow !== wasNarrow) {
      this.barsVisible = this.narrow ? 80 : 160;
      if (this.candles.length) this.rightIndex = this.candles.length + 4;
    }
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    this.requestRender();
  }

  get layout() {
    const padding = { top: 10, right: this.priceAxisW, bottom: TIME_AXIS_H };
    const volumeHeight = Math.round(this.height * this.volumePaneRatio);
    const priceHeight = this.height - padding.top - TIME_AXIS_H - volumeHeight;
    return { padding, volumeHeight, priceHeight, width: this.width, height: this.height, volumeTop: padding.top + priceHeight };
  }

  requestRender() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => {
      this._raf = null;
      try { this.render(); } catch (e) { console.error('[chart]', e); }
    });
  }

  /* ------------------------------------------------------------ 事件綁定 */

  _bind() {
    const c = this.canvas;
    c.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = c.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const factor = e.deltaY > 0 ? 1.12 : 1 / 1.12;
      const s = this._scales();
      const anchorIdx = s.xToIndex(px);
      const newBars = clamp(this.barsVisible * factor, 25, 1500);
      const ratio = (anchorIdx - s.leftIndex) / this.barsVisible;
      this.barsVisible = newBars;
      this._userZoomed = true;
      this.rightIndex = anchorIdx + (1 - ratio) * newBars;
      this.autoScroll = this.rightIndex >= this.candles.length;
      this.clampView();
      this.onViewChange();
      this.requestRender();
    }, { passive: false });

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    c.addEventListener('mousedown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; c.style.cursor = 'grabbing'; });
    window.addEventListener('mouseup', () => { dragging = false; c.style.cursor = 'crosshair'; });
    window.addEventListener('mousemove', (e) => {
      if (dragging) {
        const s = this._scales();
        const dx = e.clientX - lastX;
        lastX = e.clientX;
        lastY = e.clientY;
        this.rightIndex -= dx / s.barWidth;
        this.autoScroll = false;
        this.clampView();
        this.requestRender();
        return;
      }
    });
    c.addEventListener('mousemove', (e) => {
      const rect = c.getBoundingClientRect();
      this.pointer = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      this.hover = this.hitTest(this.pointer.x, this.pointer.y);
      this.onHover(this.hover, this.pointer, this.pointerInfo());
      this.requestRender();
    });
    c.addEventListener('mouseleave', () => {
      this.pointer = null;
      this.hover = null;
      this.onHover(null, null, null);
      this.requestRender();
    });
    c.addEventListener('dblclick', () => { this.resetView(); });

    // 觸控：單指平移、雙指縮放
    let touchStart = null;
    c.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) touchStart = { x: e.touches[0].clientX, bars: this.barsVisible, right: this.rightIndex };
      else if (e.touches.length === 2) {
        touchStart = {
          dist: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY),
          bars: this.barsVisible,
          right: this.rightIndex,
        };
      }
    }, { passive: true });
    c.addEventListener('touchmove', (e) => {
      if (!touchStart) return;
      if (e.touches.length === 1 && touchStart.x != null) {
        const s = this._scales();
        this.rightIndex = touchStart.right - (e.touches[0].clientX - touchStart.x) / s.barWidth;
        this.autoScroll = false;
      } else if (e.touches.length === 2 && touchStart.dist) {
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        this.barsVisible = clamp(touchStart.bars * (touchStart.dist / Math.max(1, d)), 25, 1500);
      }
      this.clampView();
      this.requestRender();
      e.preventDefault();
    }, { passive: false });
    c.addEventListener('touchend', () => { touchStart = null; });
  }

  clampView() {
    const n = this.candles.length || 1;
    this.rightIndex = clamp(this.rightIndex, Math.min(30, n), n + this.barsVisible * 0.6);
  }

  resetView() {
    this._userZoomed = false;
    this.barsVisible = this.narrow ? 80 : 160;
    this.rightIndex = this.candles.length + 6;
    this.autoScroll = true;
    this.requestRender();
  }

  zoom(factor) {
    this._userZoomed = true;
    this.barsVisible = clamp(this.barsVisible * factor, 25, 1500);
    this.clampView();
    this.requestRender();
  }

  pointerInfo() {
    if (!this.pointer) return null;
    const s = this._scales();
    const idx = Math.round(s.xToIndex(this.pointer.x));
    const c = this.candles[idx];
    if (!c) return null;
    return { candle: c, index: idx, price: s.yToPrice(this.pointer.y) };
  }

  _scales() {
    const { padding, priceHeight } = this.layout;
    const from = this.rightIndex - this.barsVisible;
    const extras = [];
    const a = this.analysis;
    if (a && !a.empty) {
      if (this.layers.setup && a.setup && !a.setup.none) {
        extras.push(a.setup.entry, a.setup.stop, ...a.setup.targets.map((t) => t.price));
      }
      if (this.layers.premiumDiscount && a.range) extras.push(a.range.high, a.range.low);
    }
    const { min, max } = autoRange(this.candles, from, this.rightIndex, extras);
    return createScales({
      width: this.width,
      height: padding.top + priceHeight + padding.bottom,
      padding: { top: padding.top, right: this.priceAxisW, bottom: 0 },
      barsVisible: this.barsVisible,
      rightIndex: this.rightIndex,
      min,
      max,
      logScale: this.logScale,
    });
  }

  /* ---------------------------------------------------------------- 繪製 */

  render() {
    const ctx = this.ctx;
    const t = getTheme(this.themeName);
    const layout = this.layout;
    ctx.clearRect(0, 0, this.width, this.height);
    ctx.fillStyle = t.bg;
    ctx.fillRect(0, 0, this.width, this.height);
    if (!this.candles.length) {
      ctx.fillStyle = t.textDim;
      ctx.font = '13px system-ui';
      ctx.fillText(this.lang === 'zh' ? '載入中…' : 'Loading…', 16, 28);
      return;
    }
    const s = this._scales();
    const a = this.analysis && !this.analysis.empty ? this.analysis : null;
    const env = { ctx, s, t, a, candles: this.candles, layout, layers: this.layers, lang: this.lang, narrow: this.narrow };

    this._grid(ctx, t, s, layout);
    this._watermark(ctx, t, layout);

    if (a) {
      if (this.layers.sessions) L.drawSessions(env);
      if (this.layers.premiumDiscount) L.drawPremiumDiscount(env);
      if (this.layers.ote) L.drawOte(env);
      if (this.layers.fib) L.drawFib(env);
      if (this.layers.volumeProfile) L.drawVolumeProfile(env);
      if (this.layers.fvg) L.drawFvg(env);
      if (this.layers.orderBlocks || this.layers.breakers) L.drawOrderBlocks(env);
      if (this.layers.keyLevels) L.drawKeyLevels(env);
      if (this.layers.liquidity) L.drawLiquidity(env);
    }

    this._candles(ctx, t, s, layout);
    this._volume(ctx, t, s, layout);

    if (a) {
      if (this.layers.ema) L.drawEmas(env);
      if (this.layers.vwap) L.drawVwap(env);
      if (this.layers.structure) L.drawStructure(env);
      if (this.layers.swingLabels) L.drawSwingLabels(env);
      if (this.layers.sweeps) L.drawSweeps(env);
      if (this.layers.inducement) L.drawInducement(env);
      if (this.layers.setup) L.drawSetup(env);
    }

    this._priceAxis(ctx, t, s, layout);
    this._timeAxis(ctx, t, s, layout);
    this._lastPrice(ctx, t, s, layout);
    this._crosshair(ctx, t, s, layout);
    this._legend(ctx, t, layout);
  }

  /** 時間軸刻度數量：窄畫面要更少，否則標籤會重疊 */
  _tickCount() {
    return Math.max(3, Math.min(9, Math.round(this.width / 110)));
  }

  _grid(ctx, t, s, layout) {
    ctx.save();
    ctx.strokeStyle = t.grid;
    ctx.lineWidth = 1;
    for (const p of priceTicks(s.min, s.max, this.narrow ? 5 : 7)) {
      const y = Math.round(s.y(p)) + 0.5;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(s.plotW, y);
      ctx.stroke();
    }
    for (const tk of timeTicks(this.candles, s.leftIndex, s.rightIndex, this._tickCount())) {
      const x = Math.round(s.x(tk.index)) + 0.5;
      ctx.beginPath();
      ctx.moveTo(x, layout.padding.top);
      ctx.lineTo(x, layout.height - TIME_AXIS_H);
      ctx.stroke();
    }
    ctx.restore();
  }

  _watermark(ctx, t, layout) {
    const base = layout.padding.top + layout.priceHeight - 14;
    ctx.save();
    ctx.fillStyle = t.watermark;
    ctx.font = `bold ${this.narrow ? 18 : 30}px system-ui, sans-serif`;
    ctx.fillText('SMC TERMINAL', this.narrow ? 10 : 18, base - (this.narrow ? 10 : 16));
    if (!this.narrow) {
      ctx.font = '12px system-ui, sans-serif';
      ctx.fillText(this.lang === 'zh' ? 'Smart Money Concepts 分析終端' : 'Smart Money Concepts Analysis', 20, base);
    }
    ctx.restore();
  }

  _candles(ctx, t, s, layout) {
    const from = Math.max(0, Math.floor(s.leftIndex) - 1);
    const to = Math.min(this.candles.length - 1, Math.ceil(s.rightIndex) + 1);
    const bw = Math.max(1, s.barWidth * 0.7);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, layout.padding.top, s.plotW, layout.priceHeight);
    ctx.clip();

    if (this.chartType === 'line' || this.chartType === 'area') {
      ctx.beginPath();
      for (let i = from; i <= to; i++) {
        const x = s.x(i);
        const y = s.y(this.candles[i].close);
        i === from ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = t.ema20;
      ctx.lineWidth = 1.6;
      ctx.stroke();
      if (this.chartType === 'area') {
        ctx.lineTo(s.x(to), layout.padding.top + layout.priceHeight);
        ctx.lineTo(s.x(from), layout.padding.top + layout.priceHeight);
        ctx.closePath();
        const g = ctx.createLinearGradient(0, layout.padding.top, 0, layout.padding.top + layout.priceHeight);
        g.addColorStop(0, 'rgba(91,163,245,0.25)');
        g.addColorStop(1, 'rgba(91,163,245,0)');
        ctx.fillStyle = g;
        ctx.fill();
      }
      ctx.restore();
      return;
    }

    for (let i = from; i <= to; i++) {
      const c = this.candles[i];
      const x = Math.round(s.x(i));
      const up = c.close >= c.open;
      const color = up ? t.up : t.down;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = Math.min(1.4, Math.max(0.7, s.barWidth * 0.14));
      ctx.beginPath();
      ctx.moveTo(x + 0.5, s.y(c.high));
      ctx.lineTo(x + 0.5, s.y(c.low));
      ctx.stroke();
      const yo = s.y(c.open);
      const yc = s.y(c.close);
      const top = Math.min(yo, yc);
      const h = Math.max(1, Math.abs(yc - yo));
      if (bw <= 1.6) {
        ctx.fillRect(x, top, 1.4, h);
      } else if (this.chartType === 'hollow' && up) {
        ctx.strokeRect(x - bw / 2 + 0.5, top + 0.5, bw, h);
      } else {
        ctx.fillRect(x - bw / 2, top, bw, h);
      }
    }
    ctx.restore();
  }

  _volume(ctx, t, s, layout) {
    const from = Math.max(0, Math.floor(s.leftIndex));
    const to = Math.min(this.candles.length - 1, Math.ceil(s.rightIndex));
    let maxV = 0;
    for (let i = from; i <= to; i++) maxV = Math.max(maxV, this.candles[i].volume || 0);
    if (!maxV) return;
    const top = layout.volumeTop;
    const h = layout.volumeHeight - 4;
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, top, s.plotW, h + 4);
    ctx.clip();
    const bw = Math.max(1, s.barWidth * 0.7);
    for (let i = from; i <= to; i++) {
      const c = this.candles[i];
      const vh = ((c.volume || 0) / maxV) * h;
      ctx.fillStyle = c.close >= c.open ? t.volUp : t.volDown;
      ctx.fillRect(s.x(i) - bw / 2, top + h - vh, bw, vh);
    }
    ctx.strokeStyle = t.axis;
    ctx.beginPath();
    ctx.moveTo(0, top + 0.5);
    ctx.lineTo(s.plotW, top + 0.5);
    ctx.stroke();
    ctx.fillStyle = t.textDim;
    ctx.font = '9px ui-monospace, monospace';
    ctx.fillText(`VOL ${fmtCompact(this.candles[to]?.volume)}`, 6, top + 11);
    ctx.restore();
  }

  _priceAxis(ctx, t, s, layout) {
    ctx.save();
    ctx.fillStyle = t.bg;
    ctx.fillRect(s.plotW, 0, this.priceAxisW, layout.height);
    ctx.strokeStyle = t.axis;
    ctx.beginPath();
    ctx.moveTo(s.plotW + 0.5, 0);
    ctx.lineTo(s.plotW + 0.5, layout.height);
    ctx.stroke();
    ctx.fillStyle = t.textDim;
    ctx.font = `${this.narrow ? 9 : 10}px ui-monospace, monospace`;
    const digits = precisionFor(s.max);
    for (const p of priceTicks(s.min, s.max, this.narrow ? 5 : 7)) {
      const y = s.y(p);
      if (y < 8 || y > layout.padding.top + layout.priceHeight) continue;
      ctx.fillText(fmtPrice(p, digits), s.plotW + 6, y + 3);
    }
    ctx.restore();
  }

  _timeAxis(ctx, t, s, layout) {
    const y = layout.height - TIME_AXIS_H;
    ctx.save();
    ctx.fillStyle = t.bg;
    ctx.fillRect(0, y, this.width, TIME_AXIS_H);
    ctx.strokeStyle = t.axis;
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(this.width, y + 0.5);
    ctx.stroke();
    ctx.fillStyle = t.textDim;
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'center';
    const ticks = timeTicks(this.candles, s.leftIndex, s.rightIndex, this._tickCount());
    let lastDay = null;
    for (const tk of ticks) {
      const x = s.x(tk.index);
      if (x < 20 || x > s.plotW - 10) continue;
      const d = new Date(tk.time);
      const dayKey = `${d.getUTCFullYear()}-${d.getUTCMonth()}-${d.getUTCDate()}`;
      const showDate = dayKey !== lastDay;
      lastDay = dayKey;
      const label = showDate
        ? fmtTime(tk.time, { tz: this.timezone, withDate: true }).slice(5)
        : fmtTime(tk.time, { tz: this.timezone, withDate: false });
      ctx.fillStyle = showDate ? t.text : t.textDim;
      ctx.fillText(label, x, y + 14);
    }
    ctx.textAlign = 'left';
    ctx.restore();
  }

  _lastPrice(ctx, t, s, layout) {
    const c = this.candles[this.candles.length - 1];
    if (!c) return;
    const y = s.y(c.close);
    const up = c.close >= c.open;
    ctx.save();
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = up ? t.up : t.down;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(s.plotW, y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = up ? t.up : t.down;
    ctx.fillRect(s.plotW, y - 9, this.priceAxisW, 18);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 10px ui-monospace, monospace';
    ctx.fillText(fmtPrice(c.close), s.plotW + 5, y + 3.5);
    ctx.restore();
  }

  _crosshair(ctx, t, s, layout) {
    if (!this.pointer) return;
    const { x, y } = this.pointer;
    if (x > s.plotW) return;
    ctx.save();
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = t.crosshair;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 0.5, layout.padding.top);
    ctx.lineTo(x + 0.5, layout.height - TIME_AXIS_H);
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(s.plotW, y + 0.5);
    ctx.stroke();
    ctx.setLineDash([]);
    // 價格標籤
    const price = s.yToPrice(y);
    if (y < layout.padding.top + layout.priceHeight) {
      ctx.fillStyle = t.tagBg;
      ctx.fillRect(s.plotW, y - 9, this.priceAxisW, 18);
      ctx.fillStyle = t.text;
      ctx.font = '10px ui-monospace, monospace';
      ctx.fillText(fmtPrice(price), s.plotW + 5, y + 3.5);
    }
    // 時間標籤
    const idx = Math.round(s.xToIndex(x));
    const c = this.candles[idx];
    if (c) {
      const label = fmtTime(c.time, { tz: this.timezone });
      ctx.font = '10px ui-monospace, monospace';
      const w = ctx.measureText(label).width + 10;
      ctx.fillStyle = t.tagBg;
      ctx.fillRect(clamp(x - w / 2, 0, s.plotW - w), layout.height - TIME_AXIS_H + 3, w, 16);
      ctx.fillStyle = t.text;
      ctx.fillText(label, clamp(x - w / 2, 0, s.plotW - w) + 5, layout.height - TIME_AXIS_H + 14);
    }
    ctx.restore();
  }

  _legend(ctx, t, layout) {
    const info = this.pointerInfo();
    const c = info?.candle || this.candles[this.candles.length - 1];
    if (!c) return;
    const chg = ((c.close - c.open) / c.open) * 100;
    const parts = this.narrow
      ? [`H ${fmtPrice(c.high)}`, `L ${fmtPrice(c.low)}`, `C ${fmtPrice(c.close)}`, `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%`]
      : [
          `O ${fmtPrice(c.open)}`,
          `H ${fmtPrice(c.high)}`,
          `L ${fmtPrice(c.low)}`,
          `C ${fmtPrice(c.close)}`,
          `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%`,
        ];
    ctx.save();
    ctx.font = '10px ui-monospace, monospace';
    let x = this.narrow ? 8 : 16;
    const y = layout.padding.top + 14;
    for (let i = 0; i < parts.length; i++) {
      ctx.fillStyle = i === parts.length - 1 ? (chg >= 0 ? t.up : t.down) : t.textDim;
      ctx.fillText(parts[i], x, y);
      x += ctx.measureText(parts[i]).width + 10;
    }
    ctx.restore();
  }

  /* ------------------------------------------------------------ 命中測試 */

  hitTest(px, py) {
    const a = this.analysis;
    if (!a || a.empty) return null;
    const s = this._scales();
    if (px > s.plotW) return null;
    const price = s.yToPrice(py);
    const idx = s.xToIndex(px);
    const hits = [];
    const within = (z) => price <= z.top && price >= z.bottom && idx >= z.index - 1;

    if (this.layers.orderBlocks || this.layers.breakers) {
      for (const b of a.orderBlocks) if (within(b)) hits.push({ type: 'orderblock', data: b });
    }
    if (this.layers.fvg) {
      for (const g of a.gaps) {
        if (g.kind === 'vi' && !this.layers.volumeImbalance) continue;
        if (within(g)) hits.push({ type: 'fvg', data: g });
      }
    }
    if (this.layers.liquidity) {
      for (const p of a.pools) {
        if (Math.abs(s.y(p.price) - py) < 4) hits.push({ type: 'liquidity', data: p });
      }
    }
    return hits.length ? hits.slice(0, 3) : null;
  }

  /** 匯出目前畫面為 PNG DataURL */
  toDataURL() {
    return this.canvas.toDataURL('image/png');
  }
}


/* ===== src/ui/panels.js ===== */
/**
 * 側邊分析面板的 HTML 產生器（純函式 → 易測試、易維護）
 */

const dirClass = (d) => (d === 'bull' || d === 'long' || d === 'bullish' ? 'up' : d === 'bear' || d === 'short' || d === 'bearish' ? 'down' : 'flat');

const STATE_LABEL = {
  zh: { fresh: '新鮮', tapped: '已回測', mitigated: '已消耗', breaker: '破壞塊', partial: '部分填補', filled: '已填補', inverted: '反轉 IFVG', zone: '區間' },
  en: { fresh: 'Fresh', tapped: 'Tapped', mitigated: 'Mitigated', breaker: 'Breaker', partial: 'Partial', filled: 'Filled', inverted: 'Inverted', zone: 'Zone' },
};
function stateLabel(state, lang) {
  return (STATE_LABEL[lang] || STATE_LABEL.zh)[state] || state;
}

/* --------------------------------------------------------------- 偏向面板 */
function renderBias(a, agg, lang) {
  if (!a || a.empty) return '';
  const b = a.bias;
  const pct = (b.score + 100) / 2;
  const label = lang === 'zh' ? b.labelZh : b.label;
  const factors = b.factors
    .slice(0, 6)
    .map(
      (f) => `<div class="factor">
        <span class="factor__name">${lang === 'zh' ? f.zh : f.en}${f.detail ? ` <em>${escapeHtml(String(f.detail))}</em>` : ''}</span>
        <span class="factor__bar"><i style="width:${Math.min(100, Math.abs(f.score) * 2.4)}%" class="${f.score >= 0 ? 'up' : 'down'}"></i></span>
        <span class="factor__val ${f.score >= 0 ? 'up' : 'down'}">${f.score >= 0 ? '+' : ''}${f.score.toFixed(0)}</span>
      </div>`,
    )
    .join('');

  return `
  <section class="card">
    <header class="card__head">
      <h3>${lang === 'zh' ? '市場偏向' : 'Market Bias'}</h3>
      <span class="pill pill--${dirClass(b.label)}">${label}</span>
    </header>
    <div class="bias-meter">
      <div class="bias-meter__track"><i style="left:${pct}%"></i></div>
      <div class="bias-meter__labels"><span>${lang === 'zh' ? '極空' : 'Bearish'}</span><span>${lang === 'zh' ? '中性' : 'Neutral'}</span><span>${lang === 'zh' ? '極多' : 'Bullish'}</span></div>
    </div>
    <div class="kv-grid">
      <div><span>${lang === 'zh' ? '偏向分數' : 'Bias score'}</span><b class="${dirClass(b.label)}">${b.score > 0 ? '+' : ''}${b.score}</b></div>
      <div><span>${lang === 'zh' ? '強度' : 'Strength'}</span><b>${b.strength}%</b></div>
      ${agg ? `<div><span>${lang === 'zh' ? '多週期一致性' : 'MTF alignment'}</span><b>${agg.alignment}%</b></div>
      <div><span>${lang === 'zh' ? '多週期分數' : 'MTF score'}</span><b class="${dirClass(agg.label)}">${agg.score > 0 ? '+' : ''}${agg.score}</b></div>` : ''}
    </div>
    <div class="factors">${factors}</div>
  </section>`;
}

/* --------------------------------------------------------------- 結構面板 */
function renderStructure(a, lang) {
  if (!a || a.empty) return '';
  const sw = a.structure.swing;
  const it = a.structure.internal;
  const evRow = (e) => {
    if (!e) return `<span class="dim">—</span>`;
    return `<span class="pill pill--${dirClass(e.dir)} pill--sm">${e.type}</span> <span class="mono">${fmtPrice(e.price)}</span>`;
  };
  const pd = a.pd;
  return `
  <section class="card">
    <header class="card__head"><h3>${lang === 'zh' ? '市場結構' : 'Market Structure'}</h3>
      <span class="pill pill--${dirClass(sw.trendLabel)}">${trendText(sw.trendLabel, lang)}</span>
    </header>
    <div class="rows">
      <div class="row"><span>${lang === 'zh' ? '擺動結構（HTF 邏輯）' : 'Swing structure'}</span><b>${evRow(sw.lastEvent)}</b></div>
      <div class="row"><span>${lang === 'zh' ? '內部結構（進場邏輯）' : 'Internal structure'}</span><b>${evRow(it.lastEvent)}</b></div>

/* ===== src/ui/scanner.js ===== */
/**
 * 市場掃描器：一次分析多個幣種，找出「現在最值得看」的標的。
 * 排序依據：計畫評分 → 風報比 → 與 POI 的距離。
 */
async function runScan(feed, { symbols, interval, settings, limit = 260, concurrency = 4, onProgress }) {
  const results = [];
  let done = 0;
  const queue = [...symbols];

  async function worker() {
    while (queue.length) {
      const symbol = queue.shift();
      try {
        const candles = await feed.getCandles(symbol, interval, limit);
        const a = analyze(candles, settings);
        if (!a.empty) {
          results.push({
            symbol,
            price: a.price,
            bias: a.bias,
            setup: a.setup,
            pd: a.pd,
            structure: a.structure.swing.trendLabel,
            lastEvent: a.structure.internal.lastEvent,
            sweep: a.sweeps[a.sweeps.length - 1] || null,
            nearestPoi: a.pois[0] || null,
            changePct: ((a.price - candles[Math.max(0, candles.length - 96)].close) / candles[Math.max(0, candles.length - 96)].close) * 100,
          });
        }
      } catch (e) {
        results.push({ symbol, error: e?.message || String(e) });
      }
      done++;
      onProgress?.({ done, total: symbols.length });
    }
  }

  await Promise.all(Array.from({ length: Math.min(concurrency, symbols.length) }, worker));
  return results.sort(byScore);
}

const byScore = (a, b) => (b.setup?.score ?? -1) - (a.setup?.score ?? -1);
function renderScanTable(rows, lang) {
  if (!rows.length) return `<p class="dim pad">${lang === 'zh' ? '尚未掃描。' : 'No scan yet.'}</p>`;
  const body = rows.map((r) => {
    if (r.error) return `<tr class="muted"><td>${r.symbol}</td><td colspan="7" class="dim">${r.error}</td></tr>`;
    const s = r.setup && !r.setup.none ? r.setup : null;
    const dirCls = s ? (s.dir === 'long' ? 'up' : 'down') : 'flat';
    return `<tr data-symbol="${r.symbol}" class="scan-row">
      <td><b>${r.symbol.replace('USDT', '')}</b><span class="dim">/USDT</span></td>
      <td class="mono">${fmtPrice(r.price)}</td>
      <td class="mono ${r.changePct >= 0 ? 'up' : 'down'}">${fmtPct(r.changePct)}</td>
      <td><span class="pill pill--sm pill--${r.bias.label === 'bullish' ? 'up' : r.bias.label === 'bearish' ? 'down' : 'flat'}">${lang === 'zh' ? r.bias.labelZh : r.bias.label}</span></td>
      <td>${r.pd ? `<span class="tiny">${r.pd.pct.toFixed(0)}%</span>` : '—'}</td>
      <td>${s ? `<span class="pill pill--sm pill--${dirCls}">${s.dir === 'long' ? 'L' : 'S'}</span>` : '<span class="dim">—</span>'}</td>
      <td class="mono">${s ? s.rrFinal.toFixed(2) + 'R' : '—'}</td>
      <td class="mono"><b class="${s && s.score >= 68 ? 'up' : ''}">${s ? s.score : '—'}</b>${s ? ` <span class="dim">${s.grade}</span>` : ''}</td>
    </tr>`;
  }).join('');
  return `<table class="table table--scan">
    <thead><tr>
      <th>${lang === 'zh' ? '幣種' : 'Symbol'}</th><th>${lang === 'zh' ? '價格' : 'Price'}</th><th>24×15m</th>
      <th>${lang === 'zh' ? '偏向' : 'Bias'}</th><th>${lang === 'zh' ? '區間' : 'Range'}</th>
      <th>${lang === 'zh' ? '方向' : 'Dir'}</th><th>R:R</th><th>${lang === 'zh' ? '評分' : 'Score'}</th>
    </tr></thead><tbody>${body}</tbody></table>`;

/**
 * 警報系統：價格穿越、進入 POI、結構事件。
 * 使用瀏覽器通知（若使用者授權）＋ 畫面提示。
 */
const ALERT_TYPES = {
  price: { zh: '價格穿越', en: 'Price cross' },
  poi: { zh: '進入 POI', en: 'Enter POI' },
  structure: { zh: '結構事件 (BOS/CHoCH)', en: 'Structure event' },
  sweep: { zh: '流動性掃除', en: 'Liquidity sweep' },
};
function createAlert({ symbol, interval, type, level, note }) {
  return {
    id: uid('al'),
    symbol,
    interval,
    type,
    level: level ? Number(level) : null,
    note: note || '',
    createdAt: Date.now(),
    triggeredAt: null,
    active: true,
  };
}
class AlertEngine {
  constructor(state) {
    this.state = state;
    this.lastPrice = new Map();
    this.lastEventId = new Map();
    this.lastSweepId = new Map();
  }

  requestPermission() {
    if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }

  notify(title, body) {
    toast(`${title} — ${body}`, 'alert', 6000);
    try {
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        new Notification(title, { body, tag: title + body });
      }
    } catch {}
  }

  /** 每次分析更新後呼叫 */
  check(symbol, interval, analysis, lang = 'zh') {
    if (!analysis || analysis.empty) return;
    const price = analysis.price;
    const prev = this.lastPrice.get(symbol);
    this.lastPrice.set(symbol, price);

    for (const al of this.state.alerts) {
      if (!al.active || al.symbol !== symbol) continue;
      if (al.type === 'price' && prev != null && al.level) {
        const crossedUp = prev < al.level && price >= al.level;
        const crossedDown = prev > al.level && price <= al.level;
        if (crossedUp || crossedDown) this.fire(al, `${symbol} ${lang === 'zh' ? '價格穿越' : 'crossed'} ${fmtPrice(al.level)}`, lang);
      }
      if (al.type === 'poi') {
        const hit = analysis.pois.find((p) => price <= p.top && price >= p.bottom);
        if (hit) this.fire(al, `${symbol} ${lang === 'zh' ? '進入' : 'entered'} ${hit.type} ${fmtPrice(hit.bottom)}–${fmtPrice(hit.top)}`, lang);
      }
      if (al.type === 'structure') {
        const ev = analysis.structure.internal.lastEvent;
        if (ev && this.lastEventId.get(symbol) !== ev.id) {
          this.lastEventId.set(symbol, ev.id);
          if (analysis.candles.length - ev.breakIndex <= 2) {
            this.fire(al, `${symbol} ${ev.type} ${ev.dir === 'bull' ? '↑' : '↓'} @ ${fmtPrice(ev.price)}`, lang, false);
          }
        }
      }
      if (al.type === 'sweep') {
        const sw = analysis.sweeps[analysis.sweeps.length - 1];
        if (sw && this.lastSweepId.get(symbol) !== sw.id && analysis.candles.length - sw.index <= 2) {
          this.lastSweepId.set(symbol, sw.id);
          this.fire(al, `${symbol} ${lang === 'zh' ? '流動性掃除' : 'sweep'} ${sw.side} @ ${fmtPrice(sw.level)}`, lang, false);
        }
      }
    }
  }

  fire(alert, message, lang, deactivate = true) {
    if (alert.triggeredAt && Date.now() - alert.triggeredAt < 60_000) return;
    alert.triggeredAt = Date.now();
    if (deactivate && alert.type === 'price') alert.active = false;
    this.notify(lang === 'zh' ? '⚡ SMC 警報' : '⚡ SMC Alert', message + (alert.note ? ` · ${alert.note}` : ''));
  }
}
function renderAlerts(alerts, lang) {
  if (!alerts.length) return `<p class="dim pad">${lang === 'zh' ? '尚未建立警報。' : 'No alerts yet.'}</p>`;
  return `<ul class="alert-list">${alerts.map((a) => `
    <li class="${a.active ? '' : 'muted'}">
      <div><b>${a.symbol}</b> <span class="dim">${a.interval}</span>
        <span class="pill pill--sm">${(ALERT_TYPES[a.type] || {})[lang] || a.type}</span></div>
      <div class="mono">${a.level ? fmtPrice(a.level) : '—'} ${a.note ? `<span class="dim">· ${a.note}</span>` : ''}</div>
      <button class="btn btn--icon" data-del-alert="${a.id}" title="delete">✕</button>
    </li>`).join('')}</ul>`;
}

function renderGlossary(lang, filter = '') {
  const f = filter.trim().toLowerCase();
  const items = GLOSSARY.filter(
    (g) => !f || g.term.toLowerCase().includes(f) || g.zh.includes(filter) || g.en.toLowerCase().includes(f),
  );
  const cards = items.map((g) => `
    <details class="gloss">
      <summary><span class="gloss__tag">${g.tag}</span>${g.term}</summary>
      <p>${lang === 'zh' ? g.zh : g.en}</p>
      <p class="gloss__how"><b>${lang === 'zh' ? '本程式如何計算' : 'How this app computes it'}：</b>${g.how}</p>
      <p class="gloss__trade"><b>${lang === 'zh' ? '實戰用法' : 'How to trade it'}：</b>${g.trade}</p>
    </details>`).join('');
  const steps = PLAYBOOK.map((p) => `<li><b>${p.step}</b>${lang === 'zh' ? p.zh : p.en}</li>`).join('');

    <div class="playbook">
      <h3>${lang === 'zh' ? 'SMC 實戰流程（六步驟）' : 'The 6-step SMC workflow'}</h3>
      <ol>${steps}</ol>
    </div>
    <div class="gloss-list">${cards || `<p class="dim">${lang === 'zh' ? '找不到相符的詞彙。' : 'No matching term.'}</p>`}</div>`;
}

function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  // file:// 直接開啟時不註冊（Service Worker 需要 http/https）
  if (!/^https?:$/.test(location.protocol)) return;
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW 註冊失敗', e));
  });
}

const isStandalone = () =>
  window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone === true;

function setupInstallHint() {
  const hint = $('#installHint');
  if (!hint) return;
  const dismissed = (() => { try { return localStorage.getItem('smc-install-hint') === 'off'; } catch { return false; } })();
  const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let deferredPrompt = null;

  $('#installHintClose').onclick = () => {
    hint.hidden = true;
    try { localStorage.setItem('smc-install-hint', 'off'); } catch {}
  };

  // Android / 桌面 Chrome：直接提供安裝按鈕
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (dismissed || isStandalone()) return;
    hint.querySelector('span').innerHTML = isZh()
      ? '可以把這個工具安裝成 App，全螢幕又能離線使用。'
      : 'Install this as an app for full-screen, offline use.';
    const btn = document.createElement('button');
    btn.className = 'btn btn--primary btn--sm';
    btn.textContent = isZh() ? '安裝' : 'Install';
    btn.onclick = async () => {
      hint.hidden = true;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    };
    hint.insertBefore(btn, $('#installHintClose'));
    hint.hidden = false;
  });

  const canInstall = /^https?:$/.test(location.protocol);
  if (isIos && canInstall && !isStandalone() && !dismissed) {
    if (!isZh()) {
      hint.querySelector('span').innerHTML =
        'Add to your Home Screen for a full-screen app: tap <b>Share</b> → <b>Add to Home Screen</b>.';
    }
    setTimeout(() => { hint.hidden = false; }, 2500);
  }
  if (isStandalone()) document.documentElement.classList.add('standalone');
}

function handleKeys(e) {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === 'ArrowRight') stepReplay(1);
  if (e.key === 'ArrowLeft') stepReplay(-1);
  if (e.key === '+' || e.key === '=') chart.zoom(1 / 1.25);
  if (e.key === '-') chart.zoom(1.25);
  if (e.key.toLowerCase() === 'r') loadData(true);
  if (e.key.toLowerCase() === 't') $('#themeBtn').click();
}

/* ------------------------------------------------------------------ 資料 */

async function loadSymbols() {
  try {
    symbols = await feed.getSymbols();
    renderSymbolList('');
  } catch (e) {
    console.warn('symbols', e);
  }
}

function setLoading(on) {
  $('#chartLoading').hidden = !on;
}

async function loadData(force = false) {
  setLoading(true);
  try {
    candles = await feed.getCandles(state.symbol, state.interval, state.candleCount, { force });
    lastUpdated = Date.now();
    replay.index = candles.length;
    $('#replayRange').max = candles.length;
    $('#replayRange').min = Math.min(80, candles.length);
    $('#replayRange').value = candles.length;
    recompute({ keepView: false });
    if (state.live && !replay.active) startStream();
    loadTicker();
    loadMtf();
  } catch (e) {
    toast((isZh() ? '資料載入失敗：' : 'Failed to load data: ') + (e?.message || e), 'error', 6000);
  } finally {
    setLoading(false);
    renderStatus();
  }
}

async function loadTicker() {
  try {
    ticker = await feed.getTicker(state.symbol, state.interval);
    renderTickerStrip();
  } catch {}
}

function startStream() {
  if (!state.live) return;
  feed.startStream(state.symbol, state.interval, (c) => {
    Feed.merge(candles, c);
    lastUpdated = Date.now();
    if (!replay.active) {
      replay.index = candles.length;
      throttledRecompute();
    }
  });
}

const throttledRecompute = throttle(() => recompute({ keepView: true }), 800);

/** 依目前（或回放）資料重新計算並渲染 */
function recompute({ keepView = true } = {}) {
  const view = replay.active ? candles.slice(0, Math.max(60, replay.index)) : candles;
  if (!view.length) return;
  analysis = analyze(view, { ...state.smc, htfBias });
  chart.setData(view, analysis, { keepView });
  renderAll();
  if (!replay.active) alerts.check(state.symbol, state.interval, analysis, state.lang);
  if (replay.active) {
    $('#replayLabel').textContent = `${replay.index}/${candles.length} · ${fmtTime(view[view.length - 1].time, { tz: state.timezone })}`;
  }
}

async function loadMtf() {
  const list = [...state.mtfList].sort((a, b) => (TF_WEIGHT[a] ?? 1) - (TF_WEIGHT[b] ?? 1));
  if (!list.length) { mtfRows = []; mtfAgg = null; htfBias = null; renderMtfPanel(); return; }
  try {
    const data = await feed.getMulti(state.symbol, list, 320);
    mtfRows = list
      .map((iv) => {
        const c = data[iv];
        if (!c?.length) return null;
        const a = analyze(c, state.smc);
        if (a.empty) return null;
        return { interval: iv, bias: a.bias, structure: a.structure, pd: a.pd, setup: a.setup, price: a.price };
      })
      .filter(Boolean);
    mtfAgg = aggregateBias(mtfRows);
    const higher = mtfRows.filter((r) => (TF_WEIGHT[r.interval] ?? 1) > (TF_WEIGHT[state.interval] ?? 1));
    htfBias = higher.length ? aggregateBias(higher) : mtfAgg;
    recompute({ keepView: true });
    renderMtfPanel();
  } catch (e) {
    console.warn('mtf', e);
  }
}

/* ---------------------------------------------------------------- 渲染 */

function renderAll() {
  renderAnalysisPanel();
  renderTickerStrip();
  renderStatus();
}

function renderAnalysisPanel() {
  if (!analysis) return;
  const risk = analysis.setup && !analysis.setup.none
    ? positionSize({
        accountSize: state.risk.account,
        riskPct: state.risk.riskPct,
        entry: analysis.setup.entry,
        stop: analysis.setup.stop,
        leverage: state.risk.leverage,
      })
    : null;
  setHTML('#panelAnalysis', [
    P.renderSetup(analysis, state.lang, risk),
    P.renderBias(analysis, mtfAgg, state.lang),
    P.renderStructure(analysis, state.lang),
    P.renderPois(analysis, state.lang),
    P.renderLiquidity(analysis, state.lang),
    P.renderKeyLevels(analysis, state.lang),
  ].join(''));
  const copyBtn = $('[data-copy-setup]');
  if (copyBtn) copyBtn.onclick = copyPlan;
}

/** 將目前計畫輸出成可貼進交易日誌的純文字 */
function copyPlan() {
  const s = analysis?.setup;
  if (!s || s.none) return;
  const L = isZh();
  const lines = [
    `${state.symbol} · ${state.interval} · ${PROVIDERS[feed.activeProvider]?.label}`,
    `${L ? '方向' : 'Direction'}: ${s.dir.toUpperCase()}  |  ${L ? '評級' : 'Grade'}: ${s.grade} (${s.score}/100)  |  R:R ${s.rrFinal.toFixed(2)}`,
    `${L ? '進場區' : 'Entry zone'}: ${fmtPrice(s.entryZone.bottom)} - ${fmtPrice(s.entryZone.top)} (${s.poi.type})`,
    `${L ? '進場' : 'Entry'}: ${fmtPrice(s.entry)}`,
    `${L ? '停損' : 'Stop'}: ${fmtPrice(s.stop)} (${s.riskPct.toFixed(2)}%)`,
    ...s.targets.map((t) => `${t.name}: ${fmtPrice(t.price)} (${t.rr.toFixed(2)}R, ${L ? t.label : t.labelEn})`),
    `${L ? '失效條件' : 'Invalidation'}: ${L ? s.invalidation : s.invalidationEn}`,
    `${L ? '匯流' : 'Confluence'}: ${s.checklist.filter((c) => c.ok).map((c) => (L ? c.zh : c.en)).join(' / ')}`,
    `${L ? '時間' : 'Time'}: ${fmtTime(Date.now(), { tz: state.timezone })} ${state.timezone}`,
  ];
  const text = lines.join('\n');
  navigator.clipboard?.writeText(text).then(
    () => toast(isZh() ? '交易計畫已複製到剪貼簿' : 'Trade plan copied'),
    () => toast(text, 'info', 8000),
  );
}

function renderMtfPanel() {
  const html = P.renderMtf(mtfRows, mtfAgg, state.lang)
    + (mtfAgg ? `<section class="card"><header class="card__head"><h3>${isZh() ? '由上而下敘事' : 'Top-down narrative'}</h3></header>
        <p class="pad" style="white-space:pre-line;line-height:1.75;font-size:11.5px">${escapeHtml(narrative(mtfRows, mtfAgg, state.lang))}</p></section>` : '');
  setHTML('#panelMtf', html || `<p class="dim pad">${isZh() ? '請於設定中選擇週期。' : 'Pick timeframes in settings.'}</p>`);
  if (mtfAgg) {
    $('#statusNarrative').textContent = narrative(mtfRows, mtfAgg, state.lang).split('\n')[0];
  }
}

function renderTickerStrip() {
  const base = state.symbol.replace('USDT', '');
  $('#symbolLabel').innerHTML = `${base}<span class="dim">/USDT</span>`;
  setHTML('#tickerStrip', P.renderTicker(ticker, analysis, state.lang, state.interval));
}

function renderStatus() {
  const p = PROVIDERS[feed.activeProvider];
  const streamMap = {
    live: [isZh() ? '即時串流' : 'Live stream', 'live'],
    polling: [isZh() ? '輪詢更新' : 'Polling', 'live'],
    closed: [isZh() ? '串流中斷' : 'Disconnected', 'err'],
    error: [isZh() ? '串流錯誤' : 'Stream error', 'err'],
    idle: [state.live ? (isZh() ? '待連線' : 'Idle') : (isZh() ? '已暫停' : 'Paused'), ''],
  };
  const [label, cls] = streamMap[feed.streamStatus] || streamMap.idle;
  $('#statusProvider').innerHTML = `<span class="status-dot ${p?.offline ? 'err' : 'live'}"></span>${p?.label || '—'} · ${state.symbol} · ${state.interval}`;
  $('#statusStream').innerHTML = `<span class="status-dot ${cls}"></span>${label}`;
  $('#statusUpdated').textContent = lastUpdated ? `${isZh() ? '更新於' : 'updated'} ${fmtAgo(lastUpdated)} ${isZh() ? '前' : 'ago'}` : '—';
  $('#liveBtn').classList.toggle('on', state.live);
}

function renderSymbolList(query) {
  const q = (query || '').trim().toUpperCase();
  const list = (symbols.length ? symbols : state.watchlist.map((s) => ({ symbol: s, price: 0, change: 0 })))
    .filter((s) => !q || s.symbol.includes(q))
    .slice(0, 60);
  $('#watchlistQuick').innerHTML = state.watchlist
    .map((s) => `<button data-sym="${s}">${s.replace('USDT', '')}</button>`).join('');
  $('#symbolList').innerHTML = list
    .map((s) => `<li data-sym="${s.symbol}">
        <span><b>${s.symbol.replace('USDT', '')}</b><span class="dim">/USDT</span></span>
        <span class="mono dim">${s.price ? fmtPrice(s.price) : ''}</span>
        <span class="mono ${s.change >= 0 ? 'up' : 'down'}">${s.change ? (s.change >= 0 ? '+' : '') + s.change.toFixed(2) + '%' : ''}</span>
        <span class="star ${state.watchlist.includes(s.symbol) ? 'on' : ''}" data-star="${s.symbol}">★</span>
      </li>`).join('');
  const pick = (e) => {
    const star = e.target.closest('[data-star]');
    if (star) {
      e.stopPropagation();
      const sym = star.dataset.star;
      const i = state.watchlist.indexOf(sym);
      if (i >= 0) state.watchlist.splice(i, 1);
      else state.watchlist.push(sym);
      saveState(state);
      renderSymbolList(query);
      return;
    }
    const li = e.target.closest('[data-sym]');
    if (!li) return;
    selectSymbol(li.dataset.sym);
  };
  $('#symbolList').onclick = pick;
  $('#watchlistQuick').onclick = pick;
}

function selectSymbol(sym) {
  state.symbol = sym;
  saveState(state);
  $('#symbolPanel').hidden = true;
  toggleReplay(false);
  loadData(true);
}

/* --------------------------------------------------------------- Hover tip */

function handleHover(hits, pointer) {
  const tip = $('#tip');
  if (!hits || !pointer) { tip.hidden = true; return; }
  tip.innerHTML = P.renderHoverTip(hits, state.lang);
  tip.hidden = false;
  const host = $('.chart-host').getBoundingClientRect();
  const w = tip.offsetWidth;
  const h = tip.offsetHeight;
  let x = pointer.x + 16;
  let y = pointer.y + 16;
  if (x + w > host.width) x = pointer.x - w - 16;
  if (y + h > host.height) y = Math.max(4, pointer.y - h - 16);
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
}

/* ------------------------------------------------------------------ 回放 */

function toggleReplay(on) {
  replay.active = on;
  $('#replayBar').hidden = !on;
  $('#replayBtn').classList.toggle('on', on);
  if (on) {
    feed.stopStream();
    replay.index = Math.max(120, Math.floor(candles.length * 0.7));
    $('#replayRange').value = replay.index;
  } else {
    clearInterval(replay.timer);
    replay.timer = null;
    $('#replayPlay').textContent = '▶';
    replay.index = candles.length;
    if (state.live) startStream();
  }
  recompute({ keepView: false });
}

function stepReplay(dir) {
  if (!replay.active) return;
  replay.index = Math.max(80, Math.min(candles.length, replay.index + dir));
  $('#replayRange').value = replay.index;
  recompute({ keepView: true });
}

function playReplay() {
  $('#replayPlay').textContent = '⏸';
  replay.timer = setInterval(() => {
    if (replay.index >= candles.length) {
      clearInterval(replay.timer);
      replay.timer = null;
      $('#replayPlay').textContent = '▶';
      return;
    }
    stepReplay(1);
  }, replay.speed);
}

/* ---------------------------------------------------------------- 掃描器 */

function bindScanner() {
  $('#scanBtn').onclick = async () => {
    const scope = $('#scanScope').value;
    const minScore = +$('#scanMinScore').value || 0;
    let list = state.watchlist;
    if (scope !== 'watchlist') {
      if (!symbols.length) await loadSymbols();
      list = symbols.slice(0, scope === 'top20' ? 20 : 50).map((s) => s.symbol);
    }
    if (!list.length) return toast(isZh() ? '清單為空' : 'Empty list', 'error');
    const bar = $('#scanProgress');
    bar.hidden = false;
    $('#scanBtn').disabled = true;
    $('#scanBtn').textContent = isZh() ? '掃描中…' : 'Scanning…';
    try {
      scanRows = await runScan(feed, {
        symbols: list,
        interval: state.interval,
        settings: state.smc,
        onProgress: ({ done, total }) => { bar.firstElementChild.style.width = `${(done / total) * 100}%`; },
      });
      const filtered = scanRows.filter((r) => !r.setup || r.setup.score >= minScore);
      setHTML('#scanResult', renderScanTable(filtered, state.lang));
      $('#scanResult').onclick = (e) => {
        const row = e.target.closest('[data-symbol]');
        if (row) selectSymbol(row.dataset.symbol);
      };
      toast(isZh() ? `掃描完成：${filtered.length} 個標的` : `Scan complete: ${filtered.length} symbols`);
    } catch (e) {
      toast((isZh() ? '掃描失敗：' : 'Scan failed: ') + e.message, 'error');
    } finally {
      bar.hidden = true;
      bar.firstElementChild.style.width = '0';
      $('#scanBtn').disabled = false;
      $('#scanBtn').textContent = isZh() ? '開始掃描' : 'Run scan';
    }
  };
}

/* ------------------------------------------------------------------ 回測 */

function bindBacktest() {
  $('#btRun').onclick = async () => {
    if (!candles.length) return;
    const bar = $('#btProgress');
    bar.hidden = false;
    $('#btRun').disabled = true;
    $('#btRun').textContent = isZh() ? '計算中…' : 'Running…';
    try {
      const { trades, stats } = await backtest(
        candles,
        {
          minScore: +$('#btMinScore').value || 55,
          horizon: +$('#btHorizon').value || 90,
          step: +$('#btStep').value || 5,
          settings: state.smc,
        },
        ({ done, total }) => { bar.firstElementChild.style.width = `${(done / total) * 100}%`; },
      );
      renderBacktest(trades, stats);
    } catch (e) {
      toast((isZh() ? '回測失敗：' : 'Backtest failed: ') + e.message, 'error');
    } finally {
      bar.hidden = true;
      bar.firstElementChild.style.width = '0';
      $('#btRun').disabled = false;
      $('#btRun').textContent = isZh() ? '執行回測' : 'Run backtest';
    }
  };
}

function renderBacktest(trades, s) {
  if (!s.count) {
    setHTML('#btResult', `<p class="dim pad">${isZh() ? '此設定下沒有產生足夠訊號，請降低最低評分或改用較長的歷史資料。' : 'No signals under these settings.'}</p>`);
    return;
  }
  const stat = (label, value, cls = '') => `<div class="stat"><span>${label}</span><b class="${cls}">${value}</b></div>`;
  const grades = s.byGrade.map((g) => `<div class="row"><span>${isZh() ? '評級' : 'Grade'} ${g.key}</span><b class="mono">${g.count} ${isZh() ? '筆' : 'trades'} · ${g.winRate.toFixed(0)}% · ${g.avgR.toFixed(2)}R</b></div>`).join('');
  const rows = trades.slice(-14).reverse().map((t) => `<tr>
      <td>${fmtTime(t.time, { tz: state.timezone }).slice(5, 16)}</td>
      <td class="${t.dir === 'long' ? 'up' : 'down'}">${t.dir === 'long' ? 'L' : 'S'}</td>
      <td class="mono">${fmtPrice(t.entry)}</td>
      <td class="mono ${t.r > 0 ? 'up' : 'down'}">${t.r.toFixed(2)}R</td>
      <td class="tiny dim">${t.outcome}</td></tr>`).join('');
  setHTML('#btResult', `
    <div class="stat-grid">
      ${stat(isZh() ? '訊號數' : 'Signals', s.count)}
      ${stat(isZh() ? '勝率' : 'Win rate', s.winRate.toFixed(1) + '%', s.winRate >= 50 ? 'up' : 'down')}
      ${stat(isZh() ? '期望值' : 'Expectancy', s.expectancy.toFixed(2) + 'R', s.expectancy > 0 ? 'up' : 'down')}
      ${stat(isZh() ? '總 R' : 'Total R', s.totalR.toFixed(1), s.totalR > 0 ? 'up' : 'down')}
      ${stat(isZh() ? '獲利因子' : 'Profit factor', isFinite(s.profitFactor) ? s.profitFactor.toFixed(2) : '∞')}
      ${stat(isZh() ? '最大回撤' : 'Max DD', s.maxDrawdownR.toFixed(1) + 'R', 'down')}
      ${stat(isZh() ? '平均獲利' : 'Avg win', s.avgWin.toFixed(2) + 'R', 'up')}
      ${stat(isZh() ? '平均虧損' : 'Avg loss', s.avgLoss.toFixed(2) + 'R', 'down')}
      ${stat(isZh() ? '最長連敗' : 'Max streak', s.maxLossStreak)}
    </div>
    <canvas class="equity" id="equityCurve"></canvas>
    <div class="card"><header class="card__head"><h3>${isZh() ? '分級表現' : 'By grade'}</h3></header><div class="rows rows--tight">${grades}</div></div>
    <table class="table table--compact"><thead><tr><th>${isZh() ? '時間' : 'Time'}</th><th></th><th>${isZh() ? '進場' : 'Entry'}</th><th>R</th><th>${isZh() ? '結果' : 'Result'}</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="hint">${isZh() ? '註：同一根 K 棒同時觸及停損與目標時，保守假設為停損；未計手續費與滑價。' : 'Note: stop assumed first when both are hit in one bar; fees and slippage excluded.'}</p>`);
  drawEquity(s.curve);
}

function drawEquity(curve) {
  const cv = $('#equityCurve');
  if (!cv || !curve.length) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 300;
  const h = 90;
  cv.width = w * dpr;
  cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const vals = curve.map((c) => c.equity);
  const min = Math.min(0, ...vals);
  const max = Math.max(0, ...vals);
  const span = max - min || 1;
  const x = (i) => (i / Math.max(1, curve.length - 1)) * (w - 4) + 2;
  const y = (v) => h - 6 - ((v - min) / span) * (h - 12);
  const css = getComputedStyle(document.documentElement);
  ctx.strokeStyle = css.getPropertyValue('--border').trim();
  ctx.beginPath();
  ctx.moveTo(0, y(0));
  ctx.lineTo(w, y(0));
  ctx.stroke();
  ctx.beginPath();
  curve.forEach((c, i) => (i ? ctx.lineTo(x(i), y(c.equity)) : ctx.moveTo(x(i), y(c.equity))));
  ctx.strokeStyle = vals[vals.length - 1] >= 0 ? css.getPropertyValue('--up').trim() : css.getPropertyValue('--down').trim();
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.lineTo(x(curve.length - 1), y(0));
  ctx.lineTo(x(0), y(0));
  ctx.closePath();
  ctx.fillStyle = (vals[vals.length - 1] >= 0 ? 'rgba(38,166,154,' : 'rgba(239,83,80,') + '0.12)';
  ctx.fill();
}

/* ------------------------------------------------------------------ 風險 */

function bindRisk() {
  const sync = () => {
    state.risk.account = +$('#riskAccount').value || 0;
    state.risk.riskPct = +$('#riskPct').value || 1;
    state.risk.leverage = +$('#riskLev').value || 1;
    saveState(state);
  };
  $('#riskAccount').value = state.risk.account;
  $('#riskPct').value = state.risk.riskPct;
  $('#riskLev').value = state.risk.leverage;
  ['#riskAccount', '#riskPct', '#riskLev'].forEach((id) => ($(id).onchange = () => { sync(); renderAnalysisPanel(); }));

  $('#riskFromSetup').onclick = () => {
    const s = analysis?.setup?.none ? null : analysis?.setup;
    if (!s) return toast(isZh() ? '目前沒有計畫可帶入' : 'No active plan', 'error');
    $('#riskEntry').value = s.entry.toFixed(6);
    $('#riskStop').value = s.stop.toFixed(6);
    $('#riskTarget').value = (s.targets[0]?.price ?? '').toString().slice(0, 12);
    $('#riskCalc').click();
  };
  $('#riskCalc').onclick = () => {
    sync();
    const entry = +$('#riskEntry').value;
    const stop = +$('#riskStop').value;
    const target = +$('#riskTarget').value;
    const pos = positionSize({ accountSize: state.risk.account, riskPct: state.risk.riskPct, entry, stop, leverage: state.risk.leverage });
    if (!pos) return toast(isZh() ? '請輸入有效的進場與停損價' : 'Enter valid entry & stop', 'error');
    const rr = target ? Math.abs(target - entry) / Math.abs(entry - stop) : null;
    setHTML('#riskResult', `<div class="card"><header class="card__head"><h3>${isZh() ? '計算結果' : 'Result'}</h3>
      ${rr ? `<span class="pill ${rr >= 2 ? 'pill--up' : 'pill--warn'}">${rr.toFixed(2)}R</span>` : ''}</header>
      <div class="rows">
        <div class="row"><span>${isZh() ? '風險金額' : 'Risk amount'}</span><b class="mono">${fmtNum(pos.riskAmount)} USDT</b></div>
        <div class="row"><span>${isZh() ? '每單位風險' : 'Risk per unit'}</span><b class="mono">${fmtNum(Math.abs(entry - stop), 6)}</b></div>
        <div class="row"><span>${isZh() ? '部位大小' : 'Position size'}</span><b class="mono">${fmtNum(pos.qty, 5)}</b></div>
        <div class="row"><span>${isZh() ? '名目價值' : 'Notional'}</span><b class="mono">${fmtNum(pos.notional)} USDT</b></div>
        <div class="row"><span>${isZh() ? '所需保證金' : 'Margin'}</span><b class="mono">${fmtNum(pos.marginRequired)} USDT</b></div>
        <div class="row"><span>${isZh() ? '實際槓桿' : 'Effective leverage'}</span><b class="mono">${pos.leverageUsed.toFixed(2)}×</b></div>
        ${target ? `<div class="row"><span>${isZh() ? '目標獲利' : 'Target profit'}</span><b class="mono up">${fmtNum(pos.qty * Math.abs(target - entry))} USDT</b></div>` : ''}
      </div>
      ${pos.liquidationWarning ? `<p class="invalid">⚠ ${isZh() ? '所需保證金超過帳戶權益，請降低風險或提高槓桿。' : 'Margin exceeds account equity.'}</p>` : ''}
    </div>`);
  };
}

/* ------------------------------------------------------------------ 警報 */

function bindAlerts() {
  alerts.requestPermission();
  const refresh = () => {
    setHTML('#alertList', renderAlerts(state.alerts, state.lang));
    $('#alertList').onclick = (e) => {
      const id = e.target.closest('[data-del-alert]')?.dataset.delAlert;
      if (!id) return;
      state.alerts = state.alerts.filter((a) => a.id !== id);
      saveState(state);
      refresh();
    };
  };
  $('#alertType').onchange = (e) => { $('#alertLevelRow').hidden = e.target.value !== 'price'; };
  $('#alertAdd').onclick = () => {
    const type = $('#alertType').value;
    const level = $('#alertLevel').value;
    if (type === 'price' && !level) return toast(isZh() ? '請輸入價位' : 'Enter a level', 'error');
    state.alerts.push(createAlert({ symbol: state.symbol, interval: state.interval, type, level, note: $('#alertNote').value }));
    saveState(state);
    $('#alertNote').value = '';
    refresh();
    toast(isZh() ? '已建立警報' : 'Alert created');
  };
  refresh();
}

  setHTML('#glossBody', renderGlossary(state.lang, $('#glossSearch').value));

/* ------------------------------------------------------------------ 設定 */

function bindSettings() {
  $('#setProvider').value = state.provider;
  $('#setCandles').value = state.candleCount;
  $('#setTz').value = state.timezone;
  $('#setBreakBy').value = state.smc.breakBy;
  $('#setObMode').value = state.smc.obZoneMode;
  $('#setInternal').value = state.smc.internalStrength;
  $('#setSwing').value = state.smc.swingStrength;
  $('#setDisp').value = state.smc.minDisplacementAtr;
  $('#setFvg').value = state.smc.fvgMinAtr;
  $('#setTol').value = state.smc.liquidityTolAtr;
  $('#setRR').value = state.smc.minRR;
  $('#setBuf').value = state.smc.riskBufferAtr;
  syncSettingLabels();

  $('#setProvider').onchange = (e) => {
    state.provider = e.target.value;
    feed.activeProvider = e.target.value;
    saveState(state);
    symbols = [];
    loadSymbols();
    loadData(true);
  };
  $('#setCandles').onchange = (e) => { state.candleCount = Math.max(150, Math.min(1000, +e.target.value || 500)); saveState(state); loadData(true); };
  $('#setTz').onchange = (e) => { state.timezone = e.target.value; chart.setTimezone(e.target.value); saveState(state); };

  const smcBind = (sel, key, parse = Number) => {
    $(sel).oninput = (e) => {
      state.smc[key] = parse(e.target.value);
      syncSettingLabels();
      saveState(state);
      debouncedRecompute();
    };
  };
  smcBind('#setInternal', 'internalStrength');
  smcBind('#setSwing', 'swingStrength');
  smcBind('#setDisp', 'minDisplacementAtr');
  smcBind('#setFvg', 'fvgMinAtr');
  smcBind('#setTol', 'liquidityTolAtr');
  smcBind('#setRR', 'minRR');
  smcBind('#setBuf', 'riskBufferAtr');
  $('#setBreakBy').onchange = (e) => { state.smc.breakBy = e.target.value; saveState(state); recompute({ keepView: true }); };
  $('#setObMode').onchange = (e) => { state.smc.obZoneMode = e.target.value; saveState(state); recompute({ keepView: true }); };

  $('#exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'smc-terminal-settings.json';
    a.click();
  };
  $('#resetBtn').onclick = () => {
    if (!confirm(isZh() ? '確定回復所有預設值？' : 'Reset all settings?')) return;
    Object.assign(state, resetState());
    saveState(state);
    location.reload();
  };
}

const debouncedRecompute = debounce(() => { recompute({ keepView: true }); loadMtf(); }, 250);

function syncSettingLabels() {
  $('#valInternal').textContent = state.smc.internalStrength;
  $('#valSwing').textContent = state.smc.swingStrength;
  $('#valDisp').textContent = Number(state.smc.minDisplacementAtr).toFixed(1);
  $('#valFvg').textContent = Number(state.smc.fvgMinAtr).toFixed(2);
  $('#valTol').textContent = Number(state.smc.liquidityTolAtr).toFixed(2);
  $('#valRR').textContent = Number(state.smc.minRR).toFixed(2);
  $('#valBuf').textContent = Number(state.smc.riskBufferAtr).toFixed(2);
}

function applyLang() {
  const tabs = T[state.lang].tabs;
  $$('#tabs button').forEach((b, i) => (b.textContent = tabs[i]));
  $('#symbolSearch').placeholder = isZh() ? '搜尋幣種… (BTC, ETH, SOL)' : 'Search symbol… (BTC, ETH, SOL)';
  $('#glossSearch').placeholder = isZh() ? '搜尋術語… OB / FVG / CHoCH' : 'Search terms… OB / FVG / CHoCH';
  $('#scanBtn').textContent = isZh() ? '開始掃描' : 'Run scan';
  $('#btRun').textContent = isZh() ? '執行回測' : 'Run backtest';
  $('#alertAdd').textContent = isZh() ? '建立警報' : 'Create alert';
  $('#riskCalc').textContent = isZh() ? '計算' : 'Calculate';
  $('#riskFromSetup').textContent = isZh() ? '帶入目前計畫' : 'Use current plan';
  $('#replayExit').textContent = isZh() ? '離開回放' : 'Exit replay';
  $('#exportBtn').textContent = isZh() ? '匯出設定' : 'Export settings';
  $('#resetBtn').textContent = isZh() ? '回復預設' : 'Reset';
  const dict = {
    appName: [isZh() ? 'SMC 加密貨幣分析終端' : 'SMC Crypto Terminal'],
    tagline: [isZh() ? 'Smart Money Concepts 專業分析工作台' : 'Smart Money Concepts workbench'],
    disclaimer: [isZh() ? '僅供教育與研究用途，不構成投資建議。' : 'Education only — not financial advice.'],
    replay: [isZh() ? '回放' : 'Replay'],
  };
  $$('[data-i18n]').forEach((n) => {
    const v = dict[n.dataset.i18n];
    if (v) n.textContent = v[0];
  });
}

/* -------------------------------------------------------------------- 啟動 */

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

// 便於在瀏覽器主控台檢查引擎輸出
window.__SMC__ = { get analysis() { return analysis; }, get candles() { return candles; }, state, feed, analyze };

})();
