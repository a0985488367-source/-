<style>
/* ==========================================================================
   SMC Crypto Terminal — 樣式
   設計語言：交易終端機（高密度資訊、等寬數字、低飽和背景、語意化配色）
   ========================================================================== */

:root {
  --bg: #0b0e14;
  --bg-elev: #111722;
  --bg-elev2: #161d2b;
  --border: #1e2635;
  --border-soft: #172031;
  --text: #d5deeb;
  --text-dim: #7c8aa0;
  --text-faint: #55617450;
  --up: #26a69a;
  --down: #ef5350;
  --warn: #e2b13c;
  --accent: #3aa0ff;
  --accent-soft: rgba(58, 160, 255, 0.12);
  --purple: #9b6dff;
  --radius: 8px;
  --radius-sm: 5px;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Roboto, sans-serif;
  --topbar-h: 52px;
  --status-h: 26px;
  /* iOS 瀏海／Home indicator 的安全區域（一般瀏覽器為 0） */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html[data-theme='light'] {
  --bg: #f6f8fb;
  --bg-elev: #ffffff;
  --bg-elev2: #eef2f7;
  --border: #dde3ec;
  --border-soft: #e7ecf3;
  --text: #1d2733;
  --text-dim: #66748a;
  --up: #0f9d76;
  --down: #e0413c;
  --warn: #b8860b;
  --accent: #1e78dc;
  --accent-soft: rgba(30, 120, 220, 0.1);
  --purple: #7b4fd0;
  --shadow: 0 8px 24px rgba(20, 40, 70, 0.12);
}

* { box-sizing: border-box; }
/* 讓 hidden 屬性勝過元件自身的 display（.replay-bar/.chart-loading 等） */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button, .chip, .tabs button, summary, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.tab-body, .symbol-list, .chart-toolbar, .tabs, .ticker-strip, .scroll-x { -webkit-overflow-scrolling: touch; }
input, select, textarea { font-size: 16px; } /* iOS 聚焦時不會自動放大頁面 */
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim { color: var(--text-dim); }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--text-dim); }
.muted { opacity: 0.5; }
.pad { padding: 12px; }
.hint { color: var(--text-dim); font-size: 11.5px; line-height: 1.6; margin: 0 0 10px; }
sup { font-size: 8px; color: var(--accent); margin-left: 2px; }

/* ------------------------------------------------------------------ Layout */

.app {
  display: grid;
  grid-template-rows: var(--topbar-h) 1fr var(--status-h);
  height: 100vh;
  height: 100dvh;
  /* 加到主畫面後，內容不可以被 iOS 狀態列蓋住（會整條按不到） */
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  background: var(--bg);
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  min-height: 0;
}

.chart-area {
  /* flex 而非 grid：隱藏的子元素（回放列／圖例）不會讓圖表掉到錯誤的列 */
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  border-right: 1px solid var(--border);
}

.chart-toolbar, .replay-bar, .legend-bar { flex: 0 0 auto; }
.chart-host { position: relative; flex: 1 1 auto; min-height: 0; }
#chart { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }

/* ------------------------------------------------------------------ Topbar */

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 12px;
  padding-left: max(12px, env(safe-area-inset-left));
  padding-right: max(12px, env(safe-area-inset-right));
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  min-width: 0;
}

.topbar__brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.logo {
  display: grid; place-items: center;
  width: 30px; height: 30px;
  border-radius: 7px;
  background: linear-gradient(135deg, var(--up), var(--accent));
  color: #041018; font-weight: 800; font-size: 11px; letter-spacing: 0.4px;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text b { font-size: 12.5px; }
.brand-text small { color: var(--text-dim); font-size: 10px; }

.symbol-box { position: relative; flex-shrink: 0; }
.symbol-btn {
  display: flex; align-items: center; gap: 7px;
  background: var(--bg-elev2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 7px 11px; cursor: pointer;
  font-weight: 700; font-size: 14px; letter-spacing: 0.3px;
}
.symbol-btn:hover { border-color: var(--accent); }

.symbol-panel {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
  width: 320px; background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); padding: 8px;
}
.symbol-panel input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 8px 10px; outline: none;
}
.symbol-panel input:focus { border-color: var(--accent); }
.symbol-panel__quick { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }
.symbol-panel__quick button {
  background: var(--bg-elev2); border: 1px solid var(--border); border-radius: 20px;
  padding: 3px 9px; font-size: 11px; cursor: pointer;
}
.symbol-panel__quick button:hover { border-color: var(--accent); color: var(--accent); }
.symbol-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: 320px; overflow-y: auto; }
.symbol-list li {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer;
}
.symbol-list li:hover { background: var(--bg-elev2); }
.symbol-list .star { color: var(--text-dim); cursor: pointer; padding: 0 4px; }
.symbol-list .star.on { color: var(--warn); }

.ticker-strip {
  display: flex; align-items: center; gap: 14px; min-width: 0;
  overflow-x: auto; scrollbar-width: none; flex: 1;
}
.ticker-strip::-webkit-scrollbar { display: none; }
.tk__price { font-family: var(--mono); font-size: 16px; font-weight: 700; }
.tk__chg { font-family: var(--mono); font-size: 12px; }
.tk__item { display: flex; flex-direction: column; font-family: var(--mono); font-size: 11.5px; line-height: 1.3; white-space: nowrap; }
.tk__item i { color: var(--text-dim); font-style: normal; font-size: 9px; letter-spacing: 0.4px; }
.tk__session i { color: var(--purple); }

.topbar__right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

/* ------------------------------------------------------------- Buttons/segs */

.btn {
  background: var(--bg-elev2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn--icon { width: 30px; height: 30px; padding: 0; display: grid; place-items: center; font-size: 13px; }
.btn--sm { padding: 4px 8px; font-size: 11.5px; }
.btn--block { width: 100%; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn--primary:hover { filter: brightness(1.1); color: #fff; }
.btn.on { border-color: var(--up); color: var(--up); }
.btn-row { display: flex; gap: 6px; margin: 8px 0; }

.seg { display: flex; background: var(--bg-elev2); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
.seg button {
  background: transparent; border: 0; padding: 6px 9px; cursor: pointer; font-size: 11.5px;
  color: var(--text-dim); border-right: 1px solid var(--border-soft);
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--text); background: var(--bg-elev); }
.seg button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg--sm button { padding: 4px 7px; font-size: 11px; }

/* -------------------------------------------------------------- Chart tools */

.chart-toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px; background: var(--bg-elev); border-bottom: 1px solid var(--border);
}
.toolbar-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

/* 只有圖層標籤橫向捲動，右側控制鈕固定在畫面上 */
.chips { display: flex; gap: 4px; flex-wrap: nowrap; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: thin; padding-bottom: 1px; }
.chips::-webkit-scrollbar { height: 3px; }
.chips::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 20px; padding: 3px 9px; font-size: 11px; cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }

.replay-bar {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px;
  background: var(--bg-elev2); border-bottom: 1px solid var(--border);
}
.replay-bar input[type='range'] { flex: 1; }
.mini-select { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 3px 6px; }

.legend-bar {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  padding: 5px 10px; background: var(--bg-elev); border-top: 1px solid var(--border);
  font-size: 10.5px; color: var(--text-dim); min-height: 26px;
}
.legend-bar span { display: inline-flex; align-items: center; gap: 4px; }
.legend-bar i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.legend-bar .box { width: 10px; height: 9px; border-radius: 2px; }

.chart-loading { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.25); }
.spinner { width: 26px; height: 26px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.tip {
  position: absolute; z-index: 40; pointer-events: none;
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 8px 10px; font-size: 11px; max-width: 290px; line-height: 1.55;
}
.tip__block + .tip__block { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border-soft); }
.tip b { display: block; margin-bottom: 2px; }

/* ----------------------------------------------------------------- Sidebar */

.sidebar { display: grid; grid-template-rows: auto 1fr; background: var(--bg-elev); min-height: 0; }

.tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  background: transparent; border: 0; border-bottom: 2px solid transparent;
  padding: 9px 12px; cursor: pointer; color: var(--text-dim); font-size: 12px; white-space: nowrap;
}
.tabs button:hover { color: var(--text); }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

.tab-body { overflow-y: auto; padding: 10px; min-height: 0; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ------------------------------------------------------------------- Cards */

.card {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 10px; overflow: hidden;
}
.card__head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border-bottom: 1px solid var(--border-soft); background: var(--bg-elev2);
}
.card__head h3 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.2px; }
.card--setup.long { border-color: rgba(38, 166, 154, 0.4); }
.card--setup.short { border-color: rgba(239, 83, 80, 0.4); }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 600;
  background: var(--bg-elev2); border: 1px solid var(--border);
}
.pill--sm { font-size: 9.5px; padding: 1px 6px; }
.pill--lg { font-size: 12px; padding: 4px 12px; }
.pill--up, .pill--down, .pill--warn { background: var(--bg-elev2); }
.pill--up { color: var(--up); border-color: var(--up); }
.pill--down { color: var(--down); border-color: var(--down); }
.pill--warn { color: var(--warn); border-color: var(--warn); }
@supports (color: color-mix(in srgb, red 50%, transparent)) {
  .pill--up { border-color: color-mix(in srgb, var(--up) 45%, transparent); background: color-mix(in srgb, var(--up) 12%, transparent); }
  .pill--down { border-color: color-mix(in srgb, var(--down) 45%, transparent); background: color-mix(in srgb, var(--down) 12%, transparent); }
  .pill--warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
}
.pill--flat { color: var(--text-dim); }

.rows { padding: 4px 10px 10px; }
.rows--tight { padding-top: 6px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--border-soft); font-size: 11.8px; }
.row:last-child { border-bottom: 0; }
.row > span { color: var(--text-dim); }
.row > b { font-weight: 600; text-align: right; }
.row .entry { color: var(--accent); }
.swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px; }
.kv-grid > div { background: var(--bg-elev2); border-radius: var(--radius-sm); padding: 6px 8px; }
.kv-grid span { display: block; color: var(--text-dim); font-size: 10px; }
.kv-grid b { font-family: var(--mono); font-size: 14px; }

/* -------------------------------------------------------------- Bias meter */

.bias-meter { padding: 12px 10px 4px; }
.bias-meter__track {
  position: relative; height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, var(--down), var(--text-faint) 50%, var(--up));
}
.bias-meter__track i {
  position: absolute; top: -4px; width: 3px; height: 14px; border-radius: 2px;
  background: var(--text); transform: translateX(-50%); box-shadow: 0 0 0 2px var(--bg);
}
.bias-meter__labels { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-dim); margin-top: 4px; }

.factors { padding: 4px 10px 10px; }
.factor { display: grid; grid-template-columns: 1fr 56px 34px; align-items: center; gap: 8px; font-size: 11px; padding: 3px 0; }
.factor__name { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.factor__name em { font-style: normal; opacity: 0.7; font-size: 10px; }
.factor__bar { background: var(--bg-elev2); height: 4px; border-radius: 2px; overflow: hidden; }
.factor__bar i { display: block; height: 100%; }
.factor__bar i.up { background: var(--up); }
.factor__bar i.down { background: var(--down); }
.factor__val { font-family: var(--mono); text-align: right; font-size: 10.5px; }

.range-bar { position: relative; height: 6px; margin: 10px 0 16px; background: linear-gradient(90deg, color-mix(in srgb, var(--up) 30%, transparent), color-mix(in srgb, var(--down) 30%, transparent)); border-radius: 3px; }
.range-bar i { position: absolute; top: -4px; width: 3px; height: 14px; background: var(--text); border-radius: 2px; transform: translateX(-50%); }
.range-bar__eq { position: absolute; left: 50%; top: -2px; width: 1px; height: 10px; background: var(--text-dim); }
.range-bar label { position: absolute; top: 10px; font-family: var(--mono); font-size: 9.5px; color: var(--text-dim); }
.range-bar label.lo { left: 0; }
.range-bar label.hi { right: 0; }

/* ------------------------------------------------------------------ Tables */

.table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.table th { text-align: left; color: var(--text-dim); font-weight: 500; font-size: 10px; padding: 6px 8px; border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; background: var(--bg); }
.table td { padding: 5px 8px; border-bottom: 1px solid var(--border-soft); }
.table tbody tr:hover { background: var(--bg-elev2); }
.table--compact td, .table--compact th { padding: 4px 8px; }
.table--scan { min-width: 520px; }
.scan-row { cursor: pointer; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
.dot.up { background: var(--up); }
.dot.down { background: var(--down); }
.tiny { font-size: 10px; }
.scroll-x { overflow-x: auto; }

/* --------------------------------------------------------------- Liquidity */

.liq-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
.liq-split h4 { margin: 0 0 5px; font-size: 10px; font-weight: 600; }
.liq { list-style: none; margin: 0; padding: 0; }
.liq li { display: grid; grid-template-columns: auto 1fr; gap: 4px 6px; font-size: 10.5px; padding: 3px 0; }
.liq .bar { grid-column: 1 / -1; height: 3px; background: var(--bg-elev2); border-radius: 2px; overflow: hidden; }
.liq .bar i { display: block; height: 100%; background: var(--warn); }

/* ------------------------------------------------------------------- Setup */

.setup-top { display: flex; align-items: center; gap: 10px; padding: 10px 10px 6px; }
.setup-score, .setup-rr { display: flex; flex-direction: column; line-height: 1.1; margin-left: auto; text-align: right; }
.setup-score b { font-family: var(--mono); font-size: 18px; }
.setup-score span, .setup-rr span { font-size: 9px; color: var(--text-dim); }
.setup-rr b { font-family: var(--mono); font-size: 15px; color: var(--up); }
.grade { font-weight: 800; font-size: 15px; font-family: var(--mono); }
.grade--Aplus, .grade--A { color: var(--up); }
.grade--B { color: var(--warn); }
.grade--C, .grade--D { color: var(--down); }

.checklist, .notes { border-top: 1px solid var(--border-soft); }
.checklist summary, .notes summary { padding: 7px 10px; cursor: pointer; font-size: 11.5px; font-weight: 600; }
.checklist ul { list-style: none; margin: 0; padding: 0 10px 10px; }
.checklist li { display: flex; align-items: center; gap: 7px; font-size: 11px; padding: 3px 0; color: var(--text-dim); }
.checklist li.ok { color: var(--text); }
.checklist .tick { width: 14px; display: inline-grid; place-items: center; border-radius: 3px; font-size: 9px; }
.checklist li.ok .tick { background: rgba(38, 166, 154, 0.22); color: var(--up); }
.checklist li.no .tick { background: rgba(239, 83, 80, 0.18); color: var(--down); }
.checklist li em { margin-left: auto; font-style: normal; font-size: 9.5px; opacity: 0.6; }
.notes ul { margin: 0; padding: 0 10px 6px 26px; font-size: 11px; line-height: 1.65; color: var(--text-dim); }
.invalid { margin: 0; padding: 6px 10px 10px; font-size: 11px; color: var(--warn); }
.head-actions { display: inline-flex; align-items: center; gap: 8px; }
.setup-warn { margin: 0; padding: 8px 10px; background: rgba(226, 177, 60, 0.12); color: var(--warn); font-size: 11px; border-bottom: 1px solid var(--border-soft); }
.risk-box { background: var(--bg-elev2); margin: 0 10px 8px; border-radius: var(--radius-sm); padding: 4px 8px; }

/* ------------------------------------------------------------------- Forms */

.form-row { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
.form-row label { color: var(--text-dim); font-size: 11.5px; }
.form-row label em { font-style: normal; color: var(--accent); font-family: var(--mono); }
.input {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 6px 8px; width: 100%; outline: none;
}
.input:focus { border-color: var(--accent); }
input[type='range'] { width: 100%; accent-color: var(--accent); }
.tab-panel h4 { margin: 14px 0 8px; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; }

.progress { height: 4px; background: var(--bg-elev2); border-radius: 2px; overflow: hidden; margin: 8px 0; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }

.alert-list { list-style: none; margin: 10px 0 0; padding: 0; }
.alert-list li {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 7px 9px; margin-bottom: 6px; font-size: 11.5px;
}
.alert-list li .mono { grid-column: 1; font-size: 11px; }
.alert-list li button { grid-row: 1 / span 2; grid-column: 2; }

/* --------------------------------------------------------------- Glossary */

.playbook { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin: 10px 0; }
.playbook h3 { margin: 0 0 8px; font-size: 12px; }
.playbook ol { margin: 0; padding-left: 0; list-style: none; counter-reset: step; }
.playbook li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 11.5px; line-height: 1.6; padding: 5px 0; border-bottom: 1px dashed var(--border-soft); }
.playbook li:last-child { border-bottom: 0; }
.playbook li b { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 10px; }

.gloss { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; background: var(--bg); }
.gloss summary { padding: 8px 10px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.gloss[open] summary { border-bottom: 1px solid var(--border-soft); }
.gloss__tag { background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 1px 6px; font-size: 9.5px; font-weight: 500; }
.gloss p { margin: 0; padding: 7px 10px; font-size: 11.5px; line-height: 1.7; color: var(--text-dim); }
.gloss p + p { border-top: 1px dashed var(--border-soft); }
.gloss__how b { color: var(--accent); }
.gloss__trade b { color: var(--up); }

/* ------------------------------------------------------------- Backtest UI */

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
.stat { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 8px; }
.stat span { display: block; font-size: 9.5px; color: var(--text-dim); }
.stat b { font-family: var(--mono); font-size: 14px; }
.equity { width: 100%; height: 90px; display: block; margin: 6px 0 10px; }

/* ---------------------------------------------------------------- Status */

.statusbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  background: var(--bg-elev); border-top: 1px solid var(--border);
  font-size: 10.5px; color: var(--text-dim); overflow: hidden; white-space: nowrap;
}
.status-item { display: inline-flex; align-items: center; gap: 5px; }
.status-item--grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim); }
.status-dot.live { background: var(--up); box-shadow: 0 0 6px var(--up); animation: pulse 2s infinite; }
.status-dot.err { background: var(--down); }
@keyframes pulse { 50% { opacity: 0.35; } }

/* ---------------------------------------------------------------- Toasts */

#toasts { position: fixed; right: 14px; bottom: 40px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
.toast {
  background: var(--bg-elev); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm); padding: 9px 12px; box-shadow: var(--shadow); font-size: 12px;
  max-width: 330px; animation: slidein 0.22s ease;
}
.toast--error { border-left-color: var(--down); }
.toast--alert { border-left-color: var(--warn); }
.toast--out { opacity: 0; transform: translateX(10px); transition: 0.3s; }
@keyframes slidein { from { opacity: 0; transform: translateX(16px); } }

/* ------------------------------------------------------- 安裝提示 / 全螢幕 */

.install-hint {
  position: fixed; left: 10px; right: 10px;
  bottom: calc(10px + var(--safe-bottom));
  z-index: 150; display: flex; align-items: center; gap: 10px;
  background: var(--bg-elev); border: 1px solid var(--accent);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 10px 12px; font-size: 12px; line-height: 1.5;
}
.install-hint svg { vertical-align: -2px; }
.install-hint b { color: var(--accent); }
.install-hint button { margin-left: auto; flex-shrink: 0; }

body.chart-full .sidebar,
body.chart-full .statusbar { display: none; }
body.chart-full .workspace { grid-template-rows: 1fr; grid-template-columns: 1fr; }
body.chart-full .legend-bar { display: none; }

body.panel-max .chart-area { display: none; }
body.panel-max .workspace { grid-template-rows: 1fr; grid-template-columns: 1fr; }

/* -------------------------------------------------------------- Responsive */

.only-mobile, .only-mobile-inline { display: none; }

@media (max-width: 1180px) {
  .workspace { grid-template-columns: minmax(0, 1fr) 330px; }
  .brand-text { display: none; }
}

@media (max-width: 900px) {
  :root { --topbar-h: auto; --status-h: 24px; }

  /* 固定高度 + 內部捲動：圖表與工具列永遠留在畫面上（交易 App 的正確行為） */
  .app { height: 100vh; height: 100dvh; }
  .topbar { flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; gap: 8px; }
  .ticker-strip { order: 3; flex: 0 0 100%; width: 100%; gap: 12px; }

/** 極簡事件匯流排（發佈／訂閱） */
function createBus() {
  const map = new Map();
  return {
    on(evt, fn) {
      if (!map.has(evt)) map.set(evt, new Set());
      map.get(evt).add(fn);
      return () => map.get(evt)?.delete(fn);
    },
    off(evt, fn) { map.get(evt)?.delete(fn); },
    emit(evt, payload) {
      map.get(evt)?.forEach((fn) => {
        try { fn(payload); } catch (e) { console.error(`[bus:${evt}]`, e); }
      });
      map.get('*')?.forEach((fn) => fn({ evt, payload }));
    },
  };
}
const bus = createBus();

/** 迷你 DOM 工具 */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return node;
}
function setHTML(target, html) {
  const node = typeof target === 'string' ? $(target) : target;
  if (node) node.innerHTML = html;
  return node;
}
function toast(message, kind = 'info', ms = 3200) {
  let host = $('#toasts');

  }
  const node = el('div', { class: `toast toast--${kind}`, text: message });

const J = async (url, { timeout = 12000 } = {}) => {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeout);
  try {
    const res = await fetch(url, { signal: ctl.signal, headers: { accept: 'application/json' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } finally {
    clearTimeout(t);
  }
};

const mkCandle = (t, o, h, l, c, v, closed = true) => ({
  time: +t, open: +o, high: +h, low: +l, close: +c, volume: +v, closed,

const DEMO_SYMBOLS = [
  ['BTCUSDT', 64000, 1], ['ETHUSDT', 3200, 2], ['SOLUSDT', 148, 3], ['BNBUSDT', 580, 4],
  ['XRPUSDT', 0.62, 5], ['DOGEUSDT', 0.14, 6], ['ADAUSDT', 0.45, 7], ['AVAXUSDT', 34, 8],
  ['LINKUSDT', 16.5, 9], ['TONUSDT', 6.8, 10], ['ARBUSDT', 1.05, 11], ['OPUSDT', 2.3, 12],
];

/**
 * 產生具備 SMC 特徵的合成行情：趨勢腿、回調、流動性掃除、位移缺口。
 * 使用固定亂數種子 → 結果可重現，適合教學與離線展示。
 */
function generateDemoCandles(symbol, interval, limit = 800, endTime = Date.now()) {
  const meta = DEMO_SYMBOLS.find((s) => s[0] === symbol) || ['BTCUSDT', 64000, 1];
  const rnd = mulberry32(meta[2] * 9973 + hashCode(interval));
  const stepMs = intervalMs(interval);
  // 固定長度 + 對齊週期的錨點：不論呼叫者要多少根，價格序列都一致
  const TOTAL = 1200;
  const anchor = Math.floor(endTime / stepMs) * stepMs;
  const start = anchor - stepMs * TOTAL;
  const want = Math.min(TOTAL, limit);
  limit = TOTAL;
  let price = meta[1];
  const vol = meta[1] * 0.004;
  const candles = [];
  let trend = rnd() > 0.5 ? 1 : -1;
  let legBars = 0;
  let legTarget = 30 + Math.floor(rnd() * 40);
  let phase = 'impulse';

  for (let i = 0; i < limit; i++) {
    legBars++;
    if (legBars > legTarget) {
      legBars = 0;
      legTarget = 18 + Math.floor(rnd() * 45);
      if (phase === 'impulse') phase = rnd() > 0.35 ? 'pullback' : 'range';
      else if (phase === 'pullback') { phase = 'impulse'; if (rnd() > 0.78) trend *= -1; }
      else phase = 'impulse';
    }
    let drift = 0;
    let sigma = vol;
    if (phase === 'impulse') { drift = trend * vol * 0.55; sigma = vol * 1.25; }
    else if (phase === 'pullback') { drift = -trend * vol * 0.28; sigma = vol * 0.8; }
    else { drift = 0; sigma = vol * 0.6; }

    // 軟性均值回歸：避免長序列隨機漂移到不合理的價位
    const pull = -((price - meta[1]) / meta[1]) * vol * 0.9;
    const open = price;
    let close = open + drift + pull + (rnd() - 0.5) * sigma * 2;
    let high = Math.max(open, close) + rnd() * sigma * 0.9;
    let low = Math.min(open, close) - rnd() * sigma * 0.9;

    // 隨機製造流動性掃除（長影線後收回）
    if (rnd() > 0.965) {
      const up = rnd() > 0.5;
      if (up) high += sigma * (1.5 + rnd() * 1.5);
      else low -= sigma * (1.5 + rnd() * 1.5);
      close = open + (up ? -1 : 1) * sigma * 0.3;
    }
    // 位移 K 棒 → 製造 FVG
    if (phase === 'impulse' && rnd() > 0.93) {
      close = open + trend * sigma * (2.2 + rnd() * 1.8);
      if (trend > 0) { high = close + sigma * 0.3; low = open - sigma * 0.1; }
      else { low = close - sigma * 0.3; high = open + sigma * 0.1; }
    }
    price = close;
    const volume = (0.6 + rnd() * 1.1) * (phase === 'impulse' ? 1.7 : 1) * meta[1] * 12;
    candles.push(mkCandle(start + i * stepMs, open, Math.max(high, open, close), Math.min(low, open, close), close, volume));
  }
  return candles.slice(-want);
}

function hashCode(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}
function intervalMs(interval) {
  const m = /^(\d+)([mhdw])$/.exec(interval);
  if (!m) return 900000;
  const n = +m[1];
  return n * { m: 60000, h: 3600000, d: 86400000, w: 604800000 }[m[2]];
}

/* ===== src/data/feed.js ===== */
/**
 * 行情串接層：負責抓取歷史 K 線、開啟即時串流、處理備援與快取。
 */


const cache = new Map();
const cacheKey = (p, s, i, l) => `${p}:${s}:${i}:${l}`;
const TTL = 20_000;
class Feed {
  constructor(state) {
    this.state = state;
    this.ws = null;
    this.activeProvider = state.provider;
    this.streamStatus = 'idle';
    this.symbolsCache = new Map();
  }

  get provider() {
    return getProvider(this.activeProvider);
  }

  /** 依序嘗試各資料源，回傳第一個成功者 */
  async withFallback(fn, { preferred } = {}) {
    const order = [preferred || this.state.provider, ...PROVIDER_ORDER.filter((p) => p !== (preferred || this.state.provider))];
    let lastErr;
    for (const id of order) {
      const provider = PROVIDERS[id];
      if (!provider) continue;
      try {
        const out = await fn(provider);
        if (this.activeProvider !== id) {
          this.activeProvider = id;
          bus.emit('provider:changed', { id, fallback: id !== this.state.provider });
        }
        return out;
      } catch (e) {
        lastErr = e;
        bus.emit('provider:error', { id, error: e?.message || String(e) });
      }
    }
    throw lastErr || new Error('所有資料源皆無法連線');
  }

  async getCandles(symbol, interval, limit = 500, { force = false } = {}) {
    const key = cacheKey(this.state.provider, symbol, interval, limit);
    const hit = cache.get(key);
    if (!force && hit && Date.now() - hit.at < TTL) return hit.data;
    const data = await this.withFallback((p) => p.fetchKlines(symbol, interval, { limit }));
    cache.set(key, { at: Date.now(), data });
    return data;
  }

  async getSymbols() {
    const key = this.state.provider;
    const hit = this.symbolsCache.get(key);
    if (hit && Date.now() - hit.at < 120_000) return hit.data;
    const data = await this.withFallback((p) => p.fetchSymbols());
    this.symbolsCache.set(key, { at: Date.now(), data });
    return data;
  }

  async getTicker(symbol, interval) {
    return this.withFallback((p) => p.fetchTicker(symbol, interval));
  }

  /** 多週期批次抓取（用於 MTF 面板與掃描器） */
  async getMulti(symbol, intervals, limit = 320) {
    const out = {};
    await Promise.all(
      intervals.map(async (iv) => {
        try {
          out[iv] = await this.getCandles(symbol, iv, limit);
        } catch {
          out[iv] = [];
        }
      }),
    );
    return out;
  }

  stopStream() {
    if (this.ws) {
      try { this.ws.onclose = null; this.ws.close(); } catch {}
      this.ws = null;
    }
    this.streamStatus = 'idle';
    bus.emit('stream:status', 'idle');
  }

  startStream(symbol, interval, onCandle) {
    this.stopStream();
    const provider = getProvider(this.activeProvider);
    if (!provider.supportsStream || typeof WebSocket === 'undefined') {
      this.streamStatus = 'polling';
      bus.emit('stream:status', 'polling');
      this.pollTimer && clearInterval(this.pollTimer);
      this.pollTimer = setInterval(async () => {
        try {
          const c = await provider.fetchKlines(symbol, interval, { limit: 2 });
          if (c.length) onCandle(c[c.length - 1]);
        } catch {}
      }, 15000);
      return;
    }
    try {
      this.ws = provider.createStream(symbol, interval, onCandle, (status) => {
        this.streamStatus = status;
        bus.emit('stream:status', status);
        if (status === 'closed' && this.state.live) {
          clearTimeout(this.retryTimer);
          this.retryTimer = setTimeout(() => this.startStream(symbol, interval, onCandle), 3000);
        }
      });
    } catch (e) {
      bus.emit('provider:error', { id: provider.id, error: e?.message || String(e) });
    }
  }

  /** 將即時 K 棒合併進既有序列 */
  static merge(candles, candle) {
    if (!candles.length) return [candle];
    const last = candles[candles.length - 1];
    if (candle.time === last.time) {
      candles[candles.length - 1] = { ...last, ...candle };
      return candles;
    }
    if (candle.time > last.time) {
      candles.push(candle);
      return candles;
    }
    return candles;
  }
}

/**
 * 傳統技術指標 — 作為 SMC 的輔助濾網（動能、波動度、成交量）
 * Classic indicators used as confluence filters for the SMC engine.
