# 部署 Cloudflare Worker（即時進場守門員）
#
# 需要在 Repo → Settings → Secrets and variables → Actions 加入兩個 secret：
#   CLOUDFLARE_API_TOKEN   權限：Workers Scripts 編輯 + Workers KV Storage 編輯
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 主控台右側的 Account ID
#
# Discord webhook 會沿用既有的 DISCORD_WEBHOOK_URL（或 SMC）secret，自動同步到 Worker，
# 不必在 Cloudflare 那邊再設定一次。
name: 部署 Cloudflare Worker

on:
  push:
    branches: ['main']
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 檢查 Cloudflare 金鑰
        id: check
        env:
          # 兩個都讀：secret 讀不到時退回 variable（很多人會誤填在 Variables 分頁）
          # 接受兩個名稱。實務上「更新既有 secret」這個動作比「新增」容易失敗，
          # 所以多開一個新名字讓人可以直接新增一個，不必去改舊的那個。
          TOKEN_SECRET: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_VAR: ${{ vars.CF_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
          TOKEN_NEW: ${{ secrets.CF_API_TOKEN }}
          # 帳戶 ID 同理：接受一個新名稱，新增一個就好，不用去更新舊的那個。
          ACCOUNT_SECRET: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_VAR: ${{ vars.CF_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_NEW: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 這一步只會印出「有沒有設定」「長度幾個字」，永遠不會印出金鑰內容。
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          TOKEN="$(trim "${TOKEN_SECRET:-$TOKEN_VAR}")"
          ACCOUNT="$(trim "${ACCOUNT_SECRET:-$ACCOUNT_VAR}")"

          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"
          [ -n "$ACCOUNT" ] && echo "::add-mask::$ACCOUNT"

          where() { [ -n "$1" ] && echo "Secrets 分頁" || { [ -n "$2" ] && echo "Variables 分頁" || echo "找不到"; }; }
          echo "=== 金鑰檢查（不會顯示內容）==="
          echo "API Token ：來源=$(where "$TOKEN_SECRET" "$TOKEN_VAR")，名稱=$([ -n "$TOKEN_NEW" ] && echo CF_API_TOKEN || echo CLOUDFLARE_API_TOKEN)，長度=${#TOKEN}"
          echo "帳戶 ID ：來源=$(where "$ACCOUNT_SECRET" "$ACCOUNT_VAR")，名稱=$([ -n "$ACCOUNT_NEW" ] && echo CF_ACCOUNT_ID || echo CLOUDFLARE_ACCOUNT_ID)，長度=${#ACCOUNT}"

          OK=true
          if [ -z "$TOKEN" ]; then
            echo "::error::讀不到 API Token。請在 Settings → Secrets and variables → Actions → Secrets 分頁按 New repository secret，新增一個名為 CF_API_TOKEN 的 secret（不必去動舊的 CLOUDFLARE_API_TOKEN）。"
            OK=false
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::讀不到 CLOUDFLARE_ACCOUNT_ID。同上，名稱完全等於 CLOUDFLARE_ACCOUNT_ID。"
            OK=false
          fi

          # 常見貼錯：整串網址貼進來了。Account ID 一定是 32 位十六進位，
          # 所以直接從貼上的內容裡把它挑出來（例如 https://dash.cloudflare.com/<32碼>/home）。
          if [ -n "$ACCOUNT" ] && ! printf '%s' "$ACCOUNT" | grep -qE '^[0-9a-fA-F]{32}$'; then
            PICKED="$(printf '%s' "$ACCOUNT" | grep -oE '[0-9a-fA-F]{32}' | head -n1)"
            if [ -n "$PICKED" ]; then
              echo "::add-mask::$PICKED"
              echo "ℹ️ CLOUDFLARE_ACCOUNT_ID 夾在別的文字裡（長度 ${#ACCOUNT}），已自動擷取出 32 碼的帳號 ID。"
              ACCOUNT="$PICKED"
            else
              echo "::error::CLOUDFLARE_ACCOUNT_ID 裡找不到 32 碼的帳號 ID。請到 https://dash.cloudflare.com 登入後，複製網址列 dash.cloudflare.com/ 後面那一段英數字。"
              OK=false
            fi
          fi
          # API Token 常見貼錯：前面多了 Bearer、或整段被引號包住
          TOKEN="$(printf '%s' "$TOKEN" | sed -e 's/^[Bb]earer[[:space:]]*//' -e 's/^["'"'"']//' -e 's/["'"'"']$//')"
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN"

          if [ "$OK" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
            echo "CF_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
            echo "✅ 兩個金鑰都讀到了，開始部署。"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "❌ 金鑰不齊，略過部署（不算失敗，補好再跑一次就好）。"
          fi

      - name: 驗證 Cloudflare 金鑰能不能用
        if: ${{ steps.check.outputs.ready == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          # 只印 Cloudflare 回傳的成功與否和錯誤訊息，不會印出金鑰。
          ok() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s||"{}").success?0:1))' 2>/dev/null; }
          why() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const e of (JSON.parse(s).errors||[]))console.log("   ["+e.code+"] "+e.message)}catch{console.log("   回應不是 JSON")}})'; }
          verify() { curl -sS -H "Authorization: Bearer $1" https://api.cloudflare.com/client/v4/user/tokens/verify; }

          # Cloudflare 的 API Token 是 40 個字元。如果貼進來的字串裡夾了別的文字
          # （例如連同「Token value:」一起複製），就把裡面那段 40 字元的挑出來試試看。
          CANDIDATES="$CLOUDFLARE_API_TOKEN"
          EXTRACTED="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -c 'A-Za-z0-9_-' '\n' | awk 'length($0)==40' | head -n1)"
          if [ -n "$EXTRACTED" ] && [ "$EXTRACTED" != "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::add-mask::$EXTRACTED"
            CANDIDATES="$CANDIDATES
          $EXTRACTED"
          fi

          GOOD=""
          while IFS= read -r CAND; do
            CAND="$(printf '%s' "$CAND" | tr -d '[:space:]')"
            [ -z "$CAND" ] && continue
            if verify "$CAND" | ok; then GOOD="$CAND"; break; fi
          done <<EOF
          $CANDIDATES
          EOF

          if [ -z "$GOOD" ]; then
            echo "❌ API Token 無效（長度 ${#CLOUDFLARE_API_TOKEN}）"
            verify "$CLOUDFLARE_API_TOKEN" | why
            echo "::error::Cloudflare 不認這把 API Token（長度 ${#CLOUDFLARE_API_TOKEN}，正常是 40）。請到 https://dash.cloudflare.com/profile/api-tokens 用 Edit Cloudflare Workers 範本建立，複製建立完成後「只顯示一次」的那一長串，然後在 GitHub 按 New repository secret 新增一個名為 CF_API_TOKEN 的 secret —— 不要去更新舊的那個。"
            exit 1
          fi
          if [ "$GOOD" != "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ℹ️ CLOUDFLARE_API_TOKEN 夾在別的文字裡，已自動擷取出 40 字元的 Token。"
            echo "CF_TOKEN=$GOOD" >> "$GITHUB_ENV"
          fi
          echo "✅ API Token 有效"

          KV="$(curl -sS -H "Authorization: Bearer $GOOD" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=1")"
          if printf '%s' "$KV" | ok; then
            echo "✅ 帳號 ID 正確，而且 Token 讀得到 Workers KV 清單"

            # 「讀清單」跟「建立」是兩種不同等級的權限，Cloudflare 常常只給了讀取。
            # 直接測試建立一個暫時的命名空間，成功就立刻刪掉，藉此在部署前就抓出
            # 「權限等級選成讀取而非編輯」這種問題，而不是等 wrangler 建立失敗才發現。
            CREATE="$(curl -sS -X POST \
              -H "Authorization: Bearer $GOOD" -H "Content-Type: application/json" \
              -d '{"title":"smc-signals-permission-probe"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")"
            if printf '%s' "$CREATE" | ok; then
              PROBE_ID="$(printf '%s' "$CREATE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result?.id||""))')"
              [ -n "$PROBE_ID" ] && curl -sS -X DELETE -H "Authorization: Bearer $GOOD" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$PROBE_ID" >/dev/null
              echo "✅ 也確認建得起 KV 命名空間（測試用的已經刪除）"
            elif printf '%s' "$CREATE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.exit((JSON.parse(s).errors||[]).some(e=>e.code===10014)?0:1)}catch{process.exit(1)}})'; then
              # 錯誤代碼 10014＝「同名命名空間已存在」，代表上一次執行中途
              # 被中斷、建立成功但沒跑到刪除那一步，殘留到這次——這件事本身
              # 已經證明 Edit 權限沒問題（沒有 Edit 權限根本建不出這個殘留），
              # 不該被誤判成「權限只有讀取」而擋住整次部署。把殘留的清掉、
              # 當作驗證通過繼續往下跑，下次也不會再被同一個殘留卡住。
              echo "ℹ️ 上次測試用的命名空間沒清乾淨、還留著——這本身就證明 Edit 權限沒問題，先清掉再繼續"
              STALE_ID="$(curl -sS -H "Authorization: Bearer $GOOD" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const hit=(JSON.parse(s).result||[]).find(n=>n.title==="smc-signals-permission-probe");process.stdout.write(hit?hit.id:"")}catch{process.stdout.write("")}})')"
              [ -n "$STALE_ID" ] && curl -sS -X DELETE -H "Authorization: Bearer $GOOD" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$STALE_ID" >/dev/null
              echo "✅ 也確認建得起 KV 命名空間（先前殘留的測試命名空間已清掉）"
            else
              printf '%s' "$CREATE" | why
              echo "::error::Token 讀得到 KV 清單，但建不了新的命名空間。這代表 Workers KV Storage 這條權限的等級被設成了「讀取」，需要改成「編輯」。請到 https://dash.cloudflare.com/profile/api-tokens 打開這把 Token 的 Edit，把 Workers KV Storage 那一列右邊的等級從 Read 改成 Edit，然後往下按 Save（不用重新複製貼上，等級本身改變不會產生新的 Token 字串）。"
              exit 1
            fi
          else
            printf '%s' "$KV" | why
            echo "::warning::讀不到這個帳號的 Workers KV，正在確認這把 Token 實際能看到哪些帳戶……"

            # 直接問 Cloudflare「這把 Token 能看到哪些帳戶」，
            # 不用再靠螢幕截圖去猜帳戶資源／權限到底哪裡沒對上。
            ACCOUNTS="$(curl -sS -H "Authorization: Bearer $GOOD" "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
            node -e '
              let s = "";
              process.stdin.on("data", d => s += d).on("end", () => {
                let j;
                try { j = JSON.parse(s); } catch { console.log("   （回應不是 JSON，可能是網路問題）"); return; }
                const configured = process.argv[1];
                if (!j.success) {
                  console.log("   Token 連「列出帳戶」都做不到 —— 這把 Token 可能完全沒有任何帳戶層級的權限。");
                  for (const e of j.errors || []) console.log("   [" + e.code + "] " + e.message);
                  return;
                }
                const list = j.result || [];
                if (!list.length) {
                  console.log("   這把 Token 看不到任何帳戶。多半是「帳戶資源」那格選成了空的，或勾錯了帳戶。");
                  return;
                }
                const ids = list.map((a) => a.id);
                if (ids.includes(configured)) {
                  console.log("   奇怪：Token 看得到這個帳戶（" + list.find(a=>a.id===configured).name + "），但剛才讀 KV 還是被拒絕。");
                  console.log("   這種情況通常是權限清單裡雖然有「Workers KV Storage」，但等級是「讀取」而不是「編輯」，或者剛編輯完權限後忘記按最後的「儲存／Save」。");
                } else {
                  console.log("   問題找到了：GitHub 上設定的帳戶 ID 跟這把 Token 能看到的帳戶對不起來。");
                  console.log("   這把 Token 實際看得到的帳戶：");
                  for (const a of list) console.log("     - " + a.name);
                  console.log("   請到 Cloudflare 主控台首頁，網址列 dash.cloudflare.com/ 後面那一段，才是要填進 CLOUDFLARE_ACCOUNT_ID 的值。");
                }
              });
            ' "$CLOUDFLARE_ACCOUNT_ID" <<< "$ACCOUNTS"

            echo "::error::Token 有效，但讀不到這個帳號的 Workers KV。詳細原因見上方輸出。"
            exit 1
          fi

      - name: 查 Cloudflare 官方 API，找出部署被拒絕的真正原因
        if: ${{ steps.check.outputs.ready == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          # 這一步只讀不寫，用來在真正部署前先排除幾個 Cloudflare 帳號常見的
          # 「權限看起來都對，但還是被拒絕」的原因，不再靠使用者截圖來回猜。
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"; }
          ok() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s||"{}").success?0:1))' 2>/dev/null; }
          why() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const e of (JSON.parse(s).errors||[]))console.log("   ["+e.code+"] "+e.message)}catch{console.log("   回應不是 JSON")}})'; }

          # 原因一：這個帳戶從來沒有在 Cloudflare 網頁上開通過 Workers、
          # 也沒有設定 workers.dev 子網域。沒有這個子網域，API 部署 Worker
          # 常常會被拒絕，即使 Token 權限完全正確。
          SUB="$(api "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          if printf '%s' "$SUB" | ok; then
            HOST="$(printf '%s' "$SUB" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result?.subdomain||"（空）"))')"
            echo "✅ 這個帳戶已經設定 workers.dev 子網域：$HOST"
          else
            echo "❌ 讀不到 workers.dev 子網域設定"
            printf '%s' "$SUB" | why
            echo "::warning::這個帳戶可能從來沒有在 Cloudflare 網頁上開通過 Workers。請登入 https://dash.cloudflare.com → 左側選單 Workers & Pages，如果它要你先選一個 workers.dev 子網域名稱（例如 xxx.workers.dev），代表就是這個原因——選好、確認之後再回來部署。"
          fi

          # 原因二：直接用 Token 呼叫「列出 Workers 指令碼」，
          # 確認 Workers Scripts 權限本身在這個帳戶下真的生效。
          LIST="$(api "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          if printf '%s' "$LIST" | ok; then
            echo "✅ Token 讀得到這個帳戶的 Workers 指令碼清單（權限本身沒問題）"
          else
            echo "❌ 連「列出 Workers 指令碼」都被拒絕"
            printf '%s' "$LIST" | why
          fi

      - name: 建立 KV 命名空間（若不存在）
        if: ${{ steps.check.outputs.ready == 'true' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          set -e
          find_id() {
            npx --yes wrangler@3 kv namespace list 2>/dev/null \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const hit=j.find(n=>String(n.title).includes("SMC_KV"));process.stdout.write(hit?hit.id:"")}catch{process.stdout.write("")}})'
          }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "建立 KV 命名空間 SMC_KV…"
            npx --yes wrangler@3 kv namespace create SMC_KV || true
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then
            echo "::error::無法取得 KV 命名空間 ID，請確認 API Token 有 Workers KV Storage 的編輯權限"
            exit 1
          fi
          echo "KV 命名空間 ID：$ID"
          echo "KV_ID=$ID" >> "$GITHUB_ENV"

      - name: 打包 Worker（含它 import 的 SMC 引擎），才能真的做全市場掃描
        # worker/index.js 現在會 import ../src/market/scan.js（進而 import 到
        # SMC 引擎一大串檔案），但部署走的經典上傳 API 只能傳一個檔案，
        # 沒有打包步驟就會找不到模組。用 esbuild 把它跟它需要的原始碼
        # 一起打包成一個自包含的檔案，再上傳這個打包後的版本。
        if: ${{ steps.check.outputs.ready == 'true' }}
        working-directory: worker
        run: |
          set -e
          npx --yes esbuild@0.24 index.js --bundle --format=esm --platform=neutral --outfile=dist/index.js
          echo "打包完成：$(wc -c < dist/index.js) bytes"

      - name: 部署 Worker（改用 Cloudflare 經典上傳 API，不走 wrangler 的版本化部署）
        if: ${{ steps.check.outputs.ready == 'true' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
          # Global API Key 是完全不同的驗證機制（等同帳號本人登入，沒有像
          # Scoped Token 那樣的權限範圍）。實測發現連經典上傳 API 都被 Scoped
          # Token 拒絕、而且沒有任何錯誤代碼，判斷問題出在這把 Token 的範圍
          # 本身，不是端點選錯。兩個都有設定時優先用 Global Key 試這一步。
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_GLOBAL_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
        run: |
          set -e
          if [ -n "$CF_EMAIL" ] && [ -n "$CF_GLOBAL_KEY" ]; then
            echo "ℹ️ 有設定 Global API Key，這一步改用它（Scoped Token 的範圍似乎擋住了寫入 Workers 指令碼）"
            AUTH_HEADERS=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_GLOBAL_KEY")
          else
            AUTH_HEADERS=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          fi
          # vars 直接從 wrangler.toml 讀，不在這裡另外複製一份數字，
          # 這樣以後改 wrangler.toml 就不必記得回來同步這支腳本。
          METADATA="$(node -e '
            const fs = require("fs");
            const toml = fs.readFileSync("wrangler.toml", "utf8");
            const vars = {};
            const varsBlock = toml.match(/\[vars\]\n([\s\S]*?)(?=\n\[|$)/);
            if (varsBlock) {
              for (const line of varsBlock[1].split("\n")) {
                const m = line.match(/^(\w+)\s*=\s*"(.*)"\s*$/);
                if (m) vars[m[1]] = m[2];
              }
            }
            const main = (toml.match(/^main\s*=\s*"(.+)"/m) || [, "index.js"])[1];
            const compat = (toml.match(/^compatibility_date\s*=\s*"(.+)"/m) || [, "2024-11-01"])[1];
            const kvBinding = (toml.match(/binding\s*=\s*"(\w+)"/) || [, "SMC_KV"])[1];
            const bindings = [
              { type: "kv_namespace", name: kvBinding, namespace_id: process.argv[1] },
              ...Object.entries(vars).map(([name, text]) => ({ type: "plain_text", name, text })),
            ];
            console.log(JSON.stringify({ main_module: main, compatibility_date: compat, bindings }));
          ' "$KV_ID")"

          # 上傳打包後的檔案（dist/index.js），不是原始的 index.js——metadata 裡
          # main_module 寫的是 "index.js"，Cloudflare 是用這個表單欄位名稱去對應
          # main_module，欄位名稱不變，只是內容換成打包後的版本。
          RESP="$(curl -sS -X PUT \
            "${AUTH_HEADERS[@]}" \
            -F "metadata=$METADATA;type=application/json" \
            -F "index.js=@dist/index.js;type=application/javascript+module" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/smc-signals")"

          if ! printf '%s' "$RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s||"{}").success?0:1))' 2>/dev/null; then
            echo "❌ 部署失敗"
            printf '%s' "$RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(JSON.stringify(j,null,2))}catch{console.log(s)}})'
            exit 1
          fi
          echo "✅ Worker 程式碼已部署"

          # 啟用這支 script 的 workers.dev 網址：這是跟「部署程式碼」完全獨立的
          # 開關（Cloudflare API 文件：POST .../workers/scripts/{name}/subdomain）。
          # wrangler deploy 會自動做這一步，但這裡繞過 wrangler 直接用經典 API
          # 上傳程式碼，所以網址開關要自己補上——不補的話程式碼部署會顯示成功，
          # 但打開 https://smc-signals.<子網域>.workers.dev 只會看到 Cloudflare
          # 「There is nothing here yet」的預設頁面，跟金鑰或程式碼本身無關。
          SUBDOMAIN_RESP="$(curl -sS -X POST \
            "${AUTH_HEADERS[@]}" -H "Content-Type: application/json" \
            -d '{"enabled":true,"previews_enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/smc-signals/subdomain")"
          if printf '%s' "$SUBDOMAIN_RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s||"{}").success?0:1))' 2>/dev/null; then
            echo "✅ workers.dev 網址已啟用"
          else
            echo "::warning::啟用 workers.dev 網址失敗，程式碼雖然部署了但網址可能打不開"
            printf '%s' "$SUBDOMAIN_RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const e of (JSON.parse(s).errors||[]))console.log("   ["+e.code+"] "+e.message)}catch{}})'
          fi

          # 排程觸發器（每 2 分鐘）也是獨立的經典端點，跟上面同一套 API。
          CRON_RESP="$(curl -sS -X PUT \
            "${AUTH_HEADERS[@]}" -H "Content-Type: application/json" \
            -d '[{"cron":"*/2 * * * *"}]' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/smc-signals/schedules")"
          if printf '%s' "$CRON_RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s||"{}").success?0:1))' 2>/dev/null; then
            echo "✅ 排程（每 2 分鐘）已設定"
          else
            echo "::warning::排程設定失敗，Worker 已部署但不會自動觸發，可以之後在 Cloudflare 主控台手動加"
            printf '%s' "$CRON_RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const e of (JSON.parse(s).errors||[]))console.log("   ["+e.code+"] "+e.message)}catch{}})'
          fi

      - name: 同步 Discord webhook 到 Worker
        if: ${{ steps.check.outputs.ready == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.SMC }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_GLOBAL_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::沒有 Discord webhook secret，Worker 將無法推播"
            exit 0
          fi
          # 這是 Workers 指令碼底下的子資源，跟部署那步一樣可能被 Scoped
          # Token 擋下來，同樣優先用 Global Key（如果有設定）。
          if [ -n "$CF_EMAIL" ] && [ -n "$CF_GLOBAL_KEY" ]; then
            AUTH_HEADERS=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_GLOBAL_KEY")
          else
            AUTH_HEADERS=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          fi
          PAYLOAD="$(node -e 'console.log(JSON.stringify({name:"DISCORD_WEBHOOK_URL", text: process.argv[1], type: "secret_text"}))' "$WEBHOOK")"
          RESP="$(curl -sS -X PUT \
            "${AUTH_HEADERS[@]}" -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/smc-signals/secrets")"
          if printf '%s' "$RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s||"{}").success?0:1))' 2>/dev/null; then
            echo "已同步 webhook 到 Worker"
          else
            echo "::warning::webhook 同步失敗"
            printf '%s' "$RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const e of (JSON.parse(s).errors||[]))console.log("   ["+e.code+"] "+e.message)}catch{}})'
          fi

      - name: 同步選用金鑰到 Worker（沒設定就略過，不影響其他功能）
        if: ${{ steps.check.outputs.ready == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
          CF_EMAIL: ${{ secrets.CF_EMAIL }}
          CF_GLOBAL_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
          EXECUTOR_URL: ${{ secrets.EXECUTOR_URL }}
          EXECUTOR_HMAC_SECRET: ${{ secrets.EXECUTOR_HMAC_SECRET }}
          AUTO_TRADE_TOKEN: ${{ secrets.AUTO_TRADE_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
        run: |
          if [ -n "$CF_EMAIL" ] && [ -n "$CF_GLOBAL_KEY" ]; then
            AUTH_HEADERS=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_GLOBAL_KEY")
          else
            AUTH_HEADERS=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          fi
          sync_secret() {
            NAME="$1"; VALUE="$2"
            if [ -z "$VALUE" ]; then
              echo "ℹ️ 沒有設定 $NAME，跳過（自動下單維持關閉，不影響其他功能）"
              return 0
            fi
            PAYLOAD="$(node -e 'console.log(JSON.stringify({name: process.argv[1], text: process.argv[2], type: "secret_text"}))' "$NAME" "$VALUE")"
            RESP="$(curl -sS -X PUT \
              "${AUTH_HEADERS[@]}" -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/smc-signals/secrets")"
            if printf '%s' "$RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s||"{}").success?0:1))' 2>/dev/null; then
              echo "已同步 $NAME 到 Worker"
            else
              echo "::warning::$NAME 同步失敗"
              printf '%s' "$RESP" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{for(const e of (JSON.parse(s).errors||[]))console.log("   ["+e.code+"] "+e.message)}catch{}})'
            fi
          }
          sync_secret EXECUTOR_URL "$EXECUTOR_URL"
          sync_secret EXECUTOR_HMAC_SECRET "$EXECUTOR_HMAC_SECRET"
          sync_secret AUTO_TRADE_TOKEN "$AUTO_TRADE_TOKEN"
          sync_secret GITHUB_API_TOKEN "$GITHUB_API_TOKEN"

      - name: 部署完直接打 /status 確認現在的狀態（不需要另外開瀏覽器查）
        if: ${{ steps.check.outputs.ready == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          SUB="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          HOST="$(printf '%s' "$SUB" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s||"{}").result?.subdomain||""))')"
          if [ -z "$HOST" ]; then
            echo "::warning::讀不到 workers.dev 子網域，略過這次的 /status 確認"
            exit 0
          fi
          # 部署跟排程剛生效，給它幾秒再打，避免打到還沒切換完成的舊版本
          sleep 5
          curl -sS "https://smc-signals.$HOST.workers.dev/status" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.stringify(JSON.parse(s),null,2))}catch{console.log("回應不是 JSON：",s)}})'
          echo "--- /auto-trade/status ---"
          curl -sS "https://smc-signals.$HOST.workers.dev/auto-trade/status" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.stringify(JSON.parse(s),null,2))}catch{console.log("回應不是 JSON：",s)}})'
          echo "--- /auto-trade/status?detail=1（列出每筆追蹤中部位的完整內容，排查有停損沒止盈這種問題不用再猜） ---"
          curl -sS "https://smc-signals.$HOST.workers.dev/auto-trade/status?detail=1" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.stringify(JSON.parse(s),null,2))}catch{console.log("回應不是 JSON：",s)}})'
          echo "--- /run?dry=1（不會推播、不會下單，只看這次執行會不會出錯、抓到幾個訊號） ---"
          curl -sS "https://smc-signals.$HOST.workers.dev/run?dry=1" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.stringify(JSON.parse(s),null,2))}catch{console.log("回應不是 JSON：",s)}})'
