# SMC 訊號 → Discord（含模擬盤追蹤與每日晨報）
#
# 每 15 分鐘掃描一次；每天台灣時間 08:00 推一份晨報。
# 因為跑在 GitHub 的機器上，所以「手機關著、網頁沒開」也會通知。
#
# 使用前只要做一件事：
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#   Name: DISCORD_WEBHOOK_URL（或 SMC，兩個名稱都接受）
#   Secret: 你的 Discord webhook 網址
name: SMC 訊號推播

on:
  schedule:
    - cron: '*/15 * * * *'   # 每 15 分鐘掃描（UTC；GitHub 排程可能延遲幾分鐘）
    - cron: '0 0 * * *'      # 每日晨報（UTC 00:00 = 台灣 08:00）
  workflow_dispatch:
    inputs:
      mode:
        description: 執行模式
        type: choice
        default: run
        options: [run, brief, market, probe, test, dry-run]

permissions:
  contents: write   # 需要把模擬盤帳本寫回倉庫

concurrency:
  group: smc-signals
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 決定執行模式
        id: mode
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then MODE=brief; else MODE=run; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "執行模式：$MODE"

      - name: 檢查 webhook 是否已設定
        id: check
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.SMC }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 探測交易所連線（不需要 webhook）
        if: ${{ steps.mode.outputs.mode == 'probe' }}
        run: node scripts/discord-notify.mjs --probe

      - name: 尚未設定 webhook
        if: ${{ steps.mode.outputs.mode != 'probe' && steps.check.outputs.configured != 'true' }}
        run: |
          echo "::warning::尚未設定 DISCORD_WEBHOOK_URL，略過推播。"
          echo "設定方式：Repo → Settings → Secrets and variables → Actions → New repository secret"
          echo "  Name:   DISCORD_WEBHOOK_URL（或 SMC）"
          echo "  Secret: 你的 Discord webhook 網址"
          node scripts/discord-notify.mjs --dry-run

      # 全市場掃描：成交量前 N 名跑一遍，產生「可進場 / 等待回測」清單供網站與推播使用
      - name: 全市場掃描
        if: ${{ steps.mode.outputs.mode == 'run' || steps.mode.outputs.mode == 'market' || steps.mode.outputs.mode == 'brief' }}
        run: |
          # 手動選 market 模式時強制重掃，其餘情況沿用 45 分鐘內的結果
          if [ "${{ steps.mode.outputs.mode }}" = "market" ]; then
            node scripts/market-scan.mjs
          else
            node scripts/market-scan.mjs --if-stale=45
          fi

      - name: 執行
        if: ${{ steps.mode.outputs.mode != 'probe' && steps.check.outputs.configured == 'true' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.SMC }}
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            test)    node scripts/discord-notify.mjs --test ;;
            brief)   node scripts/discord-notify.mjs --brief ;;
            market)  echo "（僅執行全市場掃描）" ;;
            dry-run) node scripts/discord-notify.mjs --dry-run ;;
            *)       node scripts/discord-notify.mjs ;;
          esac

      # 帳本存回倉庫：紀錄永久保留，也可以直接在 GitHub 上瀏覽 data/journal.md
      - name: 保存模擬盤帳本
        if: ${{ always() && steps.mode.outputs.mode != 'probe' && steps.mode.outputs.mode != 'test' && steps.mode.outputs.mode != 'dry-run' }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "帳本沒有變化，不需要提交"
            exit 0
          fi
          git config user.name "smc-signals[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): 更新模擬盤帳本 [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "已提交"
              exit 0
            fi
            echo "推送失敗，5 秒後重試（$i/3）"
            sleep 5
          done
          echo "::warning::帳本推送失敗，下次執行會再試"
