# 看一個幣現在的教練狀態（15m／30m／1h＋4h 方向），結果印在 notice
name: 教練看單一幣
on:
  workflow_dispatch:
    inputs:
      sym:
        description: '幣（例如 TRUMPUSDT）'
        default: 'TRUMPUSDT'
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/research/coach-peek.mjs --sym="${{ inputs.sym }}"
      - name: 教練劇本紀錄（算數的）
        run: |
          curl -sS -m 30 "${{ vars.WORKER_URL || 'https://smc-signals.crypto-radar-guardian-24x7.workers.dev' }}/coach-live" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const tpe=(x)=>new Date(x*1000+8*3600e3).toISOString().slice(5,16).replace("T"," ");const d=j.done.filter(x=>!x.rule);const L=d.map(x=>`${tpe(x.rtT)}→${x.endT?tpe(x.endT):"-"} ${x.sym.replace(/USDT$/,"")} ${x.iv} ${x.side==="L"?"多":"空"} ${x.rr}R 順勢=${x.bias} ${x.out} ${x.r>=0?"+":""}${x.r}R`);L.push(`進行中 ${j.open.length} 筆：`+j.open.map(x=>`${x.sym.replace(/USDT$/,"")} ${x.iv} ${x.side==="L"?"多":"空"} ${x.rr}R`).join("、"));const enc=(x)=>x.replace(/%/g,"%25").replace(/\n/g,"%0A");for(let k=0;k<L.length;k+=25)console.log(`::notice title=教練紀錄 ${k/25+1}::${enc(L.slice(k,k+25).join("\n"))}`)})'
