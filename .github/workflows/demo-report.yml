# Demo 帳戶實際成交的績效報告（依策略分開統計）
#
# 跟 Executor 拿最近幾天的成交明細（GET /history），還原成一筆一筆的交易，
# 結果印在 log 和步驟摘要。Executor 要先部署過有 /history 的版本（fly deploy）。
name: Demo 實際績效報告

on:
  workflow_dispatch:
    inputs:
      days:
        description: '往前查幾天（最多 90）'
        default: '30'
      mode:
        description: 'report＝成交報告；ledger＝對帳（每週餘額掉多少、各策略／資金費／對不上的、現在持倉）；st-whatif＝超級趨勢如果沒手動平倉會怎樣；rcheck＝自動策略每筆換算 R（跟回測比）'
        type: choice
        options: [report, ledger, st-whatif, rcheck]
        default: report
      strategy:
        description: '明細只列某個策略（st 超級趨勢、coach 教練、bo 突破…空白＝全部）'
        default: ''

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 產生報告
        env:
          EXECUTOR_URL: ${{ secrets.EXECUTOR_URL }}
          EXECUTOR_HMAC_SECRET: ${{ secrets.EXECUTOR_HMAC_SECRET }}
          DAYS: ${{ inputs.days }}
          ONLY_STRATEGY: ${{ inputs.strategy }}
          WORKER_URL: ${{ vars.WORKER_URL || 'https://smc-signals.crypto-radar-guardian-24x7.workers.dev' }}
        run: |
          case "${{ inputs.mode }}" in
            st-whatif) node scripts/research/st-whatif.mjs ;;
            ledger) node scripts/demo-ledger.mjs ;;
            rcheck) node scripts/demo-rcheck.mjs ;;
            *) node scripts/demo-report.mjs ;;
          esac
