# 部位管理規則 A/B 實測
#
# 這個沙盒環境連不到交易所 API，但 Actions runner 連得到，
# 所以研究用的回測放在這裡跑，結果直接印在 log 並存進 data/research/。
name: 策略研究（A/B 實測）

on:
  workflow_dispatch:
    inputs:
      study:
        description: '要跑哪個研究：ab-test（部位管理規則）或 confluence（斐波那契／成交量分布匯流）'
        type: choice
        options: [ab-test, confluence]
        default: ab-test
      symbols:
        description: '要測的幣種（逗號分隔）'
        default: 'BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,LTCUSDT,DOTUSDT,NEARUSDT,APTUSDT,ARBUSDT,OPUSDT'
      intervals:
        description: '週期（逗號分隔）；留空＝該研究的預設值'
        default: ''
      min_score:
        description: '最低分數'
        default: '55'
      variants:
        description: 'ab-test 只跑這些規則（逗號分隔）；留空＝全部'
        default: ''
      btc_ema:
        description: 'ab-test 判斷 BTC 漲跌用的 EMA 長度'
        default: '200'
      commit:
        description: '是否把結果存回倉庫'
        default: 'true'

permissions:
  contents: write

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 跑研究
        env:
          STUDY: ${{ inputs.study }}
          SYMBOLS: ${{ inputs.symbols }}
          INTERVALS: ${{ inputs.intervals }}
          MIN_SCORE: ${{ inputs.min_score }}
          VARIANTS: ${{ inputs.variants }}
          BTC_EMA: ${{ inputs.btc_ema }}
        run: |
          set -o pipefail
          if [ "$STUDY" = confluence ]; then SCRIPT=confluence-study; DEF_INT=30m,1h,4h; else SCRIPT=ab-test; DEF_INT=15m,1h; fi
          node "scripts/research/$SCRIPT.mjs" \
            --symbols="$SYMBOLS" \
            --intervals="${INTERVALS:-$DEF_INT}" \
            --min-score="$MIN_SCORE" \
            --only="$VARIANTS" \
            --btc-ema="${BTC_EMA:-200}" \
            | tee ab-output.txt

      - name: 寫進步驟摘要
        if: always()
        run: |
          {
            echo "## 策略研究：${{ inputs.study }}"
            echo '```'
            cat ab-output.txt || echo '(沒有輸出)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 存回倉庫
        if: ${{ inputs.commit == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/research/ || true
          git diff --cached --quiet || git commit -m "chore(research): 更新 ${{ inputs.study }} 研究結果 [skip ci]"
          git push
