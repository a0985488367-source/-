# 部位管理規則 A/B 實測
#
# 這個沙盒環境連不到交易所 API，但 Actions runner 連得到，
# 所以研究用的回測放在這裡跑，結果直接印在 log 並存進 data/research/。
name: 策略研究（A/B 實測）

on:
  workflow_dispatch:
    inputs:
      study:
        description: '要跑哪個研究：ab-test（部位管理規則）、confluence（斐波那契／成交量分布匯流）、alt（別種做法：突破、回檔、RSI2）、fakeout（假突破 MSS 反手／延續後 OTE 回調進場）、smc-mix（SMC 條件單項＋兩兩組合，例如 FVG＋斐波那契）或 mtf-smc（多週期 SMC：日線→4h→1h→15m、PO3、成交量分布；天數用 extra 的 --days=）'
        type: choice
        options: [ab-test, confluence, alt, fakeout, smc-mix, mtf-smc]
        default: ab-test
      symbols:
        description: '要測的幣種（逗號分隔）'
        default: 'BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,LTCUSDT,DOTUSDT,NEARUSDT,APTUSDT,ARBUSDT,OPUSDT'
      intervals:
        description: '週期（逗號分隔）；留空＝該研究的預設值'
        default: ''
      min_score:
        description: '最低分數'
        default: '55'
      variants:
        description: 'ab-test 只跑這些規則（逗號分隔）；留空＝全部'
        default: ''
      btc_ema:
        description: 'ab-test 判斷 BTC 漲跌用的 EMA 長度'
        default: '200'
      fee:
        description: 'ab-test 每筆一進一出的成本（占倉位價值），預設 0.0011；要算滑價就加大'
        default: '0.0011'
      limit:
        description: '每個幣／週期抓幾根 K 棒（超過 1000 會自動分段往前抓；愈多愈穩但跑愈久）'
        default: '1000'
      sub:
        description: '精準驗證：另外抓細 K 棒（例如 5m），*_5M 規則進場後改用細 K 棒逐根跑；留空＝不抓'
        default: ''
      sub_days:
        description: '精準驗證抓最近幾天的細 K 棒'
        default: '150'
      extra:
        description: '額外參數（空白分隔，例如 --fee-model=split --entries=market,L0:1）；留空＝不加'
        default: ''
      commit:
        description: '是否把結果存回倉庫'
        default: 'true'

permissions:
  contents: write

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 跑研究
        env:
          STUDY: ${{ inputs.study }}
          SYMBOLS: ${{ inputs.symbols }}
          INTERVALS: ${{ inputs.intervals }}
          MIN_SCORE: ${{ inputs.min_score }}
          VARIANTS: ${{ inputs.variants }}
          BTC_EMA: ${{ inputs.btc_ema }}
          FEE: ${{ inputs.fee }}
          LIMIT: ${{ inputs.limit }}
          SUB: ${{ inputs.sub }}
          SUB_DAYS: ${{ inputs.sub_days }}
          EXTRA: ${{ inputs.extra }}
        run: |
          set -o pipefail
          if [ "$STUDY" = confluence ]; then SCRIPT=confluence-study; DEF_INT=30m,1h,4h; elif [ "$STUDY" = alt ]; then SCRIPT=alt-strategies; DEF_INT=1h,4h; elif [ "$STUDY" = fakeout ]; then SCRIPT=fakeout-ote; DEF_INT=15m,1h,4h,6h; elif [ "$STUDY" = smc-mix ]; then SCRIPT=smc-mix; DEF_INT=30m,1h,4h; elif [ "$STUDY" = mtf-smc ]; then SCRIPT=mtf-smc; DEF_INT=1d,4h,1h,15m; else SCRIPT=ab-test; DEF_INT=15m,1h; fi
          node "scripts/research/$SCRIPT.mjs" \
            --symbols="$SYMBOLS" \
            --intervals="${INTERVALS:-$DEF_INT}" \
            --min-score="$MIN_SCORE" \
            --only="$VARIANTS" \
            --btc-ema="${BTC_EMA:-200}" \
            --fee="${FEE:-0.0011}" \
            --limit="${LIMIT:-1000}" \
            --sub="$SUB" \
            --sub-days="${SUB_DAYS:-150}" \
            $EXTRA \
            | tee ab-output.txt

      - name: 寫進步驟摘要
        if: always()
        run: |
          {
            echo "## 策略研究：${{ inputs.study }}"
            echo '```'
            cat ab-output.txt || echo '(沒有輸出)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 存回倉庫
        if: ${{ inputs.commit == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/research/ || true
          git diff --cached --quiet || git commit -m "chore(research): 更新 ${{ inputs.study }} 研究結果 [skip ci]"
          git push
