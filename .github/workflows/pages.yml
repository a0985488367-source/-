# 部署到 GitHub Pages → 取得可在 iPhone Safari 開啟的網址
#
# 這個 workflow 會自動啟用 Pages（configure-pages 的 enablement: true），
# 所以不需要手動去 Settings → Pages 設定。
# 唯一的前提：免費帳號的 Pages 不支援私有倉庫，倉庫必須是 Public。
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'claude/smc-crypto-trading-app-6p37v9']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild single-file version
        run: node scripts/build-single.mjs
      - uses: actions/configure-pages@v5
        with:
          # 自動幫倉庫開啟 Pages（來源設為 GitHub Actions），
          # 使用者就不必再手動去 Settings → Pages 設定
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
