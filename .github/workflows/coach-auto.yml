# 切換 SMC 教練自動下單（關／Demo／真錢）——跟 App「戰績」分頁的開關是同一個，手機在 GitHub 上按也可以
name: 教練自動下單開關

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '要切到哪裡'
        type: choice
        options: [status, demo, live, both, off]
        default: status
      confirm:
        description: '切到真錢（live 或 both）時請輸入 REAL（大寫）確認'
        default: ''
      live_rule:
        description: '真錢下單條件：不變／寬鬆（跟模擬一樣，有訊號就進）／嚴格（只做順勢＋≥2R）'
        type: choice
        options: [不變, 寬鬆, 嚴格]
        default: 不變
      trend_live:
        description: '超級趨勢上真錢：不變／開／關'
        type: choice
        options: [不變, 開, 關]
        default: 不變
      trend_entry:
        description: '超級趨勢真錢怎麼進場：不變／等教練（教練找回踩）／市價（訊號一出來就進）'
        type: choice
        options: [不變, 等教練, 市價]
        default: 不變

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 切換
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          LIVE_RULE: ${{ inputs.live_rule }}
          TREND_LIVE: ${{ inputs.trend_live }}
          TREND_ENTRY: ${{ inputs.trend_entry }}
          T1: ${{ secrets.APP_TOKEN }}
          T2: ${{ secrets.AI_TOKEN }}
          T3: ${{ secrets.AUTO_TRADE_TOKEN }}
          WORKER: ${{ vars.WORKER_URL || 'https://smc-signals.crypto-radar-guardian-24x7.workers.dev' }}
        run: |
          if { [ "$MODE" = "live" ] || [ "$MODE" = "both" ]; } && [ "$CONFIRM" != "REAL" ]; then echo "::error::切到真錢要在 confirm 輸入 REAL"; exit 1; fi
          TOKEN="${T1:-${T2:-$T3}}"
          [ -n "$TOKEN" ] || { echo "::error::GitHub Secrets 沒有 APP_TOKEN／AI_TOKEN／AUTO_TRADE_TOKEN"; exit 1; }
          echo "::add-mask::$TOKEN"
          if [ "$MODE" != "status" ]; then
            R="$(curl -sS -m 20 -X POST "$WORKER/coach-auto" -H "content-type: application/json" -H "x-app-token: $TOKEN" -d "{\"mode\":\"$MODE\"}")"
            echo "回應：$R"
            echo "$R" | grep -q '"ok": true' || { echo "::error::切換失敗：$R"; exit 1; }
          fi
          if [ "$LIVE_RULE" = "寬鬆" ] || [ "$LIVE_RULE" = "嚴格" ]; then
            V=false; [ "$LIVE_RULE" = "寬鬆" ] && V=true
            R="$(curl -sS -m 20 -X POST "$WORKER/coach-auto" -H "content-type: application/json" -H "x-app-token: $TOKEN" -d "{\"liveLoose\":$V}")"
            echo "$R" | grep -q '"ok": true' || { echo "::error::改真錢條件失敗：$R"; exit 1; }
            echo "::notice::真錢條件改成：$LIVE_RULE"
          fi
          if [ "$TREND_LIVE" = "開" ] || [ "$TREND_LIVE" = "關" ]; then
            V=false; [ "$TREND_LIVE" = "開" ] && V=true
            R="$(curl -sS -m 20 -X POST "$WORKER/coach-auto" -H "content-type: application/json" -H "x-app-token: $TOKEN" -d "{\"trendLive\":$V}")"
            echo "$R" | grep -q '"ok": true' || { echo "::error::改超級趨勢真錢失敗：$R"; exit 1; }
            echo "::notice::超級趨勢上真錢：$TREND_LIVE"
          fi
          if [ "$TREND_ENTRY" = "等教練" ] || [ "$TREND_ENTRY" = "市價" ]; then
            V=coach; [ "$TREND_ENTRY" = "市價" ] && V=market
            R="$(curl -sS -m 20 -X POST "$WORKER/coach-auto" -H "content-type: application/json" -H "x-app-token: $TOKEN" -d "{\"trendEntry\":\"$V\"}")"
            echo "$R" | grep -q '"ok": true' || { echo "::error::改超級趨勢進場方式失敗：$R"; exit 1; }
            echo "::notice::超級趨勢真錢進場方式：$TREND_ENTRY"
          fi
          S="$(curl -sS -m 30 "$WORKER/coach-auto" -H "x-app-token: $TOKEN")"
          SUMMARY="$(printf '%s' "$S" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(`模式=${j.cfg.mode}｜`+Object.entries(j.accounts||{}).map(([a,s])=>`${a}：權益=${s.equity??"讀不到"} 錯誤=${s.error||"無"}`).join("｜")+`｜紀錄=${(j.trades||[]).length} 筆`)}catch(e){console.log("讀不到狀態："+s.slice(0,200))}})')"
          echo "::notice::$SUMMARY"
          C="$(curl -sS -m 30 "$WORKER/coach-coins")"
          printf '%s' "$C" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(`::notice::教練看 ${j.coins.length} 個幣（前 ${j.top.length} 名＋主流 ${j.base.length}＋自己加 ${j.extra.length}，名單日期 ${j.day}，來源 ${j.src}）：${j.coins.map(x=>x.replace(/USDT$/,"")).join(",")}｜symbolType：${(j.types||[]).join(",")}｜有標記的：${(j.typed||[]).join(",")}`)}catch(e){console.log("::warning::讀不到教練名單："+s.slice(0,200))}})'
          L="$(curl -sS -m 30 "$WORKER/coach-live")"
          printf '%s' "$L" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const d=j.done.filter(x=>!x.rule);const R=d.reduce((a,x)=>a+x.r,0);console.log(`::notice::教練劇本紀錄（算數的）：${d.length} 筆 勝率 ${d.length?Math.round(d.filter(x=>x.r>0).length/d.length*100):0}% 合計 ${R.toFixed(2)}R｜事後才看到、不算的：${j.excluded?j.excluded.n:"?"} 筆（贏 ${j.excluded?j.excluded.wins:"?"} 筆，合計 ${j.excluded?j.excluded.r:"?"}R）`)}catch(e){console.log("::warning::讀不到教練紀錄")}})'
          A="$(curl -sS -m 20 "$WORKER/auto-trade/status")"
          printf '%s' "$A" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(`::notice::順勢策略自動下單（主帳戶）：開關=${j.enabled} 帳戶=${j.executorMode||j.mode||"?"} 追蹤中的部位=${j.trackedOpenPositions??"?"}`)}catch(e){console.log("::notice::讀不到 /auto-trade/status："+s.slice(0,200))}})'
          printf '%s' "$S" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);for(const [a,x] of Object.entries(j.accounts||{})){for(const p of x.positions||[])console.log(`::notice::${a} 持倉 ${p.symbol} ${p.side} ${p.size} 均價${p.avgPrice} 停損=${p.stopLoss??"無"} 止盈=${p.takeProfit??"無"} ${p.leverage}x 強平=${p.liqPrice??"無"} ${p.coach?"（教練）":"（不是教練的單）"}`);for(const o of x.orders||[])console.log(`::notice::${a} 教練掛單 ${o.symbol} ${o.side} ${o.qty}@${o.price} ${o.orderStatus}`)}const tl=j.trendLive||{};console.log(`::notice::超級趨勢真錢：${tl.cfg&&tl.cfg.enabled?"開":"關"} 進場=${tl.cfg?(tl.cfg.entry==="market"?"市價":"等教練"+tl.cfg.waitH+"h"):"?"} 每單${tl.cfg?Math.round(tl.cfg.riskPct*100):"?"}% 最多${tl.cfg?tl.cfg.maxOpen:"?"}張`);for(const t of (tl.trades||[]).slice(0,8))console.log(`::notice::超級趨勢真錢 ${t.sym} ${t.iv} ${t.dir} ${t.state}${t.via?"（"+t.via+"）":""} 進${t.entry} 停${t.stop} ${t.lev}x 1R=${(t.riskU||0).toFixed(2)}U ${t.r!=null?t.r+"R":""}`);for(const t of (j.trades||[]).slice(0,10))console.log(`::notice::紀錄 ${t.account} ${t.sym} ${t.iv} ${t.side} ${t.state} 進${t.en} 停${t.sl} 目${t.tp} ${t.why||""}`)}catch(e){}})'
      - name: 教練下單明細
        env:
          T1: ${{ secrets.APP_TOKEN }}
          T2: ${{ secrets.AI_TOKEN }}
          T3: ${{ secrets.AUTO_TRADE_TOKEN }}
          WORKER: ${{ vars.WORKER_URL || 'https://smc-signals.crypto-radar-guardian-24x7.workers.dev' }}
        run: |
          TOKEN="${T1:-${T2:-$T3}}"
          echo "::add-mask::$TOKEN"
          curl -sS -m 30 "$WORKER/coach-auto" -H "x-app-token: $TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const tpe=(ms)=>ms?new Date(ms+8*3600e3).toISOString().slice(5,16).replace("T"," "):"-";const L=(j.trades||[]).slice(0,40).map(t=>`${tpe(t.placedAt)} ${t.account} ${t.sym.replace(/USDT$/,"")} ${t.iv} ${t.side==="L"?"多":"空"} ${t.state}｜進${t.en} 停${t.sl} 目${t.tp} ${t.rr}R 順勢=${t.bias} 折溢價=${t.disc} ${t.lev}x 1R=${(t.riskU||0).toFixed(2)}U${t.fillPrice?" 成交"+t.fillPrice+"@"+tpe(t.fillAt):""}${t.r!=null?" 結果"+t.r+"R":""} ${t.why||""}`);const enc=(x)=>x.replace(/%/g,"%25").replace(/\n/g,"%0A");for(let k=0;k<L.length;k+=20)console.log(`::notice title=教練下單明細 ${k/20+1}::${enc(L.slice(k,k+20).join("\n"))}`)})'
      - name: 真錢帳戶最近兩天成交
        env:
          T1: ${{ secrets.APP_TOKEN }}
          T2: ${{ secrets.AI_TOKEN }}
          T3: ${{ secrets.AUTO_TRADE_TOKEN }}
          WORKER: ${{ vars.WORKER_URL || 'https://smc-signals.crypto-radar-guardian-24x7.workers.dev' }}
        run: |
          TOKEN="${T1:-${T2:-$T3}}"
          echo "::add-mask::$TOKEN"
          curl -sS -m 40 "$WORKER/journal?days=2" -H "x-app-token: $TOKEN" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const tpe=(ms)=>ms?new Date(ms+8*3600e3).toISOString().slice(5,16).replace("T"," "):"-";const who=(t)=>t.strategy==="coach"?"教練":t.strategy==="manual"?"手動":"自動("+t.strategy+")";const L=(j.trades||[]).slice(0,40).map(t=>`${tpe(t.openTime)}→${tpe(t.closeTime)} ${who(t)} ${t.symbol.replace(/USDT$/,"")} ${t.dir==="long"?"多":"空"} 進${+t.entry.toPrecision(6)} 出${t.exit} 名目${t.notional.toFixed(0)}U ${t.pnl>=0?"+":""}${t.pnl.toFixed(2)}U`);L.push(`還開著：${(j.open||[]).map(t=>`${who(t)} ${t.symbol} ${t.dir}`).join("、")||"無"}｜餘額：${JSON.stringify(j.balance||{}).slice(0,200)}`);const enc=(x)=>x.replace(/%/g,"%25").replace(/\n/g,"%0A");for(let k=0;k<L.length;k+=20)console.log(`::notice title=真錢成交 ${k/20+1}::${enc(L.slice(k,k+20).join("\n"))}`)})'
