<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="水電庫存">
<title>水電材料庫存</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html { color-scheme: light } body { margin: 0; padding-top: env(safe-area-inset-top, 0px) } img { max-width: 100% } [hidden] { display: none !important }
/* 版面：頂部摘要＋分頁，底部固定的「進貨／領用」大按鈕，表單從下方滑出（單手操作） */
:root {
  --bg: #eef1f0;
  --panel: #ffffff;
  --ink: #18262b;
  --muted: #5d6d72;
  --line: #d5dcdb;
  --accent: #1f5e8c;      /* 管線藍 */
  --accent-ink: #ffffff;
  --tape: #e3b12a;        /* 電火布黃：庫存不足 */
  --tape-soft: #fbf1d3;
  --out: #b4452f;
  --in: #2c7a4b;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101719; --panel: #182226; --ink: #e5ecec; --muted: #93a3a6; --line: #2a3a3f;
  --accent: #5aa3d6; --accent-ink: #0b1a24; --tape: #e8bd45; --tape-soft: #3a3118;
  --out: #e07a62; --in: #5fbf86; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101719; --panel: #182226; --ink: #e5ecec; --muted: #93a3a6; --line: #2a3a3f;
  --accent: #5aa3d6; --accent-ink: #0b1a24; --tape: #e8bd45; --tape-soft: #3a3118;
  --out: #e07a62; --in: #5fbf86; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 120px }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums }
h1 { font-size: 22px; font-weight: 900; margin: 0; letter-spacing: .02em; text-wrap: balance }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.sample { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--tape-soft); border: 1px dashed var(--tape); border-radius: 8px; padding: 10px 12px; font-size: 13px }
.sample b { font-weight: 700 }
.sample button { margin-left: auto; border: 0; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 6px 10px; font-size: 13px }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0 }
.stat small { display: block; color: var(--muted); font-size: 12px }
.stat .v { font-size: clamp(13px, 3.8vw, 18px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.stat.warn .v { color: var(--out) }

.tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 2px solid var(--line); overflow-x: auto }
.tabs button { border: 0; background: none; padding: 10px 12px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent) }

.tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap }
.tools input { flex: 1 1 180px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel) }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 13px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

.list { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0 }
.row:last-child { border-bottom: 0 }
.row .name { font-weight: 700; min-width: 0 }
.row .meta { color: var(--muted); font-size: 12px; min-width: 0 }
.row .qty { text-align: right; font-size: 17px; font-weight: 600 }
.row .val { text-align: right; color: var(--muted); font-size: 12px }
.row.low { box-shadow: inset 4px 0 0 var(--tape) }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; border: 1px solid var(--line); color: var(--muted) }
.tag.low { background: var(--tape); border-color: var(--tape); color: #2a2205 }
.empty { padding: 28px 16px; text-align: center; color: var(--muted) }

.job { border-bottom: 1px solid var(--line) }
.job:last-child { border-bottom: 0 }
.job summary { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 14px; cursor: pointer }
.job summary::-webkit-details-marker { display: none }
.job summary .name::before { content: "▸ "; color: var(--muted) }
.job[open] summary .name::before { content: "▾ " }
.job .lines { padding: 0 14px 12px; overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 13px }
th, td { padding: 6px 4px; text-align: left; border-bottom: 1px dashed var(--line) }
th { color: var(--muted); font-weight: 500; font-size: 12px }
td.r, th.r { text-align: right }
tfoot td { font-weight: 700; border-bottom: 0 }
.linkbtn { border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 6px; padding: 6px 10px; font-size: 13px; margin-top: 8px }

.log { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line) }
.log:last-child { border-bottom: 0 }
.log .kind { font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px; color: var(--panel) }
.log .kind.in { background: var(--in) }
.log .kind.out { background: var(--out) }
.log .d { color: var(--muted); font-size: 12px }
.log .x { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 6px }

.card { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.card h3 { margin: 0 0 4px; font-size: 15px }
.card p { margin: 0 0 10px; color: var(--muted); font-size: 13px }
.card textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); font-family: var(--font-num); font-size: 12px }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px }
.btn { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 700; background: var(--accent); color: var(--accent-ink) }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink) }
.btn.danger { background: var(--out); color: var(--panel) }

.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5 }
.dock .in-row { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px }
.dock button { border: 0; border-radius: 10px; padding: 12px 8px; font-weight: 900; font-size: 16px }
.dock .b-in { background: var(--in); color: var(--panel) }
.dock .b-out { background: var(--out); color: var(--panel) }
.dock .b-new { background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding-inline: 14px }

.scrim { position: fixed; inset: 0; background: rgba(10, 18, 20, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--panel); width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto; border-radius: 16px 16px 0 0; padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)) }
.sheet h2 { margin: 0 0 12px; font-size: 18px }
.field { display: grid; gap: 4px; margin-bottom: 12px }
.field label { font-size: 13px; color: var(--muted); font-weight: 500 }
.field input, .field select { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px }
.err { color: var(--out); font-size: 13px; margin: 0 0 10px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 30 }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin-bottom: 14px }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; text-align: right }
.row .pk { grid-column: 2; text-align: right; color: var(--muted); font-size: 12px; margin-top: -4px }
.row .desc { grid-column: 1 / -1; color: var(--muted); font-size: 12px; min-width: 0 }
.desc-box { background: var(--bg); border-radius: 8px; padding: 8px 12px; color: var(--muted); font-size: 13px; margin: -4px 0 14px }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 14px }
.seg button { border: 0; background: none; border-radius: 8px; padding: 8px; font-weight: 700; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12) }
.cat-list { border: 1px solid var(--line); border-radius: 10px; max-height: 46vh; overflow-y: auto; margin: 10px 0 12px }
.cat-item { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px }
.cat-item:last-child { border-bottom: 0 }
.cat-item .box { width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 5px; margin-top: 2px; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: var(--accent-ink) }
.cat-item[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent) }
.cat-item .n { font-weight: 700 }
.cat-item .s { grid-column: 2; color: var(--muted); font-size: 12px }
.cat-item:disabled { opacity: .5 }
.line { display: grid; grid-template-columns: 1fr 110px 36px; gap: 6px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line) }
.line select, .line input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0 }
.line .qwrap { display: flex; align-items: center; gap: 4px }
.line .qwrap span { font-size: 13px; color: var(--muted); white-space: nowrap }
.line .del { border: 1px solid var(--line); background: none; border-radius: 8px; height: 40px; color: var(--muted) }
.line .have { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin: 0 }
.addline { border: 1px dashed var(--accent); color: var(--accent); background: none; border-radius: 8px; padding: 10px; width: 100%; font-weight: 700; margin: 10px 0 }
.sum { display: flex; justify-content: space-between; font-weight: 700; margin: 4px 0 12px }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 0 0 12px }
.check input { width: 20px; height: 20px }

@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out } @keyframes up { from { transform: translateY(24px); opacity: .6 } } }
</style>
</head>
<body>

<div class="wrap">
  <h1>水電材料庫存</h1>
  <p class="sub">進貨、工地領用、各工地材料成本、還剩多少，一次看。</p>

  <div class="sample" id="sampleBar" hidden>
    <span>現在顯示的是<b>範例資料</b>，可以先點點看怎麼用。</span>
    <button id="clearSample" type="button">清空範例，開始用</button>
  </div>

  <div class="stats">
    <div class="stat"><small>庫存總值</small><div class="v num" id="sValue">—</div></div>
    <div class="stat"><small>材料品項</small><div class="v num" id="sCount">—</div></div>
    <div class="stat" id="sLowBox"><small>低於安全量</small><div class="v num" id="sLow">—</div></div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="stock" aria-selected="true">庫存</button>
    <button role="tab" data-tab="jobs" aria-selected="false">工地成本單</button>
    <button role="tab" data-tab="logs" aria-selected="false">進出紀錄</button>
    <button role="tab" data-tab="backup" aria-selected="false">備份</button>
  </div>

  <section id="tab-stock">
    <div class="tools"><input id="q" type="search" placeholder="搜尋材料名稱、規格…"></div>
    <div class="chips" id="catChips"></div>
    <div class="list" id="stockList"></div>
  </section>

  <section id="tab-jobs" hidden>
    <div class="list" id="jobList"></div>
  </section>

  <section id="tab-logs" hidden>
    <div class="list" id="logList"></div>
  </section>

  <section id="tab-backup" hidden>
    <div class="card">
      <h3>資料存在哪裡</h3>
      <p>資料只存在這支手機的這個瀏覽器裡。換手機、清除瀏覽器資料前，先把下面的備份碼複製起來（貼到 LINE 給自己就行）。</p>
      <div class="btnrow"><button class="btn" id="copyBackup" type="button">複製備份碼</button><button class="btn ghost" id="copyCsv" type="button">複製庫存表（可貼到 Excel）</button></div>
    </div>
    <div class="card">
      <h3>還原備份</h3>
      <p>把之前複製的備份碼貼進來，按還原。會蓋掉目前的資料。</p>
      <textarea id="restoreText" placeholder="貼上備份碼"></textarea>
      <div class="btnrow"><button class="btn" id="restoreBtn" type="button">還原</button></div>
      <p class="err" id="restoreErr" hidden></p>
    </div>
    <div class="card">
      <h3>全部清空</h3>
      <p>刪掉所有材料和紀錄，無法復原。</p>
      <div class="btnrow"><button class="btn danger" id="wipeBtn" type="button">全部清空</button></div>
    </div>
  </section>
</div>

<div class="dock">
  <div class="in-row">
    <button class="b-in" id="dockIn" type="button">＋ 進貨</button>
    <button class="b-out" id="dockOut" type="button">－ 工地領用</button>
    <button class="b-new" id="dockNew" type="button">新增材料</button>
  </div>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

  var state;
  try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { state = null; }
  // 沒動過的範例資料直接換成最新版範例
  if (!state || !Array.isArray(state.items) || !Array.isArray(state.logs) || state.sample) state = sampleData();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- 數量、價錢顯示 ----------
  function hasPack(it) { return !!(it.pack && it.pack.size > 0); }
  // 「165 米（1 卷又 65 米）」
  function packText(it, q) {
    if (!hasPack(it) || q <= 0) return '';
    var size = it.pack.size, n = Math.floor(q / size + 1e-9), r = q - n * size;
    if (n === 0) return '不到 1 ' + it.pack.unit;
    return n + ' ' + it.pack.unit + (r > 1e-6 ? '又 ' + qtyFmt(r) + ' ' + it.unit : '整');
  }
  function fq(it, q) { var p = packText(it, q); return qtyFmt(q) + ' ' + it.unit + (p ? '（' + p + '）' : ''); }
  function fp(it, avg) { return '每' + it.unit + ' ' + unitPrice(avg) + (hasPack(it) ? '・每' + it.pack.unit + ' ' + money(avg * it.pack.size) : ''); }

  // 用進出紀錄重算每項材料的數量和加權平均成本，以及每筆領用的成本
  var calc;
  function compute() {
    var by = {}, outCost = {};
    state.items.forEach(function (it) { by[it.id] = { qty: 0, avg: 0, inCost: 0, outCost: 0 }; });
    state.logs.slice().sort(function (a, b) { return a.t - b.t; }).forEach(function (l) {
      var c = by[l.itemId]; if (!c) return;
      if (l.type === 'in') {
        var total = c.qty * c.avg + l.qty * l.price;
        c.qty += l.qty;
        c.avg = c.qty > 0 ? total / c.qty : l.price;
        c.inCost += l.qty * l.price;
      } else {
        var cost = l.qty * c.avg;
        outCost[l.id] = cost; c.outCost += cost;
        c.qty -= l.qty;
      }
    });
    calc = { by: by, outCost: outCost };
  }
  function itemById(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }
  function isLow(it) { var c = calc.by[it.id]; return c.qty <= (it.min || 0); }

  var tab = 'stock', cat = '全部';
  try { tab = localStorage.getItem(KEY + ':tab') || 'stock'; } catch (e) {}

  function render() {
    compute();

    $('sCount').textContent = state.items.length;

    $('sLowBox').classList.toggle('warn', low > 0);

    ['stock', 'jobs', 'logs', 'backup'].forEach(function (t) { $('tab-' + t).hidden = t !== tab; });

  }

  function renderStock() {

    });
    rows.sort(function (a, b) { return (isLow(b) - isLow(a)) || a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name, 'zh-Hant'); });

  function jobsData() {
    var jobs = {};

          var c = calc.by[l.it.id];
          l.el.querySelector('.qwrap span').textContent = l.it.unit;
          l.el.querySelector('.have').textContent = (l.it.desc ? l.it.desc + '・' : '') + '剩 ' + fq(l.it, c.qty);
          total += l.qty * c.avg;
        });
        $('fTotal').textContent = money(total);
      }
      $('addLine').addEventListener('click', function () { addLine().querySelector('select').focus(); });
      addLine(itemId);
      if (jobs.length && !itemId) $('fJob').value = '';
      $('fJob').focus();
      $('fCancel').addEventListener('click', close);
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var job = $('fJob').value.trim();
        if (!job) return showErr('請填工地或案件名稱，才能算這個工地的成本。');
        var ls = lines().filter(function (l) { return l.qty > 0; });
        if (!ls.length) return showErr('至少填一樣材料的數量。');
        var need = {};
        ls.forEach(function (l) { need[l.it.id] = (need[l.it.id] || 0) + l.qty; });
        for (var id in need) {
          var it = itemById(id), have = calc.by[id].qty;
          if (need[id] > have + 1e-9) return showErr(it.name + ' 只剩 ' + fq(it, have) + '，不夠領 ' + qtyFmt(need[id]) + ' ' + it.unit + '。先記進貨再領。');
        }
        var date = $('fDate').value || today();
        ls.forEach(function (l, i) { state.logs.push({ id: uid(), t: stamp(date, i), date: date, type: 'out', itemId: l.it.id, qty: l.qty, price: 0, job: job, note: '' }); });
        commit('已記錄 ' + job + ' 領用 ' + ls.length + ' 樣材料');
      });
    });
  }

  // 新增材料：從常用清單勾選，或自己填
  function itemForm(item) {
    var ed = !!item;
    if (!ed) return pickCatalog();
    customForm(item);
  }

  function pickCatalog() {
    var have = {}, picked = {}, ccat = '電';
    if (!state.sample) state.items.forEach(function (it) { have[it.name] = 1; });
    open('<h2>新增材料</h2><div class="seg"><button type="button" aria-pressed="true">從常用清單選</button><button type="button" id="toCustom" aria-pressed="false">自己填</button></div>' +
      '<input id="cq" type="search" placeholder="搜尋，例如：電線、4分、開關" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">' +
      '<div class="chips" id="cChips"></div><div class="cat-list" id="cList"></div>' +
      '<p class="hint" style="margin:0 0 12px">加好之後按「＋ 進貨」填數量和價錢。名稱、單位、安全量之後都可以改。</p>' +
      '<div class="btnrow"><button class="btn" type="button" id="cAdd" style="flex:1" disabled>勾選要加的材料</button><button class="btn ghost" type="button" id="fCancel">取消</button></div>', function () {
      function draw() {
        $('cChips').innerHTML = CATS.map(function (c) { return '<button class="chip" type="button" data-c="' + c + '" aria-pressed="' + (c === ccat) + '">' + c + '</button>'; }).join('');
        var q = $('cq').value.trim().toLowerCase();
        var rows = CATALOG.filter(function (r) { return q ? (r[1] + r[2] + r[4]).toLowerCase().indexOf(q) >= 0 : r[0] === ccat; });
        $('cList').innerHTML = rows.length ? rows.map(function (r) {
          var dis = have[r[1]], on = !!picked[r[1]];
          return '<button class="cat-item" type="button" data-n="' + esc(r[1]) + '" aria-pressed="' + on + '"' + (dis ? ' disabled' : '') + '><span class="box">' + (on ? '✓' : '') + '</span>' +
            '<span class="n">' + esc(r[1]) + (r[2] ? ' <small style="font-weight:500;color:var(--muted)">' + esc(r[2]) + '</small>' : '') + '</span>' +
            '<span class="s">' + (dis ? '已經加過了' : esc(r[4]) + '・用「' + esc(r[3]) + '」算' + (r[5] ? '，整' + esc(r[5]) + '進（每' + esc(r[5]) + ' ' + r[6] + ' ' + esc(r[3]) + '）' : '')) + '</span></button>';
        }).join('') : '<div class="empty">清單裡沒有，按上面「自己填」。</div>';
        var cnt = Object.keys(picked).length;
        $('cAdd').disabled = !cnt; $('cAdd').textContent = cnt ? '加入 ' + cnt + ' 樣材料' : '勾選要加的材料';
      }
      $('cChips').addEventListener('click', function (e) { var b = e.target.closest('[data-c]'); if (b) { ccat = b.dataset.c; $('cq').value = ''; draw(); } });
      $('cList').addEventListener('click', function (e) { var b = e.target.closest('[data-n]'); if (!b || b.disabled) return; var k = b.dataset.n; if (picked[k]) delete picked[k]; else picked[k] = 1; draw(); });
      $('cq').addEventListener('input', draw);
      $('toCustom').addEventListener('click', function () { customForm(); });
      $('fCancel').addEventListener('click', close);
      $('cAdd').addEventListener('click', function () {
        leaveSample();
        var names = Object.keys(picked);
        names.forEach(function (nm) { state.items.push(Object.assign({ id: uid() }, fromCatalog(catalogByName(nm)))); });
        commit('已加入 ' + names.length + ' 樣材料，接著按「＋ 進貨」填數量');
      });
      draw();
    });
  }

  function customForm(item) {
    var ed = !!item; item = item || { name: '', cat: '水', spec: '', unit: '個', min: 0, desc: '' };
    var pk = item.pack || { unit: '卷', size: 100 };
    open('<h2>' + (ed ? '修改材料' : '新增材料') + '</h2>' +
      (ed ? '' : '<div class="seg"><button type="button" id="toCat" aria-pressed="false">從常用清單選</button><button type="button" aria-pressed="true">自己填</button></div>') +
      '<form id="f"><div class="field"><label for="iName">材料名稱</label><input id="iName" type="text" value="' + esc(item.name) + '" placeholder="例：PVC 水管 6分"></div>' +
      '<div class="grid2"><div class="field"><label for="iCat">分類</label><select id="iCat">' + CATS.map(function (c) { return '<option' + (c === item.cat ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="iSpec">規格（可空白）</label><input id="iSpec" type="text" value="' + esc(item.spec) + '" placeholder="例：4m／支"></div></div>' +
      '<div class="field"><label for="iDesc">說明：用在哪裡（可空白）</label><input id="iDesc" type="text" value="' + esc(item.desc || '') + '" placeholder="例：冷氣 220V 專用迴路"></div>' +
      '<div class="grid2"><div class="field"><label for="iUnit">領用時用什麼單位</label><input id="iUnit" type="text" list="unitDl" value="' + esc(item.unit) + '"><datalist id="unitDl"><option value="米"><option value="支"><option value="個"><option value="卷"><option value="條"><option value="包"><option value="罐"><option value="組"></datalist></div>' +
      '<div class="field"><label for="iMin" id="iMinL">安全庫存量</label><input id="iMin" type="number" inputmode="decimal" step="any" min="0" value="' + (item.min || 0) + '"></div></div>' +
      '<label class="check"><input id="iPackOn" type="checkbox"' + (item.pack ? ' checked' : '') + '>進貨是整卷／整箱買（例如電線一卷 100 米）</label>' +
      '<div class="grid2" id="iPackBox"><div class="field"><label for="iPackUnit">整包單位</label><input id="iPackUnit" type="text" list="packDl" value="' + esc(pk.unit) + '"><datalist id="packDl"><option value="卷"><option value="箱"><option value="捆"><option value="包"></datalist></div>' +
      '<div class="field"><label for="iPackSize" id="iPackSizeL">每包多少</label><input id="iPackSize" type="number" inputmode="decimal" step="any" min="0" value="' + pk.size + '"></div></div>' +
      '<p class="hint">低於安全庫存量會標黃色「不足」，提醒要補貨。</p><p class="err" id="fErr" hidden></p>' +
      '<div class="btnrow"><button class="btn" type="submit" style="flex:1">' + (ed ? '儲存' : '新增') + '</button><button class="btn ghost" type="button" id="fCancel">取消</button></div></form>', function () {
      function sync() {
        var u = $('iUnit').value.trim() || '單位', pu = $('iPackUnit').value.trim() || '包';
        $('iPackBox').hidden = !$('iPackOn').checked;
        $('iMinL').textContent = '安全庫存量（' + u + '）';
        $('iPackSizeL').textContent = '每' + pu + '幾' + u;
      }
      ['iUnit', 'iPackUnit', 'iPackOn'].forEach(function (k) { $(k).addEventListener('input', sync); $(k).addEventListener('change', sync); });
      sync(); $('iName').focus();
      if (!ed) $('toCat').addEventListener('click', pickCatalog);
      $('fCancel').addEventListener('click', close);
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = $('iName').value.trim(), unit = $('iUnit').value.trim();
        if (!name || !unit) return showErr('名稱和單位都要填。');
        var data = { name: name, cat: $('iCat').value, spec: $('iSpec').value.trim(), desc: $('iDesc').value.trim(), unit: unit, min: parseFloat($('iMin').value) || 0 };
        if ($('iPackOn').checked) {
          var size = parseFloat($('iPackSize').value), pu = $('iPackUnit').value.trim();
          if (!(size > 0) || !pu) return showErr('整包單位和每包數量都要填。');
          data.pack = { unit: pu, size: size };
        }
        if (ed) { delete item.pack; Object.assign(item, data); commit('已儲存'); return; }
        leaveSample();
        state.items.push(Object.assign({ id: uid() }, data));
        commit('已新增 ' + name + '，接著按「＋ 進貨」填數量');
      });
    });
  }

  function itemSheet(id) {
    var it = itemById(id), c = calc.by[id];
    var used = state.logs.filter(function (l) { return l.itemId === id; }).length;
    open('<h2>' + esc(it.name) + '</h2>' + (it.desc ? '<div class="desc-box">' + esc(it.desc) + '</div>' : '') + '<dl class="kv">' +
      '<dt>分類／規格</dt><dd>' + esc(it.cat) + (it.spec ? '・' + esc(it.spec) : '') + '</dd>' +
      '<dt>目前庫存</dt><dd class="num"><b>' + esc(fq(it, c.qty)) + '</b>' + (isLow(it) ? '　<span class="tag low">不足</span>' : '') + '</dd>' +
      '<dt>安全庫存量</dt><dd class="num">' + qtyFmt(it.min || 0) + ' ' + esc(it.unit) + '</dd>' +
      (hasPack(it) ? '<dt>整包</dt><dd>每' + esc(it.pack.unit) + ' ' + qtyFmt(it.pack.size) + ' ' + esc(it.unit) + '</dd>' : '') +
      '<dt>平均成本</dt><dd class="num">' + esc(fp(it, c.avg)) + '</dd>' +
      '<dt>庫存價值</dt><dd class="num">' + money(Math.max(c.qty, 0) * c.avg) + '</dd>' +
      '<dt>累計進貨金額</dt><dd class="num">' + money(c.inCost) + '</dd>' +
      '<dt>累計用到工地</dt><dd class="num">' + money(c.outCost) + '</dd></dl>' +
      '<div class="btnrow"><button class="btn" type="button" id="aIn" style="background:var(--in);color:var(--panel)">＋ 進貨</button><button class="btn" type="button" id="aOut" style="background:var(--out);color:var(--panel)">－ 領用</button><button class="btn ghost" type="button" id="aEdit">修改</button><button class="btn ghost" type="button" id="aDel">刪除</button></div>' +
      '<div id="delConfirm" hidden><p class="err" style="margin-top:12px">確定刪除「' + esc(it.name) + '」？連同 ' + used + ' 筆進出紀錄一起刪掉，工地成本單也會少掉這項。</p><div class="btnrow"><button class="btn danger" type="button" id="aDelYes">確定刪除</button><button class="btn ghost" type="button" id="aDelNo">不要刪</button></div></div>', function () {
      $('aIn').onclick = function () { inForm(id); };
      $('aOut').onclick = function () { outForm(id); };
      $('aEdit').onclick = function () { customForm(it); };
      $('aDel').onclick = function () { $('delConfirm').hidden = false; };
      $('aDelNo').onclick = function () { $('delConfirm').hidden = true; };
      $('aDelYes').onclick = function () {
        state.items = state.items.filter(function (x) { return x.id !== id; });
        state.logs = state.logs.filter(function (l) { return l.itemId !== id; });
        commit('已刪除 ' + it.name);
      };
    });
  }

  function confirmSheet(title, body, yes, fn) {
    open('<h2>' + title + '</h2><p style="margin:0 0 14px;color:var(--muted)">' + body + '</p><div class="btnrow"><button class="btn danger" type="button" id="cYes">' + yes + '</button><button class="btn ghost" type="button" id="cNo">取消</button></div>', function () {
      $('cNo').onclick = close; $('cYes').onclick = fn;
    });
  }

  function copyText(text, okMsg) {
    var done = function () { toast(okMsg); };
    var fallback = function () {
      open('<h2>請手動複製</h2><p class="hint" style="margin:0 0 8px">這個畫面不能自動複製，長按下面文字全選後複製。</p><textarea id="cpy" style="width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);font-family:var(--font-num);font-size:12px" readonly></textarea><div class="btnrow"><button class="btn ghost" type="button" id="cpyClose">關閉</button></div>', function () {
        $('cpy').value = text; $('cpy').select(); $('cpyClose').onclick = close;
      });
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  function jobText(name) {
    var j = jobsData().filter(function (x) { return x.name === name; })[0]; if (!j) return '';
    var out = ['【材料成本單】' + j.name, '日期：' + j.last, ''];
    Object.keys(j.lines).forEach(function (id) {
      var it = itemById(id) || ghost, ln = j.lines[id];
      out.push(it.name + (it.spec ? '（' + it.spec + '）' : '') + ' × ' + qtyFmt(ln.qty) + ' ' + it.unit + (ln.qty ? ' @' + unitPrice(ln.cost / ln.qty) : '') + '　' + money(ln.cost));
    });
    out.push('', '材料合計：' + money(j.total));
    return out.join('\n');
  }

  // ---------- 事件 ----------
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    tab = b.dataset.tab; try { localStorage.setItem(KEY + ':tab', tab); } catch (er) {} render();
  });
  $('catChips').addEventListener('click', function (e) { var b = e.target.closest('[data-cat]'); if (b) { cat = b.dataset.cat; renderStock(); } });
  $('q').addEventListener('input', renderStock);
  $('stockList').addEventListener('click', function (e) { var b = e.target.closest('[data-item]'); if (b) itemSheet(b.dataset.item); });
  $('jobList').addEventListener('click', function (e) { var b = e.target.closest('[data-copyjob]'); if (b) copyText(jobText(b.dataset.copyjob), '已複製成本單'); });
  $('logList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-dellog]'); if (!b) return;
    var id = b.dataset.dellog;
    confirmSheet('刪除這筆紀錄？', '刪掉後庫存數量和平均成本會重新計算。', '刪除', function () {
      state.logs = state.logs.filter(function (l) { return l.id !== id; }); commit('已刪除紀錄');
    });
  });
  $('dockIn').onclick = function () { inForm(); };
  $('dockOut').onclick = function () { outForm(); };
  $('dockNew').onclick = function () { itemForm(); };
  $('clearSample').onclick = function () { state = { items: [], logs: [] }; save(); tab = 'stock'; render(); toast('範例已清空，按「新增材料」開始'); };

  $('copyBackup').onclick = function () { var s = JSON.parse(JSON.stringify(state)); delete s.sample; copyText(JSON.stringify(s), '已複製備份碼'); };
  $('copyCsv').onclick = function () {
    var rows = [['分類', '材料', '規格', '說明', '單位', '庫存數量', '換算', '安全量', '平均單價', '庫存價值']];
    state.items.forEach(function (it) { var c = calc.by[it.id]; rows.push([it.cat, it.name, it.spec, it.desc || '', it.unit, qtyFmt(c.qty), packText(it, c.qty), it.min || 0, Math.round(c.avg * 100) / 100, Math.round(Math.max(c.qty, 0) * c.avg)]); });
    copyText(rows.map(function (r) { return r.join('\t'); }).join('\n'), '已複製，貼到 Excel 就會分欄');
  };
  $('restoreBtn').onclick = function () {
    var err = $('restoreErr');
    try {
      var s = JSON.parse($('restoreText').value);
      if (!s || !Array.isArray(s.items) || !Array.isArray(s.logs)) throw 0;
      confirmSheet('還原備份？', '目前的資料會被備份裡的 ' + s.items.length + ' 項材料、' + s.logs.length + ' 筆紀錄取代。', '還原', function () {
        state = s; $('restoreText').value = ''; err.hidden = true; commit('已還原');
      });
    } catch (e) { err.textContent = '這不是有效的備份碼，請確認整段都有貼上。'; err.hidden = false; }
  };
  $('wipeBtn').onclick = function () {
    confirmSheet('全部清空？', '所有材料和進出紀錄都會刪除，無法復原。建議先複製備份碼。', '全部清空', function () { state = { items: [], logs: [] }; commit('已全部清空'); });
  };

  render();
})();
</script>
</body>
</html>
