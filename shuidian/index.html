<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="水電工地帳">
<title>水電工地帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html { color-scheme: light } body { margin: 0; padding-top: env(safe-area-inset-top, 0px) } img { max-width: 100% } [hidden] { display: none !important }
/* 版面：上面一個總覽數字，中間一張清單，底部四個分頁＋中間「＋」記一筆；表單一律從下方滑出（單手操作） */
:root {
  --bg: #eef1f0;
  --panel: #ffffff;
  --ink: #18262b;
  --muted: #5d6d72;
  --line: #d5dcdb;
  --accent: #1f5e8c;      /* 管線藍 */
  --accent-ink: #ffffff;
  --tape: #e3b12a;        /* 電火布黃：庫存不足 */
  --tape-soft: #fbf1d3;
  --out: #b4452f;         /* 花出去 */
  --in: #2c7a4b;          /* 收進來／賺 */
  --c-mat: #1f5e8c;       /* 材料 */
  --c-lab: #c98a1b;       /* 工錢 */
  --c-exp: #8a5aa8;       /* 雜支 */
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101719; --panel: #182226; --ink: #e5ecec; --muted: #93a3a6; --line: #2a3a3f;
  --accent: #5aa3d6; --accent-ink: #0b1a24; --tape: #e8bd45; --tape-soft: #3a3118;
  --out: #e07a62; --in: #5fbf86; --c-mat: #5aa3d6; --c-lab: #e3a83c; --c-exp: #b58ad0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101719; --panel: #182226; --ink: #e5ecec; --muted: #93a3a6; --line: #2a3a3f;
  --accent: #5aa3d6; --accent-ink: #0b1a24; --tape: #e8bd45; --tape-soft: #3a3118;
  --out: #e07a62; --in: #5fbf86; --c-mat: #5aa3d6; --c-lab: #e3a83c; --c-exp: #b58ad0; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5 }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 130px }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
small { font-size: 12px }
.muted { color: var(--muted) }

.top { display: flex; align-items: center; gap: 10px }
.top h1 { font-size: 20px; font-weight: 900; margin: 0; letter-spacing: .02em; flex: 1 }
.top button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 13px }

.sample { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--tape-soft); border: 1px dashed var(--tape); border-radius: 8px; padding: 10px 12px; font-size: 13px }
.sample button { margin-left: auto; border: 0; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 6px 10px; font-size: 13px }

/* 每個分頁頂端：標題列＋月份切換 */
.head { display: flex; align-items: center; gap: 8px; margin: 18px 0 10px; flex-wrap: wrap }
.head h2 { margin: 0; font-size: 17px; flex: 1 }
.month { display: flex; align-items: center; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px }
.month button { border: 0; background: none; padding: 6px 10px; color: var(--muted); font-size: 16px; line-height: 1 }
.month span { font-weight: 700; font-size: 14px; min-width: 84px; text-align: center }
.smallbtn { border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 700 }

/* 總覽卡 */
.hero { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px }
.hero .lbl { color: var(--muted); font-size: 13px }
.hero .big { font-size: 26px; font-weight: 600; line-height: 1.25 }
.bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--bg); margin: 10px 0 8px }
.bar i { display: block; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c) }
.m-mat { --c: var(--c-mat) } .m-lab { --c: var(--c-lab) } .m-exp { --c: var(--c-exp) }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0 }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 13px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.search { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-top: 10px }

.list { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.empty { padding: 28px 16px; text-align: center; color: var(--muted) }
.rowbtn { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px }
.rowbtn:last-child { border-bottom: 0 }
.r1 { display: flex; align-items: baseline; gap: 8px }
.r1 .t { font-weight: 700; flex: 1; min-width: 0 }
.r1 .v { font-weight: 600; white-space: nowrap }
.r2 { display: flex; gap: 8px; color: var(--muted); font-size: 12px; margin-top: 2px; flex-wrap: wrap }
.r2 .sp { flex: 1 }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); vertical-align: 2px; margin-right: 6px; white-space: nowrap }
.pill.low { background: var(--tape); border-color: var(--tape); color: #2a2205 }
.pill.done { background: var(--bg) }
.pill.live { border-color: var(--accent); color: var(--accent) }
.pos { color: var(--in) } .neg { color: var(--out) }
.rowbtn.low { box-shadow: inset 4px 0 0 var(--tape) }

/* 以日期分組的紀錄 */
.day { padding: 6px 14px; background: var(--bg); color: var(--muted); font-size: 12px; font-weight: 700; display: flex }
.day span:first-child { flex: 1 }
.rec { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center }
.rec:last-child { border-bottom: 0 }
.rec .t { min-width: 0 }
.rec .s { color: var(--muted); font-size: 12px }
.rec .x { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 0 0; display: block; margin-left: auto }

/* 底部導覽 */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }
.nav .in-row { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end }
.nav button { border: 0; background: none; padding: 10px 0 9px; font-size: 13px; font-weight: 700; color: var(--muted); display: grid; justify-items: center; gap: 2px }
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.nav button[aria-selected="true"] { color: var(--accent) }
.nav .plus { padding: 0 0 8px }
.nav .plus b { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 30px; font-weight: 400; margin-top: -18px; box-shadow: 0 3px 10px rgba(0, 0, 0, .18) }
.nav .plus span { color: var(--accent) }

/* 下方滑出表單 */
.scrim { position: fixed; inset: 0; background: rgba(10, 18, 20, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--panel); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)) }
.sheet h2 { margin: 0 0 12px; font-size: 18px }
.sheet h3 { margin: 18px 0 6px; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between }
.field { display: grid; gap: 4px; margin-bottom: 12px }
.field > label, .lab { font-size: 13px; color: var(--muted); font-weight: 500 }
.field input, .field select, .field textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px }
.hint { font-size: 12px; color: var(--muted); margin: -6px 0 12px }
.err { color: var(--out); font-size: 13px; margin: 0 0 10px }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px }
.btn { border: 0; border-radius: 8px; padding: 11px 14px; font-weight: 700; background: var(--accent); color: var(--accent-ink) }
.btn.main { flex: 1 }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--ink) }
.btn.danger { background: var(--out); color: var(--panel) }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--bg); border-radius: 10px; padding: 4px; margin-bottom: 14px }
.seg button { border: 0; background: none; border-radius: 8px; padding: 8px 4px; font-weight: 700; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12) }
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px }
.pick button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; font-weight: 700 }
.pick button small { display: block; font-weight: 500; color: var(--muted) }
.pick button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.pick button[aria-pressed="true"] small { color: var(--accent-ink) }
.sum { display: flex; justify-content: space-between; font-weight: 700; margin: 4px 0 12px }
.desc-box { background: var(--bg); border-radius: 8px; padding: 8px 12px; color: var(--muted); font-size: 13px; margin: -4px 0 14px }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; margin: 0 0 6px }
.kv dt { color: var(--muted) }
.kv dd { margin: 0; text-align: right }
.kv .tot { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 700 }
table { width: 100%; border-collapse: collapse; font-size: 13px }
th, td { padding: 6px 4px; text-align: left; border-bottom: 1px dashed var(--line) }
th { color: var(--muted); font-weight: 500; font-size: 12px }
td.r, th.r { text-align: right; white-space: nowrap }
.tbl { overflow-x: auto }

/* 「＋」選單 */
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px }
.act { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 14px 12px; text-align: left; display: grid; gap: 2px }
.act b { font-size: 16px }
.act small { color: var(--muted) }
.act::before { content: ""; width: 24px; height: 4px; border-radius: 2px; background: var(--c, var(--accent)); margin-bottom: 6px }

/* 材料：常用清單、多行領料 */
.cat-list { border: 1px solid var(--line); border-radius: 10px; max-height: 44vh; overflow-y: auto; margin: 10px 0 12px }
.cat-item { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 12px }
.cat-item:last-child { border-bottom: 0 }
.cat-item .box { width: 20px; height: 20px; border: 2px solid var(--line); border-radius: 5px; margin-top: 2px; display: grid; place-items: center; font-size: 13px; font-weight: 900; color: var(--accent-ink) }
.cat-item[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent) }
.cat-item .n { font-weight: 700 }
.cat-item .s { grid-column: 2; color: var(--muted); font-size: 12px }
.cat-item:disabled { opacity: .5 }
.line { display: grid; grid-template-columns: 1fr 110px 36px; gap: 6px; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--line) }
.line select, .line input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0 }
.line .qwrap { display: flex; align-items: center; gap: 4px }
.line .qwrap span { font-size: 13px; color: var(--muted); white-space: nowrap }
.line .del { border: 1px solid var(--line); background: none; border-radius: 8px; height: 40px; color: var(--muted) }
.line .have { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin: 0 }
.addline { border: 1px dashed var(--accent); color: var(--accent); background: none; border-radius: 8px; padding: 10px; width: 100%; font-weight: 700; margin: 10px 0 }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 0 0 12px }
.check input { width: 20px; height: 20px }
.card { margin-top: 12px; background: var(--bg); border-radius: 10px; padding: 14px }
.card h4 { margin: 0 0 4px; font-size: 15px }
.card p { margin: 0 0 8px; color: var(--muted); font-size: 13px }
.card textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel); font-family: var(--font-num); font-size: 12px }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out } @keyframes up { from { transform: translateY(24px); opacity: .6 } } }
</style>
</head>

  <div class="top"><h1>水電工地帳</h1><button id="backupBtn" type="button">備份</button></div>
  <div class="sample" id="sampleBar" hidden>

</nav>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

  function viewExp() {

  // ---------- 下方滑出表單 ----------
  function open(html, onReady) { $('sheet').innerHTML = html; $('scrim').hidden = false; $('sheet').scrollTop = 0; if (onReady) onReady(); }
  function close() { $('scrim').hidden = true; $('sheet').innerHTML = ''; }
  $('scrim').addEventListener('click', function (e) { if (e.target === $('scrim')) close(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('scrim').hidden) close(); });
  var toastTimer;
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600); }
  function leaveSample() { if (state.sample) state = { items: [], logs: [], jobs: [], workers: [], work: [], expenses: [] }; }
  function commit(msg) { delete state.sample; save(); render(); close(); if (msg) toast(msg); }
  function showErr(m) { $('fErr').textContent = m; $('fErr').hidden = false; }
  function stamp(date, i) { return Date.parse(date + 'T12:00:00') + (Date.now() % 86400000) / 1000 + (i || 0); }
  var btns = function (label) { return '<p class="err" id="fErr" hidden></p><div class="btnrow"><button class="btn main" type="submit">' + label + '</button><button class="btn ghost" type="button" data-close>取消</button></div>'; };
  $('sheet').addEventListener('click', function (e) { if (e.target.closest('[data-close]')) close(); });
  var jobField = function (required, val) {
    return '<div class="field"><label for="fJob">工地' + (required ? '' : '（可不填）') + '</label><input id="fJob" type="text" list="jobsDl" value="' + esc(val || '') + '" placeholder="' + (required ? '例：王公館 浴室翻修' : '不填＝公司開銷，不算進工地') + '"><datalist id="jobsDl">' + jobOptions() + '</datalist></div>' +
      (openJobNames().length ? '<div class="pick" id="jobPick" style="margin-top:-6px">' + openJobNames().slice(0, 6).map(function (n) { return '<button type="button" data-j="' + esc(n) + '" style="font-weight:500;padding:5px 10px;font-size:13px">' + esc(n) + '</button>'; }).join('') + '</div>' : '');
  };
  function bindJobPick() {
    var p = $('jobPick'); if (!p) return;
    function sync() { Array.prototype.forEach.call(p.children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.j === $('fJob').value)); }); }
    p.addEventListener('click', function (e) { var b = e.target.closest('[data-j]'); if (b) { $('fJob').value = $('fJob').value === b.dataset.j ? '' : b.dataset.j; sync(); } });
    $('fJob').addEventListener('input', sync); sync();
  }

  function actionMenu() {

      '<button class="act" type="button" data-act="in" style="--c:var(--in)"><b>材料進貨</b><small>買材料回來補庫存</small></button>' +
      '<button class="act" type="button" data-act="work" style="--c:var(--c-lab)"><b>記出工</b><small>誰今天去哪個工地</small></button>' +
      '<button class="act" type="button" data-act="exp" style="--c:var(--c-exp)"><b>記雜支</b><small>飲料、便當、油錢</small></button>' +
      '<button class="act" type="button" data-act="job"><b>新工地</b><small>填工程款，算賺多少</small></button>' +

      '</div>');
  }
  var ACTS = { out: function () { outForm(); }, 'in': function () { inForm(); }, work: function () { workForm(); }, exp: function () { expForm(); }, job: function () { jobForm(); }, item: function () { pickCatalog(); }, worker: function () { workerForm(); } };

  // 工地：新增、修改（名稱、工程款、完工）
  function jobForm(name) {
    var j = name ? (jobByName(name) || { name: name, income: 0, done: false }) : { name: '', income: '', done: false, note: '' };
    open('<h2>' + (name ? '修改工地' : '新工地') + '</h2><form id="f">' +
      '<div class="field"><label for="jName">工地名稱</label><input id="jName" type="text" value="' + esc(j.name) + '" placeholder="例：王公館 浴室翻修"></div>' +
      '<div class="field"><label for="jIncome">工程款（跟客人收多少）</label><input id="jIncome" type="number" inputmode="numeric" min="0" step="any" value="' + (j.income || '') + '" placeholder="還不知道可以先空著"></div>' +
      '<div class="field"><label for="jNote">備註（地址、電話…）</label><input id="jNote" type="text" value="' + esc(j.note || '') + '"></div>' +
      (name ? '<label class="check"><input id="jDone" type="checkbox"' + (j.done ? ' checked' : '') + '>已經完工</label>' : '') +
      btns(name ? '儲存' : '新增工地') + '</form>', function () {
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var nn = $('jName').value.trim(); if (!nn) return showErr('請填工地名稱。');
        if (nn !== name && allJobNames().indexOf(nn) >= 0) return showErr('已經有叫「' + nn + '」的工地了。');
        if (!name) leaveSample();
        var rec = jobByName(name || nn);
        if (!rec) { rec = { name: nn }; state.jobs.push(rec); }
        if (name && nn !== name) {
          state.logs.forEach(function (l) { if (l.job === name) l.job = nn; });
          state.work.forEach(function (w) { if (w.job === name) w.job = nn; });
          state.expenses.forEach(function (x) { if (x.job === name) x.job = nn; });
        }
        rec.name = nn; rec.income = parseFloat($('jIncome').value) || 0; rec.note = $('jNote').value.trim(); rec.done = name ? $('jDone').checked : false;
        commit(name ? '已儲存' : '已新增工地 ' + nn);
      });
    });
  }

  function jobSheet(name) {
    var j = jobSummary(name);
    var mat = Object.keys(j.matLines).map(function (id) { var it = itemById(id) || ghost, ln = j.matLines[id]; return '<tr><td>' + esc(it.name) + '</td><td class="r num">' + qtyFmt(ln.qty) + ' ' + esc(it.unit) + '</td><td class="r num">' + money(ln.cost) + '</td></tr>'; }).join('');
    var lab = Object.keys(j.labLines).map(function (id) { var w = workerById(id) || { name: '（已刪除）' }, ln = j.labLines[id]; return '<tr><td>' + esc(w.name) + '</td><td class="r num">' + qtyFmt(ln.days) + ' 天</td><td class="r num">' + money(ln.cost) + '</td></tr>'; }).join('');
    var exp = j.expList.slice().sort(function (a, b) { return a.date.localeCompare(b.date); }).map(function (x) { return '<tr><td>' + esc(x.cat) + (x.note ? '・' + esc(x.note) : '') + '</td><td class="r">' + dayLabel(x.date) + '</td><td class="r num">' + money(x.amount) + '</td></tr>'; }).join('');
    var sec = function (t, total, rows, color) { return '<h3><span style="color:var(' + color + ')">' + t + '</span><span class="num">' + money(total) + '</span></h3>' + (rows ? '<div class="tbl"><table>' + rows + '</table></div>' : '<p class="hint" style="margin:0">還沒有</p>'); };
    open('<h2><span class="pill ' + (j.done ? 'done' : 'live') + '">' + (j.done ? '完工' : '進行中') + '</span>' + esc(name) + '</h2>' + (j.note ? '<div class="desc-box">' + esc(j.note) + '</div>' : '') +
      '<dl class="kv"><dt>工程款</dt><dd class="num">' + (j.income ? money(j.income) : '未填') + '</dd>' +
      '<dt><span class="m-mat legend"><span>材料</span></span></dt><dd class="num">− ' + money(j.mat) + '</dd>' +
      '<dt><span class="m-lab legend"><span>工錢</span></span></dt><dd class="num">− ' + money(j.lab) + '</dd>' +
      '<dt><span class="m-exp legend"><span>雜支</span></span></dt><dd class="num">− ' + money(j.exp) + '</dd>' +
      '<dt class="tot">' + (j.income ? '賺' : '成本合計') + '</dt><dd class="tot num ' + (j.income ? (j.profit >= 0 ? 'pos' : 'neg') : '') + '">' + (j.income ? signed(j.profit) + (j.income ? '<small class="muted">（' + Math.round(j.profit / j.income * 100) + '%）</small>' : '') : money(j.cost)) + '</dd></dl>' +
      (j.income ? '' : '<p class="hint" style="margin:6px 0 0">填了工程款就會算出這個工地賺多少。</p>') +
      sec('材料', j.mat, mat, '--c-mat') + sec('工錢', j.lab, lab, '--c-lab') + sec('雜支', j.exp, exp, '--c-exp') +
      '<div class="btnrow" style="margin-top:18px"><button class="btn main" type="button" id="jEdit">修改／填工程款</button></div>' +
      '<div class="btnrow"><button class="btn ghost main" type="button" id="jCopy">複製明細</button><button class="btn ghost main" type="button" id="jDone">' + (j.done ? '改回進行中' : '標成完工') + '</button></div>', function () {
      $('jEdit').onclick = function () { jobForm(name); };
      $('jCopy').onclick = function () { copyText(jobText(j), '已複製，可以貼到 LINE'); };
      $('jDone').onclick = function () { ensureJob(name); jobByName(name).done = !j.done; commit(j.done ? '已改回進行中' : '已標成完工'); };
    });
  }
  function jobText(j) {
    var out = ['【' + j.name + '】成本明細', (j.first ? j.first + (j.last !== j.first ? ' ～ ' + j.last : '') : ''), ''];
    var ks = Object.keys(j.matLines);
    if (ks.length) { out.push('■ 材料 ' + money(j.mat)); ks.forEach(function (id) { var it = itemById(id) || ghost, ln = j.matLines[id]; out.push('・' + it.name + (it.spec ? '（' + it.spec + '）' : '') + ' × ' + qtyFmt(ln.qty) + ' ' + it.unit + '　' + money(ln.cost)); }); out.push(''); }
    ks = Object.keys(j.labLines);
    if (ks.length) { out.push('■ 工錢 ' + money(j.lab)); ks.forEach(function (id) { var w = workerById(id) || { name: '（已刪除）' }, ln = j.labLines[id]; out.push('・' + w.name + ' ' + qtyFmt(ln.days) + ' 天　' + money(ln.cost)); }); out.push(''); }
    if (j.expList.length) { out.push('■ 雜支 ' + money(j.exp)); j.expList.forEach(function (x) { out.push('・' + x.date.slice(5) + ' ' + x.cat + (x.note ? ' ' + x.note : '') + '　' + money(x.amount)); }); out.push(''); }
    out.push('成本合計：' + money(j.cost));
    return out.join('\n');
  }

  // 員工
  function workerForm(w) {
    var ed = !!w; w = w || { name: '', wage: '' };
    open('<h2>' + (ed ? '修改員工' : '新增員工') + '</h2><form id="f">' +
      '<div class="field"><label for="wName">名字</label><input id="wName" type="text" value="' + esc(w.name) + '" placeholder="例：阿明"></div>' +
      '<div class="field"><label for="wWage">日薪（做一天多少錢）</label><input id="wWage" type="number" inputmode="numeric" min="0" step="any" value="' + (w.wage || '') + '" placeholder="例：2500"></div>' +
      (ed ? '<p class="hint">改日薪只影響之後記的出工，之前的照舊。</p>' : '') + btns(ed ? '儲存' : '新增') + '</form>', function () {

        e.preventDefault();

  function workerSheet(id) {

      (recs.length ? '<div class="tbl"><table>' + recs.map(function (x) { return '<tr><td>' + dayLabel(x.date) + '</td><td>' + esc(x.job) + '</td><td class="r">' + daysFmt(x.days) + '</td><td class="r num">' + money(x.days * x.wage) + '</td></tr>'; }).join('') + '</table></div>' : '<p class="hint" style="margin:0">這個月還沒有出工紀錄。</p>') +
      '<div class="btnrow" style="margin-top:16px"><button class="btn main" type="button" id="wCopy">複製薪水單</button><button class="btn ghost" type="button" id="wEdit">修改</button><button class="btn ghost" type="button" id="wDel">刪除</button></div>' +
      '<div id="delBox" hidden><p class="err" style="margin-top:12px">刪除「' + esc(w.name) + '」？之前的出工紀錄和工地工錢會保留。</p><div class="btnrow"><button class="btn danger" type="button" id="wDelYes">確定刪除</button></div></div>', function () {

      $('wDel').onclick = function () { $('delBox').hidden = false; };

  // 記出工：選工地、勾員工、全天／半天
  function workForm() {
    if (!state.workers.length) { toast('先新增員工，填名字和日薪'); workerForm(); return; }
    var picked = {}, days = 1;
    open('<h2>記出工</h2><form id="f">' +
      '<div class="field"><label for="fDate">日期</label><input id="fDate" type="date" value="' + today() + '"></div>' + jobField(true) +
      '<div class="lab" style="margin-bottom:4px">誰去（可以選好幾個）</div><div class="pick" id="wPick">' + state.workers.map(function (w) { return '<button type="button" data-w="' + w.id + '" aria-pressed="false">' + esc(w.name) + '<small>日薪 ' + money(w.wage) + '</small></button>'; }).join('') + '</div>' +
      '<div class="lab" style="margin-bottom:4px">做多久</div><div class="seg" id="dSeg"><button type="button" data-d="1" aria-pressed="true">全天</button><button type="button" data-d="0.5" aria-pressed="false">半天</button><button type="button" data-d="1.5" aria-pressed="false">1.5 天（加班）</button></div>' +
      '<div class="field"><label for="fNote">備註（可不填）</label><input id="fNote" type="text" placeholder="例：配管、拉線"></div>' +
      '<div class="sum"><span>這次工錢</span><span class="num" id="fTotal">NT$0</span></div>' + btns('記錄出工') + '</form>', function () {
      bindJobPick();
      function sync() {
        var t = 0;
        Array.prototype.forEach.call($('wPick').children, function (b) { b.setAttribute('aria-pressed', String(!!picked[b.dataset.w])); if (picked[b.dataset.w]) t += workerById(b.dataset.w).wage * days; });
        Array.prototype.forEach.call($('dSeg').children, function (b) { b.setAttribute('aria-pressed', String(Number(b.dataset.d) === days)); });
        $('fTotal').textContent = money(t);

      $('wPick').addEventListener('click', function (e) { var b = e.target.closest('[data-w]'); if (!b) return; if (picked[b.dataset.w]) delete picked[b.dataset.w]; else picked[b.dataset.w] = 1; sync(); });
      $('dSeg').addEventListener('click', function (e) { var b = e.target.closest('[data-d]'); if (b) { days = Number(b.dataset.d); sync(); } });
      $('f').addEventListener('submit', function (e) {

        var job = $('fJob').value.trim(), ids = Object.keys(picked);

        commit('已記錄 ' + ids.length + ' 人出工');

    });

  // 記雜支
  function expForm() {
    var c = '飲料';
    open('<h2>記雜支</h2><form id="f">' +
      '<div class="lab" style="margin-bottom:4px">花在什麼</div><div class="pick" id="cPick">' + EXP_CATS.map(function (x) { return '<button type="button" data-c="' + x + '">' + x + '</button>'; }).join('') + '</div>' +
      '<div class="grid2"><div class="field"><label for="fAmt">金額</label><input id="fAmt" type="number" inputmode="numeric" min="0" step="any" placeholder="例：150"></div><div class="field"><label for="fDate">日期</label><input id="fDate" type="date" value="' + today() + '"></div></div>' +
      jobField(false) + '<div class="field"><label for="fNote">備註（可不填）</label><input id="fNote" type="text" placeholder="例：三杯手搖"></div>' + btns('記錄雜支') + '</form>', function () {
      bindJobPick();
      function sync() { Array.prototype.forEach.call($('cPick').children, function (b) { b.setAttribute('aria-pressed', String(b.dataset.c === c)); }); }
      $('cPick').addEventListener('click', function (e) { var b = e.target.closest('[data-c]'); if (b) { c = b.dataset.c; sync(); } });
      sync(); $('fAmt').focus();
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var amt = parseFloat($('fAmt').value); if (!(amt > 0)) return showErr('請填金額。');

  // ---------- 材料 ----------
  function itemOptions(sel) {

  function inForm(itemId) {
    if (!state.items.length) { pickCatalog(); return; }
    var mode = 'pack';
    open('<h2>材料進貨</h2><form id="f">' +
      '<div class="field"><label for="fItem">材料</label><select id="fItem">' + itemOptions(itemId) + '</select></div>' +
      '<div class="desc-box" id="fHave"></div>' +
      '<div class="seg" id="fMode"><button type="button" data-m="pack"></button><button type="button" data-m="unit"></button></div>' +

      '<div class="grid2"><div class="field"><label for="fDate">日期</label><input id="fDate" type="date" value="' + today() + '"></div><div class="field"><label for="fNote">廠商／備註</label><input id="fNote" type="text" placeholder="例：大同水電行"></div></div>' +
      btns('記錄進貨') + '</form>', function () {
      function cur() { return itemById($('fItem').value); }

      function sync() {
        var it = cur(), c = calc.by[it.id];
        $('fHave').textContent = (it.desc ? it.desc + '。' : '') + '目前庫存 ' + fq(it, c.qty) + (c.avg ? '，平均' + fp(it, c.avg) : '');
        $('fMode').hidden = !hasPack(it);
        if (hasPack(it)) {
          var b = $('fMode').children;
          b[0].textContent = '整' + it.pack.unit + '進（每' + it.pack.unit + ' ' + qtyFmt(it.pack.size) + ' ' + it.unit + '）';
          b[1].textContent = '用' + it.unit + '算';
          b[0].setAttribute('aria-pressed', String(mode === 'pack')); b[1].setAttribute('aria-pressed', String(mode !== 'pack'));
        }
        var u = usePack() ? it.pack.unit : it.unit;
        $('fQtyL').textContent = '買了幾' + u; $('fPriceL').textContent = '每' + u + '多少錢';
        var ref = usePack() ? c.avg * it.pack.size : c.avg;
        $('fPrice').placeholder = ref ? '上次約 ' + (Math.round(ref * 10) / 10) : '例：' + (usePack() ? '1350' : '45');
        var qn = parseFloat($('fQty').value) || 0, p = parseFloat($('fPrice').value) || 0;
        $('fConv').textContent = usePack() && qn ? '＝ ' + qtyFmt(qn * it.pack.size) + ' ' + it.unit : '小計';
        $('fTotal').textContent = money(qn * p);
      }
      $('fItem').addEventListener('change', sync);
      $('fMode').addEventListener('click', function (e) { var b = e.target.closest('[data-m]'); if (b) { mode = b.dataset.m; sync(); } });
      $('fQty').addEventListener('input', sync); $('fPrice').addEventListener('input', sync);
      sync(); $('fQty').focus();
      $('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var it = cur(), qn = parseFloat($('fQty').value), p = parseFloat($('fPrice').value);
        if (!(qn > 0)) return showErr('數量要大於 0。'); if (!(p >= 0)) return showErr('請填單價，才能算成本。');
        var date = $('fDate').value || today();
        var log = { id: uid(), t: stamp(date), date: date, type: 'in', itemId: it.id, qty: qn, price: p, job: '', note: $('fNote').value.trim() };
        if (usePack()) { log.qty = qn * it.pack.size; log.price = p / it.pack.size; log.pk = { n: qn, unit: it.pack.unit }; }
        state.logs.push(log);
        commit('已進貨 ' + it.name + '，現在有 ' + fq(it, calc.by[it.id].qty + log.qty));

    });
  }

  function outForm(itemId) {
    if (!state.items.length) { pickCatalog(); return; }
    open('<h2>工地領料</h2><form id="f">' + jobField(true) +
      '<div class="field"><label for="fDate">日期</label><input id="fDate" type="date" value="' + today() + '"></div>' +
      '<div class="lab">領了哪些材料</div><div id="lines"></div>' +
      '<button class="addline" type="button" id="addLine">＋ 再加一樣材料</button>' +
      '<div class="sum"><span>這次材料成本</span><span id="fTotal" class="num">NT$0</span></div>' + btns('記錄領料') + '</form>', function () {
      bindJobPick();
      var n = 0;
      function addLine(sel) {
        var i = n++, d = document.createElement('div');
        d.className = 'line';
        d.innerHTML = '<select id="lItem' + i + '" aria-label="材料">' + itemOptions(sel) + '</select>' +
          '<div class="qwrap"><input id="lQty' + i + '" type="number" inputmode="decimal" step="any" min="0" placeholder="數量" aria-label="數量"><span></span></div>' +
          '<button class="del" type="button" aria-label="移除這一樣">✕</button><p class="have"></p>';
        $('lines').appendChild(d);
        d.querySelector('select').addEventListener('change', sync);

        sync(); return d;
      }
      function lines() { return Array.prototype.map.call($('lines').children, function (d) { return { el: d, it: itemById(d.querySelector('select').value), qty: parseFloat(d.querySelector('input').value) || 0 }; }); }
      function sync() {

      $('f').addEventListener('submit', function (e) {

        var need = {}; ls.forEach(function (l) { need[l.it.id] = (need[l.it.id] || 0) + l.qty; });
        for (var id in need) { var it = itemById(id), have = calc.by[id].qty; if (need[id] > have + 1e-9) return showErr(it.name + ' 只剩 ' + fq(it, have) + '，不夠領 ' + qtyFmt(need[id]) + ' ' + it.unit + '。先記進貨再領。'); }
        var date = $('fDate').value || today();
        ensureJob(job);
        ls.forEach(function (l, i) { state.logs.push({ id: uid(), t: stamp(date, i), date: date, type: 'out', itemId: l.it.id, qty: l.qty, price: 0, job: job, note: '' }); });
        commit('已記錄 ' + job + ' 領料 ' + ls.length + ' 樣');
      });
    });
  }

  function pickCatalog() {
    var have = {}, picked = {}, ccat = '電';
    if (!state.sample) state.items.forEach(function (it) { have[it.name] = 1; });
    open('<h2>新增材料</h2><div class="seg"><button type="button" aria-pressed="true">從常用清單選</button><button type="button" id="toCustom" aria-pressed="false">自己填</button></div>' +
      '<input id="cq" class="search" style="margin:0;background:var(--bg)" type="search" placeholder="搜尋，例如：電線、4分、開關">' +
      '<div class="chips" id="cChips" style="margin-top:10px"></div><div class="cat-list" id="cList"></div>' +
      '<p class="hint" style="margin:0 0 12px">加好之後記「材料進貨」填數量和價錢。名稱、單位、安全量之後都可以改。</p>' +
      '<div class="btnrow"><button class="btn main" type="button" id="cAdd" disabled>勾選要加的材料</button><button class="btn ghost" type="button" data-close>取消</button></div>', function () {
      function draw() {
        $('cChips').innerHTML = CATS.map(function (c) { return '<button class="chip" type="button" data-c="' + c + '" aria-pressed="' + (c === ccat) + '">' + c + '</button>'; }).join('');
        var ql = $('cq').value.trim().toLowerCase();
        var rows = CATALOG.filter(function (r) { return ql ? (r[1] + r[2] + r[4]).toLowerCase().indexOf(ql) >= 0 : r[0] === ccat; });
        $('cList').innerHTML = rows.length ? rows.map(function (r) {
          var dis = have[r[1]], on = !!picked[r[1]];
          return '<button class="cat-item" type="button" data-n="' + esc(r[1]) + '" aria-pressed="' + on + '"' + (dis ? ' disabled' : '') + '><span class="box">' + (on ? '✓' : '') + '</span>' +
            '<span class="n">' + esc(r[1]) + (r[2] ? ' <small style="font-weight:500;color:var(--muted)">' + esc(r[2]) + '</small>' : '') + '</span>' +
            '<span class="s">' + (dis ? '已經加過了' : esc(r[4]) + '・用「' + esc(r[3]) + '」算' + (r[5] ? '，整' + esc(r[5]) + '進（每' + esc(r[5]) + ' ' + r[6] + ' ' + esc(r[3]) + '）' : '')) + '</span></button>';
        }).join('') : '<div class="empty">清單裡沒有，按上面「自己填」。</div>';
        var cnt = Object.keys(picked).length;
        $('cAdd').disabled = !cnt; $('cAdd').textContent = cnt ? '加入 ' + cnt + ' 樣材料' : '勾選要加的材料';
      }
      $('cChips').addEventListener('click', function (e) { var b = e.target.closest('[data-c]'); if (b) { ccat = b.dataset.c; $('cq').value = ''; draw(); } });
      $('cList').addEventListener('click', function (e) { var b = e.target.closest('[data-n]'); if (!b || b.disabled) return; var k = b.dataset.n; if (picked[k]) delete picked[k]; else picked[k] = 1; draw(); });
      $('cq').addEventListener('input', draw);
      $('toCustom').addEventListener('click', function () { customForm(); });
      $('cAdd').addEventListener('click', function () {
        leaveSample();
        var names = Object.keys(picked);
        names.forEach(function (nm) { state.items.push(Object.assign({ id: uid() }, fromCatalog(catalogByName(nm)))); });
        commit('已加入 ' + names.length + ' 樣材料，接著記「材料進貨」填數量');
      });
      draw();
    });
  }

  function customForm(item) {
    var ed = !!item; item = item || { name: '', cat: '水', spec: '', unit: '個', min: 0, desc: '' };
    var pk = item.pack || { unit: '卷', size: 100 };
    open('<h2>' + (ed ? '修改材料' : '新增材料') + '</h2>' +
      (ed ? '' : '<div class="seg"><button type="button" id="toCat" aria-pressed="false">從常用清單選</button><button type="button" aria-pressed="true">自己填</button></div>') +
      '<form id="f"><div class="field"><label for="iName">材料名稱</label><input id="iName" type="text" value="' + esc(item.name) + '" placeholder="例：PVC 水管 6分"></div>' +
      '<div class="grid2"><div class="field"><label for="iCat">分類</label><select id="iCat">' + CATS.map(function (c) { return '<option' + (c === item.cat ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div>' +

      '<label class="check"><input id="iPackOn" type="checkbox"' + (item.pack ? ' checked' : '') + '>進貨是整卷／整箱買（例如電線一卷 100 米）</label>' +
      '<div class="grid2" id="iPackBox"><div class="field"><label for="iPackUnit">整包單位</label><input id="iPackUnit" type="text" list="packDl" value="' + esc(pk.unit) + '"><datalist id="packDl"><option value="卷"><option value="箱"><option value="捆"><option value="包"></datalist></div>' +

      '<p class="hint">低於安全庫存量會標黃色「不足」，提醒要補貨。</p>' + btns(ed ? '儲存' : '新增') + '</form>', function () {

        e.preventDefault();

        var data = { name: name, cat: $('iCat').value, spec: $('iSpec').value.trim(), desc: $('iDesc').value.trim(), unit: unit, min: parseFloat($('iMin').value) || 0 };

        leaveSample();

      });
    });
  }

    tab = b.dataset.tab; try { localStorage.setItem(KEY + ':tab', tab); } catch (er) {}
    render(); window.scrollTo(0, 0);
  });
  $('plusBtn').addEventListener('click', actionMenu);
  $('sheet').addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b) ACTS[b.dataset.act](); });
  $('backupBtn').addEventListener('click', backupSheet);
  $('clearSample').addEventListener('click', function () { state = { items: [], logs: [], jobs: [], workers: [], work: [], expenses: [] }; save(); render(); toast('範例已清空，按「＋ 記一筆」開始'); });
  $('view').addEventListener('input', function (e) { if (e.target.id === 'q') { q = e.target.value; render(); } });
  $('view').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var d = b.dataset;
    if (d.mon) { var y = Number(month.slice(0, 4)), m = Number(month.slice(5)) + Number(d.mon); if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } month = y + '-' + pad(m); render(); }
    else if (d.act) ACTS[d.act]();
    else if (d.jf) { jobFilter = d.jf; render(); }
    else if (d.job) jobSheet(d.job);
    else if (d.cat) { cat = d.cat; render(); }
    else if (d.sv) { stockView = d.sv; render(); }
    else if (d.item) itemSheet(d.item);
    else if (d.worker) workerSheet(d.worker);
    else if (d.del) {
      var p = d.del.split(':'), coll = p[0], id = p[1];
      confirmSheet('刪除這筆紀錄？', coll === 'logs' ? '刪掉後庫存數量和平均成本會重新計算。' : '刪掉後工地成本會跟著重算。', '刪除', function () {
        state[coll] = state[coll].filter(function (x) { return x.id !== id; }); commit('已刪除');
      });
    }
  });

  render();
})();
</script>
</body>
</html>
