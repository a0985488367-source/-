# Guardian 主程式 —— 給用電腦以 wrangler 部署的人
#
# 手機部署請看 DEPLOY.md，用 Cloudflare 網頁編輯器貼上即可，不需要這個檔案。
#
#   npx wrangler deploy -c wrangler.guardian.toml
#
# 機密不要寫在這裡，用指令設定：
#   npx wrangler secret put DISCORD_WEBHOOK  -c wrangler.guardian.toml
#   npx wrangler secret put BYBIT_API_KEY    -c wrangler.guardian.toml
#   npx wrangler secret put BYBIT_API_SECRET -c wrangler.guardian.toml
#   npx wrangler secret put ADMIN_TOKEN      -c wrangler.guardian.toml

name = "crypto-radar-guardian"
main = "public/crypto-radar-guardian.worker.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "GUARDIAN_KV"
id = "在此填入你的 KV namespace ID"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# 非機密設定。BYBIT_ENV 可填 live / demo / testnet
BYBIT_ENV = "live"
