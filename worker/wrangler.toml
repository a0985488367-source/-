# Cloudflare Worker 設定
#
# 部署方式（二選一）：
#   A. GitHub Actions 自動部署（推薦）—— 在倉庫加入 CLOUDFLARE_API_TOKEN 與
#      CLOUDFLARE_ACCOUNT_ID 兩個 secret，deploy-worker.yml 會自動打包再上傳
#   B. 手動部署 —— index.js 有 import 其他原始碼（見下方 Worker 自己掃描），
#      不能直接貼進 Cloudflare 主控台。要先在本機打包：
#        cd worker && npx esbuild index.js --bundle --format=esm \
#          --platform=neutral --outfile=dist/index.js
#      再把 dist/index.js 的內容貼進主控台
#
# 兩種方式都需要在 Worker 上設定：
#   Secret        DISCORD_WEBHOOK_URL
#   KV binding    SMC_KV（用來記住已通知過的標的）
#
# 選用：自動下單（Demo 模擬交易，預設關閉，細節見 index.js 開頭的說明）。
# Worker 自己不直接呼叫 Bybit（美國地區的 IP 會被 Bybit 整個擋掉），改打
# 獨立部署的 Bybit Executor 服務（見 executor/ 資料夾跟它自己的 README）
#   Secret        EXECUTOR_URL / EXECUTOR_HMAC_SECRET / AUTO_TRADE_TOKEN
#
# 選用：Worker 自己即時掃描（需要 Workers Paid，細節見 index.js 開頭的說明）
#   Variable      WORKER_SCAN_ENABLED / WORKER_SCAN_TOP / WORKER_SCAN_BATCH_SIZE /
#                 WORKER_SCAN_BATCH_INTERVAL_MIN / WORKER_SCAN_INTERVAL / WORKER_SCAN_PROVIDERS /
#                 WORKER_SCAN_MIN_SCORE（掃描累積門檻，跟推播/下單門檻 MIN_SCORE 是分開的）/
#                 WORKER_SCAN_CONCURRENCY（單批內同時發出的請求數，共用 IP 容易被限流）
#
# 選用：把 Worker 自己的掃描結果寫回 data/market.json（細節見 index.js 開頭的說明）
#   Secret        GITHUB_API_TOKEN（fine-grained PAT，只給這個倉庫的 Contents 讀寫權限）
#   Variable      GITHUB_REPO / GITHUB_MARKET_PATH（不設就用預設值，通常不用改）

name = "smc-signals"
main = "index.js"
compatibility_date = "2024-11-01"

# 每 2 分鐘檢查一次價格是否進入進場區
[triggers]
crons = ["*/2 * * * *"]

[vars]
MARKET_URL = "https://raw.githubusercontent.com/a0985488367-source/-/main/data/market.json"
MIN_SCORE = "65"
MAX_MARKET_AGE_MIN = "240"
ALERT_TTL_SEC = "21600"
NEAR_PCT = "0.08"
# 自動下單（選用，預設關閉，開關另外看 KV 的 auto-trade:enabled）
# SMC 進場區自動下單：2026-09-28 晚上改成只跑 SMC、每單 5%，一晚 3 筆全虧（−43U）；
# 同一晚的條件組合回測（smc-mix，約 1000 組）也找不到穩定優勢 → 2026-09-29 使用者決定先關掉，只推播
SMC_AUTO_TRADE_ENABLED = "false"
AUTO_TRADE_RISK_PCT = "5"
# 槓桿照評分線性插值：評分等於 MIN_SCORE 給 MIN 倍，100 分給 MAX 倍
AUTO_TRADE_LEVERAGE_MIN = "3"
AUTO_TRADE_LEVERAGE_MAX = "10"
# 停損距離很近時，光靠 AUTO_TRADE_RISK_PCT 算出來的數量可能需要用掉幾乎
# 全部的保證金，變成一張單就把其他訊號的下單空間吃光；這裡限制單筆最多
# 佔用可用餘額的這個 %，超過會先試著拉高槓桿省保證金，還是不夠才縮小數量
AUTO_TRADE_MAX_MARGIN_PCT = "25"
# 只自動下這些方向（逗號分隔，例如 "long,short"）；其他方向照樣推播、進模擬盤紀錄
AUTO_TRADE_DIRECTIONS = "long,short"
# 不自動下單的進場區類型（逗號分隔）；一樣照樣推播、進模擬盤紀錄
AUTO_TRADE_EXCLUDE_POI = ""
# 所有持倉停損打到時的虧損加總上限（占帳戶 %）；搬到成本價的部位不算
AUTO_TRADE_MAX_OPEN_RISK_PCT = "0"
# 停損距離（占進場價 %）低於這個就不下單：停損愈近，手續費吃掉的 R 愈多
AUTO_TRADE_MIN_STOP_PCT = "0"
# 倉位只能開到「用帳戶總額算出來該有大小」的這個 % 以下就不開（可用保證金不夠時不硬開）
AUTO_TRADE_MIN_SIZE_PCT = "50"
# 第一個止盈目標至少要幾 R 才下單（目標太近的單只通知）
AUTO_TRADE_MIN_TP1_RR = "1.5"
# BTC 同週期收在這條 EMA 之上（漲勢）就不下空單；0＝不限制
AUTO_TRADE_BTC_TREND_EMA = "200"
# ── 順勢策略組合（2026-09-28 上線 6 策略、每單 3%、最多同時 5 張；同一天晚上使用者決定改回只跑 SMC，全部關掉）──
# 全策略回測（27 種策略 × 7 種出場 × 30m／1h／2h／4h／6h，74 檔、5 分鐘精準版）只有 4h／6h 的順勢策略
# 四段都賺；挑出下面 6 個合在同一個帳戶跑（組合模擬，每單 3%、最多 5 張）：
#   原週期前半 8.4 倍／後半 13.5 倍、5 分鐘精準版前段 1.58 倍（122 天）、最近 75 天 1.89 倍，
#   每月約 +12～29%，最大回撤 63%（每單 3%、最多 3 張是回撤 31%、每月 +10～20%）
# 每個策略只在 <前綴>_TF 的週期判斷；同一個幣已經有部位就不開。幣種清單留空＝內建 74 檔
#   唐奇安 55 突破（src/strategies/breakout.js）6h：停損 2 ATR、止盈 1R（BREAKOUT_TP_R），之後不動
BREAKOUT_ENABLED = "false"
BREAKOUT_TF = "6h"
BREAKOUT_RISK_PCT = "3"
BREAKOUT_TP_R = "1"
#   EMA20／50 交叉（src/strategies/ema-cross.js）6h：停損 2 ATR，賺 1R 移到成本、1.5R 後追蹤，不設止盈
EMA_CROSS_ENABLED = "false"
EMA_CROSS_TF = "6h"
#   MACD 穿零軸（src/strategies/macd-zero.js）6h：出場跟 EMA 交叉一樣（保本＋追蹤）
MACD_ZERO_ENABLED = "false"
MACD_ZERO_TF = "6h"
#   放量突破（src/strategies/trend-extra.js）6h：量 > 均量 2 倍＋突破近 20 根高低點；停損 2 ATR、止盈 2R
VOL_BREAK_ENABLED = "false"
VOL_BREAK_TF = "6h"
VOL_BREAK_TP_R = "2"
#   超級趨勢翻多／翻空（src/strategies/trend-extra.js）4h：停損 2 ATR、保本＋追蹤
SUPERTREND_ENABLED = "false"
SUPERTREND_TF = "4h"
#   黃金／死亡交叉 SMA50／200（src/strategies/trend-extra.js）6h：停損 3 ATR、保本＋追蹤
GOLDEN_CROSS_ENABLED = "false"
GOLDEN_CROSS_TF = "6h"
# 假突破反手（src/strategies/fakeout.js）：組合模擬最近 75 天虧，2026-09-28 關掉
FAKEOUT_ENABLED = "false"
BREAKOUT_INTERVALS = "4h,6h"
# 上面所有策略加起來同時最多 5 張，不限方向（使用者選的；3 張回撤小一半但慢一些）
BREAKOUT_MAX_OPEN = "5"
BREAKOUT_MAX_SAME_DIR = "0"
# 74 檔 × 兩個週期，每次 tick 多判斷幾檔（UTC 0／12 點 4h 跟 6h 同時收盤）
BREAKOUT_BATCH_SIZE = "20"
# Worker 自己即時掃描（需要 Workers Paid；開啟前留意對外部交易所 API 的
# 請求量會增加，見 index.js 開頭的說明）。採分批架構：候選池 120 檔，
# 每 10 分鐘只真的重新掃描其中 20 檔，結果累積進 KV，繞完一輪（120/20=6
# 批 × 10 分鐘 ≈ 1 小時）就等於整個候選池都更新過一次；比對現價／自動
# 下單仍然是每 2 分鐘執行。分批（跟下面的 CONCURRENCY）不是因為 CPU 撐
# 不住——實測 120 檔全掃不到 1 秒 CPU 時間——是因為 Cloudflare 邊緣節點
# 對外是共用 IP，一次塞太多請求容易被交易所限流擋掉
WORKER_SCAN_ENABLED = "true"
# 2026-09-29 使用者要求：SMC 只盯市值前 10 大（不含穩定幣），只推播不下單
SMC_SYMBOLS = "BTCUSDT,ETHUSDT,XRPUSDT,BNBUSDT,SOLUSDT,DOGEUSDT,ADAUSDT,TRXUSDT,LINKUSDT,AVAXUSDT"
WORKER_SCAN_TOP = "120"
WORKER_SCAN_BATCH_SIZE = "20"
WORKER_SCAN_BATCH_INTERVAL_MIN = "10"
# 逗號分隔可以同時開多個進場週期：每個週期各自輪流掃描（同一個 tick 只
# 真的重新掃描一個到期的週期），不會因為多加週期就讓單批的請求量變大，
# 只是把原本大部分 tick 都空著的時間拿來輪流服務其他週期；每個週期各自
# 涵蓋一輪候選池的時間跟只開一個週期時一樣（≈ TOP/BATCH_SIZE ×
# BATCH_INTERVAL_MIN ≈ 1 小時），不會變慢
WORKER_SCAN_INTERVAL = "4h,1h,30m"
# 掃描累積門檻，故意設很低（幾乎不濾）：跟上面的 MIN_SCORE（推播/下單
# 門檻）是兩件事，掃描這一步只要是有效計畫就先存起來，要不要因此推播、
# 下單留到比對現價那一步才照 MIN_SCORE 篩——這樣累積結果才不會被鎖死在
# 「這一批剛好有幾檔當下超過推播門檻」，候選池繞完一輪才能真的都留下來
WORKER_SCAN_MIN_SCORE = "0"
# 單批內同時發出的請求數；共用 IP 愈大愈容易被限流，數字愈小單批要花
# 愈久跑完，但比較不會整批被擋
WORKER_SCAN_CONCURRENCY = "3"
# 資料源照這個順序嘗試，優先用 Bybit（跟自動下單實際交易的交易所一致）
WORKER_SCAN_PROVIDERS = "bybit,binance,okx"

# KV 命名空間：部署前請先建立，並把 id 填在這裡
# （wrangler kv namespace create SMC_KV，或在主控台 Storage → KV 建立）
[[kv_namespaces]]
binding = "SMC_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
