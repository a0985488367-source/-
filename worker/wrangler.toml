# Cloudflare Worker 設定
#
# 部署方式（二選一）：
#   A. GitHub Actions 自動部署（推薦）—— 在倉庫加入 CLOUDFLARE_API_TOKEN 與
#      CLOUDFLARE_ACCOUNT_ID 兩個 secret，deploy-worker.yml 會自動打包再上傳
#   B. 手動部署 —— index.js 有 import 其他原始碼（見下方 Worker 自己掃描），
#      不能直接貼進 Cloudflare 主控台。要先在本機打包：
#        cd worker && npx esbuild index.js --bundle --format=esm \
#          --platform=neutral --outfile=dist/index.js
#      再把 dist/index.js 的內容貼進主控台
#
# 兩種方式都需要在 Worker 上設定：
#   Secret        DISCORD_WEBHOOK_URL
#   KV binding    SMC_KV（用來記住已通知過的標的）
#
# 選用：自動下單（Demo 模擬交易，預設關閉，細節見 index.js 開頭的說明）
#   Secret        BYBIT_DEMO_API_KEY / BYBIT_DEMO_API_SECRET / AUTO_TRADE_TOKEN
#
# 選用：Worker 自己即時掃描（需要 Workers Paid，細節見 index.js 開頭的說明）
#   Variable      WORKER_SCAN_ENABLED / WORKER_SCAN_TOP / WORKER_SCAN_BATCH_SIZE /
#                 WORKER_SCAN_BATCH_INTERVAL_MIN / WORKER_SCAN_INTERVAL / WORKER_SCAN_PROVIDERS
#
# 選用：把 Worker 自己的掃描結果寫回 data/market.json（細節見 index.js 開頭的說明）
#   Secret        GITHUB_API_TOKEN（fine-grained PAT，只給這個倉庫的 Contents 讀寫權限）
#   Variable      GITHUB_REPO / GITHUB_MARKET_PATH（不設就用預設值，通常不用改）

name = "smc-signals"
main = "index.js"
compatibility_date = "2024-11-01"

# 每 2 分鐘檢查一次價格是否進入進場區
[triggers]
crons = ["*/2 * * * *"]

[vars]
MARKET_URL = "https://raw.githubusercontent.com/a0985488367-source/-/main/data/market.json"
MIN_SCORE = "65"
MAX_MARKET_AGE_MIN = "240"
ALERT_TTL_SEC = "21600"
NEAR_PCT = "0.08"
# 自動下單（選用，預設關閉，開關另外看 KV 的 auto-trade:enabled）
AUTO_TRADE_RISK_PCT = "1"
# 槓桿照評分線性插值：評分等於 MIN_SCORE 給 MIN 倍，100 分給 MAX 倍
AUTO_TRADE_LEVERAGE_MIN = "3"
AUTO_TRADE_LEVERAGE_MAX = "10"
# Worker 自己即時掃描（需要 Workers Paid；開啟前留意對外部交易所 API 的
# 請求量會增加，見 index.js 開頭的說明）。採分批架構：候選池 120 檔，
# 每 10 分鐘只真的重新掃描其中 20 檔（避免撐爆 Workers Paid 的 30 秒 CPU
# 上限），結果累積進 KV，繞完一輪（120/20=6 批 × 10 分鐘 ≈ 1 小時）就等於
# 整個候選池都更新過一次；比對現價／自動下單仍然是每 2 分鐘執行
WORKER_SCAN_ENABLED = "true"
WORKER_SCAN_TOP = "120"
WORKER_SCAN_BATCH_SIZE = "20"
WORKER_SCAN_BATCH_INTERVAL_MIN = "10"
WORKER_SCAN_INTERVAL = "1h"
# 資料源照這個順序嘗試，優先用 Bybit（跟自動下單實際交易的交易所一致）
WORKER_SCAN_PROVIDERS = "bybit,binance,okx"

# KV 命名空間：部署前請先建立，並把 id 填在這裡
# （wrangler kv namespace create SMC_KV，或在主控台 Storage → KV 建立）
[[kv_namespaces]]
binding = "SMC_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
