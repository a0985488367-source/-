<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1A33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SMC 道場</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ai:#0F1A33; --ai2:#152446; --ai3:#22355E; --ai4:#2E4579;
  --washi:#ECE6D6; --washi2:#D9D0B8; --mist:#8F9AB8;
  --shu:#E2483D; --kin:#D8B24A; --jade:#3DBB8F; --sky:#6FA8FF;
  --f-brush:"LXGW WenKai TC","Noto Sans TC",serif;
  --f-body:"Noto Sans TC",system-ui,sans-serif;
  --f-num:"Barlow Semi Condensed","Noto Sans TC",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ai);color:var(--washi);font:400 15px/1.6 var(--f-body)}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#1d2f5c 0%,var(--ai) 60%) fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--kin);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700}
p{margin:.4em 0}
small{font-size:12px}

/* 頂部 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(15,26,51,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ai3)}
.lvbox{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.seal-lv{display:grid;place-items:center;width:38px;height:38px;border-radius:6px;background:var(--shu);color:var(--washi);font:700 10px/1 var(--f-body);transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(236,230,214,.35)}
.seal-lv b{font:700 17px/1 var(--f-num);display:block}
.xp{flex:1;max-width:120px;height:5px;border-radius:3px;background:var(--ai3);overflow:hidden}
.xp i{display:block;height:100%;background:var(--kin);transition:width .5s}
.coins{font:600 13px var(--f-num);color:var(--mist)}.coins b{color:var(--kin);font-size:15px}
.streak{display:flex;align-items:center;gap:3px;font:700 17px var(--f-num);color:var(--mist)}
.streak svg{width:18px;height:18px;fill:var(--ai4)}
.streak.alive{color:#FFB25B}.streak.alive svg{fill:#FF8A3D;filter:drop-shadow(0 0 6px rgba(255,138,61,.6))}
.leave{display:none;font:500 14px var(--f-body);color:var(--mist);padding:6px 10px;border:1px solid var(--ai3);border-radius:8px}
#topTitle{display:none;font:700 16px var(--f-brush)}
.immersive .leave,.immersive #topTitle{display:block}
.immersive .lvbox,.immersive .coins{display:none}
.immersive #topTitle{flex:1}

main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
.immersive main{padding-bottom:calc(32px + var(--safe-b))}
.immersive .toast{bottom:calc(20px + var(--safe-b))}

/* 底部分頁 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + var(--safe-b));background:var(--ai);border-top:1px solid var(--ai3)}
.immersive .tabbar{display:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;color:var(--mist);font-size:11px}
.tabbar b{font:400 22px/1.1 var(--f-brush)}
.tabbar button.on{color:var(--washi)}
.tabbar button.on b{color:var(--shu)}

/* 共用 */
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--ai4);background:var(--ai2);font-weight:700;width:100%;margin-top:10px}
.btn.primary{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.primary:disabled{opacity:.4}
.btn.ghost{background:none;border-color:transparent;color:var(--mist);font-weight:500}
.btn.big{min-height:52px;font-size:17px}
.link{color:var(--mist);text-decoration:underline;font-size:12px;margin-left:6px}
.sec-title{font:700 17px var(--f-brush);margin:22px 0 10px;color:var(--washi2)}
.mode-title{font:700 28px/1.25 var(--f-brush);letter-spacing:.02em}
.mode-desc{color:var(--mist);font-size:14px;line-height:1.7}
.loading{padding:60px 0;text-align:center;color:var(--mist);font-family:var(--f-brush);font-size:17px;animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
.err{color:var(--shu)}
.bar{height:6px;background:var(--ai3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);transition:width .4s}
.bar i.low{background:var(--shu)}
.foot{color:var(--mist);font-size:12px;margin-top:28px}
.lesson{color:var(--kin);font-size:14px;border-left:3px solid var(--kin);padding-left:10px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat-row div{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-top:1px solid var(--ai3)}
.stat-row b{font:700 24px var(--f-num)}.stat-row span{font-size:12px;color:var(--mist)}

/* 首頁 */
.welcome{padding:18px;margin-bottom:14px;border:1px solid var(--kin);border-radius:14px;background:linear-gradient(160deg,rgba(216,178,74,.12),transparent)}
.welcome h1{font:700 24px var(--f-brush)}
.today{display:flex;align-items:center;gap:16px;padding:6px 0 14px}
.ring{width:96px;height:96px;flex:none;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--ai3);stroke-width:9}
.ring-fg{fill:none;stroke:#FF8A3D;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s}
.today-txt b{display:block;font:700 34px/1 var(--f-num)}.today-txt b small{font-size:16px;color:var(--mist)}
.today-txt span{display:block;font-size:14px;margin-top:4px}
.today-txt em{display:block;font-style:normal;font-size:12px;color:var(--mist)}
.review{padding:16px;border-radius:14px;background:var(--ai2);border:1px solid var(--ai3)}
.review .stack{display:flex;margin-bottom:12px}
.review .stack .kcard{margin-right:-26px;transform:rotate(-6deg)}
.review .stack .kcard:nth-child(2){transform:rotate(1deg) translateY(-4px)}
.review .stack .kcard:nth-child(3){transform:rotate(7deg)}
.rv-txt b{display:block;font:700 19px var(--f-brush)}.rv-txt span{font-size:13px;color:var(--mist)}
.mission{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--ai3)}
.mission .bar{grid-column:1/-1;height:4px}
.mission .m-prog{font:600 14px var(--f-num);color:var(--mist)}
.mission.done .m-txt{color:var(--mist);text-decoration:line-through}
.mission.done .bar i{background:var(--kin)}
.chest{width:100%;margin-top:12px;padding:12px;border-radius:10px;border:1px dashed var(--ai4);color:var(--mist);font-weight:700}
.chest.ready{border:1px solid var(--kin);color:#1a1405;background:var(--kin);animation:pulse 1.6s infinite}
.chest.opened{border-style:solid;opacity:.5}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(216,178,74,.18)}}
.modes3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 12px;border-radius:12px;background:var(--ai2);border:1px solid var(--ai3);text-align:left}
.mtile b{font:400 30px/1 var(--f-brush);color:var(--shu)}
.mtile.ranked b{color:var(--tc)}.mtile.story b{color:var(--kin)}
.mtile span{font-weight:700}.mtile small{color:var(--mist)}

/* 概念卡：和紙卡＋朱印，墨會變淡 */
.kcard{--ink:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:184px;border-radius:6px;padding:18px 10px 12px;background:var(--washi);color:#1d2340;box-shadow:0 2px 0 var(--washi2),0 10px 24px rgba(0,0,0,.35);overflow:hidden}
.kcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--rc,#9AA6C4)}
.kcard .kc-glyph{font:700 60px/1 var(--f-brush);opacity:var(--ink);filter:blur(calc((1 - var(--ink)) * 1.4px))}
.kcard .kc-name{font:700 14px var(--f-brush);margin-top:10px;text-align:center;opacity:calc(.35 + var(--ink) * .65)}
.kcard .kc-rar{position:absolute;top:10px;left:9px;font-size:10px;color:#5b6283}
.kcard .kc-seal{position:absolute;right:8px;bottom:8px;min-width:24px;padding:2px 4px;border:2px solid var(--shu);border-radius:3px;color:var(--shu);font:700 10px/1.1 var(--f-body);transform:rotate(-8deg);opacity:calc(.3 + var(--ink) * .7);text-align:center}
.kcard .kc-fade{position:absolute;left:8px;bottom:9px;font-size:10px;color:#8a6b2f}
.kcard.faded{background:linear-gradient(170deg,#e6dfcc,#d6ccb2)}
.kcard.locked{background:var(--ai2);color:var(--ai4);box-shadow:inset 0 0 0 1px var(--ai3)}
.kcard.locked .kc-glyph{font-size:44px}.kcard.locked .kc-name{color:var(--mist)}
.kcard.sm{width:70px;height:96px;padding:10px 4px 6px}
.kcard.sm .kc-glyph{font-size:30px}.kcard.sm .kc-name{font-size:10px;margin-top:4px}
.kcard.sm .kc-rar,.kcard.sm .kc-seal,.kcard.sm .kc-fade{display:none}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;justify-items:center}
.kslot{display:block}
.card-reveal{display:flex;justify-content:center;margin:6px 0 12px}
.card-reveal .kcard{transform:scale(1.15);animation:stamp-in .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp-in{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:scale(1.15)}}
.card-def{font-size:15px;line-height:1.75}
.pts{padding-left:20px;margin:6px 0;color:var(--washi2);font-size:14px}
.pts li{margin:3px 0}
.new-card{color:var(--kin);font-weight:700}
.kstat{font-size:12px;color:var(--mist)}

/* 題目 */
.q{animation:q-in .25s ease-out}
@keyframes q-in{from{opacity:0;transform:translateY(6px)}}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.q-card{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--washi2)}
.q-card b{display:grid;place-items:center;width:26px;height:26px;border-radius:4px;background:var(--washi);color:#1d2340;font:700 16px var(--f-brush)}
.combo{order:3;margin-left:auto;font:700 14px var(--f-num);color:#FF8A3D}
.q-kind{font-size:12px;padding:1px 8px;border-radius:20px;border:1px solid var(--ai4);color:var(--mist)}
.q-prompt{font:700 19px/1.5 var(--f-brush);margin:4px 0}
.q-sub{color:var(--mist);font-size:13px;margin:0 0 8px}
.q-timer{height:4px;background:var(--ai3);border-radius:2px;overflow:hidden;margin:6px 0 8px}
.q-timer i{display:block;height:100%;width:100%;background:var(--sky);transition:width .1s linear}
.q-timer i.low{background:var(--shu)}
.q-chart{position:relative;margin:4px -16px 0;border-top:1px solid var(--ai3);border-bottom:1px solid var(--ai3)}
.q-chart canvas{display:block;width:100%;touch-action:pan-y}
.q-meta{position:absolute;left:10px;top:4px;font:500 11px var(--f-num);color:var(--mist);pointer-events:none}
.q-tools{display:flex;gap:8px;margin-top:8px}
.tool{padding:6px 10px;border-radius:8px;border:1px solid var(--kin);color:var(--kin);font-size:13px;font-weight:700}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--ai4);background:var(--ai2);font-size:15px;line-height:1.5;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--jade);background:rgba(61,187,143,.16)}
.opt.wrong{border-color:var(--shu);background:rgba(226,72,61,.16)}
.opt.gone{opacity:.25;text-decoration:line-through}
.pickbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;color:var(--mist);font-size:14px}
.nudge{display:flex;gap:6px}
.nudge button{width:44px;height:44px;border-radius:10px;border:1px solid var(--ai4);background:var(--ai2);font-size:15px;color:var(--washi2)}
.nudge button:active{background:var(--ai3)}
.pickbar .btn{width:auto;margin:0;flex:none;padding:10px 22px}
.pickbar span{flex:1 1 100%}
.pickbar .confirm{margin-left:auto}
.q-res{margin-top:14px;padding:14px;border-radius:12px;background:var(--ai2);border-left:4px solid var(--mist)}
.is-ok .q-res{border-left-color:var(--jade)}.is-bad .q-res{border-left-color:var(--shu)}
.verdict{font:700 26px/1 var(--f-brush)}
.is-ok .verdict{color:var(--jade)}.is-bad .verdict{color:var(--shu)}
.why{font-size:14px;line-height:1.75;color:var(--washi2)}
.pts-line{font:600 15px var(--f-num);color:var(--washi2)}
.taunt{color:var(--shu);font-family:var(--f-brush)}
.trial-hud{font:600 13px var(--f-num);color:var(--mist);margin-bottom:8px}

/* 闖關 */
.mode-lobby{text-align:left}
.lobby-art{width:96px;height:96px;display:grid;place-items:center;margin:8px 0 12px;border-radius:50%;background:radial-gradient(circle,#2a1b26,#120c18);box-shadow:0 0 0 2px var(--shu),0 0 30px rgba(226,72,61,.35)}
.lobby-art span{font:700 52px/1 var(--f-brush);color:var(--shu)}
.run-hud{display:flex;align-items:flex-end;gap:14px}
.acct{flex:1}.acct span{font-size:12px;color:var(--mist)}.acct b{display:block;font:700 26px/1.1 var(--f-num)}
.acct .bar{height:8px;margin-top:4px}
.floor{display:flex;align-items:baseline;gap:2px;color:var(--mist)}.floor b{font:700 34px/1 var(--f-num);color:var(--washi)}
.relics{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 12px}
.relic{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--kin);color:var(--kin);font:700 14px var(--f-brush)}
.tools-txt{font-size:12px;color:var(--mist)}
.gold{margin-left:auto;font:600 13px var(--f-num);color:var(--kin)}
.monster{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:12px;border-radius:12px;background:linear-gradient(90deg,rgba(226,72,61,.12),transparent);border:1px solid rgba(226,72,61,.35)}
.monster.elite{border-color:var(--violet,#B07CE8);background:linear-gradient(90deg,rgba(176,124,232,.14),transparent)}
.monster.boss{border-color:var(--shu);border-width:2px;background:linear-gradient(90deg,rgba(226,72,61,.25),transparent)}
.m-glyph{display:grid;place-items:center;width:48px;height:48px;border-radius:10px;background:#1a0f17;color:var(--shu);font:700 30px var(--f-brush)}
.m-name{font:700 16px var(--f-brush)}
.m-hp{display:flex;gap:4px;margin-top:4px}
.m-hp i{width:14px;height:8px;border-radius:2px;background:var(--ai3)}.m-hp i.on{background:var(--shu)}
.doors{display:grid;gap:10px}
.door{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:14px;border-radius:12px;background:var(--ai2);border:1px solid var(--ai3);text-align:left}
.door b{grid-row:1/3;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:2px solid var(--ai4);font:700 26px var(--f-brush)}
.door span{font-weight:700;font-size:16px}.door small{color:var(--mist)}
.door-elite b{border-color:#B07CE8;color:#B07CE8}.door-boss b{border-color:var(--shu);color:var(--shu)}
.door-rest b{border-color:var(--jade);color:var(--jade)}.door-shop b{border-color:var(--kin);color:var(--kin)}
.door-fight b{color:var(--washi)}
.death{text-align:center;padding-top:28px}
.death-stamp{display:inline-block;margin:10px 0 18px;padding:6px 18px;border:5px solid var(--shu);color:var(--shu);font:700 54px/1 var(--f-brush);transform:rotate(-10deg);animation:slam .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(2.4) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(-10deg)}}

/* 排位 */
.tier-badge{display:grid;place-items:center;width:110px;height:110px;margin:6px 0 10px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--tc)}
.tier-badge span{font:700 30px var(--f-brush);color:#141a2e}
.lp-bar{height:8px;border-radius:4px;background:var(--ai3);overflow:hidden;margin:8px 0}
.lp-bar i{display:block;height:100%}
.opp{display:flex;flex-direction:column;padding:10px 0;border-top:1px solid var(--ai3);border-bottom:1px solid var(--ai3);margin:10px 0}
.opp span{color:var(--mist);font-size:14px}
.hist{display:flex;gap:4px}.hist i{width:12px;height:12px;border-radius:2px}.hist i.w{background:var(--jade)}.hist i.l{background:var(--shu)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:10px}
.duel .side{display:flex;flex-direction:column}.duel .ai{align-items:flex-end;text-align:right}
.duel .side span{font-size:12px;color:var(--mist)}.duel .side b{font:700 30px/1 var(--f-num)}
.duel .me b{color:var(--jade)}.duel .ai b{color:var(--shu)}
.duel .mid{text-align:center;font:600 13px var(--f-num);color:var(--mist)}
.ai-status{display:block;color:var(--mist)}.ai-status.hot{color:var(--shu);animation:breathe .8s infinite}
.result{text-align:center}.res-big{font:700 72px/1 var(--f-brush)}.result.win .res-big{color:var(--kin)}.result.lose .res-big{color:var(--mist)}
.lp-delta{font:700 22px var(--f-num)}.promo{color:var(--kin);font:700 20px var(--f-brush)}

/* 劇情 */
.story-list .chapter{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px 4px;border-bottom:1px solid var(--ai3);text-align:left}
.ch-n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:2px solid var(--kin);color:var(--kin);font:700 18px var(--f-num)}
.chapter.clear .ch-n{background:var(--kin);color:#1a1405}
.chapter.locked{opacity:.4}
.ch-body b{display:block;font:700 16px var(--f-brush)}.ch-body small{color:var(--mist)}
.ch-prog{display:flex;gap:3px}.ch-prog i{width:8px;height:8px;border-radius:50%;background:var(--ai3)}.ch-prog i.on{background:var(--kin)}
.ch-kicker{color:var(--kin);font:700 13px var(--f-brush);margin:0}
.stages{display:grid;gap:10px;margin:16px 0}
.stage{display:grid;grid-template-columns:1fr auto;padding:14px;border-radius:12px;border:1px solid var(--ai3);background:var(--ai2);text-align:left}
.stage b{font:700 18px var(--f-brush)}.stage small{grid-column:1;color:var(--mist)}.stage span{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;color:var(--kin)}
.stage.clear{border-color:var(--kin)}.stage:disabled{opacity:.45}
.dialog{min-height:56vh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:10px}
.speaker{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sp-glyph{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--washi);color:#1d2340;font:700 30px var(--f-brush)}
.speaker.boss .sp-glyph{background:#1a0f17;color:var(--shu);box-shadow:0 0 0 2px var(--shu)}
.speaker.me .sp-glyph{background:var(--ai3);color:var(--washi)}
.speaker b{font:700 17px var(--f-brush)}
.line{font:400 19px/1.8 var(--f-brush);padding:14px 16px;border-radius:12px;background:var(--ai2);border:1px solid var(--ai3);animation:q-in .3s}
.boss-hud{display:flex;align-items:center;gap:10px}.boss-hud .monster{flex:1;margin:0}
.lives{display:flex;gap:4px}.lives i{width:14px;height:14px;transform:rotate(45deg);border-radius:2px;background:var(--ai3)}.lives i.on{background:var(--jade)}
.demo .why{margin-top:10px}

/* 彈窗、提示 */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,9,20,.6);opacity:0;transition:opacity .2s}
.modal.in{opacity:1}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:22px 18px calc(18px + var(--safe-b));border-radius:18px 18px 0 0;background:var(--ai2);border-top:1px solid var(--ai4);transform:translateY(20px);transition:transform .25s}
.modal.in .sheet{transform:none}
.sheet h3{font:700 22px var(--f-brush);margin-bottom:6px}
.row-btns{display:flex;flex-direction:column}
.row-btns .btn{text-align:left;justify-content:flex-start;font-weight:500}
.row-btns .btn.primary{justify-content:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));z-index:60;transform:translate(-50%,12px);opacity:0;padding:9px 16px;border-radius:24px;background:var(--ai3);border:1px solid var(--ai4);font-size:14px;font-weight:700;transition:all .25s;max-width:90vw;text-align:center}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast.gold{background:var(--kin);color:#1a1405;border-color:var(--kin)}
.toast.fire{background:#FF8A3D;color:#1a0d02;border-color:#FF8A3D}
.toast.dim{color:var(--mist)}
.hit-me main{animation:shake .35s}
.hit-me::after{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;box-shadow:inset 0 0 80px rgba(226,72,61,.6)}
.hit-mon .monster .m-glyph{animation:hitmon .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes hitmon{40%{transform:scale(.85) rotate(-6deg);background:var(--shu);color:#fff}}
.confetti{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:1px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){main{padding-top:24px}}
</style>
</head>

</header>
