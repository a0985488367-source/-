<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F1D"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SMC 道場">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"></head><body><title>SMC 道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a night trading desk. One phone-width column; the chart is the hero of every screen, gold is reserved for rewards (XP, rank, combo). Deliberately single dark theme. */
:root{
  --bg:#0A0F1D; --panel:#111a2e; --panel2:#17223b; --line:#25314f; --fg:#E8EDF7; --mut:#8C99B8; --dim:#56627f;
  --bull:#2CD3A3; --bear:#FF6E6E; --gold:#F5BF4F; --sel:#8E9DFF;
  --bull-a:rgba(44,211,163,.15); --bear-a:rgba(255,110,110,.15); --gold-a:rgba(245,191,79,.15); --sel-a:rgba(142,157,255,.17);
  --f-num:"Chakra Petch","Noto Sans TC",ui-monospace,monospace;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.6 var(--f-body);padding-inline:16px;padding-block:0;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-bottom:40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
button:disabled{cursor:default}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;background:var(--bg)}
.brand{font:700 18px var(--f-num);letter-spacing:.04em;display:flex;align-items:baseline;gap:6px;padding:4px 0}
.brand span{font:900 16px var(--f-body);color:var(--gold)}
.topr{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-num);padding:5px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.chip b{color:var(--gold);font-weight:700}
.icon{width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font:600 13px var(--f-num);color:var(--mut)}
.icon.on{color:var(--gold);border-color:var(--gold)}

/* type */
.eyebrow{font:600 11px var(--f-num);letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:900 30px/1.25 var(--f-body)}
.h2{font:900 22px/1.35 var(--f-body)}
.lead{color:var(--mut);margin:0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.mut{color:var(--mut)}

/* rank card */
.rank{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line)}
.badge{grid-row:span 2;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font:700 20px var(--f-num);color:var(--bg);background:var(--gold);box-shadow:0 0 0 4px var(--gold-a)}
.rank .nm{font:900 18px var(--f-body)}
.rank .nm small{font:600 12px var(--f-num);color:var(--mut);margin-left:6px}
.xpbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);transition:width .6s ease}
.xpline{display:flex;justify-content:space-between;font:600 11px var(--f-num);color:var(--mut);grid-column:2}

/* hero chart */
.hero{border-radius:14px;background:var(--panel);border:1px solid var(--line);padding:10px 10px 6px;position:relative}
.hero .cap{position:absolute;left:14px;bottom:12px;font:700 13px var(--f-body);color:var(--fg);background:rgba(10,15,29,.78);padding:4px 10px;border-radius:6px;border:1px solid var(--line);transition:opacity .3s}

/* mode cards */
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.mode:hover{border-color:var(--sel);transform:translateY(-1px)}
.mode .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--panel2)}
.mode b{display:block;font:900 17px var(--f-body)}
.mode span{display:block;font-size:13px;color:var(--mut);line-height:1.45}
.mode .meta{font:600 12px var(--f-num);color:var(--gold);text-align:right;white-space:nowrap}

/* chapter list */
.chap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.ch:disabled{opacity:.4}
.ch .no{font:700 18px var(--f-num);color:var(--sel)}
.ch b{display:block;font:700 16px var(--f-body)}
.ch i{display:block;font:500 12px var(--f-num);font-style:normal;color:var(--mut)}
.ch.cur{border-color:var(--sel);box-shadow:0 0 0 3px var(--sel-a)}
.stars{display:inline-flex;gap:5px}
.star{width:14px;height:14px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:var(--line)}
.star.on{background:var(--gold)}
.stars.big{gap:12px}.stars.big .star{width:42px;height:42px}
.stars.big .star.on{animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both}
.stars.big .star:nth-child(2){animation-delay:.18s}.stars.big .star:nth-child(3){animation-delay:.36s}
@keyframes starIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}

/* chart */
.cbox{border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:8px 8px 4px;position:relative}
.chead{display:flex;justify-content:space-between;align-items:center;font:600 11px var(--f-num);color:var(--mut);padding:0 4px 4px;gap:8px}
.chead .tf{color:var(--sel)}
.chead .htf{padding:2px 8px;border-radius:999px;font-weight:700}
.htf.bull{background:var(--bull-a);color:var(--bull)}.htf.bear{background:var(--bear-a);color:var(--bear)}
.mini{display:grid;grid-template-columns:1fr 1.1fr;gap:8px;align-items:stretch}
svg.chart{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.chart text{font-family:var(--f-num)}
.ax{font-size:9px;fill:var(--dim)}
.grid{stroke:var(--line);stroke-width:.6}
.cd line{stroke-width:1.2}
.cd.up line{stroke:var(--bull)}.cd.up rect{fill:var(--bull)}
.cd.dn line{stroke:var(--bear)}.cd.dn rect{fill:var(--bear)}
.cd.new{animation:cdIn .28s ease-out both;transform-box:fill-box;transform-origin:bottom}
@keyframes cdIn{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
.cd.dim{opacity:.35}
.col-sel{fill:var(--sel-a);stroke:var(--sel);stroke-width:1}
.col-ok{fill:var(--bull-a);stroke:var(--bull);stroke-width:1}
.col-no{fill:var(--bear-a);stroke:var(--bear);stroke-width:1}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(142,157,255,.06)}
.z-bull{fill:var(--bull-a)}.z-bear{fill:var(--bear-a)}.z-sel{fill:var(--sel-a)}.z-gold{fill:var(--gold-a)}.z-mut{fill:rgba(140,153,184,.1)}
.zb-bull{stroke:var(--bull)}.zb-bear{stroke:var(--bear)}.zb-sel{stroke:var(--sel)}.zb-gold{stroke:var(--gold)}.zb-mut{stroke:var(--mut)}
.zb{fill:none;stroke-width:.8;stroke-dasharray:2 2}
.ln{stroke-width:1.2;fill:none}
.ln.dash{stroke-dasharray:4 3}
.l-bull{stroke:var(--bull)}.l-bear{stroke:var(--bear)}.l-sel{stroke:var(--sel)}.l-gold{stroke:var(--gold)}.l-mut{stroke:var(--mut)}.l-fg{stroke:var(--fg)}
.lb{font-size:10px;font-weight:700;paint-order:stroke;stroke:var(--panel);stroke-width:3.2px;stroke-linejoin:round}
.t-bull{fill:var(--bull)}.t-bear{fill:var(--bear)}.t-sel{fill:var(--sel)}.t-gold{fill:var(--gold)}.t-mut{fill:var(--mut)}.t-fg{fill:var(--fg)}
.ann{animation:annIn .35s ease both}
@keyframes annIn{from{opacity:0}to{opacity:1}}
.tag rect{rx:3px}.tag text{font-size:9.5px;font-weight:700;fill:var(--bg)}
.tg-bull{fill:var(--bull)}.tg-bear{fill:var(--bear)}.tg-gold{fill:var(--gold)}.tg-sel{fill:var(--sel)}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;font:700 16px var(--f-body);background:var(--sel);color:var(--bg);transition:transform .1s,filter .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.gold{background:var(--gold)}
.btn.bull{background:var(--bull)}.btn.bear{background:var(--bear)}
.btn.wide{width:100%}
.btn small{font:600 12px var(--f-num);opacity:.75}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);line-height:1.45;font-weight:500;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--sel)}
.opt.ok{border-color:var(--bull);background:var(--bull-a)}
.opt.no{border-color:var(--bear);background:var(--bear-a)}
.opt:disabled:not(.ok):not(.no){opacity:.5}
.bopt{min-height:64px;border-radius:14px;font:900 17px var(--f-body);background:var(--panel2);border:1px solid var(--line);padding:8px}
.bopt.ok{background:var(--bull);color:var(--bg);border-color:var(--bull)}
.bopt.no{background:var(--bear);color:var(--bg);border-color:var(--bear)}

/* quiz chrome */
.qtop{display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:5px;flex:1}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--bull)}.dots i.no{background:var(--bear)}.dots i.cur{background:var(--sel)}
.hearts{display:flex;gap:4px}
.heart{width:16px;height:14px;background:var(--bear);clip-path:path('M8 14 L1.3 7.2 A3.9 3.9 0 0 1 8 2.4 A3.9 3.9 0 0 1 14.7 7.2 Z')}
.heart.off{background:var(--line)}
.heart.lose{animation:lose .6s ease both}
@keyframes lose{30%{transform:scale(1.5)}100%{transform:scale(1)}}
.prompt{font:700 17px/1.5 var(--f-body)}
.hint{font-size:13px;color:var(--mut)}
.fb{padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.fb .st{font:900 18px var(--f-body)}
.fb .st.ok{color:var(--bull)}.fb .st.no{color:var(--bear)}
.fb p{margin:0}
.fb .why{color:var(--mut);font-size:14px}
.kw{color:var(--gold);font-weight:700}

/* lesson */
.story{min-height:5.2em;padding:14px 16px;border-radius:12px;background:var(--panel2);border-left:3px solid var(--gold);font-size:16px;line-height:1.65}
.story.in{animation:annIn .4s ease both}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--gold);width:20px;border-radius:4px}

/* replay */
.bal{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.bal .v{font:700 26px var(--f-num)}
.bal .d{font:700 14px var(--f-num)}
.up{color:var(--bull)}.down{color:var(--bear)}
.rlog{display:flex;gap:4px}
.rlog i{width:20px;height:20px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font:700 10px var(--f-num);font-style:normal}
.rlog i.w{background:var(--bull-a);border-color:var(--bull);color:var(--bull)}
.rlog i.l{background:var(--bear-a);border-color:var(--bear);color:var(--bear)}
.rlog i.s{color:var(--mut)}
.rlog i.cur{border-color:var(--sel)}

/* blitz */
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--sel);transition:width .1s linear}
.timer.low i{background:var(--bear)}
.bstat{display:flex;justify-content:space-between;align-items:baseline}
.bstat .sc{font:700 30px var(--f-num)}
.combo{font:700 15px var(--f-num);color:var(--gold);min-height:1.4em}
.blitz.fever .cbox{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-a),0 0 30px rgba(245,191,79,.18)}
.count{font:700 96px var(--f-num);text-align:center;color:var(--gold);padding:60px 0;animation:cnt 1s ease both}
@keyframes cnt{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(1)}}

/* results */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.stat b{display:block;font:700 22px var(--f-num)}
.stat span{font-size:12px;color:var(--mut)}
.center{text-align:center;align-items:center}

.skrow{display:grid;grid-template-columns:8.2em 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;color:var(--fg)}
.skrow:last-child{border-bottom:0}
.skrow.link{cursor:pointer}.skrow.link:hover .skn{color:var(--sel)}
.skn{font-size:13.5px;font-weight:500;min-width:0}
.skbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:0}
.skbar i{display:block;height:100%;border-radius:5px;transition:width .6s ease}
.lv-bad i,.lg.lv-bad{background:var(--bear)}.lv-mid i,.lg.lv-mid{background:var(--gold)}.lv-good i,.lg.lv-good{background:var(--bull)}.lv-none i{background:var(--dim)}
.lv-t-bad{color:var(--bear)}.lv-t-mid{color:var(--gold)}.lv-t-good{color:var(--bull)}.lv-t-none{color:var(--dim)}
.sknum{font:600 12.5px var(--f-num);font-variant-numeric:tabular-nums;color:var(--fg);text-align:right;white-space:nowrap}
.sknum small{color:var(--mut);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mut);padding-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}.lg{display:inline-block;width:10px;height:10px;border-radius:3px}
.weakbox{border-color:rgba(245,191,79,.45);background:linear-gradient(135deg,rgba(245,191,79,.07),var(--panel))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.tog b{font-weight:500}.tog span{font:600 12px var(--f-num)}
.tog.on{border-color:var(--sel);background:var(--sel-a);box-shadow:0 0 0 2px var(--sel-a)}
details.mis{border-top:1px solid var(--line);padding:10px 0}
details.mis summary{display:flex;gap:8px;align-items:flex-start;cursor:pointer;list-style:none;font-size:14px;line-height:1.5}
details.mis summary::-webkit-details-marker{display:none}
details.mis summary .chip{flex:none;font-size:11px;padding:2px 8px}
details.mis p{margin:8px 0 0;font-size:13.5px;color:var(--mut)}
details.mis p.mut{color:var(--bear)}
button.chip{cursor:pointer}
.inv{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gc{color:var(--gold);font-weight:700}
.stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.stages:before{content:"";position:absolute;left:40px;top:20px;bottom:20px;width:3px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 14px)}
.stg{position:relative;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.stg:disabled{opacity:.45}
.stg.boss{border-color:rgba(185,139,255,.6);background:linear-gradient(135deg,rgba(185,139,255,.12),var(--panel))}
.smon{width:64px;height:64px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;overflow:hidden}
.smon .msvg{width:56px;height:56px}
.smon .lock{font:700 26px var(--f-num);color:var(--dim)}
.sinfo{display:flex;flex-direction:column;min-width:0}
.sinfo i{font:600 11px var(--f-num);font-style:normal;color:var(--mut);letter-spacing:.06em}
.sinfo b{font:900 17px var(--f-body)}
.sinfo span{font-size:12px;color:var(--mut);line-height:1.4}
.smeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.smeta small{color:var(--mut);font-size:11px}
.bigmon{width:150px;height:150px;animation:bob 2.4s ease-in-out infinite}.bigmon .msvg{width:100%;height:100%}
.bigmon.dead{filter:grayscale(1);opacity:.5;transform:rotate(-12deg);animation:none}
.advcard{border-color:rgba(54,211,165,.5);background:linear-gradient(135deg,rgba(54,211,165,.10),var(--panel))}
.advcard .ic .msvg{width:40px;height:40px}
.arena{position:relative;height:190px;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 75% 30%,color-mix(in srgb,var(--mc) 22%,transparent),transparent 60%),linear-gradient(180deg,#18223D,#0F1629);border:1px solid var(--line)}
.arena:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.07));border-top:1px solid rgba(255,255,255,.08)}
.arena.rage{box-shadow:inset 0 0 0 2px rgba(255,110,110,.6),0 0 24px rgba(255,110,110,.25)}
.fighter{position:absolute;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
.fighter b{font:700 11px var(--f-body);color:var(--mut);white-space:nowrap}
.fighter.you{left:6%}.hsvg{width:110px;height:84px;animation:bob 1.6s ease-in-out infinite}
.mon{right:6%}.mon .msvg{width:118px;height:118px;animation:bob 2s ease-in-out infinite}
.bossm .msvg{width:136px;height:136px}
.mbar{width:110px;height:8px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.mbar i{display:block;height:100%;background:var(--bear);transition:width .4s ease}
.hp .heart{width:13px;height:12px}
.hearts{display:flex;gap:3px}
@keyframes bob{50%{transform:translateY(-5px)}}
.lunge{animation:lunge .45s ease}@keyframes lunge{40%{transform:translateX(90px)}}
.atk{animation:atk .45s ease}@keyframes atk{40%{transform:translateX(-90px) scale(1.06)}}
.hit .msvg{animation:hitf .45s ease}@keyframes hitf{0%,100%{filter:none;transform:none}20%{filter:brightness(2.4);transform:translateX(8px)}50%{transform:translateX(-6px)}}
.hurt .hsvg{animation:hitf .45s ease}
.die{animation:die .8s ease forwards}@keyframes die{to{transform:scale(.2) rotate(40deg);opacity:0}}
.redflash{animation:rf .4s ease}@keyframes rf{30%{box-shadow:inset 0 0 60px rgba(255,110,110,.7)}}
.slash{position:absolute;right:8%;bottom:40px;width:120px;height:120px;pointer-events:none;opacity:0;z-index:3;background:linear-gradient(135deg,transparent 45%,#fff 49%,var(--gold) 51%,transparent 55%)}
.slash.go{animation:sl .35s ease-out}@keyframes sl{0%{opacity:0;transform:translate(-30px,-30px) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translate(30px,30px) scale(1.1)}}
.fxl{position:absolute;inset:0;pointer-events:none;z-index:4}
.dmg{position:absolute;font:700 26px var(--f-num);color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:dm 1.1s ease-out forwards}
.dmg.m{right:18%;top:30px}.dmg.h{left:14%;top:40px}
.dmg.crit{color:var(--gold);font-size:34px}.dmg.hurt{color:var(--bear)}.dmg.heal{color:var(--bull);font-size:20px}
.dmg.tag{font:900 16px var(--f-body);color:var(--gold);top:8px;right:12%}

function D(st){return st.x.dir}
function bc(d){return d>0?'bull':'bear'}
function pivMarks(st,neutral){
  return G.labels(st).map(function(v){
    var c=neutral?'mut':(v.lb==='HH'||v.lb==='HL')?'bull':(v.lb==='LH'||v.lb==='LL')?'bear':'mut';
    return mark(v.i,v.p,neutral?(v.t==='H'?'高':'低'):v.lb,v.t==='H'?'up':'down',c);
  });
}
function rdir(){return pick([1,-1])}
function ok(t,y){return {t:t,ok:!!y}}

/* 1 ─ structure */
function qTrend(){
  var k=pick(['up','down','range']),st=k==='range'?G.sRange():G.sTrend(k==='up'?1:-1);
  return {skill:'structure',st:st,type:'choice',prompt:'這段 '+st.x.tf+' 走勢是什麼結構？',
    options:[ok('上升結構：HH + HL',k==='up'),ok('下降結構：LH + LL',k==='down'),ok('盤整：高低點沒有方向',k==='range')],
    bopts:[ok('上升',k==='up'),ok('下降',k==='down'),ok('盤整',k==='range')],
    reveal:{ann:pivMarks(st)},
    why:k==='up'?'高點一個比一個高（HH），低點也一個比一個高（HL），買方掌控。':k==='down'?'高點一個比一個低（LH），低點也一個比一個低（LL），賣方掌控。':'高低點忽高忽低，沒有連續墊高或壓低。盤整時先別急，等區間被突破再判斷方向。',
    brief:k==='range'?'高低點沒有連續方向':'看高低點是一路'+(k==='up'?'墊高':'壓低')};
}
function qHL(){
  var d=rdir(),st=G.sTrend(d),L=G.labels(st),want=d>0?'L':'H',tg=null;
  L.forEach(function(v){if(v.t===want)tg=v});
  var nm=d>0?'HL':'LH';
  return {skill:'structure',st:st,type:'candle',answer:[tg.i],
    prompt:d>0?'上升結構中，點出「最近的 HL」（更高的低點）。':'下降結構中，點出「最近的 LH」（更低的高點）。',
    judge:function(v){var f=L.filter(function(x){return x.i===v})[0];
      if(!f)return '這根不是擺動點。擺動點是一波走勢轉折的頂或底。';
      if(f.lb===nm)return '這是比較早的 '+nm+'，要找最近的那一個。';
      return '這根是 '+f.lb+'，不是 '+nm+'。';},
    reveal:{ann:pivMarks(st).concat([line(tg.p,tg.i,null,d>0?'多頭防線':'空頭防線',bc(d),{below:d>0})])},
    why:'最近的 '+nm+' 是'+(d>0?'多':'空')+'方的防線。只要它沒被收盤突破，結構就還成立；一旦被收盤突破，就是 CHoCH（下一章）。'};
}
/* 2 ─ BOS / CHoCH */
function breakPre(st){var d=D(st);return [line(st.hP.p,st.hP.i,null,d>0?'前高':'前低','mut'),line(st.lP.p,st.lP.i,null,d>0?'最近 HL':'最近 LH','mut',{below:d>0})]}
function breakMark(st){var d=D(st),bd=st.kind==='bos'?d:-d,c=st.C[st.conf];return mark(st.conf,bd>0?c.h:c.l,st.kind==='bos'?'BOS':'CHoCH',bd>0?'up':'down',bc(bd))}
function breakWhy(st){var d=D(st);
  return st.kind==='bos'?'收盤突破'+(d>0?'前高':'前低')+'，順著原本的'+(d>0?'上升':'下降')+'方向，這是 BOS，趨勢延續。':
    '收盤突破的是反方向的'+(d>0?'最近 HL':'最近 LH')+'。'+(d>0?'多':'空')+'方的防線被破，這是 CHoCH，結構可能轉向。'}
function qBreak(){
  var st=G.sBreak(rdir(),pick(['bos','choch'])),b=st.kind==='bos';
  return {skill:'break',st:st,type:'choice',pre:breakPre(st),prompt:'最後一段收盤突破了哪條線？這叫什麼？',
    options:[ok('BOS：順著趨勢突破，趨勢延續',b),ok('CHoCH：反方向突破，結構轉變',!b),ok('兩條線都沒有被收盤突破',false)],
    bopts:[ok('BOS',b),ok('CHoCH',!b)],
    reveal:{ann:[breakMark(st)]},why:breakWhy(st),brief:b?'順勢破前高/前低 = BOS':'反向破防線 = CHoCH'};
}
function qBreakClick(){
  var st=G.sBreak(rdir(),pick(['bos','choch'])),d=D(st),bd=st.kind==='bos'?d:-d;
  return {skill:'break',st:st,type:'candle',pre:breakPre(st),answer:[st.conf],
    prompt:'哪一根 K 線用「收盤」確認了突破？',
    judge:function(v){var c=st.C[v],ext=bd>0?c.h:c.l;
      if(v>st.conf)return '這根在突破之後了，要找第一根收盤越過線的。';
      if(G.gt({dir:bd},ext,st.lvl))return '這根只有影線穿過，收盤沒站穩，不算確認。';
      return '這根的收盤還沒越過那條線。';},
    reveal:{ann:[breakMark(st)]},why:breakWhy(st)+' 判斷一律看收盤，影線刺穿不算。'};
}
/* 3 ─ liquidity */
function liqReveal(st){var d=D(st),U=st.x.U;return [line(st.eq,st.e1.i,null,d>0?'Equal Highs':'Equal Lows','mut',{below:d<0}),zone(st.eq,st.eq+d*2.2*U,st.e1.i,null,d>0?'BSL 買方流動性':'SSL 賣方流動性','gold',{lpos:d>0?'top':'bot'})]}
function qLiq(){
  var d=rdir(),st=G.sEq(d),U=st.x.U,r=[st.eq-d*.12*U,st.eq+d*2.4*U];
  return {skill:'liq',st:st,type:'price',range:[Math.min(r[0],r[1]),Math.max(r[0],r[1])],include:[st.eq+d*3.2*U],
    prompt:d>0?'點出買方流動性（BSL）最集中的價位。':'點出賣方流動性（SSL）最集中的價位。',
    judge:function(p){return G.gt({dir:d},st.eq,p)?'這個價位在等'+(d>0?'高':'低')+'點的內側。止損單和突破單是掛在等'+(d>0?'高點上方':'低點下方')+'。':'太遠了。止損單會緊貼在等'+(d>0?'高':'低')+'點外側。'},
    reveal:{ann:liqReveal(st)},
    why:d>0?'兩個幾乎一樣高的高點，空單止損和追突破的買單都擠在它上方，形成買方流動性 BSL，價格常被吸過去。':'兩個幾乎一樣低的低點，多單止損和追空的單都擠在它下方，形成賣方流動性 SSL，價格常被吸過去。'};
}
function qLiqSide(){
  var d=rdir(),st=G.sEq(d);
  return {skill:'liq',st:st,type:'choice',prompt:'這張圖最明顯的流動性池在哪一側？',
    options:[ok('上方：等高點外面的買方流動性',d>0),ok('下方：等低點外面的賣方流動性',d<0)],
    bopts:[ok('上方 BSL',d>0),ok('下方 SSL',d<0)],
    reveal:{ann:liqReveal(st)},why:'等'+(d>0?'高':'低')+'點是散戶最愛放止損的地方，越明顯的平頂/平底，流動性越多。',brief:'看平頂或平底在哪'};
}
/* 4 ─ sweep */
function sweepPre(st){return [line(st.eq,st.e1.i,null,D(st)>0?'等高點':'等低點','mut',{below:D(st)<0})]}
function sweepMark(st){var d=D(st),c=st.C[st.ev];return mark(st.ev,d>0?c.h:c.l,st.real?'真突破':'Sweep',d>0?'up':'down',st.real?bc(d):'gold')}
function qSweep(){
  var d=rdir(),st=G.sSweep(d,false);
  return {skill:'sweep',st:st,type:'candle',pre:sweepPre(st),answer:[st.ev],
    prompt:'哪一根 K 線掃蕩了等'+(d>0?'高':'低')+'點的流動性？',
    judge:function(v){if(v===st.e1.i||v===st.e2.i)return '這是等'+(d>0?'高':'低')+'點本身，還沒有刺穿。';if(v>st.ev)return '這根在掃蕩之後，是反轉的部分。';return '這根沒有刺穿等'+(d>0?'高':'低')+'點。'},
    reveal:{ann:[sweepMark(st)]},
    why:'影線刺穿等'+(d>0?'高':'低')+'點、收盤卻收回來：外面的單被吃光，推力用完，價格隨即反向。這就是流動性掃蕩。'};
}
function qSweepReal(){
  var d=rdir(),real=Math.random()<.5,st=G.sSweep(d,real);
  return {skill:'sweep',st:st,type:'choice',pre:sweepPre(st),vis:Math.min(st.C.length,st.ev+3),
    prompt:'價格衝過等'+(d>0?'高':'低')+'點了。這是？',
    options:[ok('流動性掃蕩：收盤收回，假突破',!real),ok('真突破：收盤站穩在外面',real)],
    bopts:[ok('掃蕩',!real),ok('真突破',real)],
    reveal:{vis:st.C.length,ann:[sweepMark(st)]},
    why:real?'收盤站在等'+(d>0?'高':'低')+'點外面，回測也守住，這是真突破。':'只有影線穿出去，收盤又收回來，是掃蕩。看完後價格就反向了。',brief:real?'收盤站穩 = 真突破':'收盤收回 = 掃蕩'};
}
/* 5 ─ order block */
function obAnn(st){var d=D(st),ob=st.C[st.obI],c=st.C[st.brk],r=st.C[st.ret];
  return [zone(ob.l,ob.h,st.obI,null,d>0?'看漲 OB':'看跌 OB',bc(d),{border:true}),mark(st.brk,d>0?c.h:c.l,'BOS',d>0?'up':'down',bc(d)),mark(st.ret,d>0?r.l:r.h,'回測',d>0?'down':'up','gold')]}
function qOB(){
  var d=rdir(),st=G.sOB(d);
  return {skill:'ob',st:st,type:'candle',vis:st.impEnd+1,slots:st.C.length,answer:[st.obI],
    prompt:d>0?'強勢上攻突破了前高。哪一根是看漲 Order Block？':'強勢下殺跌破了前低。哪一根是看跌 Order Block？',
    judge:function(v){var c=st.C[v],opp=d>0?c.c<c.o:c.c>c.o;
      if(v>st.obI)return '這根是位移本身。OB 在位移開始之前。';
      if(opp)return '後面還有一根'+(d>0?'下跌':'上漲')+' K 線。OB 要選位移前「最後」一根。';
      return (d>0?'看漲 OB 要找下跌（陰）K 線。':'看跌 OB 要找上漲（陽）K 線。');},
    reveal:{vis:st.C.length,ann:obAnn(st)},
    why:'位移（又大又快、突破結構）之前的最後一根'+(d>0?'下跌':'上漲')+' K 線就是 OB。價格回到這裡時，常見'+(d>0?'買':'賣')+'盤再次接手。'};
}
function qOBDir(){
  var d=rdir(),st=G.sOB(d),ob=st.C[st.obI];
  return {skill:'ob',st:st,type:'choice',vis:st.impEnd+1,slots:st.C.length,pre:[zone(ob.l,ob.h,st.obI,st.impEnd,'?','sel',{border:true})],
    prompt:'框起來的這根是哪一種 Order Block？',
    options:[ok('看漲 OB：回測時找買點',d>0),ok('看跌 OB：回測時找賣點',d<0)],
    bopts:[ok('看漲 OB',d>0),ok('看跌 OB',d<0)],
    reveal:{vis:st.C.length,ann:obAnn(st)},why:'它之後是一段強勢'+(d>0?'上漲':'下跌')+'並突破結構，所以是'+(d>0?'看漲':'看跌')+' OB。',brief:'看它後面的位移往哪走'};
}
/* 6 ─ FVG */
function fvgAnn(st){var d=D(st),g=st.gap,r=st.C[st.ret];return [zone(g.bot,g.top,g.i-1,null,'FVG','gold',{border:true,lpos:d>0?'bot':'top'}),{t:'col',i:g.i-1,cls:'sel'},{t:'col',i:g.i+1,cls:'sel'},mark(st.ret,d>0?r.l:r.h,'回補',d>0?'down':'up','gold')]}
function qFVG(){
  var d=rdir(),st=G.sFVG(d);
  return {skill:'fvg',st:st,type:'candle',vis:st.impEnd+1,slots:st.C.length,answer:st.all.filter(function(i){return i<st.impEnd}),
    prompt:'這段'+(d>0?'上攻':'下殺')+'留下了'+(d>0?'看漲':'看跌')+' FVG。點出造成缺口的「中間那根」K 線。',
    judge:function(v){return '這根前一根和後一根的影線有重疊，中間沒有缺口。'},
    reveal:{vis:st.C.length,ann:fvgAnn(st)},
    why:'中間那根'+(d>0?'爆發上漲':'爆發下跌')+'，讓前一根的'+(d>0?'高點':'低點')+'和後一根的'+(d>0?'低點':'高點')+'之間沒有重疊，這段價格只有單邊成交。價格常回來補一部分再走。'};
}
function qFVGDir(){
  var d=rdir(),st=G.sFVG(d),g=st.gap;
  return {skill:'fvg',st:st,type:'choice',vis:st.impEnd+1,slots:st.C.length,pre:[zone(g.bot,g.top,g.i-1,st.impEnd,'?','sel',{border:true})],
    prompt:'框起來的缺口是？',
    options:[ok('看漲 FVG：價格回補時可能有支撐',d>0),ok('看跌 FVG：價格回補時可能有壓力',d<0)],
    bopts:[ok('看漲 FVG',d>0),ok('看跌 FVG',d<0)],
    reveal:{vis:st.C.length,ann:fvgAnn(st)},why:'缺口由一根'+(d>0?'大陽線':'大陰線')+'造成，所以是'+(d>0?'看漲':'看跌')+' FVG。',brief:'看造成缺口的那根往哪衝'};
}
/* 7 ─ premium / discount */
function pdPre(st){var a=st.sw;return [line(st.hi,Math.min(a[0],a[1]),null,'Swing High','mut'),line(st.lo,Math.min(a[0],a[1]),null,'Swing Low','mut',{below:true}),line(st.mid,Math.min(a[0],a[1]),null,'50% EQ','sel',{right:true})]}
function pdZones(st){var a=Math.min(st.sw[0],st.sw[1]);return [zone(st.hi,st.mid,a,null,'溢價區 Premium','bear',{rlab:true}),zone(st.mid,st.lo,a,null,'折價區 Discount','bull',{lpos:'bot',rlab:true})]}
function qPD(){
  var d=rdir(),st=G.sPD(d,pick(['p','d']));
  return {skill:'pd',st:st,type:'price',pre:pdPre(st),range:d>0?[st.lo,st.mid]:[st.mid,st.hi],
    prompt:d>0?'想在這段上漲之後做多，應該等價格回到哪裡？點一個價位。':'想在這段下跌之後做空，應該等價格反彈到哪裡？點一個價位。',
    judge:function(p){if(p<st.lo||p>st.hi)return '已經超出波段範圍，結構可能被破壞了。';return '這是'+(p>st.mid?'溢價':'折價')+'區，'+(d>0?'做多會買得比較貴。':'做空會賣得比較便宜。')},
    reveal:{ann:pdZones(st)},
    why:d>0?'做多要在 50% 以下的折價區買，成本低、止損近、盈虧比好。':'做空要在 50% 以上的溢價區賣，賣得貴、止損近、盈虧比好。'};
}
function qPDChoice(){
  var d=rdir(),st=G.sPD(d,pick(['p','d'])),n=st.C.length;
  return {skill:'pd',st:st,type:'choice',pre:pdPre(st).concat([{t:'dot',i:n-1,p:st.last,cls:'gold'}]),
    prompt:'現在價格（金色點）在哪個區域？',
    options:[ok('溢價區：50% 以上',st.prem),ok('折價區：50% 以下',!st.prem)],
    bopts:[ok('溢價區',st.prem),ok('折價區',!st.prem)],
    reveal:{ann:pdZones(st)},why:'現在價格在 50% 線'+(st.prem?'上方，是溢價區，適合找空、不適合追多。':'下方，是折價區，適合找多、不適合追空。'),brief:'看在 50% 線上方還是下方'};
}
/* 8 ─ full setup */
function setupAnn(st,withPos,side){
  var d=D(st),C=st.C,a=[];
  a.push(line(st.lq.p,st.lq.i,st.swI,d>0?'SSL':'BSL','gold',{below:d>0}));
  a.push(mark(st.swI,st.sw,'Sweep',d>0?'down':'up','gold'));
  a.push(line(st.lh.p,st.lh.i,st.choch>=0?st.choch:st.decI,d>0?'LH':'HL','mut',{below:d<0}));
  if(st.choch>=0){var c=C[st.choch];a.push(mark(st.choch,d>0?c.h:c.l,'CHoCH',d>0?'up':'down',bc(d)))}
  else{var pv=st.piv[7];a.push(mark(pv.i,pv.p,'沒有 CHoCH',d>0?'up':'down','mut'))}
  if(st.variant!=='nochoch'){var ob=C[st.swI];a.push(zone(ob.l,ob.h,st.swI,st.decI,'OB',bc(d),{border:true,lpos:d>0?'top':'bot'}))}
  if(withPos&&side){var R=st.R;a.push({t:'pos',i:st.decI,entry:st.entry,sl:st.entry-side*R,tp:st.entry+side*2*R,label:side>0?'做多':'做空'})}
  return a;
}
function setupWhy(st){var d=D(st),L=d>0?'多':'空';
  if(st.variant==='good')return '1h 偏'+L+'，15m 先掃掉'+(d>0?'下方':'上方')+'流動性，再收盤突破 '+(d>0?'LH':'HL')+' 形成 CHoCH，最後回測 OB。四個條件到齊，是標準的做'+L+'劇本。';
  if(st.variant==='counter')return '15m 的形狀很漂亮，但 1h 是偏'+(d>0?'空':'多')+'的。逆著大週期的訊號，常常只是大級別裡的小反彈。高週期方向是硬性過濾，這筆應該觀望。';
  return '價格雖然掃了流動性，但反彈只有影線刺過 '+(d>0?'LH':'HL')+'，收盤沒站上去，沒有 CHoCH。結構沒確認就進場，等於在猜。';}
function qSetup(variant){
  var d=rdir(),st=G.sSetup(d,variant),h=G.htfChart(st.htf,st.x);
  return {skill:(variant==='counter'?'mtf':variant==='nochoch'?'break':'setup'),st:st,htf:h,type:'choice',vis:st.decI+1,slots:st.C.length,
    prompt:'看 1h 方向和 15m 走勢。價格回到這個位置，你要？',
    options:[ok('做多',st.ans==='long'),ok('做空',st.ans==='short'),ok('觀望',st.ans==='skip')],
    reveal:{vis:st.C.length,ann:setupAnn(st,st.ans!=='skip',st.ans==='long'?1:-1)},why:setupWhy(st)};
}
function qSetupOB(){
  var d=rdir(),st=G.sSetup(d,'good'),h=G.htfChart(d,st.x),imp=st.piv[7].i;
  return {skill:'ob',st:st,htf:h,type:'candle',vis:imp+1,slots:st.C.length,answer:[st.swI],
    prompt:'掃蕩之後出現 CHoCH。點出用來進場的 Order Block。',
    judge:function(v){if(v>st.swI)return '這根是 CHoCH 的位移本身，OB 在它之前。';return '還不夠晚。OB 是位移前最後一根'+(d>0?'下跌':'上漲')+' K 線，這裡剛好也是掃蕩那根。'},
    reveal:{vis:st.decI+1,ann:setupAnn(st)},
    why:'掃蕩那根同時是位移前最後一根'+(d>0?'下跌':'上漲')+' K 線，所以它就是 OB。等價格回測這裡進場，止損放在掃蕩'+(d>0?'低點下方':'高點上方')+'。'};
}

 {n:'流動性',en:'Liquidity',build:function(){return [qLiq(),qLiqSide(),qLiq(),qLiqSide(),qLiq()]}},
 {n:'流動性掃蕩',en:'Liquidity Sweep',build:function(){return [qSweep(),qSweepReal(),qSweep(),qSweepReal(),qSweepReal()]}},
 {n:'Order Block',en:'Order Block',build:function(){return [qOB(),qOBDir(),qOB(),qOBDir(),qOB()]}},

(function(){

    a.push(zone(f.bot,f.top,Math.min.apply(null,f.is)-1,null,'② 遠','gold',{border:true,rlab:true}));}

}

  if(st.variant==='A')return W(d,'① 在 50% 以上的溢價區，做多會買太貴','① 在 50% 以下的折價區，做空會賣太便宜')+'，而且 ① 和 ② 之間有一個明顯的擺動'+W(d,'低','高')+'點，那裡是流動性。價格先掃掉它、穿過 ①，到 ② 才真正反彈。掛 ① 的人被打止損。';
  return '① 本身就在 50% '+W(d,'以下的折價區','以上的溢價區')+'，① 和 ② 之間只有一根小回檔，沒有明顯的流動性。價格回到 ① 就反彈了，掛 ② 的單根本等不到成交。';}

}

function earlyReveal(st,withPos){var d=st.x.dir,C=st.C,c=C[st.imp],a=[line(st.lq.p,st.lq.i,st.swI,W(d,'SSL','BSL'),'gold',{below:d>0}),mark(st.swI,st.sw,'Sweep',W(d,'down','up'),'gold'),mark(st.imp,W(d,c.h,c.l),'這裡之後才是時機',W(d,'up','down'),bc(d))];
  if(withPos)a.push({t:'pos',i:st.decI,entry:st.entry,sl:st.entry-d*st.R,tp:st.entry+d*2*st.R,label:'急著'+W(d,'做多','做空')});return a}
function earlyWhy(st){var d=st.x.dir;return '1h 偏'+W(d,'多','空')+'沒錯，但 15m '+W(d,'下方','上方')+'那個明顯的'+W(d,'低','高')+'點還沒被掃。大家的止損都放在它'+W(d,'下面','上面')+'，那正是大資金要的流動性。價格先掃掉止損再走：方向對了，時機錯了，一樣虧錢。'}

window.LESSONS.push(

var LS=[{k:'long',t:'做多',c:'bull'},{k:'skip',t:'觀望',c:'ghost'},{k:'short',t:'做空',c:'bear'}];
var SK={good:'setup',counter:'mtf',nochoch:'break',early:'timing',dfvgA:'dfvg',dfvgB:'dfvg'};
var TAG={good:'標準劇本',counter:'多週期方向',nochoch:'結構確認',early:'進場時機',dfvgA:'雙 FVG',dfvgB:'雙 FVG'};
function round(type){
  var d=G.pick([1,-1]),st,R={type:type,tag:TAG[type],skill:SK[type]};
  if(type==='dfvgA'||type==='dfvgB'){
    st=G.sDFVG(d,type==='dfvgA'?'A':'B');
    R.opts=[{k:'near',t:'掛 ① 近',c:'sel'},{k:'skip',t:'觀望',c:'ghost'},{k:'far',t:'掛 ② 遠',c:'gold'}];
    R.prompt='兩個 FVG 區，限價單掛哪個？';R.pre=dfPre(st);
    R.order=function(k){return k==='skip'?null:dfPos(st,k)};
    R.result=function(k){return st.sim[k]};
    R.reveal=function(){return dfReveal(st).concat([dfPos(st,st.ans)])};
    R.why=dfWhy(st);
  }else{
    st=type==='early'?G.sEarly(d):G.sSetup(d,type);
    R.opts=LS;R.prompt='決策點：你要怎麼做？';R.pre=type==='early'?[line(st.lq.p,st.lq.i,null,W(d,'前低','前高'),'mut',{below:d>0})]:[];
    R.order=function(k){if(k==='skip')return null;var s=k==='long'?1:-1;return {t:'pos',i:st.decI,entry:st.entry,sl:st.entry-s*st.R,tp:st.entry+s*2*st.R,label:s>0?'做多':'做空'}};
    R.result=function(k){return st.sim[k]};
    R.reveal=function(){var a=st.ans==='long'?1:st.ans==='short'?-1:0;return type==='early'?earlyReveal(st,false):Q.setupAnn(st,!!a,a)};
    R.why=type==='early'?earlyWhy(st):Q.setupWhy(st);
  }
  R.st=st;R.htf=G.htfChart(st.htf,st.x);R.ans=st.ans;R.decI=st.decI;
  R.label=function(k){var o=R.opts.filter(function(x){return x.k===k})[0];return o?o.t:k};
  return R;
}

function confetti(n){if(RM)return;var cs=['#F5BF4F','#2CD3A3','#FF6E6E','#8E9DFF','#E8EDF7'];
  for(var i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,r:Math.random()*6+3,c:cs[i%5],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120+Math.random()*40});
  if(!raf)loop();}
function loop(){cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(function(p){return p.life>0});
  parts.forEach(function(p){p.vy+=.3;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.globalAlpha=Math.min(1,p.life/40);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});

function heroLoop(){
  var timer=0,alive=true;onLeave(function(){alive=false;clearTimeout(timer)});

    if(!alive)return;

    var v=6;

      if(!alive)return;v++;

      if(v>st.swI){ann=all.slice(0,2);txt='掃蕩！'+(d>0?'下方':'上方')+'流動性被吃掉'}

function lesson(ci){

    '<button class="btn ghost wide" id="skip" type="button" style="min-height:40px;font-size:14px">直接開始測驗</button>');

function quiz(ci){
  var qs=Q.CH[ci].build(),S={i:0,hearts:3,res:[],xp:0};
  function ask(){
    var q=qs[S.i],locked=false,sel=null;window.__q=q;
    var dots=qs.map(function(_,i){return '<i class="'+(S.res[i]===true?'ok':S.res[i]===false?'no':i===S.i?'cur':'')+'"></i>'}).join('');
    var hearts='';for(var i=0;i<3;i++)hearts+='<span class="heart'+(i<S.hearts?'':' off')+'"></span>';
    var ctl='';
    if(q.type==='choice')ctl='<div class="opts">'+q.options.map(function(o,i){return '<button class="opt" type="button" data-o="'+i+'">'+o.t+'</button>'}).join('')+'</div>';
    else ctl='<p class="hint">'+(q.type==='candle'?'在圖上點一根 K 線，再按確認。':'在圖上點一個價位，再按確認。')+'</p><button class="btn wide" id="conf" type="button" disabled>確認</button>';
    var el=screen('<div class="qtop"><button class="icon" id="quit" type="button" aria-label="離開">✕</button><div class="dots">'+dots+'</div><div class="hearts" id="hearts">'+hearts+'</div></div>'+
      (q.htf?htfBox('qh',q.htf):'')+cbox('qc',q.st)+'<h2 class="prompt">'+q.prompt+'</h2><div id="ctl">'+ctl+'</div><div id="fb"></div>');
    if(q.htf)new Chart($('#qh'),{st:q.htf,h:100,noTag:true});
    var ch=new Chart($('#qc'),{st:q.st,vis:q.vis||q.st.C.length,slots:q.slots,ann:q.pre||[],include:q.include,h:250,
      pick:q.type==='choice'?null:q.type,onPick:function(v){sel=v;$('#conf').disabled=false;SFX.tick()}});window.__ch=ch;
    $('#quit').onclick=academy;
    function finish(good,msg){
      locked=true;S.res[S.i]=good;window.Stats&&Stats.rec(q.skill,good,q,good?'':msg);
      var box=$('#qcBox');
      if(good){SFX.ok();S.xp+=20;addXP(20);floatTxt('+20 XP',box);box.classList.add('flash-ok')}
      else{SFX.bad();S.hearts--;shake(box);var hs=document.querySelectorAll('.heart');var hh=hs[S.hearts];if(hh){hh.classList.add('off','lose')}}
      var rv=q.reveal||{},to=rv.vis||q.st.C.length,set={pick:null,ann:(q.pre||[]).concat(rv.ann||[])};
      if(q.type==='candle'){set.ok=q.answer;if(!good)set.no=sel;set.sel=null}
      if(q.type==='price'){set.okZone=q.range;set.selCls=good?'bull':'bear'}
      ch.set(set);
      var stop=stream(ch,to,90);onLeave(stop);
      var last=S.hearts<=0||S.i===qs.length-1;
      $('#fb').innerHTML='<div class="fb"><p class="st '+(good?'ok':'no')+'">'+(good?G.pick(['答對了！','漂亮！','正確！','看得很準！']):'答錯了')+'</p>'+
        (msg?'<p>'+msg+'</p>':'')+'<p class="why">'+q.why+'</p><button class="btn wide" id="nx" type="button">'+(S.hearts<=0?'查看結果':last?'完成本章':'下一題 →')+'</button></div>';
      $('#nx').onclick=function(){if(S.hearts<=0||S.i===qs.length-1)result();else{S.i++;ask()}};
      setTimeout(function(){var f=$('#fb');f&&f.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'})},120);
    }
    if(q.type==='choice')el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
      if(locked)return;var o=q.options[+b.dataset.o];
      el.querySelectorAll('.opt').forEach(function(x){x.disabled=true;if(q.options[+x.dataset.o].ok)x.classList.add('ok')});
      if(!o.ok)b.classList.add('no');finish(o.ok,'')}});
    else $('#conf').onclick=function(){if(locked||sel==null)return;
      var good=q.type==='candle'?q.answer.indexOf(sel)>=0:(sel>=q.range[0]&&sel<=q.range[1]);
      $('#ctl').innerHTML='';finish(good,good?'':q.judge(sel))};
  }
  function result(){
    var fail=S.hearts<=0,n=fail?0:S.hearts,prev=save.stars[ci]||0,ok=S.res.filter(function(r){return r}).length,bonus=0;
    if(!fail){bonus=Math.max(0,n-prev)*40+20;save.stars[ci]=Math.max(prev,n);persist();addXP(bonus)}
    var nextOpen=!fail&&ci<Q.CH.length-1;
    screen('<div class="stack center"><p class="eyebrow">第 '+(ci+1)+' 章 · '+Q.CH[ci].n+'</p><h2 class="h1">'+(fail?'能量用完了':n===3?'完美通關！':'通關！')+'</h2>'+

      '<div class="stack" style="width:100%">'+(nextOpen?'<button class="btn gold wide" id="nxt" type="button">下一章：'+Q.CH[ci+1].n+'</button>':'')+
      (ci===Q.CH.length-1&&!fail?'<button class="btn gold wide" id="rp" type="button">去回放實戰試試身手</button>':'')+
      '<div class="duo"><button class="btn ghost" id="again" type="button">'+(fail?'重看圖解':'換一批題目')+'</button><button class="btn ghost" id="toA" type="button">回學院</button></div></div></div>');
    if(!fail){SFX.win();if(n===3)confetti(120)}
    var b;if((b=$('#nxt')))b.onclick=function(){lesson(ci+1)};if((b=$('#rp')))b.onclick=window.Replay;
    $('#again').onclick=function(){fail?lesson(ci):quiz(ci)};$('#toA').onclick=academy;
  }
  ask();
}

    '<p class="why">連對 3 題 ×1.5，連對 5 題進入<span class="kw">狂熱模式</span> ×2，連對 8 題 ×3。答錯扣 3 秒並中斷連擊。</p>'+

    '<button class="btn gold wide" id="go" type="button">開始</button><button class="btn ghost wide" id="bk" type="button">回首頁</button>');

function countdown(){
  var n=3,el=A.screen('<div class="count num" id="cnt">3</div>'),t;SFX.tick();
  t=setInterval(function(){n--;if(n<=0){clearInterval(t);play();return}var c=$('#cnt');c.textContent=n;c.style.animation='none';void c.offsetWidth;c.style.animation='';SFX.tick()},800);

}
function play(){
  var B={t:60,score:0,combo:0,max:0,n:0,ok:0,over:false,lock:false},tm;

    '<div class="timer" id="tb"><i style="width:100%"></i></div><div id="qa"></div></div>');

  function upd(){var t=Math.max(0,B.t);$('#tt').textContent=t.toFixed(1);$('#tb i').style.width=(t/60*100)+'%';$('#tb').classList.toggle('low',t<=10);
    $('#sc').textContent=B.score;$('#cb').textContent=B.combo>=2?'連擊 ×'+B.combo+(mult()>1?'  ·  '+mult()+'倍':''):'';$('#bz').classList.toggle('fever',B.combo>=5)}

    if(B.over)return;

    qa.innerHTML=A.cbox('bc',q.st)+'<h2 class="prompt" id="bp" style="margin:12px 0">'+q.prompt+'</h2><div class="'+(ops.length===3?'trio':'duo')+'">'+ops.map(function(o,i){return '<button class="bopt" type="button" data-o="'+i+'">'+o.t+'</button>'}).join('')+'</div>';
    var ch=new Chart($('#bc'),{st:q.st,vis:q.vis||q.st.C.length,slots:q.slots,ann:q.pre||[],h:220});
    qa.querySelectorAll('.bopt').forEach(function(b){b.onclick=function(){
      if(B.lock||B.over)return;B.lock=true;B.n++;
      var o=ops[+b.dataset.o];
      qa.querySelectorAll('.bopt').forEach(function(x){if(ops[+x.dataset.o].ok)x.classList.add('ok')});
      var rv=q.reveal||{};ch.set({ann:(q.pre||[]).concat(rv.ann||[]),vis:rv.vis||ch.o.vis});
      window.Stats&&Stats.rec(q.skill,o.ok,q,o.ok?'':'閃電戰選了「'+o.t+'」');
      if(o.ok){B.ok++;B.combo++;B.max=Math.max(B.max,B.combo);var pts=Math.round(100*mult());B.score+=pts;SFX.combo(B.combo);A.floatTxt('+'+pts,b);if(B.combo===5){A.toast('狂熱模式！分數 ×2');A.confetti(60)}upd();setTimeout(next,550)}
      else{b.classList.add('no');B.combo=0;B.t-=3;SFX.bad();A.shake($('#bcBox'));A.floatTxt('−3 秒',b,true);
        $('#bp').innerHTML='<span style="color:var(--bear)">✕</span> '+(q.brief||'');upd();setTimeout(next,1500)}
    }});

    A.screen('<div class="stack center"><p class="eyebrow">閃電戰 · 時間到</p><h2 class="h1 num" style="font-size:54px;color:var(--gold)">'+B.score+'</h2><p class="lead">'+(best?'新紀錄！':'最高分 '+A.save.bestBlitz)+'</p>'+
      '<div class="statgrid" style="width:100%"><div class="stat"><b class="num">'+B.ok+' / '+B.n+'</b><span>答對</span></div><div class="stat"><b class="num">×'+B.max+'</b><span>最高連擊</span></div><div class="stat"><b class="num">'+xp+'</b><span>獲得 XP</span></div></div>'+
      '<div class="duo" style="width:100%"><button class="btn gold" id="again" type="button">再玩一次</button><button class="btn ghost" id="hm" type="button">回首頁</button></div></div>');
    SFX.win();if(best)A.confetti(150);

/* Diagnostic test, skill analysis page, weakness drill, and the shared runner for single + multi-step questions. */
(function(){
var A=window.App,$=A.$,G=window.G,Q=window.Q,SFX=A.SFX,ST=window.Stats,QB=window.QB,SK=ST.SK;
function pct(v){return Math.round(v*100)+'%'}
function lvl(a){return a==null?'none':a<.6?'bad':a<.8?'mid':'good'}

/* ── runner ── */
function runList(items,cfg){
  var i=0,tally={},pts=0,tot=0;
  function T(sk,ok){var t=tally[sk]||(tally[sk]={n:0,ok:0});t.n++;if(ok)t.ok++;tot++;if(ok)pts++}
  function show(){
    var q=items[i],steps=q.multi?q.steps:[q],k=0,sel=null,locked=false;window.__dq=q;
    var prog=Math.round(i/items.length*100);
    var el=A.screen('<div class="qtop"><button class="icon" id="quit" type="button" aria-label="離開">✕</button><div class="dots"><i class="cur" style="flex:none;width:'+prog+'%;background:var(--sel)"></i><i style="flex:1"></i></div><span class="num mut" style="font-size:12px">'+(i+1)+' / '+items.length+'</span></div>'+
      '<div class="row wrap" id="tags"></div>'+(q.htf?A.htfBox('dh',q.htf,q.hideHtf||!!A.save.hard):'')+A.cbox('dc',q.st)+
      '<h2 class="prompt" id="dp"></h2><div id="ctl"></div><div id="fb"></div>');

    var inc=[];steps.forEach(function(s){(s.include||[]).forEach(function(p){inc.push(p)})});
    var ch=new Chart($('#dc'),{st:q.st,vis:q.vis||q.st.C.length,slots:q.slots,ann:q.pre||[],include:inc,h:250});window.__dch=ch;
    $('#quit').onclick=cfg.quit||A.home;
    function step(){
      var s=steps[k];sel=null;locked=false;window.__ds=s;
      $('#tags').innerHTML=(q.multi?'<span class="chip" style="color:var(--gold);border-color:var(--gold)">綜合題 · 步驟 '+(k+1)+' / '+steps.length+'</span>':'')+'<span class="chip">'+SK[s.skill]+'</span>';
      $('#dp').innerHTML=s.prompt;$('#fb').innerHTML='';
      ch.set({pick:s.type==='choice'?null:s.type,sel:null,selP:null,okZone:null,ok:null,no:null,onPick:function(v){sel=v;var c=$('#conf');if(c)c.disabled=false;SFX.tick()}});
      if(s.type==='choice'){
        $('#ctl').innerHTML='<div class="opts">'+s.options.map(function(o,j){return '<button class="opt" type="button" data-o="'+j+'">'+o.t+'</button>'}).join('')+'</div>';
        document.querySelectorAll('#ctl .opt').forEach(function(b){b.onclick=function(){
          if(locked)return;var o=s.options[+b.dataset.o];
          document.querySelectorAll('#ctl .opt').forEach(function(x){x.disabled=true;if(s.options[+x.dataset.o].ok)x.classList.add('ok')});
          if(!o.ok)b.classList.add('no');answer(o.ok,o.ok?'':'你選了「'+o.t+'」')}});
      }else{
        $('#ctl').innerHTML='<p class="hint">'+(s.type==='candle'?'在圖上點一根 K 線，再按確認。':'在圖上點一個價位，再按確認。')+'</p><button class="btn wide" id="conf" type="button" disabled>確認</button>';
        $('#conf').onclick=function(){if(locked||sel==null)return;var good=s.type==='candle'?s.answer.indexOf(sel)>=0:(sel>=s.range[0]&&sel<=s.range[1]);
          $('#ctl').innerHTML='';
          var set={pick:null};if(s.type==='candle'){set.ok=s.answer;if(!good)set.no=sel;set.sel=null}else{set.okZone=s.range;set.selCls=good?'bull':'bear'}
          ch.set(set);answer(good,good?'':s.judge(sel))};
      }
    }
    function answer(good,msg){
      locked=true;var s=steps[k],box=$('#dcBox');
      ST.rec(s.skill,good,{prompt:s.prompt,why:s.why||q.why},msg);T(s.skill,good);
      if(good){SFX.ok();A.addXP(15);A.floatTxt('+15 XP',box)}else{SFX.bad();A.shake(box)}
      var last=k===steps.length-1;
      if(!last){
        $('#fb').innerHTML='<div class="fb"><p class="st '+(good?'ok':'no')+'">'+(good?'✓ 正確':'✕ 不對')+'</p>'+(msg&&!good&&s.type!=='choice'?'<p>'+msg+'</p>':'')+'<p class="why">'+(s.why||'')+'</p><button class="btn wide" id="nstep" type="button">下一步 →</button></div>';
        $('#nstep').onclick=function(){k++;step();window.scrollTo({top:0,behavior:A.RM?'auto':'smooth'})};
      }else{
        var rv=q.reveal||{};
        ch.set({pick:null,ann:(q.pre||[]).concat(rv.ann||[])});
        A.onLeave(A.stream(ch,rv.vis||q.st.C.length,80));
        var lastItem=i===items.length-1;
        $('#fb').innerHTML='<div class="fb"><p class="st '+(good?'ok':'no')+'">'+(good?G.pick(['答對了！','漂亮！','正確！']):'答錯了')+'</p>'+(msg&&s.type!=='choice'?'<p>'+msg+'</p>':'')+
          (q.multi&&s.why?'<p class="why">'+s.why+'</p>':'')+'<p class="why">'+(q.why||'')+'</p><button class="btn wide" id="nx" type="button">'+(lastItem?'查看結果':'下一題 →')+'</button></div>';
        $('#nx').onclick=function(){if(lastItem)cfg.done(tally,pts,tot);else{i++;show()}};
      }
      setTimeout(function(){var f=$('#fb');f&&f.scrollIntoView({behavior:A.RM?'auto':'smooth',block:'nearest'})},120);
    }
    step();
  }
  show();
}

/* ── bars ── */
function barRow(sk,a,extra,link){

  return '<'+tg+(link?' type="button"':'')+' class="skrow'+(link?' link':'')+'" data-sk="'+sk+'"><span class="skn">'+SK[sk]+'</span><span class="skbar lv-'+L+'"><i style="width:'+(v==null?0:Math.max(4,v*100))+'%"></i></span><span class="sknum">'+(extra!=null?extra:(a?pct(v)+' <small>· '+a.n+' 題'+(a.rn<3?' · 樣本少':'')+'</small>':'未作答'))+'</span></'+tg+'>';
}

    '<div class="fb"><p>'+(A.save.hard?'14':'12')+' 題，混合單題和<span class="kw">綜合題</span>。綜合題會在同一張圖上拆成好幾步：先看 1h 方向、再看有沒有掃流動性、有沒有收盤 CHoCH、止損放哪，最後才做決定。</p>'+

function report(tally,pts,tot){
  var rows=Object.keys(tally).map(function(sk){var t=tally[sk];return {sk:sk,acc:t.ok/t.n,t:t}}).sort(function(a,b){return a.acc-b.acc||b.t.n-a.t.n});

    '<div class="fb"><p class="st" style="font-size:15px">這次各項表現</p><div>'+rows.map(function(r){return barRow(r.sk,{acc:r.acc,n:r.t.n},r.t.ok+' / '+r.t.n)}).join('')+'</div></div>'+
    (weak.length?'<div class="fb weakbox"><p class="st" style="font-size:15px;color:var(--gold)">最需要加強</p><div class="row wrap">'+weak.map(function(s){return '<span class="chip">'+SK[s]+'</span>'}).join('')+'</div><button class="btn gold wide" id="drill" type="button">針對這 '+weak.length+' 項特訓 10 題</button></div>':'<div class="fb"><p class="st ok">全部答對！</p><p class="why">可以到能力分析看長期的正確率，或再診斷一次換一批題目。</p></div>')+

/* ── drill ── */
function pickSkill(list){
  var w=list.map(function(sk){var a=ST.acc(sk);return a&&a.rn>=3?Math.pow(1-a.sm,1.5)+.08:.5});
  var s=w.reduce(function(a,b){return a+b},0),r=Math.random()*s;
  for(var i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}return list[list.length-1];
}
function drill(skills){
  if(!skills||!skills.length)skills=ST.ORDER.slice();
  var before={};skills.forEach(function(sk){var a=ST.acc(sk);before[sk]=a?a.acc:null});
  var items=[],lastF=null;
  for(var n=0;n<10;n++){var sk=pickSkill(skills),bank=QB.bankFor?QB.bankFor(sk):QB.BANK[sk],f;var tries=0;do{f=G.pick(bank);tries++}while(f===lastF&&bank.length>1&&tries<5);lastF=f;var q=f();items.push(q)}
  runList(items,{done:function(tally,pts,tot){drillReport(skills,before,tally,pts,tot)},quit:drillPick});
}
function drillReport(skills,before,tally,pts,tot){
  A.addXP(pts*5);

    var delta=b==null||!a?'':(a.acc-b>=0?'<span class="up">▲ '+pct(a.acc-b)+'</span>':'<span class="down">▼ '+pct(b-a.acc)+'</span>');
    return barRow(sk,{acc:t.ok/t.n,n:t.n},t.ok+' / '+t.n+(delta?'　'+delta:''))}).join('');
  A.screen('<div class="stack"><p class="eyebrow">弱點特訓 · 結果</p><h2 class="h1 num">'+pts+' / '+tot+'</h2><p class="lead">這輪的判斷正確數。▲▼ 是該項近 20 題正確率的變化。</p>'+
    '<div class="fb"><div>'+rows+'</div></div>'+

/* Advanced chapters 11-14, detail-trap questions, hard mode question pools. */
(function(){
var A=window.App,G=window.G,Q=window.Q,QB=window.QB,ST=window.Stats,line=Q.line,zone=Q.zone,mark=Q.mark,bc=Q.bc;
function ok(t,y){return {t:t,ok:!!y}}
function W(d,a,b){return d>0?a:b}
function H(st){return G.htfChart(st.htf||st.x.dir,st.x)}
if(A.save.hard===undefined){A.save.hard=true;A.persist()}

Object.assign(ST.SK,{idm:'Inducement 誘導',breaker:'Breaker／IFVG',ote:'OTE 進場',amd:'Power of 3'});
['idm','breaker','ote','amd'].forEach(function(k){if(ST.ORDER.indexOf(k)<0)ST.ORDER.push(k)});
Object.assign(ST.CHOF,{idm:10,breaker:11,ote:12,amd:13});

/* ── Inducement ── */
function idmPre(st){var d=st.x.dir,a=st.ob1.c,b=st.ob2.c;return [zone(a.l,a.h,st.ob1.i,null,'① 回檔 OB','sel',{border:true,rlab:true}),zone(b.l,b.h,st.ob2.i,null,'② 起漲 OB','gold',{border:true,rlab:true,lpos:W(d,'bot','top')})]}
function idmReveal(st,pos){var d=st.x.dir,C=st.C,c=C[st.choch],a=idmPre(st).concat([line(st.idm.p,st.idm.i,null,'IDM 誘導','gold',{below:d>0}),mark(st.sweep,G.botOf(st.x,C[st.sweep]),'掃 IDM',W(d,'down','up'),'gold'),mark(st.choch,W(d,c.h,c.l),'CHoCH',W(d,'up','down'),bc(d))]);
  if(pos)a.push({t:'pos',i:st.decI,entry:st.ob2.entry,sl:st.ob2.sl,tp:st.ob2.entry+d*2*st.ob2.R,label:'掛 ②'});return a}
function idmWhy(st){var d=st.x.dir;return '① 在回檔的第一個小'+W(d,'低','高')+'點上，也就是 IDM 誘導。它'+W(d,'下面','上面')+'擠滿了急著進場的人的止損，而且還在溢價區。大資金先掃掉 IDM，① 被打穿；價格回到起漲點的 ②，出現 CHoCH 後才真正'+W(d,'上漲','下跌')+'。'}
function qIDM(){var d=G.pick([1,-1]),st=G.sIDM(d);
  return {skill:'idm',st:st,htf:H(st),type:'choice',vis:st.decI+1,slots:st.C.length,pre:idmPre(st),
    prompt:'突破結構之後回檔。'+W(d,'做多','做空')+'限價單要掛在哪個 OB？',
    options:[ok('① 回檔的第一個 OB，離現價近',false),ok('② 起漲點的 OB，等 IDM 被掃再說',true),ok('現在直接追'+W(d,'多','空'),false)],
    bopts:[ok('① 近',false),ok('② 起漲',true)],
    reveal:{vis:st.C.length,ann:idmReveal(st,true)},why:idmWhy(st),brief:'第一個回檔點是誘餌'};}
function qIDMClick(){var d=G.pick([1,-1]),st=G.sIDM(d);
  return {skill:'idm',st:st,htf:H(st),type:'candle',vis:st.decI+1,slots:st.C.length,answer:[st.idm.i],
    prompt:'點出這段回檔裡的「誘導 IDM」：突破後第一個小'+W(d,'低','高')+'點。',
    judge:function(v){if(v===st.ob2.i)return '這根是起漲點，是真正的 POI，不是誘導。';if(v<st.ob2.i)return '這根在突破之前，還沒有形成這段的回檔。';return '這根不是突破後第一個擺動'+W(d,'低','高')+'點。'},
    reveal:{vis:st.sweep+2,ann:[line(st.idm.p,st.idm.i,null,'IDM','gold',{below:d>0}),mark(st.sweep,G.botOf(st.x,st.C[st.sweep]),'掃 IDM',W(d,'down','up'),'gold')]},
    why:'IDM 是突破後回檔形成的第一個小'+W(d,'低','高')+'點。散戶會在這裡進場、止損放在它外面，所以價格常常先掃掉它，才去真正的 POI。'};}
function comboIDM(){var d=G.pick([1,-1]),st=G.sIDM(d),a=st.ob1.c,above=(a.h+a.l)/2>st.mid;
  return {multi:true,skill:'combo',st:st,htf:H(st),hideHtf:true,vis:st.decI+1,slots:st.C.length,pre:idmPre(st),
    steps:[
     {skill:'structure',type:'choice',prompt:'這段'+W(d,'上漲','下跌')+'有「收盤」突破前'+W(d,'高','低')+'（BOS）嗎？',options:[ok('有，BOS 確認',true),ok('沒有，只有影線',false)],why:'衝刺那段有 K 線收盤越過前'+W(d,'高','低')+'，結構確認。'},
     {skill:'idm',type:'candle',prompt:'點出突破後第一個小'+W(d,'低','高')+'點（IDM）。',answer:[st.idm.i],judge:function(v){return v===st.ob2.i?'這是起漲點，不是誘導。':'這根不是突破後第一個擺動點。'},why:'IDM 就是 ① 所在的那個小'+W(d,'低','高')+'點。'},
     {skill:'pd',type:'choice',prompt:'① 在這段波段 50% 的哪一側？',options:[ok('上方',above),ok('下方',!above)],why:'① 在 50% '+(above?'上方':'下方')+'。對'+W(d,'做多','做空')+'來說是'+((d>0)===above?'貴的一側，位置差。':'便宜的一側。')},
     {skill:'idm',type:'choice',prompt:'綜合以上，限價單掛哪？',options:[ok('① 回檔 OB',false),ok('② 起漲 OB',true),ok('都不掛',false)]}],
    reveal:{vis:st.C.length,ann:idmReveal(st,true)},why:idmWhy(st)};}

/* ── Breaker / IFVG ── */
function brkReveal(st,pos){var d=st.x.dir,ob=st.ob,g=st.g,a=[zone(ob.l,ob.h,st.obI,null,'Breaker',bc(-d),{border:true,rlab:true}),zone(g.bot,g.top,g.i-1,null,'IFVG',bc(-d),{rlab:true,lpos:W(d,'top','bot')})];
  var c=st.C[st.brk];a.push(mark(st.brk,W(d,c.l,c.h),'收盤'+W(d,'跌破','突破'),W(d,'down','up'),bc(-d)));
  if(pos)a.push({t:'pos',i:st.decI,entry:st.entry,sl:st.sl,tp:st.entry-d*2*st.R,label:W(d,'做空','做多')});return a}
function qBreaker(){var d=G.pick([1,-1]),st=G.sBreaker(d,'close'),ob=st.ob;
  return {skill:'breaker',st:st,htf:H(st),type:'choice',vis:st.decI+1,slots:st.C.length,pre:[zone(ob.l,ob.h,st.obI,null,'原本的'+W(d,'看漲','看跌')+' OB',bc(d),{border:true})],
    prompt:'價格反彈回原本的 OB。你要？',
    options:[ok('做多',st.ans==='long'),ok('做空',st.ans==='short'),ok('觀望',false)],
    reveal:{vis:st.C.length,ann:brkReveal(st,true)},
    why:'這個 OB 先在掃完前'+W(d,'高','低')+'之後被一根大'+W(d,'陰','陽')+'線收盤'+W(d,'跌破','突破')+'，已經失效。失效的 OB 會反過來用，叫 Breaker：原本的'+W(d,'支撐變成壓力','壓力變成支撐')+'，所以這裡要'+W(d,'做空','做多')+'。'};}
function qBreakerWick(){var d=G.pick([1,-1]),k=G.pick(['close','wick']),st=G.sBreaker(d,k),ob=st.ob,cl=k==='close';
  return {skill:'breaker',st:st,htf:H(st),type:'choice',vis:st.brk+1,slots:st.C.length,pre:[zone(ob.l,ob.h,st.obI,null,W(d,'看漲','看跌')+' OB',bc(d),{border:true})],
    prompt:'價格'+W(d,'跌','漲')+'穿了這個 OB。現在它？',
    options:[ok('失效了：收盤穿過，變成 Breaker',cl),ok('還有效：只有影線刺穿，收盤收回來',!cl)],
    bopts:[ok('變 Breaker',cl),ok('還有效',!cl)],
    reveal:{vis:st.C.length,ann:cl?brkReveal(st,false):[zone(ob.l,ob.h,st.obI,null,'OB 守住',bc(d),{border:true,rlab:true}),mark(st.brk,G.botOf(st.x,st.C[st.brk]),'只有影線',W(d,'down','up'),'gold')]},
    why:cl?'有 K 線「收盤」'+W(d,'跌破','突破')+' OB，代表這裡的'+W(d,'買','賣')+'盤被打掉了，OB 失效並翻轉成 Breaker。':'只有影線刺穿、收盤又收回 OB 裡，這比較像掃流動性，OB 還有效，價格之後照原方向走。',
    brief:cl?'收盤穿過 = 失效':'只有影線 = 還有效'};}
function qIFVG(){var d=G.pick([1,-1]),st=G.sBreaker(d,'close'),g=st.g;
  return {skill:'breaker',st:st,htf:H(st),type:'choice',vis:st.decI+1,slots:st.C.length,pre:[zone(g.bot,g.top,g.i-1,null,'FVG','sel',{border:true})],
    prompt:'這個 FVG 被一根大'+W(d,'陰','陽')+'線收盤穿過了。價格反彈回來時，它是？',
    options:[ok('還是原本的'+W(d,'支撐','壓力'),false),ok('反過來變成'+W(d,'壓力','支撐')+'（IFVG）',true)],
    bopts:[ok('原方向',false),ok('IFVG 反向',true)],
    reveal:{vis:st.C.length,ann:brkReveal(st,true)},
    why:'FVG 被收盤整個穿過，就變成反向的 IFVG。價格回測時，它的作用跟原本相反。如果只是影線刺進去，FVG 還算有效。',brief:'收盤穿過 FVG → IFVG 反向'};}

/* ── OTE ── */
function fibLines(st,ks){var a=[];ks.forEach(function(k){a.push(line(st.F(k),st.p[2].i,null,String(k),k===.705?'gold':'mut',{right:true}))});return a}
function oteZone(st){return zone(st.F(.618),st.F(.79),st.p[2].i,null,'OTE','gold',{border:true})}
function oteJudge(st){return function(p){var r=(st.hi-p)/(st.hi-st.lo);if(r<.5)return '這裡回撤不到 0.5，還在溢價區。';if(r<.618)return '已經在折價區，但還沒到 OTE（0.62 以上）。';if(r>1)return '已經超過擺動點，結構被破壞了。';return '回撤超過 0.79，太深了，接近結構失效。'}}
function qOTEClick(){var d=G.pick([1,-1]),st=G.sOTE(d,'ote'),a=st.F(.618),b=st.F(.79);
  return {skill:'ote',st:st,htf:H(st),type:'price',vis:st.p[3].i+1,slots:st.C.length,pre:fibLines(st,[0,1]),range:[Math.min(a,b),Math.max(a,b)],judge:oteJudge(st),
    prompt:'只畫了 0 和 1。自己估算，點出 OTE（回撤 0.62–0.79）裡的價位。',
    reveal:{vis:st.p[3].i+1,ann:fibLines(st,[0,.5,.618,.705,.79,1]).concat([oteZone(st)])},
    why:'從擺動'+W(d,'低','高')+'點拉到擺動'+W(d,'高','低')+'點，回撤 0.62 到 0.79 是 OTE。0.5 只是折價區的起點，0.705 是 OTE 的甜蜜點。'};}
function qOTEDepth(){var d=G.pick([1,-1]),k=G.pick(['ote','shallow','deep']),st=G.sOTE(d,k);
  return {skill:'ote',st:st,htf:H(st),type:'choice',vis:st.decI+1,slots:st.C.length,pre:fibLines(st,[0,.5,.618,.79,1]),
    prompt:'價格回檔到這裡。對'+W(d,'做多','做空')+'來說，這個位置？',
    options:[ok('只回到 0.5 附近，還不夠便宜',k==='shallow'),ok('進入 OTE，好位置',k==='ote'),ok('超過 0.79，太深，結構快失效',k==='deep')],
    bopts:[ok('不夠便宜',k==='shallow'),ok('OTE',k==='ote'),ok('太深',k==='deep')],
    reveal:{vis:st.decI+1,ann:fibLines(st,[0,.5,.618,.79,1]).concat([oteZone(st),mark(st.decI,st.p[4].p,'回撤 '+st.r.toFixed(2),W(d,'down','up'),'gold')])},
    why:k==='ote'?'回撤落在 0.62–0.79 之間，是 OTE。再配合 OB 或 FVG，就是好的進場區。':k==='shallow'?'回撤還不到 0.5，價格在溢價區，現在進場盈虧比差。可以等更深的回檔，或等小週期結構。':'回撤超過 0.79，已經很接近擺動點，再深一點結構就失效。這種位置止損空間小、失敗率高。',
    brief:k==='ote'?'0.62–0.79 = OTE':k==='shallow'?'不到 0.5 = 太貴':'超過 0.79 = 太深'};}
function qOTESL(){var d=G.pick([1,-1]),st=G.sOTE(d,'ote'),U=st.x.U,a=st.lo-d*1.2*U,b=st.lo-d*.02*U,e=st.F(.705);
  return {skill:'risk',st:st,htf:H(st),type:'price',vis:st.decI+1,slots:st.C.length,pre:fibLines(st,[0,.5,.705,1]).concat([oteZone(st)]),range:[Math.min(a,b),Math.max(a,b)],include:[st.lo-d*2*U],
    judge:function(p){if(G.gt(st.x,p,e))return '止損在進場價的'+W(d,'上方','下方')+'，方向反了。';if(G.gt(st.x,p,st.lo))return '放在擺動點裡面，回檔稍微深一點就被掃掉。要放在擺動'+W(d,'低','高')+'點外側。';return '太遠了，盈虧比會變差。擺動點外一點點就夠。'},
    prompt:'在 0.705 掛'+W(d,'多','空')+'單，止損放哪？點一個價位。',
    reveal:{vis:st.C.length,ann:fibLines(st,[0,.5,.705,1]).concat([oteZone(st),{t:'pos',i:st.decI,entry:e,sl:st.lo-d*.4*U,tp:e+d*2*Math.abs(e-(st.lo-d*.4*U)),label:'0.705'}])},
    why:'OTE 的止損放在擺動'+W(d,'低','高')+'點（fib 1）外側。價格破了它，代表這段'+W(d,'上漲','下跌')+'的結構失效。'};}
function comboOTE(){var d=G.pick([1,-1]),st=G.sOTE(d,'ote'),q1=qOTEClickFor(st),q2=qOTESLFor(st);
  return {multi:true,skill:'combo',st:st,htf:H(st),hideHtf:true,vis:st.decI+1,slots:st.C.length,pre:fibLines(st,[0,1]),
    steps:[q1,q2,{skill:'ote',type:'choice',prompt:'現在回檔落在 OTE。如果小週期也出現 CHoCH，要進場嗎？',options:[ok('要，位置和確認都到了',true),ok('不要，等它回到 0.5',false)],why:'OTE 加上小週期確認，是很典型的進場。等回到 0.5 反而是倒退。'}],
    reveal:{vis:st.C.length,ann:fibLines(st,[0,.5,.618,.705,.79,1]).concat([oteZone(st)])},why:'先算出 OTE，再把止損放在擺動點外，最後等確認進場。'};}
function qOTEClickFor(st){var a=st.F(.618),b=st.F(.79);return {skill:'ote',type:'price',prompt:'點出 OTE（回撤 0.62–0.79）裡的價位。',range:[Math.min(a,b),Math.max(a,b)],judge:oteJudge(st),why:'0.62 到 0.79 之間是 OTE。'}}
function qOTESLFor(st){var d=st.x.dir,U=st.x.U,a=st.lo-d*1.2*U,b=st.lo-d*.02*U;return {skill:'risk',type:'price',prompt:'止損放哪？點一個價位。',range:[Math.min(a,b),Math.max(a,b)],include:[st.lo-d*2*U],judge:function(p){return G.gt(st.x,p,st.lo)?'放在擺動點裡面，太容易被掃掉。':'太遠了，或方向不對。'},why:'擺動點外側一點點。'}}

/* ── Power of 3 ── */
function amdPre(st,full){var d=st.x.dir,a=[{t:'band',i1:0,i2:st.ai,label:full?'A 亞洲盤':'亞洲盤',cls:'sel'},{t:'band',i1:st.ai+1,i2:st.li,label:full?'M 倫敦盤':'倫敦盤',cls:'bear'}];
  a.push(line(st.aH,0,st.ai+2,W(d,'亞洲高','亞洲低'),'gold',{below:d<0}),line(st.aL,0,null,W(d,'亞洲低','亞洲高'),'gold',{below:d>0}),line(st.op,0,null,'開盤價','mut',{right:true}));return a}
function amdReveal(st){var d=st.x.dir,C=st.C,c=C[st.choch];return amdPre(st,true).concat([{t:'band',i1:st.li+1,i2:C.length-1,label:'D 紐約盤',cls:'bull'},mark(st.sw,G.botOf(st.x,C[st.sw]),'Sweep',W(d,'down','up'),'gold'),mark(st.choch,W(d,c.h,c.l),'CHoCH',W(d,'up','down'),bc(d))])}
function amdMarks(st){var d=st.x.dir,C=st.C,c=C[st.choch];return [{t:'band',i1:st.li+1,i2:C.length-1,label:'D 紐約盤',cls:'bull'},mark(st.sw,G.botOf(st.x,C[st.sw]),'Sweep',W(d,'down','up'),'gold'),mark(st.choch,W(d,c.h,c.l),'CHoCH',W(d,'up','down'),bc(d))]}
function amdWhy(st){var d=st.x.dir;return '亞洲盤橫盤是累積（A）。倫敦盤'+W(d,'跌破亞洲低點、跑到開盤價下面','突破亞洲高點、跑到開盤價上面')+'，掃掉止損，是操縱（M）。收盤站回並出現 CHoCH 後，紐約盤走出真正的方向，是分配（D）。'}
function qAMD(){var d=G.pick([1,-1]),st=G.sAMD(d);
  return {skill:'amd',st:st,htf:H(st),type:'choice',vis:st.decI+1,slots:st.C.length,pre:amdPre(st),
    prompt:'倫敦盤'+W(d,'跌破亞洲盤低點','突破亞洲盤高點')+'了。這最可能是？',
    options:[ok('真突破，馬上追'+W(d,'空','多'),false),ok('操縱：等收盤站回、CHoCH 後做'+W(d,'多','空'),true),ok('還在亞洲盤區間裡，繼續等',false)],

function series(){

function ma(C,n,i){var s=0,k=0;for(var j=Math.max(0,i-n+1);j<=i;j++){s+=C[j].c;k++}return s/k}

function lowN(C,i,n){var m=1e18;for(var j=i-n+1;j<=i;j++)m=Math.min(m,C[j].l);return m}
function highN(C,i,n){var m=-1e18;for(var j=i-n+1;j<=i;j++)m=Math.max(m,C[j].h);return m}

 chase:function(C,i,pos,mem){var c=C[i],big=body(c)>avgBody(C,i,10)*1.3;if(big)return c.c>c.o?1:-1;return pos},
 k:function(C,i,pos){var f=ma(C,7,i),s=ma(C,20,i),c=C[i].c;if(f>s&&c>s)return 1;if(f<s&&c<s)return -1;return pos},

   if(pos!==0){if(pos>0&&(c.l<=mem.sl||c.h>=mem.tp))return 0;if(pos<0&&(c.h>=mem.sl||c.l<=mem.tp))return 0;return pos}
   var lo=lowN(C,i-1,12),hi=highN(C,i-1,12);
   if(c.l<lo&&c.c>lo){mem.sl=c.l;mem.tp=c.c+2*(c.c-c.l);return 1}
   if(c.h>hi&&c.c<hi){mem.sl=c.h;mem.tp=c.c-2*(c.h-c.c);return -1}return 0},

     return '<div class="bt-tag"><span>'+TAGN[g.k]+'</span><span class="bt-bar"><i style="width:'+w+'%;background:'+(e>=0?'var(--bull)':'var(--bear)')+'"></i></span><span class="num">'+(e>=0?'+':'')+e.toFixed(2)+'R</span><span class="num mut">'+g.n+' 筆 '+Math.round(g.w/g.n*100)+'%</span></div>'}).join('')+'<p class="why" style="font-size:12px">R = 用止損距離當單位的報酬。+0.5R 代表平均每筆賺到半個止損距離。</p></div>':'')+

function rules(){

   '・HH／HL／LH／LL：擺動點（左右各 4 根確認，所以會晚 4 根才出現，跟實盤一樣）。<br>'+

/* ── start a run ── */
function dailyPick(){var r=rng(hash('smc-daily-'+today()));return {coin:COINS[Math.floor(r()*COINS.length)],tf:'1h',u:r()}}
function loading(msg){A.screen('<div class="fb center" style="padding:40px 16px"><div class="bt-spin"></div><p class="mut">'+msg+'</p></div>')}
function begin(mode){
  var M=MODES[mode],coin,tf,u;
  if(mode==='daily'){var d=dailyPick();coin=d.coin;tf=d.tf;u=d.u}
  else{coin=B.coin==='R'?COINS[Math.floor(Math.random()*COINS.length)]:B.coin;tf=B.tf;u=Math.random()}
  loading('載入 '+coin+' '+tf+' 歷史行情…');
  load(coin,tf).then(function(C){
    var lo=HIST+20,hi=C.length-M.bars-2,s=lo+Math.floor(u*(hi-lo));
    B.cur={mode:mode,coin:coin,tf:tf,s:s,cur:s-1,bars:M.bars,bal:START,peak:START,minEq:START,pos:null,ord:null,tr:[],day:mode==='daily'?today():null};
    if(mode==='daily'){B.daily[today()]={ret:0,done:0}}
    A.persist();play(C);
  }).catch(function(e){loadErr(e)});
}
function resume(){var r=B.cur;loading('載入 '+r.coin+' '+r.tf+' 歷史行情…');load(r.coin,r.tf).then(play).catch(loadErr)}
function loadErr(e){A.screen('<div class="fb"><p class="st no">行情資料載入失敗</p><p class="why">'+String(e&&e.message||e)+'。請確認網路連線後再試一次。</p><button class="btn wide" id="bk" type="button">回大廳</button></div>');$('#bk').onclick=lobby}

/* ── play ── */
var R,C,AN,M,ch,htfCh,tk,auto=0,lastStep=0;
function play(data){
  R=B.cur;C=data;M=MODES[R.mode];tk=null;stopAuto();
  var from=R.s-HIST,to=R.s+R.bars;
  var off=Math.max(0,from-60);AN=window.SMCA.analyze(C.slice(off,to+1),4,2);AN.off=off;
  if(R.cur<R.s)R.cur=R.s-1+1;/* first visible bar = s */

}
function A_(i){return i-AN.off}/* index into analysis arrays */
function layout(){

   '<div class="bt-top"><div><b class="num">'+R.coin+'USDT</b> <span class="pill">'+R.tf+'</span> <span class="pill">'+MODES[R.mode].n+'</span></div><span class="sp"></span><span class="num mut" id="btBar"></span></div>'+
   '<div class="bt-eq"><div class="row"><span class="mut">資金</span><b class="num" id="btBal"></b><span class="num" id="btRet"></span><span class="sp"></span><span class="pill" id="btBias"></span></div>'+(M.target?'<div class="bt-goal"><i id="btGoal"></i><span class="z0"></span></div><div class="row num mut" style="font-size:11px"><span>底線 −'+M.maxLoss*100+'%</span><span class="sp"></span><span>目標 +'+M.target*100+'%</span></div>':'')+'</div>'+
   '<div class="cbox"><div class="chead"><div class="chips bt-ov">'+[['st','結構'],['in','內部'],['fvg','FVG'],['ob','OB'],['liq','流動性']].map(function(o){return '<button class="pill'+(B.ov[o[0]]?' up':'')+'" type="button" data-ov="'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div><span class="sp"></span><button class="pill" type="button" data-z="-1">－</button><button class="pill" type="button" data-z="1">＋</button></div><div id="btC"></div><p class="bt-hint" id="btHint"></p></div>'+
   '<details class="cbox bt-htf" id="btHtfBox"'+(B.htfOpen!==0?' open':'')+'><summary class="chead"><span>大週期 '+htfName(R.tf)+'</span><span id="btHtfLab"></span></summary><div id="btH"></div></details>'+
   '<div id="btPanel"></div>'+
   '<div class="bt-ctrl"><button class="btn ghost" id="b1" type="button">下一根</button><button class="btn ghost" id="b5" type="button">×5</button><button class="btn ghost" id="bA" type="button">自動</button><button class="btn ghost" id="bX" type="button">結束</button></div>');
  ch=new window.Chart($('#btC'),{st:{C:[C[R.cur]],x:{sym:R.coin,tf:R.tf,dec:DEC[R.coin]}},vis:1,h:270,ann:[]});
  htfCh=new window.Chart($('#btH'),{st:{C:[C[R.cur]],x:{sym:R.coin,tf:htfName(R.tf),dec:DEC[R.coin]}},vis:1,h:150,ann:[],noTag:false});
  el.querySelectorAll('[data-ov]').forEach(function(b){b.onclick=function(){B.ov[b.dataset.ov]=B.ov[b.dataset.ov]?0:1;A.persist();b.classList.toggle('up');draw()}});
  el.querySelectorAll('[data-z]').forEach(function(b){b.onclick=function(){var z=[40,60,90,130],i=z.indexOf(B.zoom);i=Math.max(0,Math.min(z.length-1,(i<0?1:i)-(+b.dataset.z)));B.zoom=z[i];draw()}});
  $('#btHtfBox').addEventListener('toggle',function(){B.htfOpen=$('#btHtfBox').open?1:0;if($('#btHtfBox').open)drawHtf()});
  $('#b1').onclick=function(){stopAuto();step(1)};$('#b5').onclick=function(){stopAuto();step(5)};
  $('#bA').onclick=function(){if(auto)stopAuto();else startAuto()};
  var armed=0;$('#bX').onclick=function(){stopAuto();var b=$('#bX');if(armed){finish('提早結束');return}armed=1;b.textContent='確定？';b.classList.add('warn');setTimeout(function(){armed=0;if(b.isConnected){b.textContent='結束';b.classList.remove('warn')}},2500)};
  A.onLeave(stopAuto);
  draw();panel();
}
function startAuto(){if(tk)return;auto=setInterval(function(){step(1,true)},420);var b=$('#bA');if(b){b.textContent='暫停';b.classList.add('on')}}
function stopAuto(){if(auto){clearInterval(auto);auto=0}var b=$('#bA');if(b){b.textContent='自動';b.classList.remove('on')}}

function equity(px){var e=R.bal;if(R.pos)e+=R.pos.dir*(px-R.pos.entry)*R.pos.qty;return e}
function htfNow(){var g=HTF[R.tf][1],dt=C[1].t-C[0].t,from=Math.max(0,R.s-HIST*1.5|0);
  var H=aggregate(C.slice(from,R.cur+1),R.cur-from,g,dt);var an=window.SMCA.analyze(H,3,2);return {H:H,an:an,trend:an.trend[H.length-1]}}

/* ── draw ── */
function draw(){
  var cur=R.cur,Z=B.zoom,from=Math.max(0,cur-Z+1),win=C.slice(from,cur+1),dec=DEC[R.coin],ann=[],lo=1e18,hi=-1e18;
  win.forEach(function(k){lo=Math.min(lo,k.l);hi=Math.max(hi,k.h)});var rg=hi-lo,near=function(p){return p>lo-rg*.35&&p<hi+rg*.35};
  var X=function(i){return Math.max(0,i-from)},ai=function(i){return i+AN.off};
  var known=function(o){return ai(o.k)<=cur};
  if(B.ov.fvg){var fs=AN.fv.filter(function(f){return known(f)&&(f.fill==null||ai(f.fill)>cur)&&ai(f.i)>=from-40&&near((f.p1+f.p2)/2)}).slice(-4);
    fs.forEach(function(f){ann.push({t:'zone',p1:f.p1,p2:f.p2,from:X(ai(f.i)),cls:f.dir>0?'bull':'bear',label:'FVG',rlab:1})})}
  if(B.ov.ob){[1,-1].forEach(function(d){AN.obs.filter(function(o){return o.dir===d&&known(o)&&(o.inv==null||ai(o.inv)>cur)&&near((o.p1+o.p2)/2)}).slice(-2).forEach(function(o){ann.push({t:'zone',p1:o.p1,p2:o.p2,from:X(ai(o.i)),cls:'sel',border:1,label:d>0?'多方 OB':'空方 OB',rlab:1,lpos:d>0?'bot':null})})})}
  if(B.ov.liq){
    AN.eq.filter(function(e){return known(e)&&near(e.p)&&ai(e.i)>=from-60}).forEach(function(e){
      var sw=e.sw!=null&&ai(e.sw)<=cur;
      if(!sw)ann.push({t:'line',p:e.p,from:X(ai(e.i)),cls:'gold',label:(e.hi?'EQH':'EQL')+' $$$',right:1,below:!e.hi});
      else if(ai(e.sw)>=from)ann.push({t:'mark',i:ai(e.sw)-from,p:e.hi?C[ai(e.sw)].h:C[ai(e.sw)].l,label:'掃',cls:'gold',pos:e.hi?'up':'down'})});
    var lh=null,ll=null;AN.piv.forEach(function(p){if(!known(p))return;var sw=p.sw!=null&&ai(p.sw)<=cur;if(sw)return;if(p.hi)lh=p;else ll=p});
    if(lh&&near(lh.p))ann.push({t:'line',p:lh.p,from:X(ai(lh.i)),cls:'mut',label:'前高',right:1});
    if(ll&&near(ll.p))ann.push({t:'line',p:ll.p,from:X(ai(ll.i)),cls:'mut',label:'前低',right:1,below:1})}
  if(B.ov.st){
    AN.ev.filter(function(e){return ai(e.i)<=cur&&ai(e.i)>=from}).slice(-5).forEach(function(e){
      var lab=e.t,known2=e.t==='CHoCH'&&e.res&&ai(e.rk)<=cur;if(known2)lab=e.res>0?'CHoCH ✓':'假 CHoCH ✗';
      ann.push({t:'line',p:e.p,from:X(ai(e.from)),to:ai(e.i)-from,cls:e.t==='CHoCH'?(known2&&e.res<0?'mut':'bear'):'bull',label:lab,solid:e.t==='CHoCH',below:e.dir<0})});
    /* the latest unresolved external CHoCH: show the point that must hold */
    var lc=null;AN.ev.forEach(function(e){if(e.t==='CHoCH'&&ai(e.i)<=cur)lc=e});
    if(lc&&!(lc.res&&ai(lc.rk)<=cur)&&ai(lc.i)>cur-60&&near(lc.pp))ann.push({t:'line',p:lc.pp,from:X(ai(lc.pi)),cls:'gold',label:'保護'+(lc.dir>0?'低點':'高點')+'（破了=假CHoCH）',right:1,below:lc.dir>0});
    if(B.ov.in)AN.iev.filter(function(e){return !e.ext&&ai(e.i)<=cur&&ai(e.i)>=from}).slice(-4).forEach(function(e){ann.push({t:'line',p:e.p,from:X(ai(e.from)),to:ai(e.i)-from,cls:'mut',label:'i-'+e.t,below:e.dir<0})});
    AN.piv.filter(function(p){return known(p)&&p.lab&&ai(p.i)>=from}).slice(-8).forEach(function(p){ann.push({t:'mark',i:ai(p.i)-from,p:p.p,label:p.lab,cls:'mut',pos:p.hi?'up':'down'})})}
  /* trades */
  R.tr.forEach(function(t){if(t.x<from)return;if(t.i>=from)ann.push({t:'mark',i:t.i-from,p:t.dir>0?C[t.i].l:C[t.i].h,label:t.dir>0?'多':'空',cls:'sel',pos:t.dir>0?'down':'up'});
    ann.push({t:'mark',i:t.x-from,p:t.dir>0?C[t.x].h:C[t.x].l,label:rStr(t.R).replace('.00',''),cls:t.R>=0?'bull':'bear',pos:t.dir>0?'up':'down'})});
  var P=R.pos;if(P)ann.push({t:'pos',i:Math.max(0,P.i-from),entry:P.entry,sl:P.sl,tp:P.tp,label:(P.dir>0?'多 ':'空 ')+rStr(P.dir*(C[cur].c-P.entry)/Math.abs(P.entry-P.sl0)),tpl:'TP'});
  var O=R.ord;if(O){ann.push({t:'line',p:O.entry,cls:'sel',label:'限價'+(O.dir>0?'多':'空')+' '+fmt(O.entry,dec),solid:1,from:X(O.i)});ann.push({t:'line',p:O.sl,cls:'bear',label:'SL',from:X(O.i),right:1});ann.push({t:'line',p:O.tp,cls:'bull',label:'TP',from:X(O.i),right:1})}
  if(tk){var te=tkEntry();if(te!=null&&tk.sl!=null&&tk.tp!=null)ann.push({t:'pos',i:cur-from,entry:te,sl:tk.sl,tp:tk.tp,label:'預覽',tpl:'TP '+tkRR().toFixed(1)+'R'});
    else{if(te!=null)ann.push({t:'line',p:te,cls:'sel',label:'進場',solid:1});if(tk.sl!=null)ann.push({t:'line',p:tk.sl,cls:'bear',label:'SL',right:1})}}
  ch.set({st:{C:win,x:{sym:R.coin,tf:R.tf,dec:dec}},vis:win.length,slots:Z+6,ann:ann,pick:tk?'price':null,selP:null,onPick:onPick});
  if($('#btHtfBox')&&$('#btHtfBox').open)drawHtf();else htfInfo();
  hud();
}

  if(b){b.textContent=txt;b.className='pill'+(t>0?' up':t<0?' down':'')}if(l){l.textContent=t>0?'偏多 ↗':t<0?'偏空 ↘':'未定';l.className='pill'+(t>0?' up':t<0?' down':'')}

  }else if(R.ord){var O=R.ord;h='<div class="fb"><div class="row"><b>限價'+(O.dir>0?'多':'空')+'單等待成交</b><span class="sp"></span><span class="num mut">@ '+fmt(O.entry,dec)+'</span></div><button class="btn ghost wide" id="oX" type="button">撤單</button></div>';

  }

  p.querySelectorAll('[data-rr]').forEach(function(b){b.onclick=function(){tk.rr=b.dataset.rr==='c'?'c':+b.dataset.rr;if(tk.rr==='c')tk.step='tp';recalc();draw();panel()}});
  p.querySelectorAll('[data-rk]').forEach(function(b){b.onclick=function(){tk.risk=+b.dataset.rk;B.risk=tk.risk;panel()}});
