}
function fld(k,lab,v){return '<button class="bt-f'+(tk.step===k?' on':'')+'" data-step="'+k+'" type="button"><span>'+lab+'</span><b class="num">'+(v==null?'—':fmt(v,DEC[R.coin]))+'</b><small>'+(k==='tp'&&tk.rr!=='c'?tk.rr+'R':'點圖')+'</small></button>'}
function tkEntry(){return tk.type==='lmt'?tk.entry:C[R.cur].c}
function tkRR(){var e=tkEntry();return Math.abs(tk.tp-e)/Math.abs(e-tk.sl)}
function tkRisk(){var e=tkEntry();if(e==null||tk.sl==null||e===tk.sl)return null;var eq=equity(C[R.cur].c),r=eq*tk.risk,d=Math.abs(e-tk.sl),q=r/d,n=q*e,cap=false;
  if(n>eq*MAXLEV){n=eq*MAXLEV;q=n/e;r=q*d;cap=true}return {r:r,q:q,n:n,lev:n/eq,cap:cap}}
function recalc(){var e=tkEntry();if(e!=null&&tk.sl!=null&&tk.rr!=='c')tk.tp=e+(e-tk.sl)*tk.rr}
function openTk(dir){
  stopAuto();var cur=R.cur,px=C[cur].c,at=AN.atr[cur-AN.off],sl=null;
  /* suggest a stop just beyond the latest confirmed swing on the protective side */
  for(var i=AN.piv.length-1;i>=0;i--){var p=AN.piv[i];if(p.k+AN.off>cur)continue;
    if(dir>0&&!p.hi&&p.p<px&&px-p.p<4*at){sl=p.p-.15*at;break}if(dir<0&&p.hi&&p.p>px&&p.p-px<4*at){sl=p.p+.15*at;break}}
  if(sl==null)sl=px-dir*1.5*at;
  tk={dir:dir,type:'mkt',entry:null,sl:sl,tp:null,rr:2,risk:Math.min(B.risk||.01,M.maxRisk||.05),tag:null,step:'sl'};
  recalc();SFX.tick();draw();panel();
}
function onPick(price){
  if(!tk)return;tk[tk.step]=price;
  if(tk.step==='entry')tk.step='sl';else if(tk.step==='sl'&&tk.rr==='c')tk.step='tp';
  recalc();SFX.tick();draw();panel();
}
function submit(){
  var e=tkEntry(),px=C[R.cur].c,d=tk.dir;
  if(tk.sl==null)return panel('還沒設止損。');
  if(d>0&&!(tk.sl<e))return panel('做多的止損要在進場價下方。');
  if(d<0&&!(tk.sl>e))return panel('做空的止損要在進場價上方。');
  if(tk.tp==null||(d>0&&!(tk.tp>e))||(d<0&&!(tk.tp<e)))return panel('止盈要在進場價的獲利方向。');
  if(tk.type==='lmt'){if(d>0&&e>=px)return panel('多單限價要掛在現價下方（等回踩）。要追價請用市價。');if(d<0&&e<=px)return panel('空單限價要掛在現價上方（等反彈）。要追價請用市價。')}
  var rk=tkRisk();if(!rk)return panel('止損不能等於進場價。');
  var at=AN.atr[R.cur-AN.off],h=htfNow().trend,mt=AN.trend[R.cur-AN.off];
  var base={dir:d,entry:e,sl:tk.sl,sl0:tk.sl,tp:tk.tp,qty:rk.q,tag:tk.tag||'other',atr:at,htf:h,mt:mt,rr:tkRR(),risk:rk.r,cap:rk.cap};
  if(tk.type==='mkt'){openPos(base,px,FEE_T,R.cur);SFX.cash()}
  else{base.i=R.cur;R.ord=base;SFX.tick();A.toast('限價單已掛出')}
  tk=null;A.persist();draw();panel();
}
function openPos(o,fill,fee,i){
  var P=Object.assign({},o);P.entry=fill;P.i=i;P.fee=fill*P.qty*fee;R.bal-=P.fee;
  /* keep the planned risk honest when a limit fills at a better price than planned */
  P.risk=Math.abs(P.entry-P.sl0)*P.qty;R.pos=P;
}
function closePos(px,why,manual){
  var P=R.pos;if(!P)return;var fee=px*P.qty*(why==='止盈'?FEE_M:FEE_T),pnl=P.dir*(px-P.entry)*P.qty-fee;
  R.bal+=pnl;var tot=pnl-P.fee+(P.realized||0),risk0=Math.abs(P.entry-P.sl0)*(P.qty0||P.qty);
  var tr={dir:P.dir,i:P.i,x:R.cur,entry:P.entry,exit:px,sl:P.sl0,tp:P.tp,R:tot/risk0,pnl:tot,why:why,tag:P.tag,atr:P.atr,htf:P.htf,mt:P.mt,rr:P.rr,be:P.be?1:0,cap:P.cap?1:0};
  R.tr.push(tr);R.pos=null;
  if(manual){SFX.tick()}else if(tr.R>0){SFX.ok()}else SFX.bad();
  A.toast(why+'　'+rStr(tr.R)+'　'+(tr.pnl>=0?'+':'-')+money(Math.abs(tr.pnl)));
  A.persist();
}
function halfClose(){var P=R.pos,px=C[R.cur].c;if(!P||P.half)return;var q=P.qty/2,fee=px*q*FEE_T,pnl=P.dir*(px-P.entry)*q-fee;
  R.bal+=pnl;P.realized=(P.realized||0)+pnl;P.qty0=P.qty;P.qty=q;P.half=1;SFX.cash();A.toast('平倉一半　'+(pnl>=0?'+':'-')+money(Math.abs(pnl)));A.persist()}

/* ── advance bars ── */
function step(n,isAuto){
  if(tk)return;
  for(var s=0;s<n;s++){
    if(R.cur>=R.s+R.bars-1){finish('時間到');return}
    R.cur++;var k=C[R.cur],ev=false;
    var O=R.ord;
    if(O){var hit=O.dir>0?k.l<=O.entry:k.h>=O.entry;
      if(hit){var gap=O.dir>0?k.o<O.entry:k.o>O.entry,fill=gap?k.o:O.entry;R.ord=null;openPos(O,fill,gap?FEE_T:FEE_M,R.cur);A.toast('限價單成交');SFX.cash();ev=true;
        /* the bar that fills can also stop us out; only count TP on the fill bar if the stop was never touched */
        var P=R.pos;if(P.dir>0?k.l<=P.sl:k.h>=P.sl){closePos(P.sl,'止損')}else if(P.dir>0?k.c>=P.tp:k.c<=P.tp){closePos(P.tp,'止盈')}}}
    else if(R.pos){var P2=R.pos,slHit=P2.dir>0?k.l<=P2.sl:k.h>=P2.sl,tpHit=P2.dir>0?k.h>=P2.tp:k.l<=P2.tp;
      if(slHit){var gp=P2.dir>0?k.o<P2.sl:k.o>P2.sl;closePos(gp?k.o:P2.sl,P2.be&&P2.sl===P2.entry?'保本出場':'止損');ev=true}
      else if(tpHit){var gt=P2.dir>0?k.o>P2.tp:k.o<P2.tp;closePos(gt?k.o:P2.tp,'止盈');ev=true}}
    var eq=equity(k.c);R.peak=Math.max(R.peak,eq);R.minEq=Math.min(R.minEq,eq);
    if(M.maxLoss&&eq<=START*(1-M.maxLoss)){if(R.pos)closePos(k.c,'強制平倉');draw();finish('爆倉線');return}
    if(M.target&&!R.pos&&R.bal>=START*(1+M.target)){draw();finish('達標');return}
    if(ev){if(isAuto)stopAuto();break}
  }
  A.persist();draw();panel();
}

/* ── finish & review ── */
function metrics(r){
  var T=r.tr,n=T.length,w=T.filter(function(t){return t.R>0}).length,gp=0,gl=0,sr=0,eq=START,pk=START,mdd=0;
  T.forEach(function(t){sr+=t.R;if(t.pnl>0)gp+=t.pnl;else gl-=t.pnl;eq+=t.pnl;pk=Math.max(pk,eq);mdd=Math.max(mdd,(pk-eq)/pk)});
  mdd=Math.max(mdd,(r.peak-r.minEq)/r.peak);
  return {n:n,w:w,wr:n?w/n:0,R:sr,avgR:n?sr/n:0,pf:gl?gp/gl:(gp?99:0),mdd:mdd,ret:r.bal/START-1}}
function coach(r){
  var T=r.tr,out=[],M2=MODES[r.mode];
  if(!T.length){out.push(['觀望整局','一筆都沒做。耐心是好事，但回測的目的就是練「找到 A+ 機會就出手」。下次試著至少找一個掃流動性＋CHoCH 的位置。']);return out}
  var tight=T.filter(function(t){return Math.abs(t.entry-t.sl)<.6*t.atr});
  if(tight.length)out.push(['止損太近',tight.length+' 筆的止損距離小於 0.6 根 ATR，'+tight.filter(function(t){return t.R<0}).length+' 筆被打掉。正常波動就會掃到。止損放在擺動高低點（流動性）外面，再用風險 % 縮小倉位。']);
  var ctr=T.filter(function(t){return t.htf&&t.htf!==t.dir});
  if(ctr.length){var cw=ctr.filter(function(t){return t.R>0}).length,wr=Math.round(cw/ctr.length*100);out.push(['逆大週期',ctr.length+' 筆跟 '+HTF[r.tf][0]+' 結構方向相反，勝率 '+wr+'%。'+(wr>=50?'這次逆勢有賺，但樣本太少，長期來看逆勢單勝率通常較低；做之前要先看到小週期 CHoCH 確認。':'大週期定方向、小週期找進場，逆勢單要等 CHoCH 確認。')])}
  var low=T.filter(function(t){return t.rr<1.5});
  if(low.length)out.push(['盈虧比偏低',low.length+' 筆計畫盈虧比低於 1.5R。勝率要超過 40% 才打平，盡量把目標放在對面的流動性（前高前低、EQH/EQL）。']);
  if(T.length>r.bars/12)out.push(['交易太頻繁',r.bars+' 根裡做了 '+T.length+' 筆。SMC 的好機會不常出現，等「掃流動性 → 結構轉向 → 回踩 FVG/OB」三件事都到位再進。']);
  var man=T.filter(function(t){return t.why==='手動平倉'&&t.R>0&&t.R<1});
  if(man.length>=2)out.push(['太早下車',man.length+' 筆小賺就手動平倉。設好的止盈要給它時間，或改成「平一半＋止損移保本」。']);
  var tg=T.filter(function(t){return t.tag==='other'}).length;
  if(tg===T.length&&T.length>1)out.push(['沒標進場理由','每筆都選「其他」。標上進場理由，大廳就能統計哪一種進場最適合你。']);
  var good=T.filter(function(t){return t.R>=1.5});
  if(good.length)out.push(['做得好',good.length+' 筆拿到 1.5R 以上。'+(good[0].tag!=='other'?'像「'+TAGN[good[0].tag]+'」這種進場值得多練。':'')]);
  if(!out.length)out.push(['穩','沒有明顯壞習慣。繼續累積樣本數，30 筆以上的統計才有意義。']);
  return out}
function finish(why){
  stopAuto();tk=null;if(R.pos)closePos(C[R.cur].c,'結束平倉');R.ord=null;
  var r=R,m=metrics(r),res='';
  if(r.mode==='prop'){var pass=why==='達標'||(m.ret>=MODES.prop.target&&why!=='爆倉線');res=pass?'通過':'未通過';B.tot.props++;if(pass)B.tot.pass++}
  B.tot.runs++;B.tot.n+=m.n;B.tot.w+=m.w;B.tot.R+=m.R;
  r.tr.forEach(function(t){var g=B.tags[t.tag]||(B.tags[t.tag]={n:0,w:0,R:0});g.n++;if(t.R>0)g.w++;g.R+=t.R});
  if(r.mode==='daily')B.daily[r.day||today()]={ret:m.ret,done:1};
  var key=r.mode;if(B.best[key]==null||m.ret>B.best[key])B.best[key]=m.ret;
  var sum={mode:r.mode,coin:r.coin,tf:r.tf,s:r.s,bars:r.bars,cur:r.cur,ret:m.ret,res:res||why,t0:C[r.s].t,t1:C[r.cur].t,tr:r.tr.slice(0,25),move:C[r.cur].c/C[r.s].c-1,when:Date.now()};
  B.runs.unshift(sum);B.runs=B.runs.slice(0,12);
  var xp=15+m.w*6+(res==='通過'?150:0)+(r.mode==='daily'?30:0),gold=Math.max(0,Math.round(10+m.R*8))+(res==='通過'?80:0);
  if(save.adv)save.adv.gold=(save.adv.gold||0)+gold;
  B.cur=null;A.persist();A.addXP(xp);
  if(res==='通過'){A.confetti(160);SFX.win()}else if(m.ret>0)SFX.win();
  review(sum,m,why,xp,gold,coach(r));
}
function review(sum,m,why,xp,gold,notes){
  var dec=DEC[sum.coin],pass=sum.res==='通過';
  var h='<p class="eyebrow">Reveal</p><h1 class="h2">'+(sum.mode==='prop'?(pass?'挑戰通過！':'挑戰失敗'):'回測結束')+'</h1>'+
   '<div class="fb bt-reveal"><p class="mut" style="margin:0;font-size:13px">這段行情其實是</p><p class="st" style="margin:0">'+sum.coin+'USDT・'+sum.tf+'</p><p class="num" style="margin:0">'+dstr(sum.t0)+' → '+dstr(sum.t1)+'</p><p class="mut" style="margin:0;font-size:13px">期間行情 <b class="num" style="color:'+(sum.move>=0?'var(--bull)':'var(--bear)')+'">'+pct(sum.move)+'</b>・結束原因：'+why+'</p></div>'+
   '<div class="statgrid"><div class="stat"><b class="num" style="color:'+(m.ret>=0?'var(--bull)':'var(--bear)')+'">'+pct(m.ret)+'</b><span>報酬</span></div><div class="stat"><b class="num">'+m.n+'</b><span>交易 '+m.w+' 勝</span></div><div class="stat"><b class="num">'+Math.round(m.wr*100)+'%</b><span>勝率</span></div>'+

   (sum.tr.length?'<p class="eyebrow">交易紀錄（點一下看細節）</p><div class="bt-runs">'+sum.tr.map(function(t,i){return '<button class="bt-run" type="button" data-t="'+i+'"><b style="color:'+(t.dir>0?'var(--bull)':'var(--bear)')+'">'+(t.dir>0?'多':'空')+'</b><span class="mut">'+TAGN[t.tag]+'・'+t.why+'</span><span class="sp"></span><span class="num" style="color:'+(t.R>=0?'var(--bull)':'var(--bear)')+'">'+rStr(t.R)+'</span></button>'}).join('')+'</div><div class="cbox" id="tdBox" hidden><div class="chead"><span id="tdLab"></span></div><div id="tdC"></div></div>':'')+
   '<p class="mut center" style="font-size:13px;margin:0">+'+xp+' XP・● +'+gold+' 金幣（卡匣商城可用）</p>'+
   '<div class="duo"><button class="btn bull" id="again" type="button"'+(sum.mode==='daily'?' disabled':'')+'>再來一局</button><button class="btn ghost" id="lb" type="button">回大廳</button></div>';
  var el=A.screen(h);

function runDetail(sum){
  var m=metrics({tr:sum.tr,bal:START*(1+sum.ret),peak:START,minEq:START});

function fmt(p,d){return window.fmtP(p,d)}

/* ── data pools ── */
var pools={};
function pool(coin,tf){
  var k=coin+'_'+tf;if(pools[k])return Promise.resolve(pools[k]);
  return BT.load(coin,tf).then(function(C){
    var AN=SM.analyze(C,4,2),P={C:C,AN:AN,coin:coin,tf:tf,dec:DEC[coin],ext:[],int:[],s3:[],res:[]};
    AN.ev.forEach(function(e){if(e.t!=='CHoCH'||e.i<90||e.i>C.length-70)return;P.ext.push(e);if(e.score===3)P.s3.push(e);if(e.res)P.res.push(e)});
    AN.iev.forEach(function(e){if(e.t!=='CHoCH'||e.ext||!e.xt||e.dir===e.xt||e.i<90||e.i>C.length-70)return;
      /* the external swing that would have to break for a real trend change */
      var tgt=null;AN.piv.forEach(function(p){if(p.hi===(e.dir>0?1:0)&&p.k<=e.i&&p.i<e.i&&(p.sw==null||p.sw>e.i))tgt=p});
      if(!tgt||(e.dir>0?tgt.p<=C[e.i].c:tgt.p>=C[e.i].c))return;e.tgt=tgt;P.int.push(e)});
    pools[k]=P;return P})}

function extPivMarks(P,from,to){return P.AN.piv.filter(function(p){return p.k<=to&&p.i>=from&&p.lab}).slice(-7).map(function(p){return {t:'mark',i:p.i-from,p:p.p,label:p.lab,cls:'mut',pos:p.hi?'up':'down'}})}
function featAnn(P,e,from){
  var C=P.C,ann=[],d=e.dir;
  if(e.fSweep)ann.push({t:'line',p:e.swp,from:e.swi-from,to:e.pi-from,cls:'gold',label:'被掃的'+W(d,'低點','高點'),below:d>0},{t:'mark',i:e.pi-from,p:e.pp,label:'掃',cls:'gold',pos:W(d,'down','up')});
  if(e.fFvg)ann.push({t:'zone',p1:e.fvP[0],p2:e.fvP[1],from:e.fvI-from,cls:W(d,'bull','bear'),label:'FVG',rlab:1});
  if(e.fDisp){for(var u=e.pi+1;u<=e.i;u++)if(d*(C[u].c-C[u].o)>=1.1*P.AN.atr[u]){ann.push({t:'col',i:u-from,cls:'sel'});break}}
  return ann}
function featList(e,P){var a=P.AN.atr[e.i];return FEAT.map(function(f){var on=e[f[0]],x='';
  if(f[0]==='fClose')x='（收盤離線 '+(e.dir*(P.C[e.i].c-e.p)/a).toFixed(2)+' 根 ATR，要 ≥ 0.25）';
  return '<span style="color:'+(on?'var(--bull)':'var(--bear)')+'">'+(on?'✓ ':'✗ ')+f[1]+'</span>'+x}).join('<br>')}

/* ── question builders (each returns null when the pool can't serve it) ── */
function qIO(P){
  var isExt=Math.random()<.5,e=isExt?pick(P.ext):pick(P.int);if(!e)return null;
  var d=e.dir,from=e.i-70,C=P.C,dec=P.dec;
  var ann=extPivMarks(P,from,e.i).concat([{t:'line',p:e.p,from:e.from-from,to:e.i-from,cls:'sel',label:'被突破的點 ?',below:d<0},{t:'col',i:e.i-from,cls:'sel'}]);
  var rv=ann.slice();
  if(!isExt){rv.push({t:'line',p:e.tgt.p,from:e.tgt.i-from,cls:W(d,'bear','bull'),label:'外部'+W(d,'高點','低點')+'：要收盤'+W(d,'突破','跌破')+'這裡',solid:1,below:d<0})}
  else rv.push({t:'mark',i:e.i-from,p:W(d,C[e.i].h,C[e.i].l),label:'外部 CHoCH',cls:W(d,'bull','bear'),pos:W(d,'up','down')});
  return {type:'io',P:P,from:from,vis:e.i,ann:ann,rv:{vis:e.i,ann:rv},
    prompt:'標起來的那根 K 線收盤突破了虛線。這是內部還是外部 CHoCH？',
    options:[['外部 CHoCH：大結構轉向',isExt],['內部 CHoCH：大結構還沒變',!isExt]],
    why:isExt?'被突破的是大擺動點（圖上 HH/HL/LH/LL 標的那種），所以外部結構從'+W(d,'空翻多','多翻空')+'。外部 CHoCH 才是「方向可能改了」的訊號，但還要等後面同向的 BOS 才算確認。'
      :'被突破的只是回'+W(d,'跌','彈')+'裡的小擺動點。外部結構還是'+W(d,'偏空','偏多')+'，真正的外部'+W(d,'高點','低點')+'在 '+fmt(e.tgt.p,dec)+'，要收盤'+W(d,'突破','跌破')+'那裡才是外部 CHoCH。內部 CHoCH 只是提醒你「可能要轉了」，不是進場理由。在這份資料裡，逆勢的內部 CHoCH 之後，下一個外部突破往同方向走的大約 '+RATE.upg+'%。'};
}
function qMiss(P){

function qProt(P){
  var e=pick(P.ext);if(!e)return null;var d=e.dir,C=P.C,a=P.AN.atr[e.i],from=e.i-60,dec=P.dec;
  var cands=[[e.pp,'這段'+W(d,'上漲','下跌')+'的起點（保護'+W(d,'低點','高點')+'）',1],[e.p,'被突破的 CHoCH 線',0]];

function qScore(P){

function chart(G,C,from,to,vis,ann,extra){return new window.Chart($('#tc'),Object.assign({st:{C:C.slice(from,to+1),x:{sym:G.coin,tf:'',dec:DEC[G.coin]}},vis:vis-from+1,slots:to-from+1,h:260,ann:ann},extra||{}))}
function record(G,key,good,prompt,why){G.res[key]=good;var b=T.by[key]||(T.by[key]={n:0,ok:0});b.n++;if(good)b.ok++;

  $('#nx').onclick=function(){SFX.tick();next()};f.scrollIntoView({behavior:A.RM?'auto':'smooth',block:'nearest'})}

function pivAnn(AN,from,to,off){return AN.piv.filter(function(p){return p.k<=to&&p.i>=from&&p.lab}).slice(-8).map(function(p){return {t:'mark',i:p.i-off,p:p.p,label:p.lab,cls:'mut',pos:p.hi?'up':'down'}})}

/* 1. bias on the top timeframe */
function stepBias(G){
  var s=G.s,P=G.P,H=P.H4,to=s.k4,from=Math.max(0,to-59),d=s.d,AN=P.A4;

  var opts=[{t:'偏多：找機會做多',ok:d>0},{t:'偏空：找機會做空',ok:d<0},{t:'不明確：先觀望',ok:false}];
  var el=A.screen(frame(G,0,'大方向',G.set.top)+'<p style="margin:0;font-weight:700">先看 '+G.set.top+'。現在大方向偏哪邊？</p>'+optsHTML(opts)+'<div id="fb"></div>');
  var ch=chart(G,H,from,to,to,hint);
  choice(el,opts,function(i,good){
    var last=AN.ev.filter(function(e){return e.i<=to}).slice(-1)[0];
    var why=G.set.top+' 最後一次結構突破是 <b style="color:var(--fg)">'+(last?last.t+(last.dir>0?'（向上）':'（向下）'):'—')+'</b>，擺動點'+W(d,'一路墊高（HH、HL）','一路壓低（LH、LL）')+'，所以偏'+W(d,'多','空')+'。大方向決定你只找哪一邊的單：偏'+W(d,'多就只在回調時找多單','空就只在反彈時找空單')+'，逆勢單先不碰。';
    if(i===2)why='其實結構很清楚。'+why;
    record(G,'bias',good,'大週期方向',why);
    ch.set({ann:pivAnn(AN,from,to,from).concat(evAnn(AN,from,to,from))});
    feedback(good,why,function(){stepPoi(G)})});
}

/* 2. POI inside the mid-timeframe dealing range */
function stepPoi(G){
  var s=G.s,P=G.P,H=P.H1,to=s.k1,from=Math.max(0,Math.min(s.lo-6,to-79)),d=s.d,L='ABCD';
  var list=shuffle([{z:s.poi,ok:true}].concat(s.dis.map(function(x){return {z:x.z,why:x.why,ok:false}})));

/* 3. trigger: tap the candle that completes the low-timeframe CHoCH after the POI tap */
function stepTrig(G){
  var s=G.s,P=G.P,C=P.C,ch=s.ch,d=s.d,from=Math.max(0,s.ta-40),to=Math.min(C.length-1,ch.i+6);

  var hint=T.lvl===0?[{t:'line',p:ch.p,from:ch.from-from,cls:'sel',label:'收盤越過這裡 = CHoCH'}]:T.lvl===1?pivAnn(P.A15,from,ch.i,from):[];

      (ch.fSweep?'這次轉向前還先掃了一次'+W(d,'下方','上方')+'流動性，是很標準的劇本。':'')+'只看到價格進 POI 就進場，會常常被一路'+W(d,'砸穿','拉穿')+'；等 CHoCH 犧牲一點價格，換來方向確認。';

/* 4. stop */
function stepSL(G){
  var s=G.s,P=G.P,C=P.C,ch=s.ch,d=s.d,a=s.a15,en=s.en,from=Math.max(0,s.ta-40),to=ch.i,dec=DEC[G.coin];
  var cand=[{p:s.sl,ok:true,why:'保護'+W(d,'低點','高點')+'（這次轉向的起點）再往外一點。價格要回到這裡，這個 CHoCH 就是假的，留著單也沒意義。'},
    {p:en-d*.35*a,why:'太近，還在正常波動範圍內，很容易被一根影線掃掉。'},
    {p:ch.p,why:'CHoCH 線不是失效點。價格回踩這條線很正常，止損放這裡等於幫別人提供流動性。'},
    {p:s.rL-d*.3*P.A1.atr[s.k1],why:'放在 '+G.set.mid+' 區間外面不算錯，但距離太遠，同樣的風險 % 倉位會變很小、盈虧比變差。'}];
  cand=cand.filter(function(c,i){return d*(en-c.p)>0&&cand.slice(0,i).every(function(o){return Math.abs(o.p-c.p)>.2*a})});
  var L='ABCD',list=shuffle(cand);
  var opts=list.map(function(c,k){return {t:L[k]+'　'+fmt(c.p,dec)+'　<span class="mut num" style="font-size:12px">距離 '+(d*(en-c.p)/a).toFixed(1)+' ATR</span>',ok:!!c.ok}});
  var ann=[{t:'zone',p1:s.poi.top,p2:s.poi.bot,from:0,cls:'sel'},{t:'line',p:ch.p,from:ch.from-from,to:ch.i-from,cls:W(d,'bull','bear'),label:'CHoCH',solid:1,below:d<0},{t:'line',p:en,from:ch.i-from-3,cls:'fg',label:'進場 '+fmt(en,dec),solid:1}].concat(list.map(function(c,k){return {t:'line',p:c.p,from:Math.max(0,ch.i-from-18),cls:'bear',label:L[k],right:1}}));
  var el=A.screen(frame(G,3,'止損',G.set.low)+'<p style="margin:0;font-weight:700">用 CHoCH 那根收盤 '+fmt(en,dec)+' 進場。止損放哪？</p>'+optsHTML(opts)+'<div id="fb"></div>');
  var cc=chart(G,C,from,to,to,ann);

    var why=list.map(function(c,k){return '<b style="color:'+(c.ok?'var(--bull)':'var(--fg)')+'">'+L[k]+'</b>：'+c.why}).join('<br>');
    record(G,'sl',good,'止損位置',why);
    cc.set({ann:ann.slice(0,3).concat([{t:'line',p:s.sl,from:ch.i-from-18,cls:'bear',label:'正解 SL',right:1,solid:1},{t:'mark',i:ch.pi-from,p:ch.pp,label:'保護點',cls:'gold',pos:W(d,'down','up')}])});
    feedback(good,why,function(){stepTP(G)})});

/* 5. target */
function stepTP(G){
  var s=G.s,P=G.P,H=P.H1,d=s.d,en=s.en,risk=Math.abs(en-s.sl),dec=DEC[G.coin],from=Math.max(0,Math.min(s.lo-6,s.k1-79)),to=s.k1;
  var cand=[{p:s.rH,ok:true,why:G.set.mid+' 區間的'+W(d,'高點','低點')+'：上面堆著'+W(d,'空單止損（BSL）','多單止損（SSL）')+'，是價格最自然的去處，也是第一目標。'},
    {p:s.eq,why:'區間 50% 只是中間，不是流動性。可以先平一部分，但不該當唯一目標。'},
    {p:en+d*risk,why:'固定 1R 沒有依據，跟結構無關，會讓你在對的單上賺太少。'},
    {p:s.rH+d*Math.abs(s.rH-s.rL)*.9,why:'太遠，要先突破 '+G.set.mid+' 的'+W(d,'高點','低點')+'才到得了，機率低很多。'}];
  cand=cand.filter(function(c,i){return d*(c.p-en)>0&&cand.slice(0,i).every(function(o){return Math.abs(o.p-c.p)>.25*risk})});
  var L='ABCD',list=shuffle(cand);
  var opts=list.map(function(c,k){return {t:L[k]+'　'+fmt(c.p,dec)+'　<span class="mut num" style="font-size:12px">'+(d*(c.p-en)/risk).toFixed(1)+'R</span>',ok:!!c.ok}});
  var ann=[{t:'line',p:en,from:to-from-6,cls:'fg',label:'進場',solid:1},{t:'line',p:s.rL,from:s.lo-from,cls:'mut',label:'區間'+W(d,'低','高'),right:1,below:d>0}].concat(list.map(function(c,k){return {t:'line',p:c.p,from:Math.max(0,to-from-30),cls:'bull',label:L[k],right:1}}));
  var el=A.screen(frame(G,4,'目標',G.set.mid)+'<p style="margin:0;font-weight:700">回到 '+G.set.mid+' 看目標。第一個止盈放哪？</p>'+optsHTML(opts)+'<div id="fb"></div>');
  var cc=chart(G,H,from,to,to,ann);
  choice(el,opts,function(i,good){G.pick.tp=list[i].p;
    var why=list.map(function(c,k){return '<b style="color:'+(c.ok?'var(--bull)':'var(--fg)')+'">'+L[k]+'</b>：'+c.why}).join('<br>');
    record(G,'tp',good,'止盈目標',why);
    var f=$('#fb');feedback(good,why,function(){result(G)});$('#nx').textContent='看這筆單的真實結果';});
}

   '<div class="fb"><p class="why">'+STEPS.map(function(x){return '<span style="color:'+(G.res[x[0]]?'var(--bull)':'var(--bear)')+'">'+(G.res[x[0]]?'✓ ':'✗ ')+x[1]+'</span>'}).join('　')+'</p>'+
   '<p class="why">'+(book.r>0?'這次照流程做有賺。':'這次就算照流程做也停損了：SMC 給的是機率優勢，不是保證。')+'重點是每一步的判斷有沒有對，'+(mine.r<book.r?'而你這次的止損或目標讓結果比標準答案差。':'長期累積下來才看得出差別。')+'</p></div>'+

   '<div class="duo"><button class="btn bull" id="again" type="button">下一個機會</button><button class="btn ghost" id="lb" type="button">回大廳</button></div>');
  var ann=[{t:'zone',p1:s.poi.top,p2:s.poi.bot,from:0,cls:'sel',label:'POI',rlab:1},
    {t:'pos',i:s.ch.i-from,to:book.x-from,entry:s.en,sl:s.sl,tp:s.tp,label:'標準 '+(book.r>0?'+':'')+book.r.toFixed(1)+'R',tpl:'TP'},
    {t:'line',p:G.pick.sl,from:s.ch.i-from,to:mine.x-from,cls:'gold',label:'你的 SL',right:1},{t:'line',p:G.pick.tp,from:s.ch.i-from,to:mine.x-from,cls:'gold',label:'你的 TP',right:1},
    {t:'mark',i:mine.x-from,p:mine.px,label:'你 '+(mine.r>0?'+':'')+mine.r.toFixed(1)+'R',cls:mine.r>0?'bull':'bear',pos:W(d,mine.r>0?'up':'down',mine.r>0?'down':'up')}];
  new window.Chart($('#tc'),{st:{C:C.slice(from,to+1),x:{sym:G.coin,tf:'',dec:dec}},vis:to-from+1,h:250,ann:ann});
  $('#again').onclick=function(){SFX.tick();start()};$('#lb').onclick=lobby;
}

function rng(seed){var a=seed>>>0||1;return function(){a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function build(start,legs,seed,noise){
  var r=rng(seed||7),C=[],cur=start;noise=noise==null?.35:noise;
  legs.forEach(function(L){var from=cur,n=L.n;
    for(var b=0;b<n;b++){var tgt=from+(L.to-from)*(b+1)/n,last=b===n-1,o=cur,c=last?L.to:tgt+(r()-.5)*noise*(L.big?.3:1);
      var wu=(L.big?.06:.12)+r()*(L.big?.12:.32),wd=(L.big?.06:.12)+r()*(L.big?.12:.32),k={o:o,c:c,h:Math.max(o,c)+wu,l:Math.min(o,c)-wd};

      if(L.wick!=null&&last){if(L.wick<Math.min(o,c))k.l=Math.min(k.l,L.wick);else k.h=Math.max(k.h,L.wick)}

function mirror(C,mid){return C.map(function(k){return {o:2*mid-k.o,c:2*mid-k.c,h:2*mid-k.l,l:2*mid-k.h}})}

function irlBase(seed){
  for(var s=seed;s<seed+60;s++){
    var legs=[{to:108,n:4},{to:101.8,n:5},{to:105,n:3},{to:101.3,n:3,sweep:100.5},{to:106.8,n:4,big:1},{to:0,n:3},{to:111,n:5}];
    var C0=build(104,legs.slice(0,5),s),z=fvgs(C0,15,C0.length-1,1);if(!z.length)continue;z=z[0];if(z.top-z.bot<.7)continue;
    legs[5]={to:(z.top+z.bot)/2+.4,n:3,sweep:(z.top+z.bot)/2-.05};
    var C=build(104,legs,s),hi=argmax(C,0,4,'h'),lo=argmax(C,5,10,'l'),sw=argmax(C,12,15,'l');if(C[sw].l>=C[lo].l)continue;
    return {C:C,z:z,hi:hi,H:C[hi].h,lo:lo,Lw:C[lo].l,sw:sw,n0:C0.length,tap:C0.length+2}}}

var pairCache=null;
function pairs(){if(pairCache)return Promise.resolve(pairCache);
  return Promise.all([BT.load('BTC','1h'),BT.load('ETH','1h')]).then(function(r){var Abtc=r[0],Beth=r[1],ix={};Abtc.forEach(function(c,i){ix[c.t]=i});
    var pa=SM.structure(Abtc,3,SM.atr(Abtc)).piv,pb=SM.structure(Beth,3,SM.atr(Beth)).piv,out=[];
    [0,1].forEach(function(hi){var la=pa.filter(function(p){return p.hi===hi}),lb=pb.filter(function(p){return p.hi===hi}).map(function(p){return {i:p.i,p:p.p,ai:ix[Beth[p.i].t]}});
      var bi=0;for(var k=1;k<la.length;k++){var p=la[k],q=la[k-1],P=null,Q=null;
        for(var j=0;j<lb.length;j++){if(Math.abs(lb[j].ai-p.i)<=2)P=lb[j];if(Math.abs(lb[j].ai-q.i)<=2)Q=lb[j]}
        if(!P||!Q||P===Q||p.i-q.i<6||p.i-q.i>60)continue;
        var aX=hi?p.p>q.p:p.p<q.p,bX=hi?P.p>Q.p:P.p<Q.p;if(aX===bX&&!aX)continue;
        var tg=hi?1e18:-1e18;for(var u=q.i;u<=p.i;u++)tg=hi?Math.min(tg,Abtc[u].l):Math.max(tg,Abtc[u].h);
        var ext=hi?Math.max(p.p,q.p):Math.min(p.p,q.p),ok=null,x=null;for(u=p.i+1;u<Math.min(Abtc.length,p.i+60);u++){if(hi?Abtc[u].h>ext:Abtc[u].l<ext){ok=0;x=u;break}if(hi?Abtc[u].l<tg:Abtc[u].h>tg){ok=1;x=u;break}}
        if(ok===null)continue;
        out.push({hi:hi,smt:aX!==bX,a:{i:p.i,q:q.i,p:p.p,qp:q.p},b:{i:P.i,q:Q.i,p:P.p,qp:Q.p},ok:ok,x:x,tg:tg})}});
    var ixB={};Beth.forEach(function(c,i){ixB[c.t]=i});pairCache={A:Abtc,B:Beth,list:out,ixB:ixB};return pairCache})}
function smtCharts(D,e,extra){var from=Math.min(e.a.q,e.a.i)-25,to=e.a.i+3+(extra||0),A=D.A,B=D.B,oB=D.ixB[A[from].t];if(oB==null)oB=from;

/* Boot: pick the newest save (cloud db vs this browser), then start the app. Cloud writes are debounced and one-at-a-time. */
(function(){
var KEY='smc-dojo-v2';
function readLocal(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function ts(s){return (s&&s._ts)||0}
var Cloud=window.Cloud={state:'init',at:0,ref:null,err:'',busy:false,pending:null,newer:null,ls:[]};
Cloud.on=function(f){Cloud.ls.push(f)};
function emit(){Cloud.ls.forEach(function(f){try{f()}catch(e){}})}
Cloud.emit=emit;
var started=false,local=readLocal();
function start(sv){if(started)return;started=true;window.__SAVE0=sv||null;window.__BOOT();emit()}
function cur(){return window.App?App.save:null}
Cloud.push=function(s){if(!Cloud.ref)return;Cloud.pending=s||cur();clearTimeout(Cloud.t);Cloud.t=setTimeout(flush,2500)};
function flush(){
  clearTimeout(Cloud.t);if(!Cloud.ref||!Cloud.pending||Cloud.busy)return Promise.resolve();
  var s=Cloud.pending,str=JSON.stringify(s);Cloud.pending=null;
  if(str.length>240000&&s.bt&&s.bt.runs){s.bt.runs=s.bt.runs.slice(0,4);str=JSON.stringify(s)}
  if(s.mist&&str.length>240000){s.mist=s.mist.slice(-60);str=JSON.stringify(s)}
  Cloud.busy=true;
  return Cloud.ref.set({v:str,ts:ts(s)||Date.now()}).then(function(){Cloud.busy=false;Cloud.state='ok';Cloud.err='';Cloud.at=Date.now();emit();if(Cloud.pending)return flush()},
    function(e){Cloud.busy=false;Cloud.state='err';Cloud.err=(e&&e.code)||'error';emit();
      if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')){Cloud.pending=Cloud.pending||s;setTimeout(flush,5000)}})}
Cloud.flush=function(){if(Cloud.ref&&!Cloud.pending)Cloud.pending=cur();return flush()};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});
addEventListener('pagehide',function(){flush()});
Cloud.useNewer=function(){var c=Cloud.newer;if(!c)return;try{localStorage.setItem(KEY,JSON.stringify(c))}catch(e){}Cloud.ref=null;location.reload()};

var hasClaude=window.claude&&typeof window.claude.use==='function';
if(!hasClaude){Cloud.state='off';start(local);return}
var timer=setTimeout(function(){start(local)},4500);
function offline(){Cloud.state='off';clearTimeout(timer);start(local);emit()}
Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
  var db=r[0],user=r[1];if(!db||!user)return offline();
  return user.id().then(function(uid){
    if(!uid)return offline();
    var ref=db.doc('data/users/'+uid+'/save');
    return ref.get().then(function(snap){
      var cloud=null;if(snap.exists){try{cloud=JSON.parse(snap.data().v)}catch(e){}}
      Cloud.ref=ref;Cloud.state='ok';Cloud.at=Date.now();
      if(!started){
        clearTimeout(timer);
        var useCloud=cloud&&ts(cloud)>ts(local);
        if(useCloud){try{localStorage.setItem(KEY,JSON.stringify(cloud))}catch(e){}}
        start(useCloud?cloud:local);
        if(!useCloud&&(local||!cloud))Cloud.push(cur());
      }else{
        if(cloud&&ts(cloud)>ts(cur())){Cloud.newer=cloud}else Cloud.push(cur());
      }
      emit();
    });
  });
}).catch(function(e){Cloud.state='err';Cloud.err=String((e&&e.code)||e);clearTimeout(timer);start(local);emit()});
})();
</script>
